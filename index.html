<style>
/* ===== หน้าโหลด (แสดงทันทีก่อนสคริปต์ทำงาน) ===== */
.splash{position:fixed;inset:0;z-index:50;display:grid;place-items:center;overflow:hidden;background:#EEF4FF;font-family:Anuphan,'Noto Sans Thai',system-ui,sans-serif}
.sp-bg{position:absolute;inset:0;pointer-events:none}
.sp-bg i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.75;animation:sp-drift 14s ease-in-out infinite alternate}
.sp-bg i:nth-child(1){width:46vmax;height:46vmax;left:-12vmax;top:-14vmax;background:#9CCBFF}
.sp-bg i:nth-child(2){width:38vmax;height:38vmax;right:-10vmax;top:10vh;background:#A7F3D0;animation-duration:18s;animation-delay:-4s}
.sp-bg i:nth-child(3){width:40vmax;height:40vmax;left:20vw;bottom:-18vmax;background:#FFE29A;opacity:.6;animation-duration:16s;animation-delay:-8s}
@keyframes sp-drift{to{transform:translate(6vmax,4vmax) scale(1.12)}}
.sp-card{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;padding:38px 46px 32px;border-radius:32px;
  background:rgba(255,255,255,.55);backdrop-filter:blur(26px) saturate(1.7);-webkit-backdrop-filter:blur(26px) saturate(1.7);
  box-shadow:0 30px 70px -30px rgba(20,50,120,.45),inset 0 1.5px 0 rgba(255,255,255,.95),inset 0 0 0 1px rgba(255,255,255,.7);animation:sp-in .7s cubic-bezier(.2,.9,.25,1) both}
@keyframes sp-in{from{opacity:0;transform:translateY(14px) scale(.97)}}
.sp-logo{position:relative;width:92px;height:92px;display:grid;place-items:center;margin-bottom:4px}
.sp-mark{width:76px;height:76px;border-radius:22px;overflow:hidden;box-shadow:0 14px 30px -12px rgba(10,91,224,.7);animation:sp-breathe 2.4s ease-in-out infinite}
.sp-mark svg{width:100%;height:100%;display:block}
@keyframes sp-breathe{50%{transform:scale(1.05)}}
.sp-ring{position:absolute;inset:-6px;border-radius:30px;padding:3px;background:conic-gradient(from 0deg,transparent 0 55%,#3B9BFF 75%,#34C759 90%,transparent);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:sp-spin 1.4s linear infinite}
.sp-ring.r2{inset:-14px;border-radius:36px;padding:2px;opacity:.45;background:conic-gradient(from 180deg,transparent 0 60%,#FFC83D 80%,transparent);animation-duration:2.6s;animation-direction:reverse}
@keyframes sp-spin{to{transform:rotate(360deg)}}
.sp-name{margin:0;font:700 26px/1.5 Trirong,Anuphan,serif;padding-top:.1em;background:linear-gradient(180deg,#1F4E86,#0E2747);-webkit-background-clip:text;background-clip:text;color:transparent}
.sp-tips{position:relative;height:1.6em;width:260px;font-size:14px;color:#4F6A90;text-align:center}
.sp-tips span{position:absolute;inset:0;opacity:0;animation:sp-tip 7.2s infinite}
.sp-tips span:nth-child(2){animation-delay:2.4s}.sp-tips span:nth-child(3){animation-delay:4.8s}
@keyframes sp-tip{0%{opacity:0;transform:translateY(6px)}6%,30%{opacity:1;transform:none}36%,100%{opacity:0;transform:translateY(-6px)}}
.sp-bar{width:180px;height:5px;border-radius:99px;background:rgba(30,80,160,.12);overflow:hidden;margin-top:2px}
.sp-bar i{display:block;width:40%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#3B9BFF,#34C759);animation:sp-slide 1.3s cubic-bezier(.6,0,.4,1) infinite}
@keyframes sp-slide{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
.splash.leaving{animation:sp-out .45s ease forwards;pointer-events:none}
@keyframes sp-out{to{opacity:0;transform:scale(1.03)}}
[data-theme=dark] .splash{background:#0A1222}
[data-theme=dark] .sp-bg i:nth-child(1){background:#1D4ED8;opacity:.45}[data-theme=dark] .sp-bg i:nth-child(2){background:#047857;opacity:.35}[data-theme=dark] .sp-bg i:nth-child(3){background:#92400E;opacity:.35}
[data-theme=dark] .sp-card{background:rgba(20,30,52,.55);box-shadow:0 30px 70px -30px #000,inset 0 1.5px 0 rgba(255,255,255,.15),inset 0 0 0 1px rgba(140,190,255,.15)}
[data-theme=dark] .sp-name{background:linear-gradient(180deg,#FFF6CF,#F4C84A 60%,#C98E1A);-webkit-background-clip:text;background-clip:text}
[data-theme=dark] .sp-tips{color:#9DB7DB}[data-theme=dark] .sp-bar{background:rgba(255,255,255,.1)}
@media (max-width:480px){.sp-card{padding:32px 28px 26px;margin:0 20px}.sp-name{font-size:23px}}
@media (prefers-reduced-motion:reduce){.splash *,.splash{animation-duration:.01s!important;animation-iteration-count:1!important}.sp-tips span:first-child{opacity:1}}
@media (min-width:700px){.sp-card{padding:46px 64px 38px;gap:16px}.sp-logo{width:112px;height:112px}.sp-mark{width:92px;height:92px;border-radius:26px}.sp-ring{border-radius:34px}.sp-ring.r2{border-radius:40px}.sp-name{font-size:32px}.sp-tips{font-size:15px;width:300px}.sp-bar{width:220px}}

:root{
  --bg:#f4f2ec;--surface:#fff;--surface-2:#f9f8f4;--ink:#1c2321;--muted:#5f6a65;--line:#e3e0d6;
  --primary:#1f6f5c;--primary-ink:#fff;--primary-soft:#e2efea;--accent:#d9952a;--accent-soft:#fbf0dc;
  --danger:#bf3d2a;--danger-soft:#fbe8e4;--ok:#2f8a4e;--ok-soft:#e3f3e8;
  --side:#173d33;--side-ink:#e8f1ed;--side-muted:#9fbdb2;--side-hover:#1f4d41;--side-active:#f2c56b;
  --shadow:0 1px 2px rgba(20,30,25,.06),0 4px 16px rgba(20,30,25,.06);
  --r:14px;--r-sm:9px;
  --f-head:'Anuphan','IBM Plex Sans Thai',system-ui,sans-serif;
  --f-body:'IBM Plex Sans Thai',system-ui,sans-serif;
  color-scheme:light;
}
[data-theme=dark]{
  --bg:#111513;--surface:#191e1c;--surface-2:#1f2522;--ink:#e8ece9;--muted:#9aa49f;--line:#2b3330;
  --primary:#4cb394;--primary-ink:#0b1310;--primary-soft:#1b3a31;--accent:#f0b955;--accent-soft:#3a2f1a;
  --danger:#ef7a64;--danger-soft:#3b211c;--ok:#5fc57f;--ok-soft:#1b3424;
  --side:#0d1311;--side-ink:#e3ebe7;--side-muted:#7f948b;--side-hover:#18221e;--side-active:#f0b955;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-head);margin:0;line-height:1.3;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary)}
.muted{color:var(--muted)}
.small{font-size:13px}
.hide{display:none!important}

/* ---------- buttons & inputs ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:var(--r-sm);cursor:pointer;font-weight:500;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface-2);border-color:color-mix(in srgb,var(--line) 60%,var(--ink))}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,var(--line))}
.btn.danger.solid{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:5px 10px;font-size:13.5px}
.btn.icon{padding:7px;width:36px;height:36px;justify-content:center}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:17px;height:17px;flex:none}
.input,select.input,textarea.input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);outline:none;transition:border-color .15s,box-shadow .15s}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
label.field{display:flex;flex-direction:column;gap:5px;font-size:14px;font-weight:500}
label.field>span{color:var(--muted);font-weight:500}
.row{display:flex;gap:12px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:100px 1fr 1fr;gap:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);font-size:13px;white-space:nowrap}
.chip.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.chip.warn{background:var(--accent-soft);border-color:transparent;color:color-mix(in srgb,var(--accent) 75%,var(--ink))}
.chip.bad{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.chip.pri{background:var(--primary-soft);border-color:transparent;color:var(--primary)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:var(--side);color:var(--side-ink);padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand-mark{width:38px;height:38px;border-radius:11px;background:var(--side-active);color:#1b2a24;display:grid;place-items:center;font:700 19px var(--f-head)}
.brand b{font:600 17px var(--f-head);display:block}
.brand small{color:var(--side-muted);font-size:12.5px}
.nav-group{font-size:12px;letter-spacing:.04em;color:var(--side-muted);padding:14px 10px 4px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:10px;color:var(--side-ink);text-decoration:none;cursor:pointer;border:0;background:none;width:100%;text-align:left;font-size:15px}
.nav-item svg{width:19px;height:19px;opacity:.85;flex:none}
.nav-item:hover{background:var(--side-hover)}
.nav-item.active{background:var(--side-hover);box-shadow:inset 3px 0 0 var(--side-active)}
.nav-item.active svg{color:var(--side-active);opacity:1}
.nav-item .soon{margin-left:auto;font-size:11px;padding:1px 7px;border-radius:99px;background:rgba(255,255,255,.08);color:var(--side-muted)}
.side-foot{margin-top:auto;padding:14px 10px 0;font-size:12px;color:var(--side-muted);border-top:1px solid rgba(255,255,255,.08)}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:14px 28px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(8px);position:sticky;top:0;z-index:5}
.top h1{font-size:20px}
.content{padding:26px 28px 40px;max-width:1240px;width:100%}
.credit{text-align:center;font-size:12.5px;color:var(--muted);padding:18px 0 26px;margin-top:auto}
.menu-btn{display:none}
.scrim{display:none}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.card-h h3{font-size:16.5px}
.card-b{padding:18px 20px}
.page-head{display:flex;align-items:flex-end;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.page-head h2{font-size:24px}
.page-head p{margin:2px 0 0;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stat{padding:16px 18px}
.stat .lbl{color:var(--muted);font-size:13.5px;display:flex;align-items:center;gap:7px}
.stat .lbl svg{width:16px;height:16px}
.stat .val{font:600 30px/1.2 var(--f-head);margin-top:6px;font-variant-numeric:tabular-nums}
.stat .sub{font-size:12.5px;color:var(--muted)}
.dash-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
.empty{text-align:center;padding:34px 20px;color:var(--muted)}
.empty svg{width:42px;height:42px;opacity:.5;margin-bottom:6px}
.empty b{display:block;color:var(--ink);font:600 16px var(--f-head);margin-bottom:4px}

/* phases */
.phases{list-style:none;margin:0;padding:0}
.phases li{display:flex;gap:12px;padding:9px 0;align-items:flex-start}
.phases .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:600;flex:none;border:2px solid var(--line);color:var(--muted)}
.phases li.now .dot{border-color:var(--primary);background:var(--primary);color:var(--primary-ink)}
.phases li.now b{color:var(--primary)}
.phases b{font-weight:600;display:block;font-size:14.5px}
.phases span{font-size:13px;color:var(--muted)}

/* subjects */
.subj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.subj{overflow:hidden;display:flex;flex-direction:column}
.subj-top{height:6px}
.subj .card-b{display:flex;flex-direction:column;gap:10px;flex:1}
.subj-code{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.subj h3{font-size:18px}
.subj-foot{display:flex;align-items:center;gap:6px;padding:10px 14px 10px 20px;border-top:1px solid var(--line);background:var(--surface-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* classes */
.two-pane{display:grid;grid-template-columns:270px 1fr;gap:18px;align-items:start}
.cls-list{padding:8px}
.cls-item{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:10px;border:0;background:none;cursor:pointer;text-align:left}
.cls-item:hover{background:var(--surface-2)}
.cls-item.active{background:var(--primary-soft)}
.cls-item.active .cls-name{color:var(--primary)}
.cls-name{font:600 15.5px var(--f-head)}
.cls-sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cls-count{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.search{position:relative;flex:1;min-width:180px;max-width:300px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.search .input{padding-left:33px}
.bulk{display:flex;gap:8px;align-items:center;padding:9px 16px;background:var(--accent-soft);border-bottom:1px solid var(--line);font-size:14px}
.tbl-wrap{overflow:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-weight:600;font-size:13px;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:hover td{background:color-mix(in srgb,var(--surface-2) 60%,transparent)}
.tbl tr.inactive td{color:var(--muted)}
.tbl .num{font-variant-numeric:tabular-nums;width:60px}
.tbl .act{width:1%;white-space:nowrap;text-align:right}
.tbl td .input{padding:5px 8px;font-size:14px;min-width:70px}
.tbl input[type=checkbox]{width:16px;height:16px;accent-color:var(--primary)}
.code-mask{font-variant-numeric:tabular-nums;letter-spacing:.03em}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(10,18,15,.45);display:grid;place-items:center;padding:20px;z-index:50;animation:fade .15s}
.modal{background:var(--surface);border-radius:16px;width:min(520px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:pop .18s}
.modal.wide{width:min(860px,100%)}
.modal-h{display:flex;align-items:center;padding:18px 22px 6px}
.modal-h h3{font-size:19px}
.modal-b{padding:14px 22px;overflow:auto}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 22px 18px;border-top:1px solid var(--line)}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:30px;height:30px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer}
.swatch.on{box-shadow:0 0 0 2px var(--ink)}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.check{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-sm);cursor:pointer;font-size:14px}
.check:has(input:checked){border-color:var(--primary);background:var(--primary-soft)}
.check input{accent-color:var(--primary)}

/* upload */
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:30px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;display:block}
.drop:hover,.drop.over{border-color:var(--primary);background:var(--primary-soft)}
.drop svg{width:40px;height:40px;color:var(--primary)}
.drop b{display:block;font:600 16px var(--f-head);margin:6px 0 2px}
.fmt{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;font-size:13.5px}
.fmt table{border-collapse:collapse;margin:8px 0;font-size:13px}
.fmt td,.fmt th{border:1px solid var(--line);padding:3px 9px;background:var(--surface)}
.sheet{border:1px solid var(--line);border-radius:var(--r-sm);margin-bottom:12px;overflow:hidden}
.sheet-h{display:flex;gap:12px;align-items:center;padding:10px 14px;background:var(--surface-2);flex-wrap:wrap}
.sheet-h input[type=checkbox]{width:18px;height:18px;accent-color:var(--primary)}
.sheet-h .input{width:150px;padding:6px 10px}
.sheet-b{padding:10px 14px;font-size:13.5px}
.warn-list{margin:6px 0 0;padding-left:18px;color:color-mix(in srgb,var(--accent) 70%,var(--ink))}
.radio-row{display:flex;gap:10px;flex-wrap:wrap}
.radio{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);cursor:pointer;flex:1;min-width:220px;font-size:14px}
.radio:has(input:checked){border-color:var(--primary);background:var(--primary-soft)}
.radio input{accent-color:var(--primary);margin-top:4px}

/* toast */
.toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:60;align-items:center}
.toast{background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;box-shadow:var(--shadow);animation:pop .2s}
.toast.err{background:var(--danger);color:#fff}

/* login & student */
.auth{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.auth-art{background:var(--side);color:var(--side-ink);padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.auth-art h1{font-size:38px;max-width:420px;line-height:1.25}
.auth-art p{color:var(--side-muted);max-width:420px}
.auth-art .lines{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 37px,rgba(255,255,255,.04) 37px 38px);pointer-events:none}
.auth-feat{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:460px;position:relative}
.auth-feat div{background:rgba(255,255,255,.06);border-radius:12px;padding:12px 14px;font-size:14px}
.auth-feat b{display:block;color:var(--side-active);font-family:var(--f-head)}
.auth-form{display:grid;place-items:center;padding:32px}
.auth-card{width:min(400px,100%)}
.auth-card h2{font-size:26px;margin-bottom:4px}
.note{background:var(--accent-soft);border-radius:var(--r-sm);padding:10px 12px;font-size:13.5px}
.stu{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:28px 18px;background:radial-gradient(circle at 20% 0%,var(--primary-soft),transparent 55%),var(--bg)}
.stu-card{width:min(440px,100%);padding:26px}
.stu-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stu-tile{border:1px solid var(--line);border-radius:12px;padding:14px 8px;text-align:center;font-size:14px;background:var(--surface-2)}
.stu-tile svg{width:26px;height:26px;color:var(--primary);display:block;margin:0 auto 4px}
.stu-tile small{display:block;color:var(--muted);font-size:11.5px}
.avatar{width:54px;height:54px;border-radius:50%;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;font:600 22px var(--f-head)}

.soon-page{max-width:680px}
.soon-page ul{padding-left:20px;margin:10px 0 0}
.soon-page li{margin:4px 0}

@media (max-width:1000px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .dash-grid,.two-pane{grid-template-columns:1fr}
}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:40;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30}
  .menu-btn{display:inline-flex}
  .top{padding:12px 16px}
  .content{padding:18px 16px 30px}
  .auth{grid-template-columns:1fr}
  .auth-art{padding:28px;gap:20px}
  .auth-art h1{font-size:28px}
  .top .hide-sm{display:none}
  .grid2,.grid3{grid-template-columns:1fr}
}

/* ---------- เฟส 2: งาน / ตรวจงาน / หน้านักเรียน ---------- */
.asg-list{display:flex;flex-direction:column;gap:12px}
.asg{display:flex;overflow:hidden}
.asg-bar{width:6px;flex:none}
.asg-main{flex:1;min-width:0;padding:16px 18px;display:grid;grid-template-columns:1fr auto;gap:10px 18px;align-items:center}
.asg-title{font:600 17px var(--f-head);margin:0}
.asg-meta{font-size:13.5px;color:var(--muted);display:flex;gap:6px 12px;flex-wrap:wrap;align-items:center}
.asg-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);grid-column:1/-1}
.prog-bar{flex:1;max-width:340px;height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;display:flex}
.prog-bar i{display:block;height:100%}
.due-late{color:var(--danger)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;font-size:14px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--primary);color:var(--primary-ink)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;cursor:pointer;font-size:14px}
.tab.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary);font-weight:600}
.score-in{width:76px!important;text-align:right;font-variant-numeric:tabular-nums}
.kinds{display:inline-flex;gap:3px;color:var(--muted)}
.kinds svg{width:15px;height:15px}
.grader{display:grid;grid-template-columns:1.7fr 1fr;gap:18px;align-items:start}
.gv{display:flex;flex-direction:column;gap:12px;max-height:68vh;overflow:auto;padding-right:4px}
.fv{border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surface-2)}
.fv-h{display:flex;gap:8px;align-items:center;padding:7px 10px;font-size:13px;border-bottom:1px solid var(--line);background:var(--surface)}
.fv-h b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fv img,.fv video{display:block;max-width:100%;max-height:60vh;margin:0 auto;background:#000}
.fv img{background:transparent}
.fv audio{display:block;width:100%;padding:10px}
.fv iframe{display:block;width:100%;height:60vh;border:0;background:#fff}
.fv .ph{padding:30px;text-align:center;color:var(--muted);font-size:14px}
.gs{position:sticky;top:0;display:flex;flex-direction:column;gap:12px}
.gs .big-score{display:flex;align-items:center;gap:8px;font:600 22px var(--f-head)}
.gs .big-score input{width:100px;font-size:22px;text-align:right;padding:6px 10px}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick button{border:1px dashed var(--line);background:var(--surface);border-radius:99px;padding:3px 10px;font-size:13px;cursor:pointer}
.quick button:hover{border-color:var(--primary);color:var(--primary)}
textarea.input{resize:vertical;min-height:90px}

/* นักเรียน */
.stu-wrap{width:min(680px,100%);display:flex;flex-direction:column;gap:14px}
.stu-head{display:flex;align-items:center;gap:12px;padding:16px 18px}
.stu-sum{display:flex;gap:8px;flex-wrap:wrap}
.sa{overflow:hidden}
.sa-h{display:flex;gap:12px;align-items:center;padding:14px 16px;cursor:pointer;width:100%;border:0;background:none;text-align:left}
.sa-h:hover{background:var(--surface-2)}
.sa-dot{width:10px;height:10px;border-radius:50%;flex:none}
.sa-title{font:600 16px var(--f-head)}
.sa-sub{font-size:13px;color:var(--muted)}
.sa-score{font:600 18px var(--f-head);color:var(--ok);white-space:nowrap}
.sa-b{padding:4px 16px 16px 38px;display:flex;flex-direction:column;gap:12px}
.desc{white-space:pre-wrap;font-size:14.5px}
.fb{background:var(--primary-soft);border-radius:var(--r-sm);padding:10px 12px;font-size:14px}
.fb.ret{background:var(--danger-soft)}
.flist{display:flex;flex-direction:column;gap:6px}
.fitem{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-sm);font-size:14px;background:var(--surface)}
.fitem svg{width:18px;height:18px;color:var(--primary);flex:none}
.fitem .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upl-line{font-size:13.5px;display:flex;gap:8px;align-items:center}
.spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--primary);border-radius:50%;animation:sp .7s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.drop.sm{padding:18px}
.drop.sm svg{width:28px;height:28px}
@media (max-width:820px){
  .grader{grid-template-columns:1fr}
  .gv{max-height:none}
  .asg-main{grid-template-columns:1fr}
  .asg-actions{justify-content:flex-start}
  .sa-b{padding-left:16px}
}
.fv-h svg{width:16px;height:16px;flex:none;color:var(--primary)}
.fv-h b{min-width:0;flex:0 1 auto}
.fitem .btn svg{color:var(--danger)}
.asg-meta svg{width:14px;height:14px;vertical-align:-2px}
.chip svg{width:13px;height:13px}
.check svg{width:16px;height:16px;color:var(--muted)}
a.btn{text-decoration:none}
.map-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.map-grid .field{font-size:13px}
.map-grid select.input,.map-grid input.input{padding:6px 8px;font-size:13.5px}
details>summary{list-style:none}
details>summary::-webkit-details-marker{display:none}
.fmt code{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:12.5px}

/* =====================================================================
   ธีม "ห้องเรียนครูปลื้ม" — สดใส โค้งมน แบบวัยรุ่น
   ===================================================================== */
:root{
  --bg:#f6f3ff;--surface:#fff;--surface-2:#f7f4ff;--ink:#231b40;--muted:#6c6690;--line:#e7e1f8;
  --primary:var(--primary);--primary-2:var(--primary-2);--primary-ink:#fff;--primary-soft:#efeaff;
  --accent:#ff9f1c;--accent-soft:#fff1dc;--mint:#14b8a6;--mint-soft:#d9f7f2;--sky:#38a3ff;--sky-soft:#e1f1ff;--pink-soft:#ffe9e4;--sun:var(--sun);
  --danger:#ee3d68;--danger-soft:#ffe4ec;--ok:#12a17f;--ok-soft:#dcf6ee;
  --side:#4b2fd0;--side-ink:#fff;--side-muted:#d9d0ff;--side-hover:rgba(255,255,255,.14);--side-active:var(--sun);
  --shadow:0 1px 0 rgba(35,27,64,.03),0 12px 32px -14px rgba(84,56,200,.28);
  --shadow-pop:0 6px 0 -1px rgba(77,52,190,.18),0 16px 30px -12px rgba(84,56,200,.35);
  --r:22px;--r-sm:13px;
  --f-head:'Mitr','IBM Plex Sans Thai Looped',system-ui,sans-serif;
  --f-body:'IBM Plex Sans Thai Looped','IBM Plex Sans Thai',system-ui,sans-serif;
  --grad:linear-gradient(135deg,var(--primary) 0%,var(--primary-2) 55%,var(--primary-2) 100%);
}
[data-theme=dark]{
  --bg:#13101f;--surface:#1c1730;--surface-2:#231d3b;--ink:#f2eefe;--muted:#a69fc8;--line:#2f2852;
  --primary:var(--primary);--primary-ink:#140f26;--primary-soft:#2b2353;
  --accent:#ffb347;--accent-soft:#3a2b17;--mint-soft:#163a35;--sky-soft:#16304a;--pink-soft:#3b2420;
  --danger:#ff6b8e;--danger-soft:#3d1a26;--ok:#3fd3a9;--ok-soft:#163a30;
  --side:#1a1433;--side-hover:rgba(255,255,255,.07);
  --shadow:0 1px 0 rgba(0,0,0,.3),0 14px 34px -14px rgba(0,0,0,.6);
  --shadow-pop:0 6px 0 -1px rgba(0,0,0,.45),0 16px 30px -12px rgba(0,0,0,.6);
  --grad:linear-gradient(135deg,var(--primary) 0%,var(--primary-2) 55%,var(--primary-2) 100%);
}
body{background:
  radial-gradient(900px 500px at 105% -10%,color-mix(in srgb,var(--primary-2) 16%,transparent),transparent 60%),
  radial-gradient(800px 500px at -10% 110%,color-mix(in srgb,var(--sky) 14%,transparent),transparent 60%),
  var(--bg);background-attachment:fixed}
h1,h2,h3,h4{font-weight:500;letter-spacing:-.005em}
.btn{border-radius:12px;font-weight:500;transition:transform .12s,box-shadow .15s,background .15s,filter .15s}
.btn:active{transform:translateY(1px) scale(.98)}
.btn.primary{background:var(--grad);border:0;color:#fff;box-shadow:0 8px 18px -8px color-mix(in srgb,var(--primary) 70%,transparent)}
.btn.primary:hover{filter:brightness(1.06) saturate(1.05);transform:translateY(-1px)}
.btn.big{padding:13px 18px;font:500 17px var(--f-head);border-radius:15px}
.input{border-radius:12px;border-width:1.5px}
.input.big{padding:12px 14px;font-size:17px}
.input:focus{box-shadow:0 0 0 4px var(--primary-soft)}
.card{border-radius:var(--r);border-color:var(--line)}
.chip{border-radius:99px;font-weight:500}
.chip.pri{background:var(--primary-soft);color:var(--primary)}

/* แถบเมนูข้าง */
.side{background:linear-gradient(170deg,#4b2fd0 0%,var(--primary) 55%,#9a4dff 100%)}
[data-theme=dark] .side{background:linear-gradient(170deg,#1a1433,#211845 60%,#2a1a50)}
.brand-mark{background:linear-gradient(135deg,#ffe066,#ffb347);color:#3b1d6e;border-radius:14px;transform:rotate(-6deg);font:600 21px var(--f-head);box-shadow:0 6px 14px -6px rgba(0,0,0,.35)}
.brand b{font:500 18px var(--f-head)}
.nav-item{border-radius:12px;font-weight:500}
.nav-item.active{background:rgba(255,255,255,.18);box-shadow:none}
.nav-item.active svg{color:var(--side-active)}
.nav-item .soon{background:rgba(255,255,255,.16);color:#fff}
.side-foot{border-top-color:rgba(255,255,255,.18)}
.top{background:color-mix(in srgb,var(--bg) 78%,transparent)}
.top h1{font:500 20px var(--f-head)}
.page-head h2{font-size:26px}

/* การ์ดสถิติ */
.stat .lbl svg{width:30px;height:30px;padding:6px;border-radius:10px;background:var(--primary-soft);color:var(--primary)}
.stats .stat:nth-child(2) .lbl svg{background:var(--sky-soft);color:var(--sky)}
.stats .stat:nth-child(3) .lbl svg{background:var(--mint-soft);color:var(--mint)}
.stats .stat:nth-child(4) .lbl svg{background:var(--accent-soft);color:var(--accent)}
.stat .val{font:500 34px/1.15 var(--f-head)}
.stat{transition:transform .15s}
a.stat:hover{transform:translateY(-2px)}
.phases li.now .dot{background:var(--grad);border-color:transparent}
.phases li.now b{color:var(--primary)}
.subj{transition:transform .15s}
.subj:hover{transform:translateY(-2px)}
.subj-top{height:8px}
.cls-item.active{background:var(--primary-soft)}
.tab.on{background:var(--grad);border-color:transparent;color:#fff}
.seg{border-radius:12px}
.seg button.on{background:var(--grad);color:#fff}
.modal{border-radius:24px}
.modal-h h3{font:500 20px var(--f-head)}
.toast{border-radius:14px;font-weight:500;background:#231b40;color:#fff;box-shadow:0 10px 24px -8px rgba(0,0,0,.4)}
.toast.err{background:var(--danger)}

/* หน้าเข้าสู่ระบบ */
.auth-art{background:var(--grad)}
.auth-art h1{font:500 42px/1.25 var(--f-head);color:#fff}
.auth-art p{color:rgba(255,255,255,.85);font-size:16px}
.auth-art .hl{background:var(--sun);color:#3b1d6e;padding:0 10px;border-radius:12px;display:inline-block;transform:rotate(-2deg)}
.auth-feat div{background:rgba(255,255,255,.14);border-radius:16px;backdrop-filter:blur(4px)}
.auth-feat b{color:#fff}
.deco{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.deco span{position:absolute;font-size:44px;opacity:.9;animation:float 6s ease-in-out infinite;filter:drop-shadow(0 8px 10px rgba(0,0,0,.18))}
.deco span:nth-child(1){top:12%;right:10%}
.deco span:nth-child(2){top:40%;right:22%;animation-delay:-1.5s;font-size:36px}
.deco span:nth-child(3){bottom:30%;right:6%;animation-delay:-3s}
.deco span:nth-child(4){top:60%;right:30%;animation-delay:-2s;font-size:34px}
.deco span:nth-child(5){top:22%;left:56%;animation-delay:-4s;font-size:28px}
.deco span:nth-child(6){top:7%;left:44%;animation-delay:-.7s;font-size:30px;opacity:.7}
@keyframes float{50%{transform:translateY(-12px) rotate(6deg)}}
.stu-cta{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:18px;background:linear-gradient(135deg,#fff3c4,#d8f3ff);color:#3b1d6e;text-decoration:none;box-shadow:var(--shadow-pop);transition:transform .15s}
.stu-cta:hover{transform:translateY(-2px) rotate(-.5deg)}
.stu-cta .em{font-size:34px}
.stu-cta b{font:500 18px var(--f-head);display:block}
.stu-cta small{opacity:.75}
.stu-cta .arr{margin-left:auto;font-size:22px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13.5px;margin:4px 0}
.or::before,.or::after{content:'';flex:1;height:1px;background:var(--line)}

/* ===== โซนนักเรียน ===== */
.stu{background:transparent}
.stu-login{position:relative;padding-top:44px;margin-top:28px}
.stu-hi{position:absolute;top:-32px;left:50%;transform:translateX(-50%);width:68px;height:68px;border-radius:22px;background:var(--grad);display:grid;place-items:center;font-size:34px;box-shadow:var(--shadow-pop);animation:wave 2.4s ease-in-out infinite}
@keyframes wave{0%,60%,100%{transform:translateX(-50%) rotate(0)}70%{transform:translateX(-50%) rotate(-12deg)}80%{transform:translateX(-50%) rotate(10deg)}90%{transform:translateX(-50%) rotate(-6deg)}}
.stu-banner{position:relative;overflow:hidden;border-radius:24px;padding:20px 20px 18px;background:var(--grad);color:#fff;box-shadow:var(--shadow-pop)}
.stu-banner::after{content:'';position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.12)}
.stu-banner h2{font:500 24px var(--f-head);color:#fff}
.stu-banner .pills{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.stu-banner .pill{background:rgba(255,255,255,.2);border-radius:99px;padding:2px 12px;font-size:13.5px}
.stu-banner .acts{position:absolute;top:14px;right:14px;display:flex;gap:6px;z-index:3}
.stu-banner .row{padding-right:110px}
.stu-banner .acts .btn{background:rgba(255,255,255,.2);border:0;color:#fff}
.stu-banner .acts .btn:hover{background:rgba(255,255,255,.3)}
.stu-banner .ava{width:52px;height:52px;border-radius:16px;background:#fff;color:var(--primary);display:grid;place-items:center;font:600 24px var(--f-head);transform:rotate(-5deg);flex:none}
.counters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.counter{border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.counter .em{font-size:26px}
.counter b{font:500 26px/1 var(--f-head);display:block}
.counter small{color:var(--muted);font-size:12.5px}
.counter.todo{background:linear-gradient(135deg,var(--pink-soft),var(--surface))}
.counter.wait{background:linear-gradient(135deg,var(--accent-soft),var(--surface))}
.counter.done{background:linear-gradient(135deg,var(--mint-soft),var(--surface))}
.sec-title{font:500 17px var(--f-head);margin:6px 2px -4px;display:flex;align-items:center;gap:8px}
.sa{border-radius:22px;transition:transform .15s,box-shadow .15s;border-width:1.5px}
.sa:hover{transform:translateY(-2px)}
.sa.open{border-color:color-mix(in srgb,var(--primary) 45%,var(--line))}
.sa-h{padding:16px 18px;gap:14px}
.sa-h:hover{background:transparent}
.sa-ico{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:22px;flex:none}
.sa-title{font:500 17px var(--f-head);line-height:1.35}
.sa-tag{display:inline-block;font-size:12px;font-weight:600;padding:1px 9px;border-radius:99px;margin-bottom:3px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap}
.badge.todo{background:var(--pink-soft);color:var(--danger)}
.badge.wait{background:var(--accent-soft);color:color-mix(in srgb,var(--accent) 70%,var(--ink))}
.badge.ret{background:var(--danger-soft);color:var(--danger)}
.badge.late{background:var(--danger-soft);color:var(--danger)}
.score-bubble{display:flex;flex-direction:column;align-items:center;justify-content:center;width:62px;height:62px;border-radius:20px;background:linear-gradient(135deg,var(--sun),#ff9f1c);color:#3b1d6e;box-shadow:0 8px 16px -8px rgba(255,159,28,.8);transform:rotate(4deg);flex:none}
.score-bubble b{font:600 22px/1 var(--f-head)}
.score-bubble small{font-size:11px;font-weight:600;opacity:.8}
.sa-b{padding:0 18px 18px 18px;gap:14px}
.desc{background:var(--surface-2);border-radius:14px;padding:12px 14px}
.fb{border-radius:16px 16px 16px 4px;padding:12px 14px;background:var(--primary-soft);position:relative}
.fb b{font-family:var(--f-head);font-weight:500}
.fb.ret{background:var(--danger-soft)}
.fb.star{background:linear-gradient(135deg,var(--mint-soft),var(--primary-soft))}
.lbl-sm{font:500 14px var(--f-head);color:var(--muted);margin-bottom:-6px}

/* ไทล์ไฟล์ + พรีวิว */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.tile{position:relative;border-radius:16px;overflow:hidden;background:var(--surface);border:1.5px solid var(--line);box-shadow:var(--shadow);animation:pop .25s}
.tile .th{aspect-ratio:4/3;display:grid;place-items:center;background:var(--surface-2);position:relative;overflow:hidden}
.tile .th img{width:100%;height:100%;object-fit:cover;display:block}
.tile .th .play{position:absolute;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;font-size:14px}
.tile .ext{font:600 22px var(--f-head);letter-spacing:.02em;padding:6px 12px;border-radius:12px;color:#fff}
.tile .ext.k-image{background:#38a3ff}.tile .ext.k-video{background:#f97316}.tile .ext.k-audio{background:#14b8a6}.tile .ext.k-document{background:var(--primary)}
.tile .ext.e-pdf{background:#ee3d68}.tile .ext.e-doc,.tile .ext.e-docx{background:#2b6cdf}.tile .ext.e-ppt,.tile .ext.e-pptx{background:#e5641e}.tile .ext.e-xls,.tile .ext.e-xlsx,.tile .ext.e-csv{background:#12a17f}.tile .ext.e-zip,.tile .ext.e-rar{background:#8a6d3b}
.tile .meta{padding:7px 9px 8px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .sub{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--muted)}
.tile .ext-pill{font-weight:700;font-size:10.5px;padding:0 6px;border-radius:6px;background:var(--primary-soft);color:var(--primary);text-transform:uppercase}
.tile .rm{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:var(--danger);display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2);font-size:15px;line-height:1}
.tile .rm:hover{transform:scale(1.08)}
.tile .state{position:absolute;inset:0;display:grid;place-items:center;background:rgba(35,27,64,.45);color:#fff;font-size:28px;backdrop-filter:blur(1px)}
.tile .state .spin{width:30px;height:30px;border-width:3px;border-color:rgba(255,255,255,.35);border-top-color:#fff}
.tile.ok .state{background:rgba(18,161,127,.55)}
.tile.bad{border-color:var(--danger)}
.tile.bad .state{background:rgba(238,61,104,.6)}
.tile .err{font-size:11.5px;color:var(--danger);font-weight:600}
.tile.sent::after{content:'✓ ส่งแล้ว';position:absolute;top:6px;left:6px;font-size:11px;font-weight:700;background:var(--ok);color:#fff;border-radius:99px;padding:1px 8px}
.drop.cute{border:2.5px dashed color-mix(in srgb,var(--primary) 35%,var(--line));border-radius:20px;background:var(--surface-2);padding:20px;display:flex;flex-direction:column;align-items:center;gap:2px}
.drop.cute:hover,.drop.cute.over{background:var(--primary-soft);border-color:var(--primary)}
.drop.cute .em{font-size:34px;animation:float 3s ease-in-out infinite}
.drop.cute b{font:500 17px var(--f-head);margin:4px 0 0}
.send-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.send-bar .btn.primary{flex:1;justify-content:center}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti i{position:absolute;top:-30px;font-style:normal;font-size:24px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.2}}
.lock-note{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--surface-2);font-size:14px}
.lock-note .em{font-size:22px}

/* ตารางตรวจงาน: รูปย่อ */
.mini-th{display:inline-flex;gap:4px;vertical-align:middle}
.mini-th img,.mini-th span{width:30px;height:30px;border-radius:8px;object-fit:cover;border:1px solid var(--line);display:inline-grid;place-items:center;font-size:9px;font-weight:700;color:#fff}
@media (max-width:820px){
  .auth-art h1{font-size:30px}
  .deco span{font-size:30px}
  .counters{gap:6px}
  .counter{padding:10px;flex-direction:column;text-align:center;gap:2px}
  .counter .em{font-size:22px}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .stu-banner{padding-top:58px}
  .stu-banner .row{padding-right:0}
  .auth-art .deco{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.tab.on .muted{color:rgba(255,255,255,.85)}

/* =====================================================================
   Liquid Glass — กระจกโปร่งแสง ปุ่มแคปซูล แสงสะท้อน (โหลดเป็นไฟล์สุดท้าย)
   ===================================================================== */
:root{
  --glass:rgba(255,255,255,.58);
  --glass-strong:rgba(255,255,255,.78);
  --glass-line:rgba(255,255,255,.75);
  --glass-edge:rgba(120,110,190,.18);
  --glass-hi:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.25);
  --glass-shadow:0 1px 2px rgba(40,30,90,.06),0 10px 30px -12px rgba(40,30,110,.28);
  --blur:blur(22px) saturate(180%);
}
[data-theme=dark]{
  --glass:rgba(34,30,58,.55);
  --glass-strong:rgba(44,40,72,.78);
  --glass-line:rgba(255,255,255,.12);
  --glass-edge:rgba(0,0,0,.35);
  --glass-hi:inset 0 1px 0 rgba(255,255,255,.14),inset 0 -1px 0 rgba(255,255,255,.03);
  --glass-shadow:0 1px 2px rgba(0,0,0,.4),0 14px 34px -12px rgba(0,0,0,.65);
}

/* พื้นหลังแบบ mesh ให้กระจกมีสีให้หักเห */
body{background:
  radial-gradient(40vw 40vw at 0% 0%,color-mix(in srgb,var(--primary) 30%,transparent),transparent 60%),
  radial-gradient(38vw 38vw at 100% 8%,color-mix(in srgb,var(--primary-2) 26%,transparent),transparent 60%),
  radial-gradient(45vw 45vw at 85% 100%,rgba(255,179,71,.20),transparent 60%),
  radial-gradient(40vw 40vw at 10% 95%,rgba(20,184,166,.18),transparent 60%),
  var(--bg);background-attachment:fixed}
[data-theme=dark] body{background:
  radial-gradient(40vw 40vw at 0% 0%,color-mix(in srgb,var(--primary) 35%,transparent),transparent 60%),
  radial-gradient(38vw 38vw at 100% 8%,color-mix(in srgb,var(--primary-2) 22%,transparent),transparent 60%),
  radial-gradient(45vw 45vw at 85% 100%,rgba(255,179,71,.10),transparent 60%),
  var(--bg);background-attachment:fixed}

/* ---------- พื้นผิวกระจก ---------- */
.card,.top,.side,.modal,.counter,.tile,.fmt,.sheet{
  background:var(--glass);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border:1px solid var(--glass-line);
  box-shadow:var(--glass-hi),var(--glass-shadow);
}
.card{border-radius:26px}
.modal{background:var(--glass-strong);border-radius:30px}
.modal-bg{background:rgba(20,16,40,.28);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.modal-f{border-top:1px solid var(--glass-edge)}
.card-h,.toolbar,.subj-foot{border-color:var(--glass-edge)}
.subj-foot,.toolbar[style*="surface-2"]{background:rgba(255,255,255,.25)!important}
[data-theme=dark] .subj-foot,[data-theme=dark] .toolbar[style*="surface-2"]{background:rgba(255,255,255,.03)!important}

/* แถบเมนูข้าง: แผ่นกระจกลอย */
.shell{grid-template-columns:268px 1fr}
.side{position:sticky;top:12px;margin:12px 0 12px 12px;height:calc(100vh - 24px);border-radius:28px;color:var(--ink);padding:18px 12px}
.side .brand small,.nav-group,.side-foot{color:var(--muted)}
.side-foot{border-top:1px solid var(--glass-edge)}
.nav-item{color:var(--ink);border-radius:999px;padding:9px 14px;transition:background .2s,box-shadow .2s,transform .15s}
.nav-item svg{opacity:.75}
.nav-item:hover{background:rgba(255,255,255,.5)}
[data-theme=dark] .nav-item:hover{background:rgba(255,255,255,.07)}
.nav-item.active{background:var(--glass-strong);box-shadow:var(--glass-hi),0 6px 16px -8px rgba(60,40,160,.45);font-weight:600;color:var(--primary)}
[data-theme=dark] .nav-item.active{color:#fff;background:rgba(255,255,255,.12)}
.nav-item.active svg{color:var(--primary);opacity:1}
[data-theme=dark] .nav-item.active svg{color:#c9bfff}
.nav-item .soon{background:var(--primary-soft);color:var(--primary)}

/* แถบบน: กระจกลอย */
.top{position:sticky;top:12px;margin:12px 12px 0 18px;border-radius:999px;padding:10px 12px 10px 24px;z-index:6}
.content{padding:24px 28px 40px 34px}
.credit{color:var(--muted)}

/* ---------- ปุ่มกระจก (แคปซูล + แสงสะท้อน) ---------- */
.btn{
  position:relative;isolation:isolate;overflow:hidden;
  border-radius:999px;padding:8px 16px;
  background:var(--glass);border:1px solid var(--glass-line);color:var(--ink);
  -webkit-backdrop-filter:blur(14px) saturate(180%);backdrop-filter:blur(14px) saturate(180%);
  box-shadow:var(--glass-hi),0 1px 2px rgba(40,30,90,.08),0 6px 16px -10px rgba(40,30,110,.35);
  transition:transform .18s cubic-bezier(.3,.7,.4,1.4),box-shadow .2s,background .2s,filter .2s;
}
.btn::before{ /* ไฮไลต์ด้านบน */
  content:'';position:absolute;inset:1px 1px 50% 1px;border-radius:999px 999px 40% 40%/999px 999px 14px 14px;
  background:linear-gradient(180deg,rgba(255,255,255,.65),rgba(255,255,255,0));pointer-events:none;z-index:-1;opacity:.85;
}
[data-theme=dark] .btn::before{background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,0))}
.btn:hover{background:var(--glass-strong);transform:translateY(-1px) scale(1.02);border-color:var(--glass-line)}
.btn:active{transform:scale(.97)}
.btn.icon{width:38px;height:38px;padding:0}
.btn.sm{padding:6px 13px}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.btn.ghost::before{display:none}
.btn.ghost:hover{background:var(--glass);border-color:var(--glass-line);box-shadow:var(--glass-hi)}
.btn.primary{
  background:linear-gradient(180deg,rgba(116,96,255,.92),rgba(79,92,255,.92) 55%,rgba(50,140,245,.92));
  color:#fff;border:1px solid rgba(255,255,255,.35);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 6px rgba(20,10,90,.25),0 8px 22px -10px rgba(79,92,255,.9);
}
.btn.primary::before{background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0))}
.btn.primary:hover{filter:brightness(1.07) saturate(1.1);background:linear-gradient(180deg,rgba(116,96,255,.96),rgba(79,92,255,.96) 55%,rgba(50,140,245,.96))}
.btn.danger{color:var(--danger)}
.btn.danger.solid{background:linear-gradient(180deg,rgba(255,92,120,.95),rgba(226,52,90,.95));color:#fff;border-color:rgba(255,255,255,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 20px -10px rgba(226,52,90,.9)}
.btn.line{background:linear-gradient(180deg,#2ad56a,#06b84d);color:#fff;border-color:rgba(255,255,255,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 20px -10px rgba(6,184,77,.9)}
.btn.line::before{background:linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,0))}
.line-logo{font:800 11px/1 system-ui;background:#fff;color:#06b84d;border-radius:6px;padding:3px 5px;letter-spacing:.02em}
.btn:disabled{filter:grayscale(.4);opacity:.55;transform:none}

/* อินพุตกระจก */
.input,select.input,textarea.input{background:rgba(255,255,255,.72);border:1px solid rgba(110,100,180,.28);box-shadow:inset 0 1px 2px rgba(40,30,90,.06);border-radius:14px}
[data-theme=dark] .input,[data-theme=dark] select.input,[data-theme=dark] textarea.input{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.14)}
.input:focus{border-color:rgba(91,77,255,.55);box-shadow:0 0 0 4px rgba(91,77,255,.15)}

/* ชิป / แท็บ / segmented control แบบ iOS */
.chip{background:rgba(255,255,255,.55);border:1px solid var(--glass-line);box-shadow:var(--glass-hi);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
[data-theme=dark] .chip{background:rgba(255,255,255,.06)}
.chip.ok,.chip.warn,.chip.bad,.chip.pri{border-color:transparent;box-shadow:none}
.seg{background:rgba(120,110,190,.14);border:0;border-radius:999px;padding:3px;gap:2px;box-shadow:inset 0 1px 3px rgba(40,30,90,.12)}
.seg button{border:0!important;border-radius:999px;padding:6px 14px;font-weight:500;color:var(--muted);transition:background .2s,color .2s,box-shadow .2s}
.seg button.on{background:var(--glass-strong);color:var(--ink);box-shadow:var(--glass-hi),0 3px 10px -4px rgba(40,30,110,.45)}
[data-theme=dark] .seg button.on{background:rgba(255,255,255,.16)}
.tab{border-radius:999px;background:var(--glass);border:1px solid var(--glass-line);box-shadow:var(--glass-hi)}
.tab.on{background:linear-gradient(180deg,rgba(116,96,255,.92),rgba(79,92,255,.92));color:#fff;border-color:rgba(255,255,255,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 16px -8px rgba(79,92,255,.9)}
.check,.radio{background:rgba(255,255,255,.45);border-color:var(--glass-line);border-radius:14px}
[data-theme=dark] .check,[data-theme=dark] .radio{background:rgba(255,255,255,.04)}
.check:has(input:checked),.radio:has(input:checked){background:rgba(91,77,255,.12);border-color:rgba(91,77,255,.45)}

/* ตาราง */
.tbl th{background:rgba(255,255,255,.35);border-color:var(--glass-edge);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
[data-theme=dark] .tbl th{background:rgba(255,255,255,.04)}
.tbl td{border-color:var(--glass-edge)}
.tbl tr:hover td{background:rgba(255,255,255,.35)}
[data-theme=dark] .tbl tr:hover td{background:rgba(255,255,255,.03)}

/* การ์ดสถิติ / งาน */
.stat .lbl svg{border-radius:12px;box-shadow:var(--glass-hi)}
.asg-bar{width:5px;margin:14px 0 14px 12px;border-radius:99px}
.prog-bar{background:rgba(120,110,190,.15);border:0;height:9px}
.cls-item{border-radius:16px}
.cls-item.active{background:var(--glass-strong);box-shadow:var(--glass-hi),0 6px 16px -10px rgba(60,40,160,.5)}
.bulk{background:rgba(255,179,71,.18)}
.toast{background:rgba(30,24,56,.82);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.15);border-radius:999px;padding:10px 20px}

/* ---------- แผงส่งลิงก์ ---------- */
.share{display:flex;gap:22px;align-items:flex-start}
.share-qr{display:flex;flex-direction:column;align-items:center;gap:10px}
.qr-box{width:200px;height:200px;border-radius:22px;background:#fff;padding:10px;box-shadow:var(--glass-hi),var(--glass-shadow);display:grid;place-items:center}
.qr-box svg{width:100%;height:100%}
.qr-miss{color:var(--muted);text-align:center;gap:6px;background:var(--glass)}
.qr-miss svg{width:42px;height:42px}
.present{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:24px;background:
  radial-gradient(50vw 50vw at 0% 0%,color-mix(in srgb,var(--primary) 55%,transparent),transparent 60%),radial-gradient(50vw 50vw at 100% 100%,color-mix(in srgb,var(--primary-2) 50%,transparent),transparent 60%),#1b1640;animation:fade .2s}
.present-card{background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border-radius:36px;padding:30px 40px;text-align:center;box-shadow:0 30px 80px -20px rgba(0,0,0,.6);max-width:92vw;color:#231b40}
.present-card .brand{justify-content:center;padding:0 0 6px}
.present-card .brand small{color:#6c6690}
.present-card h2{font:500 clamp(22px,3.4vw,40px) var(--f-head);margin:6px 0 14px}
.present-qr{width:min(56vh,72vw);height:min(56vh,72vw);margin:0 auto;background:#fff;border-radius:24px;padding:12px}
.present-qr svg{width:100%;height:100%}
.present-url{font:500 clamp(16px,2.2vw,26px) var(--f-head);color:var(--primary);margin-top:12px;word-break:break-all}
.present p{margin:6px 0 0;color:#6c6690}
.present-x{position:absolute;top:18px;right:18px;color:#fff;background:rgba(255,255,255,.18)}

@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;top:10px;left:10px;bottom:10px;margin:0;height:auto;width:260px;transform:translateX(-120%)}

.perm .sw{width:38px;height:22px;border-radius:99px;background:rgba(120,120,140,.35);flex:none;position:relative;transition:background .2s}
.perm .sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.perm.on .sw{background:#22c55e}.perm.on .sw::after{transform:translateX(16px)}
.perm input:focus-visible~.sw{outline:2px solid var(--primary);outline-offset:2px}
.perm.dis{cursor:not-allowed;opacity:.6}
.perm.fixed{cursor:default;border-style:dashed;background:transparent}
.perm.fixed>svg{width:16px;height:16px;color:var(--muted)}
.uc-f{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--glass-line)}
.uc-f select.input.sm-sel{width:auto;flex:none;max-width:220px;padding:6px 10px;font-size:13px}
.howto{margin:0 0 14px;padding-left:22px;line-height:1.8}
.pending-card{max-width:440px;text-align:center;padding:32px 28px}
.pending-card h2{font-family:var(--f-head);font-weight:500;margin:8px 0 6px}
@media (max-width:720px){.role-grid{grid-template-columns:1fr}}
.auth-switch{text-align:center;font-size:14px;color:var(--muted)}
.linkbtn{background:none;border:0;padding:0;font:inherit;font-weight:600;color:var(--primary);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
[data-theme=dark] .linkbtn{color:var(--primary)}
.signup-info{font-size:13px;padding:9px 12px;border-radius:12px;background:rgba(245,158,11,.12);color:var(--text)}
.signup-done{text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;padding:12px 0}
.signup-done b{font:500 20px var(--f-head)}
.nav-badge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:#f59e0b;color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.uc-msg{margin-top:10px;padding:8px 12px;border-radius:12px;background:var(--surface-2);font-size:13.5px}

/* =====================================================================
   เวอร์ชันมือถือ (≤ 760px) — ใช้คู่กับ mobile.js
   ===================================================================== */
.m-shell{min-height:100vh;min-height:100dvh}
[data-device=mobile] body{font-size:15.5px}
.m-top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:var(--bar);border-bottom:1px solid var(--bar-line);
  -webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px)}
.m-top h1{font:600 18px var(--f-head);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-mark.sm{width:32px;height:32px;border-radius:9px;font-size:17px;flex:none}
.m-shell .content{padding:16px 14px calc(96px + env(safe-area-inset-bottom));max-width:none}

/* แท็บล่าง */
.m-tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:var(--bar);border-top:1px solid var(--bar-line);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.m-tabs a,.m-tabs button{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px 4px;border:0;background:none;
  color:var(--muted);text-decoration:none;font:500 11.5px var(--f-body);cursor:pointer;border-radius:12px;min-height:52px;-webkit-tap-highlight-color:transparent}
.m-tabs svg{width:23px;height:23px;padding:3px 14px;box-sizing:content-box;border-radius:99px;transition:background .2s}
.m-tabs .on{color:var(--ink);font-weight:600}
.m-tabs .on svg{background:var(--primary-soft);color:var(--primary)}
.m-dot{position:absolute;top:6px;right:calc(50% - 20px);width:9px;height:9px;border-radius:50%;background:var(--hl);border:2px solid var(--surface)}

/* แผ่นเมนูเพิ่มเติม */
.m-sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(14,20,32,.4);display:flex;align-items:flex-end;animation:fade .15s}
.m-sheet{width:100%;background:var(--surface);border-radius:20px 20px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));box-shadow:var(--shadow-pop);animation:m-up .22s cubic-bezier(.2,.8,.2,1)}
.m-grab{width:40px;height:5px;border-radius:99px;background:var(--line-2);margin:2px auto 14px}
.m-me{display:flex;gap:12px;align-items:center;padding:0 4px 14px;border-bottom:1px solid var(--line)}
.m-me b{display:block;font:600 16px var(--f-head)}.m-me small{color:var(--muted);font-size:13px}
.m-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px 0}
.m-grid a{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:13px;font-weight:500;text-align:center}
.m-grid a svg{width:24px;height:24px;color:var(--primary)}
.m-grid a.on{border-color:var(--primary);background:var(--primary-soft)}
.m-grid .nav-badge{position:absolute;top:6px;right:8px;font-style:normal}
.m-list{display:flex;flex-direction:column;border-top:1px solid var(--line);padding-top:6px}
.m-list button{display:flex;align-items:center;gap:12px;padding:12px 6px;border:0;background:none;color:var(--ink);font:500 15px var(--f-body);text-align:left;cursor:pointer;border-radius:10px}
.m-list button svg{width:20px;height:20px;color:var(--muted)}
.m-list button.danger,.m-list button.danger svg{color:var(--danger)}
@keyframes m-up{from{transform:translateY(100%)}to{transform:none}}

/* ---------- เนื้อหาบนมือถือ ---------- */
[data-device=mobile] .page-head{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:16px}
[data-device=mobile] .page-head>div:first-child{grid-column:1/-1;margin-bottom:4px}
[data-device=mobile] .page-head h2{font-size:22px}
[data-device=mobile] .page-head .spacer{display:none}
[data-device=mobile] .page-head>.btn,[data-device=mobile] .page-head>select{width:100%;justify-content:center;padding:11px 14px}
[data-device=mobile] .stats{grid-template-columns:1fr 1fr;gap:10px}
[data-device=mobile] .stat{padding:12px 14px}
[data-device=mobile] .stat .val{font-size:26px}
[data-device=mobile] .dash-grid,[data-device=mobile] .grid2,[data-device=mobile] .grid3,[data-device=mobile] .role-grid{grid-template-columns:1fr!important}
[data-device=mobile] .field,[data-device=mobile] .field .input{min-width:0;max-width:100%}
[data-device=mobile] .card-h{padding:14px 16px;flex-wrap:wrap}
[data-device=mobile] .card-b{padding:14px 16px}
[data-device=mobile] .toolbar{flex-wrap:wrap;padding:12px 14px}
[data-device=mobile] .toolbar .search{flex:1 1 100%}
[data-device=mobile] .btn{min-height:40px}
[data-device=mobile] .btn.sm{min-height:36px}
[data-device=mobile] .btn.icon{width:40px;height:40px}
[data-device=mobile] .input{font-size:16px} /* กัน iOS ซูมอัตโนมัติ */
[data-device=mobile] .picker-row{flex-direction:column;align-items:stretch;gap:6px}
[data-device=mobile] .picker-lbl{width:auto}
[data-device=mobile] .picker select.input{max-width:none!important}
[data-device=mobile] .room-chips{display:grid;grid-template-columns:repeat(3,1fr)}
[data-device=mobile] .perm-grid{grid-template-columns:1fr}
[data-device=mobile] .uc-f{flex-direction:column;align-items:stretch}
[data-device=mobile] .uc-f .spacer{display:none}
[data-device=mobile] .uc-f select.input.sm-sel{max-width:none;width:100%}
[data-device=mobile] .toasts{bottom:calc(86px + env(safe-area-inset-bottom))}

/* ตาราง → การ์ดรายการ (ยกเว้นตารางคะแนนซึ่งเลื่อนแนวนอนได้) */
[data-device=mobile] .tbl-wrap{overflow:visible;border:0}
[data-device=mobile] table.tbl,[data-device=mobile] table.tbl tbody{display:block;width:100%}
[data-device=mobile] table.tbl thead{display:none}
[data-device=mobile] table.tbl tr{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;padding:12px 16px;border-bottom:1px solid var(--line)}
[data-device=mobile] table.tbl tr:last-child{border-bottom:0}
[data-device=mobile] table.tbl tr[hidden]{display:none}
[data-device=mobile] table.tbl td{display:flex;align-items:center;gap:8px;border:0;padding:0;background:none!important;min-width:0}
[data-device=mobile] table.tbl td[data-label]:not([data-label=""])::before{content:attr(data-label);color:var(--muted);font-size:12.5px;font-weight:500}
[data-device=mobile] table.tbl td:empty{display:none}
[data-device=mobile] table.tbl td.act{flex:1 1 100%;justify-content:flex-end;flex-wrap:wrap}
[data-device=mobile] table.tbl td .input{max-width:120px}
[data-device=mobile] table.tbl td:has(input[type=checkbox]:only-child){order:-1}

/* หน้าต่าง → แผ่นเลื่อนจากล่าง */
[data-device=mobile] .modal-bg{display:flex;align-items:flex-end;justify-content:center;padding:0}
[data-device=mobile] .modal,[data-device=mobile] .modal.wide{width:100%;max-width:100%;min-width:0;max-height:92dvh;border-radius:20px 20px 0 0;border-bottom:0;animation:m-up .24s cubic-bezier(.2,.8,.2,1)}
[data-device=mobile] .modal-h{padding:16px 18px 4px}
[data-device=mobile] .modal-b{padding:12px 18px;overflow-x:hidden}
[data-device=mobile] .modal-b .row,[data-device=mobile] .modal-b .checks{flex-wrap:wrap}
[data-device=mobile] .modal-f{padding:12px 18px calc(14px + env(safe-area-inset-bottom));flex-wrap:wrap}
[data-device=mobile] .modal-f .btn{flex:1;justify-content:center;min-height:46px}

/* หน้าเข้าสู่ระบบบนมือถือ */
[data-device=mobile] .auth{grid-template-columns:1fr}
[data-device=mobile] .auth-art{padding:28px 20px 24px;gap:12px}
[data-device=mobile] .auth-art h1{font-size:30px}
[data-device=mobile] .auth-feat{display:none}
[data-device=mobile] .auth-form{padding:20px 16px 40px;align-items:start}

/* =====================================================================
   ห้องเรียนครูปลื้ม · Liquid Glass (แนว iOS 26)
   หลัก: ปุ่ม/เมนู = กระจกเหลวลอยบนวอลเปเปอร์สีพาสเทล · เนื้อหา = การ์ดขาวทึบอ่านง่าย
   ภาพประกอบ: art.js  · โหลดเป็นไฟล์สุดท้าย
   ===================================================================== */
:root{
  --bg:#EEF3FB;--surface:#FFFFFF;--surface-2:#F5F7FB;--ink:#111827;--muted:#5B6478;--line:#E6EAF2;--line-2:#D3DAE6;
  --fill:rgba(118,128,150,.10);
  --primary:#0A7CFF;--primary-2:#5AA9FF;--primary-ink:#fff;--primary-soft:#E3F0FF;
  --indigo:#5E5CE6;--teal:#30B0C7;--green:#34C759;--orange:#FF9F0A;--yellow:#FFD60A;
  --accent:#C26A00;--accent-soft:#FFF1DB;--sun:#FFD60A;--hl:#FFD60A;--hl-soft:#FFF6CC;
  --mint:#1F9D55;--mint-soft:#E3F7EA;--sky:#0A7CFF;--sky-soft:#E3F0FF;--pink-soft:#FFE9E3;
  --danger:#E5383B;--danger-soft:#FDE9E9;--ok:#1F9D55;--ok-soft:#E3F7EA;--redpen:#E5383B;--redpen-soft:#FDE9E9;
  --side:transparent;--side-ink:var(--ink);--side-muted:var(--muted);--side-hover:var(--fill);--side-active:var(--primary);
  --r:22px;--r-sm:14px;
  --shadow:0 1px 2px rgba(16,24,48,.04),0 10px 30px -14px rgba(16,24,48,.16);
  --shadow-pop:0 24px 60px -20px rgba(16,24,48,.35);
  --f-head:'Anuphan','Noto Sans Thai',-apple-system,system-ui,sans-serif;
  --f-body:'Noto Sans Thai','Anuphan',-apple-system,system-ui,sans-serif;
  --grad:linear-gradient(135deg,#0A7CFF,#5E5CE6);
  /* กระจกเหลว */
  --lg:rgba(255,255,255,.46);--lg-strong:rgba(255,255,255,.72);
  --lg-blur:blur(16px) saturate(190%);
  --lg-rim:inset 0 0 0 .5px rgba(255,255,255,.75),inset 1.5px 1.5px 1px -1px rgba(255,255,255,1),inset -1px -1px 1px -.5px rgba(255,255,255,.6),inset 0 0 10px rgba(255,255,255,.35);
  --lg-edge:0 0 0 .5px rgba(16,24,48,.10);
  --lg-drop:0 1px 2px rgba(16,24,48,.06),0 8px 22px -8px rgba(16,24,48,.22);
  --bar:rgba(255,255,255,.55);--bar-line:rgba(255,255,255,.7);
  /* ปิดชุดกระจกเก่า */
  --glass:var(--surface);--glass-strong:var(--surface);--glass-line:var(--line);--glass-edge:var(--line);--glass-hi:0 0 0 transparent;--glass-shadow:var(--shadow);--blur:none;
}
[data-theme=dark]{
  --bg:#0B0F17;--surface:#161B25;--surface-2:#1C2230;--ink:#F1F4FA;--muted:#9AA3B6;--line:#252C3A;--line-2:#333B4C;
  --fill:rgba(160,170,200,.12);
  --primary:#3D9BFF;--primary-2:#7DBBFF;--primary-ink:#fff;--primary-soft:#12294A;
  --accent:#FFB340;--accent-soft:#3A2A10;--hl-soft:#3A3210;--mint-soft:#12301F;--sky-soft:#12294A;--pink-soft:#3A1F1A;
  --danger:#FF6467;--danger-soft:#3A1718;--ok:#4AD07A;--ok-soft:#12301F;--redpen:#FF6467;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -14px rgba(0,0,0,.6);--shadow-pop:0 24px 60px -20px rgba(0,0,0,.8);
  --lg:rgba(60,68,90,.38);--lg-strong:rgba(60,68,90,.62);
  --lg-rim:inset 0 0 0 .5px rgba(255,255,255,.16),inset 1.5px 1.5px 1px -1px rgba(255,255,255,.35),inset -1px -1px 1px -.5px rgba(255,255,255,.12),inset 0 0 10px rgba(255,255,255,.05);
  --lg-edge:0 0 0 .5px rgba(0,0,0,.4);
  --lg-drop:0 1px 2px rgba(0,0,0,.4),0 10px 24px -8px rgba(0,0,0,.6);
  --bar:rgba(22,27,37,.55);--bar-line:rgba(255,255,255,.08);
  --glass:var(--surface);--glass-strong:var(--surface);--glass-line:var(--line);--glass-edge:var(--line);
}

/* ---------- วอลเปเปอร์ ---------- */
body,[data-theme=dark] body{color:var(--ink);font:15.5px/1.65 var(--f-body);background-color:var(--bg);background-attachment:fixed;
  background-image:radial-gradient(48vw 48vw at 4% -6%,#CFE2FF,transparent 62%),radial-gradient(40vw 40vw at 100% 6%,#D6F3EC,transparent 62%),
  radial-gradient(46vw 46vw at 92% 104%,#FFE5CC,transparent 62%),radial-gradient(40vw 40vw at -4% 100%,#E4DDFF,transparent 62%)}
[data-theme=dark] body{background-image:radial-gradient(48vw 48vw at 4% -6%,#13284D,transparent 62%),radial-gradient(40vw 40vw at 100% 6%,#0F2E2A,transparent 62%),
  radial-gradient(46vw 46vw at 92% 104%,#33220F,transparent 62%),radial-gradient(40vw 40vw at -4% 100%,#221A44,transparent 62%)}
h1,h2,h3,h4{font-family:var(--f-head);font-weight:600;letter-spacing:-.005em;line-height:1.3}
a{color:var(--primary)}
:focus-visible{outline:2.5px solid var(--primary);outline-offset:2px}
::selection{background:color-mix(in srgb,var(--primary) 25%,transparent)}

/* ---------- การ์ดเนื้อหา (ทึบ อ่านง่าย) ---------- */
.card,[data-theme=dark] .card{background:var(--surface);border:0;border-radius:var(--r);box-shadow:var(--shadow);-webkit-backdrop-filter:none;backdrop-filter:none}
.card-h{border-bottom:1px solid var(--line);padding:16px 20px}
.card-h h3{font:600 17px var(--f-head)}
.fmt,.tile,.counter{-webkit-backdrop-filter:none;backdrop-filter:none}
.fmt{background:var(--surface-2);border:0;border-radius:16px;box-shadow:none}
.subj-foot,.toolbar[style*="surface-2"],[data-theme=dark] .subj-foot{background:var(--surface-2)!important}

/* =====================================================================
   ปุ่มกระจกเหลว
   ===================================================================== */
.btn{position:relative;isolation:isolate;overflow:hidden;border:0;border-radius:999px;padding:9px 18px;font:500 15px var(--f-body);color:var(--ink);
  background:var(--lg);-webkit-backdrop-filter:var(--lg-blur);backdrop-filter:var(--lg-blur);
  box-shadow:var(--lg-rim),var(--lg-edge),var(--lg-drop);
  transition:transform .35s cubic-bezier(.2,1.4,.4,1),box-shadow .2s,background .2s,filter .2s}
.btn::before,[data-theme=dark] .btn::before{display:block;content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;opacity:.9;
  background:radial-gradient(90px circle at var(--mx,30%) var(--my,-10%),rgba(255,255,255,.75),rgba(255,255,255,0) 70%),
  linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 55%)}
[data-theme=dark] .btn::before{background:radial-gradient(90px circle at var(--mx,30%) var(--my,-10%),rgba(255,255,255,.18),rgba(255,255,255,0) 70%),linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,0) 55%)}
.btn:hover{background:var(--lg-strong);transform:translateY(-1px);border:0}
.btn:active{transform:scale(.95);filter:brightness(1.06);transition-duration:.12s}
.btn.sm{padding:6px 14px;font-size:14px}
.btn.icon{width:40px;height:40px;padding:0;justify-content:center}
.btn.icon.sm{width:34px;height:34px}
.btn.ghost{background:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.btn.ghost::before{display:none}
.btn.ghost:hover{background:var(--fill);box-shadow:none}
/* ปุ่มหลัก: กระจกย้อมสีฟ้า */
.btn.primary,.btn.primary:hover{color:#fff;background:linear-gradient(180deg,rgba(64,150,255,.96),rgba(10,112,240,.96));
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.45),inset 1.5px 1.5px 1px -1px rgba(255,255,255,.9),inset 0 -6px 12px -6px rgba(0,40,120,.35),0 1px 2px rgba(10,80,200,.2),0 10px 24px -10px rgba(10,112,240,.75);filter:none}
.btn.primary:hover{filter:brightness(1.05) saturate(1.05)}
.btn.primary::before{background:radial-gradient(90px circle at var(--mx,30%) var(--my,-10%),rgba(255,255,255,.55),rgba(255,255,255,0) 70%),linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 50%)}
.btn.danger{color:var(--danger)}
.btn.danger.solid,.btn.danger.solid:hover{color:#fff;background:linear-gradient(180deg,rgba(255,90,92,.96),rgba(220,40,45,.96));box-shadow:inset 0 0 0 .5px rgba(255,255,255,.4),inset 1.5px 1.5px 1px -1px rgba(255,255,255,.85),0 10px 22px -10px rgba(220,40,45,.75)}
.btn.line,.btn.line:hover{color:#fff;background:linear-gradient(180deg,rgba(32,214,110,.96),rgba(6,190,80,.96));box-shadow:inset 0 0 0 .5px rgba(255,255,255,.4),inset 1.5px 1.5px 1px -1px rgba(255,255,255,.85),0 10px 22px -10px rgba(6,190,80,.75)}
.btn:disabled{opacity:.45;transform:none;filter:grayscale(.3)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--lg:rgba(255,255,255,.9);--lg-strong:#fff}}

/* ---------- ฟอร์มแบบ iOS ---------- */
.input,select.input,textarea.input,[data-theme=dark] .input,[data-theme=dark] select.input,[data-theme=dark] textarea.input{
  background:var(--fill);border:1px solid transparent;border-radius:14px;box-shadow:none;padding:10px 14px}
.input:focus{background:var(--surface);border-color:var(--primary);box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 18%,transparent)}
.field>span{font-weight:500;font-size:14px;color:var(--muted)}
.check,.radio,[data-theme=dark] .check,[data-theme=dark] .radio{background:var(--fill);border:1px solid transparent;border-radius:14px}
.check:has(input:checked),.radio:has(input:checked){background:var(--primary-soft);border-color:color-mix(in srgb,var(--primary) 50%,transparent)}
input[type=checkbox],input[type=radio]{accent-color:var(--primary)}

/* ---------- ชิป / segmented ---------- */
.chip,[data-theme=dark] .chip{background:var(--fill);border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;font-weight:500;font-size:12.5px;padding:3px 11px}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--accent-soft);color:var(--accent)}
.chip.bad{background:var(--danger-soft);color:var(--danger)}.chip.pri{background:var(--primary-soft);color:var(--primary)}
.seg,[data-theme=dark] .seg{background:var(--fill);border-radius:999px;padding:3px;box-shadow:none}
.seg button{border-radius:999px;padding:6px 15px;color:var(--muted)}
.seg button.on,[data-theme=dark] .seg button.on{color:var(--ink);background:var(--lg-strong);-webkit-backdrop-filter:var(--lg-blur);backdrop-filter:var(--lg-blur);box-shadow:var(--lg-rim),var(--lg-edge),0 3px 10px -4px rgba(16,24,48,.3)}
.tab{border-radius:999px;background:var(--lg);border:0;box-shadow:var(--lg-rim),var(--lg-edge)}
.tab.on{background:var(--primary);color:#fff;box-shadow:0 8px 18px -8px rgba(10,112,240,.8)}

/* ---------- ตาราง ---------- */
.tbl th,[data-theme=dark] .tbl th{background:var(--surface-2);border-color:var(--line);-webkit-backdrop-filter:none;backdrop-filter:none;font:600 13px var(--f-body);color:var(--muted)}

.tbl tr:hover td,[data-theme=dark] .tbl tr:hover td{background:color-mix(in srgb,var(--primary) 4%,transparent)}
.tbl-wrap{border-radius:0 0 var(--r) var(--r)}
.tbl input[data-chg=quick-score]{font:700 17px var(--f-head);color:var(--redpen);text-align:center}
.tbl input[data-chg=quick-score]:placeholder-shown{color:var(--muted)}

/* =====================================================================
   โครงหน้าจอ PC: เมนูข้างเป็นแผ่นกระจกลอย
   ===================================================================== */
.shell{grid-template-columns:272px 1fr}
.side,[data-theme=dark] .side{position:sticky;top:14px;margin:14px 0 14px 14px;height:calc(100vh - 28px);border-radius:30px;padding:18px 12px;color:var(--ink);border:0;
  background:var(--bar);-webkit-backdrop-filter:blur(28px) saturate(190%);backdrop-filter:blur(28px) saturate(190%);box-shadow:var(--lg-rim),var(--lg-edge),var(--lg-drop)}
.side .brand{padding:2px 8px 18px}
.side .brand b{font:700 17px var(--f-head);color:var(--ink)}
.side .brand small,.side .nav-group,.side .side-foot{color:var(--muted)}
.brand-mark{width:40px;height:40px;border-radius:12px;color:#fff;transform:none;font:700 20px var(--f-head);
  background:linear-gradient(145deg,#4DA3FF,#0A6CF0 60%,#5E5CE6);box-shadow:inset 0 1px 1px rgba(255,255,255,.6),0 6px 14px -6px rgba(10,108,240,.7)}
.nav-group{font-size:12.5px;padding:14px 12px 6px;letter-spacing:0}
.nav-item,.nav-item:hover{border-radius:999px;padding:9px 14px;color:var(--ink);font-weight:500;box-shadow:none;transition:background .2s}
.nav-item:hover,[data-theme=dark] .nav-item:hover{background:var(--fill)}
.nav-item svg{opacity:.75}
.nav-item.active,[data-theme=dark] .nav-item.active{background:var(--lg-strong);color:var(--primary);font-weight:600;box-shadow:var(--lg-rim),var(--lg-edge),0 4px 14px -6px rgba(16,24,48,.25)}
.nav-item.active svg,[data-theme=dark] .nav-item.active svg{color:var(--primary);opacity:1}
.nav-badge{background:var(--orange);color:#fff}
.side-foot{border-top:1px solid var(--line)}

/* แถบบน: ไม่มีพื้น ปุ่มกระจกลอยเหนือเนื้อหา */
.top,[data-theme=dark] .top{position:sticky;top:0;margin:0;border:0;border-radius:0;background:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;padding:16px 28px 6px;z-index:8;pointer-events:none}
.top>*{pointer-events:auto}
.top h1{font:600 15px var(--f-head);color:var(--muted);opacity:0}
.top .chip{background:var(--lg);-webkit-backdrop-filter:var(--lg-blur);backdrop-filter:var(--lg-blur);box-shadow:var(--lg-rim),var(--lg-edge);padding:7px 14px;font-size:13.5px}
.content{padding:8px 32px 48px;max-width:1260px}
.credit{color:var(--muted);font-size:12.5px}

/* ---------- หัวหน้า: ตัวใหญ่แบบ iOS ---------- */
.page-head{margin-bottom:22px;align-items:flex-end}

/* หน้าแรก: ภาพทักทาย */
.hero{position:relative;overflow:hidden;min-height:220px;margin-bottom:18px;display:flex;align-items:center;padding:0}
.hero .art.desk{position:absolute;inset:0;width:100%;height:100%}
.hero-txt{position:relative;z-index:1;padding:28px 32px;max-width:440px}
.hero-txt h2{font:700 30px/1.2 var(--f-head);color:#16213A}

[data-theme=dark] .hero-txt h2{color:#fff}[data-theme=dark] .hero-txt p{color:#C9D3EA}
.hero-acts{display:flex;gap:8px;flex-wrap:wrap}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.55),rgba(255,255,255,0) 55%);pointer-events:none}
[data-theme=dark] .hero::after{background:linear-gradient(90deg,rgba(11,15,23,.55),rgba(11,15,23,0) 60%)}

/* สถิติ: ไอคอนสี่เหลี่ยมมนแบบไอคอนแอป */
.stats{gap:14px}
.stat{padding:18px 20px;transition:transform .25s}
.stat:hover{transform:translateY(-2px)}
.stat .lbl{font-size:14px;color:var(--muted);gap:10px}
.stat .lbl svg,.stats .stat .lbl svg{width:34px;height:34px;padding:8px;border-radius:10px;color:#fff;box-shadow:inset 0 1px 1px rgba(255,255,255,.5),0 4px 10px -4px rgba(16,24,48,.35);background:linear-gradient(145deg,#4DA3FF,#0A6CF0)}
.stats .stat:nth-child(2) .lbl svg{background:linear-gradient(145deg,#5EE08A,#1FAF55)}
.stats .stat:nth-child(3) .lbl svg{background:linear-gradient(145deg,#FFB547,#FF8A00)}
.stats .stat:nth-child(4) .lbl svg{background:linear-gradient(145deg,#8E8BFF,#5E5CE6)}
.stat .val{font:700 34px/1.15 var(--f-head);margin-top:10px}

/* ภาพประกอบ */
.art{display:block}

.subj h3{font:700 19px var(--f-head)}
.asg-bar,.asg-bar[style]{width:64px;height:64px;flex:none;margin:18px 0 18px 18px;border-radius:18px;overflow:hidden;align-self:flex-start;background:none!important}
.asg-bar .art{width:100%;height:100%}
.asg-title{font:600 18px var(--f-head)}
.empty .art.spot{width:200px;height:auto;margin:0 auto 10px}

.empty{padding:36px 20px}

/* ห้องเรียน */
.room-chip{border-radius:18px;background:var(--surface);border:0;box-shadow:var(--lg-edge),var(--shadow)}
.room-chip:hover{transform:translateY(-1px)}

.cls-item{border-radius:14px}
.cls-item.active{background:var(--primary-soft);box-shadow:none}
.bulk{background:var(--accent-soft);border-radius:14px}
.ro-note{background:var(--surface);border:0;border-radius:18px;box-shadow:var(--shadow)}

/* ---------- หน้าต่าง: แผ่นกระจกฝ้า ---------- */
.modal-bg{background:rgba(10,16,30,.28);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.modal,[data-theme=dark] .modal{background:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
  border:0;border-radius:30px;box-shadow:var(--lg-rim),var(--shadow-pop)}
.modal-h h3{font:700 20px var(--f-head)}
.modal-f{border-top:1px solid var(--line)}
.toast,[data-theme=dark] .toast{background:rgba(28,32,44,.78);color:#fff;border:0;border-radius:999px;padding:11px 20px;-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.18),var(--shadow-pop)}
.toast.err{background:rgba(220,40,45,.9)}

/* ---------- หน้าเข้าสู่ระบบ ---------- */
.auth-art,[data-theme=dark] .auth-art{background:linear-gradient(160deg,#DCEBFF,#ECE6FF 55%,#FFEADA);color:var(--ink);padding:44px 48px;gap:22px}
[data-theme=dark] .auth-art{background:linear-gradient(160deg,#10203F,#1C1838 55%,#2A1D12)}
.auth-art .lines,.auth-art .deco{display:none}
.auth-art h1{font:700 46px/1.15 var(--f-head);color:var(--ink);letter-spacing:-.015em}
.auth-art .hl{background:none;color:inherit;padding:0;transform:none;display:inline;box-shadow:none}
.auth-art p{color:var(--muted);font-size:16px}
.auth-scene{position:relative;border-radius:28px;overflow:hidden;box-shadow:var(--lg-rim),0 30px 60px -30px rgba(16,24,48,.5);aspect-ratio:620/200;max-width:560px}
.auth-scene .art{width:100%;height:100%}
.auth-feat div{background:var(--lg);-webkit-backdrop-filter:var(--lg-blur);backdrop-filter:var(--lg-blur);border:0;border-radius:18px;box-shadow:var(--lg-rim),var(--lg-edge)}
.auth-feat b{color:var(--ink);font-family:var(--f-head)}
.auth-form{background:transparent}
.auth-card .or span{background:transparent}
.stu-cta{background:var(--surface);border:0;border-radius:22px;color:var(--ink);box-shadow:var(--shadow)}
.stu-cta:hover{transform:translateY(-2px)}
.stu-cta b{font:700 17px var(--f-head)}
.linkbtn,[data-theme=dark] .linkbtn{color:var(--primary)}
.signup-info{background:var(--accent-soft);border-radius:14px}

/* ---------- ฝั่งนักเรียน ---------- */
.stu{background:transparent}
.stu-login-art{margin:-26px -26px 0;height:150px;overflow:hidden;border-radius:var(--r) var(--r) 0 0}
.stu-login-art .art{width:100%;height:100%}
.stu-login{padding-top:0;margin-top:8px;overflow:hidden}

.stu-banner h2{font:700 24px var(--f-head);color:var(--ink)}

.stu-banner .acts{z-index:2}
.stu-banner .acts .btn{color:#16213A}
.stu-banner>.row{position:relative;z-index:1}
.sa,[data-theme=dark] .sa{border:0;border-radius:22px}
