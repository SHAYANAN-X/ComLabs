/* ---------- รายงาน ---------- */
function reportData(sid, cid) {
  const cols = GB.cols(sid, cid), roster = GB.roster(cid, cols);
  const asgs = store.assignments.filter(a => a.subject_id === sid && store.assignment_classes.some(x => x.assignment_id === a.id && x.classroom_id === cid));
  const sess = store.attendance_sessions.filter(s => s.classroom_id === cid && !s.is_open && (!s.subject_id || s.subject_id === sid));
  const att = new Map(); store.attendance_records.forEach(r => att.set(r.session_id + ':' + r.student_id, r.status));
  const rows = roster.map(st => {
    const t = GB.total(cols, st.id);
    const missing = asgs.filter(a => { const s = A.sub(a.id, st.id); return !s || s.status === 'returned'; }).length;
    const came = sess.filter(se => ['present', 'late'].includes(att.get(se.id + ':' + st.id))).length;
    const attPct = sess.length ? came / sess.length * 100 : null;
    return { st, scores: cols.map(c => GB.score(c, st.id).v), t, grade: thaiGrade(t.pct), missing, attPct, ms: attPct != null && attPct < 80 };
  });
  const dist = ['4', '3.5', '3', '2.5', '2', '1.5', '1', '0'].map(g => [g, rows.filter(r => r.grade === g && !r.ms).length]);
  const avg = rows.length ? rows.reduce((s, r) => s + (r.t.pct || 0), 0) / rows.length : 0;
  return { cols, rows, asgs, sess, dist, avg };
}

      <div class="rp-stats"><div><b>${thaiNum(d.rows.length)}</b><small>นักเรียน</small></div><div><b>${d.avg.toFixed(1)}%</b><small>เฉลี่ยห้อง</small></div><div><b>${thaiNum(d.rows.filter(r => r.missing).length)}</b><small>มีงานค้าง</small></div><div><b>${thaiNum(d.rows.filter(r => r.ms).length)}</b><small>เวลาเรียนไม่ถึง 80%</small></div></div></div>

    <div class="tbl-wrap"><table class="tbl rp-tbl"><thead><tr><th>เลขที่</th><th>ชื่อ - สกุล</th>${d.cols.map(c2 => `<th class="rp-num" title="${esc(c2.title)}">${esc(c2.title.length > 14 ? c2.title.slice(0, 13) + '…' : c2.title)}<small>/${+GB.max(c2)}</small></th>`).join('')}<th class="rp-num">รวม<small>/${d.rows[0]?.t.max ?? 0}</small></th><th class="rp-num">ร้อยละ</th><th class="rp-num">เกรด</th><th class="rp-num">เวลาเรียน</th><th class="rp-num">งานค้าง</th></tr></thead><tbody>

async function bkCollect() {
  const out = {};
  for (const [t] of BK_TABLES) {
    if (t === 'students') { out[t] = store.students.map(s => ({ ...s })); continue; }
    try { out[t] = await fetchAll(t, BK_ORDER[t]); }
    catch (e) { out[t] = []; }
  }
  if (!ME.admin()) out.students.forEach(s => delete s.student_code);
  return out;
}
function bkStamp() { const d = new Date(), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`; }
async function bkJson() {

async function bkXlsx() {

}
async function bkRestore() {
  const t = BK.file.data.tables, me = session.user.id, log = [];
  BK.busy = 'restore'; render();
  for (const [name, key, shared] of BK_TABLES) {
    const rows = (t[name] || []).map(r => { const o = { ...r, owner_id: me }; if (name === 'students' && !o.student_code) return null; return o; }).filter(Boolean);
    if (!rows.length) continue;
    if (shared && !ME.admin()) { log.push(`⏭ ${BK_NAMES[name]} (ผู้ดูแลเป็นผู้นำเข้า)`); continue; }
    let ok = 0, err = '';
    for (let i = 0; i < rows.length; i += 300) {
      const { error } = await sb.from(name).upsert(rows.slice(i, i + 300), { onConflict: key, ignoreDuplicates: true });
      if (error) { err = errMsg(error); break; } ok += Math.min(300, rows.length - i);
    }
    log.push(err ? `⚠️ ${BK_NAMES[name]}: ${esc(err)}` : `✅ ${BK_NAMES[name]} ${ok.toLocaleString()} รายการ`);
  }
  BK.busy = false; BK.file = null; BK.result = log.join('<br>');
  try { await loadAll(); } catch (e) {}
  render(); toast('นำเข้าข้อมูลเสร็จแล้ว');
}

/* ---------- ทำเนียบคนเก่ง (โพเดียม 5 อันดับ + 6–10) ---------- */
function podiumHTML(top, titles, opt = {}) {
  const list = (top || []).filter(x => x.xp > 0);
  if (!list.length) return `<div class="pod-empty">ยังไม่มีใครได้แต้ม ส่งงานหรือทำข้อสอบเพื่อขึ้นทำเนียบ! 🚀</div>`;
  const medal = ['', '🥇', '🥈', '🥉', '🎖️', '🎖️'];
  const plaque = (x, k) => x ? `<div class="pq p${k}${x.me ? ' me' : ''}"><div class="pq-medal">${medal[k]}</div>${emblemHTML(k)}
      <div class="pq-name">${nameTag(x.name, x.xp, x.rank, x.title_id, titles, { noBadge: true, noCrown: true })}${fireTag(x.streak)}</div>
      <div class="pq-rank">${rkBadge(rankIdx(x.xp))}</div><div class="pq-meta">Lv.${lvOf(x.xp)}</div><div class="pq-xp">${x.xp.toLocaleString()} XP</div><div class="pq-cls">${esc(x.classroom)}</div></div>` : `<div class="pq p${k} vacant">${emblemHTML(k)}<div class="pq-meta">ว่าง</div></div>`;
  const [a, b, c, d, e] = list;
  return `<div class="podium">${plaque(d, 4)}${plaque(b, 2)}${plaque(a, 1)}${plaque(c, 3)}${plaque(e, 5)}</div>
    ${!opt.noRest && list.length > 5 ? `<div class="pod-rest">${list.slice(5, 10).map(x => `<div class="pr-row${x.me ? ' me' : ''}"><span class="pr-no">${x.rank}</span>${nameTag(x.name, x.xp, x.rank, x.title_id, titles)}<span class="spacer"></span><span class="small muted">${esc(x.classroom)}</span><b class="pr-xp">${x.xp.toLocaleString()} XP</b></div>`).join('')}</div>` : ''}`;
}

/* ---------- ครู: แดชบอร์ด ---------- */

/* ---------- นักเรียน ---------- */
async function loadStudentGame(force) {

function stuFirst(v) { return v.full_name.replace(/^(เด็กชาย|เด็กหญิง|นางสาว|นาย|นาง|ด\.ช\.|ด\.ญ\.|น\.ส\.)\s*/, ''); }
function myGameCard(v, g) {
  const i = rankIdx(g.xp), r = RANKS[i], nx = RANKS[i + 1];

      <div class="gc-lv" title="ความคืบหน้าเลเวล"><i style="width:${(g.xp % 50) / 50 * 100}%"></i></div></div>

/* ---------- 🔥 Streak: ส่งงานตรงเวลาติดต่อกัน ---------- */
function fireTag(n) { return n >= 3 ? `<span class="fire-tag" title="ส่งงานตรงเวลาติดต่อกัน ${n} งาน">🔥${n}</span>` : ''; }
function streakHTML(g) {
  if (g.streak == null) return '';
  const n = +g.streak || 0, best = +g.best_streak || 0, r = { ...RULE_DEF, ...(g.rules || {}) };
  const step = n % 5, left = 5 - step;
  const due = g.streak_next ? new Date(g.streak_next) : null;
  const hrs = due ? (due - Date.now()) / 36e5 : null;
  const dueTx = due ? (hrs < 24 ? `ภายใน ${Math.max(1, Math.round(hrs))} ชั่วโมง` : `อีก ${Math.ceil(hrs / 24)} วัน`) : '';
  const lvl = n >= 10 ? 'hot3' : n >= 5 ? 'hot2' : n >= 3 ? 'hot1' : n ? 'warm' : 'cold';
  const msg = !n ? (best ? `ไฟดับแล้ว 😢 เริ่มจุดใหม่ได้เลย สถิติเดิม ${best} งาน` : 'ส่งงานให้ทันกำหนดเพื่อจุดไฟดวงแรก')
    : n < 3 ? `อีก ${3 - n} งานเริ่มได้โบนัส +${r.streak_xp} XP ต่องาน` : `ได้โบนัส +${r.streak_xp} XP ทุกงานที่ส่งทัน`;
  return `<div class="card streak ${lvl}">
    <div class="sk-fire"><span class="sk-flame">${n ? '🔥' : '🪵'}</span><b>${n}</b></div>
    <div class="sk-body"><div class="sk-t">ส่งงานตรงเวลาติดต่อกัน <b>${n}</b> งาน${best > n ? `<small>สถิติสูงสุด ${best}</small>` : n && n >= best ? '<small class="sk-pb">🏅 สถิติใหม่</small>' : ''}</div>
      <div class="sk-dots" title="ครบ 5 งาน รับ 🪙 ${r.streak_coin}">${Array.from({ length: 5 }, (_, i) => `<i class="${i < step || (n && step === 0) ? 'on' : ''}"></i>`).join('')}<span>${n && step === 0 ? `ครบรอบแล้ว! ได้ 🪙 ${r.streak_coin}` : `อีก ${left} งานรับ 🪙 ${r.streak_coin}`}</span></div>
      <div class="sk-msg">${msg}</div></div>
    ${due ? `<div class="sk-next ${hrs < 24 ? 'urgent' : ''}"><small>งานถัดไปครบกำหนด</small><b>${dueTx}</b><button class="btn sm" data-act="stu-tab" data-t="work">ไปส่งงาน</button></div>` : ''}
  </div>`;
}

I.alert = '<path d="M12 3l9.5 16.5h-19z"/><path d="M12 10v4.5M12 17.5v.01"/>';
const RISK_DEF = { missing: 3, score: 50, exam: 1, att: false, attPct: 80 };
function riskCfg() { try { return { ...RISK_DEF, ...(JSON.parse(localStorage.getItem('cr-risk-cfg')) || {}) }; } catch (e) { return { ...RISK_DEF }; } }
function riskCfgSet(k, v) { const c = riskCfg(); c[k] = v; try { localStorage.setItem('cr-risk-cfg', JSON.stringify(c)); } catch (e) {} }

function riskData() {
  const cfg = riskCfg(), term = Q.currentTerm(), now = Date.now();
  const subs = Q.subjectsOfTerm(term?.id), sids = new Set(subs.map(s => s.id));
  const week = 7 * 864e5;
  const asgs = store.assignments.filter(a => sids.has(a.subject_id) && (a.due_at ? new Date(a.due_at) < now : now - new Date(a.created_at) > week));
  const exams = store.exams.filter(e => sids.has(e.subject_id) && (!e.is_open || (e.closes_at && new Date(e.closes_at) < now)));
  const doneEx = new Set(store.exam_attempts.filter(x => x.submitted_at).map(x => x.exam_id + ':' + x.student_id));
  const cids = new Set(store.subject_classes.filter(x => sids.has(x.subject_id)).map(x => x.classroom_id));
  const out = [];
  store.classrooms.filter(c => cids.has(c.id)).forEach(c => {
    const myAsg = asgs.filter(a => store.assignment_classes.some(x => x.assignment_id === a.id && x.classroom_id === c.id));
    const myEx = exams.filter(e => store.exam_classes.some(x => x.exam_id === e.id && x.classroom_id === c.id));
    const mySubs = subs.filter(s => store.subject_classes.some(x => x.subject_id === s.id && x.classroom_id === c.id));
    const sess = cfg.att ? store.attendance_sessions.filter(s => s.classroom_id === c.id && !s.is_open) : [];
    Q.students(c.id).filter(s => s.active !== false).forEach(st => {
      const reasons = []; let sev = 0;
      const miss = myAsg.filter(a => { const s = A.sub(a.id, st.id); return !s || s.status === 'returned'; });
      if (miss.length >= cfg.missing) { reasons.push({ k: 'miss', t: `ค้างงาน ${miss.length} ชิ้น`, list: miss.map(a => a.title) }); sev += miss.length; }
      mySubs.forEach(sj => {
        const cols = GB.cols(sj.id, c.id); if (!cols.length) return;
        const t = GB.total(cols, st.id);
        if (t.max > 0 && t.pct != null && t.pct < cfg.score) { reasons.push({ k: 'score', t: `คะแนน${sj.name} ${t.pct.toFixed(0)}%` }); sev += 3; }
      });
      const noEx = myEx.filter(e => !doneEx.has(e.id + ':' + st.id));
      if (cfg.exam && noEx.length >= cfg.exam) { reasons.push({ k: 'exam', t: `ขาดสอบ ${noEx.length} ชุด`, list: noEx.map(e => e.title) }); sev += 2 * noEx.length; }
      if (cfg.att && sess.length) {
        const came = sess.filter(se => store.attendance_records.some(r => r.session_id === se.id && r.student_id === st.id && ['present', 'late'].includes(r.status))).length;
        const p = came / sess.length * 100;
        if (p < cfg.attPct) { reasons.push({ k: 'att', t: `เวลาเรียน ${p.toFixed(0)}%` }); sev += 4; }
      }
      if (reasons.length) out.push({ st, c, reasons, sev, level: sev >= 8 ? 'high' : sev >= 4 ? 'mid' : 'low' });
    });
  });
  return out.sort((a, b) => b.sev - a.sev || a.c.name.localeCompare(b.c.name, 'th', { numeric: true }) || a.st.number - b.st.number);
}

function qToText(qq, n = 1) {
  const pts = +qq.points !== 1 ? ` (${+qq.points} คะแนน)` : '';
  if (qq.qtype === 'mcq') return `${n}. ${qq.prompt}${pts}\n${(qq.choices || []).map((c, i) => `${ExamParser.TH[i]}. ${c}`).join('\n')}\nตอบ ${qq.answer != null ? ExamParser.TH[+qq.answer] : ''}`;
  if (qq.qtype === 'true_false') return `${n}. ${qq.prompt}${pts}\nตอบ ${qq.answer ? 'ถูก' : 'ผิด'}`;
  if (qq.qtype === 'short') return `${n}. ${qq.prompt}${pts}\nตอบ ${(qq.answer || []).join(' | ')}`;
  return `${n}. ${qq.prompt}${pts} [อัตนัย]`;
}

async function qbReadFile(file) {
  const ta = $('#modal-root [name=text]'), drop = $('#qb-drop'); if (!ta || !file) return;
  drop?.classList.add('busy');
  try {
    const buf = await file.arrayBuffer(); let text = '';
    if (/\.docx$/i.test(file.name)) {
      if (!window.mammoth) throw new Error('โหลดตัวอ่าน Word ไม่สำเร็จ ลองใหม่อีกครั้ง หรือคัดลอกข้อความจาก Word มาวางแทน');
      text = (await window.mammoth.extractRawText({ arrayBuffer: buf })).value;
    } else if (/\.txt$/i.test(file.name)) {
      text = RosterParser.decodeText(buf);
    } else if (/\.(xlsx|xls|csv)$/i.test(file.name)) {
      let rows;
      if (/\.csv$/i.test(file.name)) rows = RosterParser.parseCSV(RosterParser.decodeText(buf));
      else { if (!window.XLSX) throw new Error('โหลดตัวอ่าน Excel ไม่สำเร็จ ลองบันทึกเป็น .csv'); const wb = XLSX.read(buf, { type: 'array' }); rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '' }); }
      const r = ExamParser.parseRows(rows); if (r.error) throw new Error(r.error);
      text = r.questions.map((x, i) => qToText(x, i + 1)).join('\n\n');
    } else throw new Error('รองรับไฟล์ .docx .txt .xlsx .csv');
    const qs = ExamParser.parseText(text);

/* =====================================================================
   insight.js — เฟส 15
   1) วิเคราะห์ข้อสอบรายข้อ: ค่าความยาก (p) อำนาจจำแนก (r) ตัวลวง และความเชื่อมั่น KR-20
   2) พื้นที่เก็บข้อมูล · ล้างไฟล์ภาคเรียนเก่า (สำรองข้อมูลใช้ของเดิมใน reports.js)
   3) ขึ้นภาคเรียนใหม่ (คัดลอกรายวิชา/ห้อง/งาน)
   ===================================================================== */

/* ---------- 1) วิเคราะห์ข้อสอบ ---------- */
const IA_VERDICT = {
  great: ['ดีมาก', 'ok', 'ความยากพอเหมาะ แยกเด็กเก่ง/อ่อนได้ชัด เก็บเข้าคลังได้เลย'],
  good: ['ใช้ได้', 'ok', 'ใช้ต่อได้ อาจปรับตัวลวงให้คมขึ้น'],
  easy: ['ง่ายไป', 'warn', 'เกือบทุกคนตอบถูก ใช้เป็นข้ออุ่นเครื่องหรือปรับให้ยากขึ้น'],
  hard: ['ยากไป', 'warn', 'ตอบถูกน้อยมาก ควรทบทวนเนื้อหา หรือตรวจว่าโจทย์ชัดเจนไหม'],
  low: ['จำแนกต่ำ', 'warn', 'เด็กเก่งกับเด็กอ่อนตอบถูกพอ ๆ กัน ควรปรับคำถามหรือตัวลวง'],
  bad: ['ตรวจเฉลย', 'bad', 'กลุ่มอ่อนตอบถูกมากกว่ากลุ่มเก่ง อาจเฉลยผิดหรือโจทย์กำกวม'],
  few: ['ข้อมูลน้อย', '', 'มีผู้สอบไม่ถึง 5 คน ผลยังไม่น่าเชื่อถือ'],
  essay: ['อัตนัย', '', 'ดูค่าเฉลี่ยคะแนน'],
};
function iaVerdict(p, r, n) {
  if (n < 5) return 'few';
  if (r < 0) return 'bad';
  if (p > .8) return 'easy';
  if (p < .2) return 'hard';
  if (r < .2) return 'low';
  return r >= .4 ? 'great' : 'good';
}
function itemAnalysis(eid, cids) {
  const qs = EX.questions(eid);
  const studs = cids.flatMap(c => Q.students(c).filter(s => s.active !== false));
  const sids = new Set(studs.map(s => s.id));
  // ครั้งที่ดีที่สุดของแต่ละคน
  const bestOf = {};
  store.exam_attempts.filter(a => a.exam_id === eid && a.submitted_at && sids.has(a.student_id)).forEach(a => {
    const b = bestOf[a.student_id]; if (!b || +a.total_score > +b.total_score) bestOf[a.student_id] = a;
  });
  const atts = Object.values(bestOf).sort((a, b) => +b.total_score - +a.total_score);
  const N = atts.length;
  const amap = new Map(); (store.exam_answers || []).forEach(x => amap.set(x.attempt_id + '|' + x.question_id, x));
  const frac = (a, qq) => { const x = amap.get(a.id + '|' + qq.id); if (!x) return 0;
    if (x.is_correct != null && qq.qtype !== 'essay') return x.is_correct ? 1 : 0;
    return +qq.points ? Math.max(0, Math.min(1, (+x.points_awarded || 0) / +qq.points)) : 0; };
  const g = Math.max(1, Math.round(N * .27));
  const up = atts.slice(0, g), lo = atts.slice(-g);
  const mean = arr => arr.length ? arr.reduce((s, v) => s + v, 0) / arr.length : 0;
  const items = qs.map((qq, i) => {
    const all = atts.map(a => frac(a, qq));
    const p = mean(all), pU = mean(up.map(a => frac(a, qq))), pL = mean(lo.map(a => frac(a, qq)));
    const r = N >= 2 ? pU - pL : 0;
    let dist = null;
    if (qq.qtype === 'mcq') {
      const k = (qq.choices || []).length;
      const cnt = (list) => { const c = Array(k + 1).fill(0); list.forEach(a => { const x = amap.get(a.id + '|' + qq.id); const v = x && x.answer != null && x.answer !== '' ? +x.answer : -1; c[v >= 0 && v < k ? v : k]++; }); return c; };
      dist = { all: cnt(atts), up: cnt(up), lo: cnt(lo), k };
    }
    const v = qq.qtype === 'essay' ? 'essay' : iaVerdict(p, r, N);
    return { qq, i, p, r, pU, pL, v, dist };
  });
  // KR-20 (เฉพาะข้อที่ให้คะแนนถูก/ผิด)
  const di = items.filter(x => x.qq.qtype !== 'essay');
  let kr = null;
  if (di.length >= 2 && N >= 5) {
    const tot = atts.map(a => di.reduce((s, x) => s + frac(a, x.qq), 0));
    const m = mean(tot), varT = mean(tot.map(t => (t - m) ** 2));
    const spq = di.reduce((s, x) => s + x.p * (1 - x.p), 0);
    if (varT > 0) kr = di.length / (di.length - 1) * (1 - spq / varT);
  }
  return { items, N, g, kr };
}
function krText(kr) {
  if (kr == null) return ['–', '', 'ต้องมีผู้สอบอย่างน้อย 5 คน'];
  return kr >= .8 ? [kr.toFixed(2), 'ok', 'เชื่อมั่นสูงมาก'] : kr >= .7 ? [kr.toFixed(2), 'ok', 'เชื่อมั่นดี'] : kr >= .5 ? [kr.toFixed(2), 'warn', 'พอใช้ ควรปรับบางข้อ'] : [kr.toFixed(2), 'bad', 'ต่ำ ข้อสอบยังวัดได้ไม่คงที่'];
}

  const rows = A.items.map(x => [x.i + 1, RICH.plain(x.qq), x.qq.qtype, +x.p.toFixed(2), x.v === 'essay' ? '' : +x.r.toFixed(2), +x.pU.toFixed(2), +x.pL.toFixed(2), IA_VERDICT[x.v][0], IA_VERDICT[x.v][2],

async function iaToBank(eid) {

    choices: x.qq.choices, answer: x.qq.answer, points: x.qq.points ?? 1 }));

async function dmPurge(tid) {

  const ok = await confirmP(`ล้างไฟล์งานภาคเรียน ${Q.termLabel(t)}?`, `จะลบไฟล์งานนักเรียน ${(+u.files).toLocaleString()} ไฟล์ (${fmtBytes(u.bytes)}) ออกจากที่เก็บถาวร กู้คืนไม่ได้\nคะแนนและรายการส่งงานยังอยู่ครบ`, 'ลบไฟล์ถาวร');
  if (!ok) return;
  DATA.busy = tid; render();
  try {
    const files = await q(sb.rpc('term_files', { p_term: tid }));
    let done = 0;
    for (let i = 0; i < files.length; i += 100) {
      const part = files.slice(i, i + 100);
      const { error } = await sb.storage.from('submissions').remove(part.map(f => f.storage_path));
      if (error) throw error;
      await q(sb.rpc('mark_files_purged', { p_ids: part.map(f => f.id) }));
      done += part.length; toast(`ล้างแล้ว ${done}/${files.length} ไฟล์`);

function teacherCalItems(cid) {
  const term = Q.currentTerm(), subs = Q.subjectsOfTerm(term?.id), sids = new Set(subs.map(s => s.id));
  const subOf = id => subs.find(s => s.id === id);
  const cname = id => db.get('classrooms', id)?.name || '';
  const out = [], now = new Date();
  store.assignments.filter(a => sids.has(a.subject_id) && a.due_at).forEach(a => {
    const cids = store.assignment_classes.filter(x => x.assignment_id === a.id).map(x => x.classroom_id);
    if (cid && !cids.includes(cid)) return;
    const subs_ = store.submissions.filter(x => x.assignment_id === a.id);
    const pend = subs_.filter(x => x.status === 'submitted' || x.status === 'late').length;
    const total = cids.reduce((s, c) => s + Q.students(c).filter(x => x.active !== false).length, 0);
    const d = new Date(a.due_at), s = subOf(a.subject_id);
    out.push({ d, title: a.title, color: s?.color, cids, href: `#grade-${a.id}`,
      st: pend ? 'wait' : d < now ? 'past' : 'todo',
      sub: `${s?.name || ''} · ${cids.map(cname).join(', ')}`,
      badge: pend ? `รอตรวจ ${pend}` : `ส่งแล้ว ${subs_.length}/${total}` });
  });
  (store.exams || []).filter(e => sids.has(e.subject_id) && (e.closes_at || e.opens_at)).forEach(e => {
    const cids = store.exam_classes.filter(x => x.exam_id === e.id).map(x => x.classroom_id);
    if (cid && !cids.includes(cid)) return;
    const s = subOf(e.subject_id);
    out.push({ d: new Date(e.closes_at || e.opens_at), title: e.title, color: s?.color, cids, href: `#exam-res-${e.id}`, st: 'exam',
      sub: `${s?.name || ''} · ${cids.map(cname).join(', ')}`, badge: e.closes_at ? 'ปิดสอบ' : 'เปิดสอบ' });
  });
  return out;
}

async function loadChatThreads(force) {
  if (!session || !ME.active() || CHAT.loading) return;
  if (!force && CHAT.threads && Date.now() - CHAT.at < 8000) return;
  CHAT.loading = true;
  try {
    const list = await q(sb.rpc('teacher_chat_threads'));
    const prev = CHAT.seen;
    CHAT.threads = list; CHAT.at = Date.now(); CHAT.missing = false;
    CHAT.unread = list.filter(t => t.mine).reduce((a, t) => a + t.unread, 0);
    // แจ้งเตือนเมื่อมีข้อความใหม่จากนักเรียน (ตอนไม่ได้อยู่หน้าแชท)
    const sig = Object.fromEntries(list.map(t => [chatKey(t.subject_id, t.student_id), t.last_at]));
    if (prev && ui.route !== 'chat') {
      const fresh = list.find(t => t.mine && t.unread && t.last_sender === 'student' && prev[chatKey(t.subject_id, t.student_id)] !== t.last_at);
      if (fresh) toast(`💬 ${fresh.student_name.split(' ')[0]} (${fresh.classroom}) ส่งข้อความถึงครู`);
    }
    CHAT.seen = sig;
    if (CHAT.cur) { const n = list.find(x => x.subject_id === CHAT.cur.subject_id && x.student_id === CHAT.cur.student_id); if (n && n !== CHAT.cur) Object.assign(CHAT.cur, n); }
  } catch (e) { CHAT.threads = CHAT.threads || []; CHAT.missing = /chat|function/i.test(e?.message || ''); }
  CHAT.loading = false;
  chatBadgeSync();
  if (ui.route === 'chat') { chatListSync(); if (CHAT.cur) chatHeadSync(); }
}
async function loadChatMsgs() {
  const t = CHAT.cur; if (!t) return;
  try {
    const msgs = await q(sb.rpc('teacher_chat_messages', { p_student: t.student_id, p_subject: t.subject_id }));
    if (CHAT.cur !== t) return;
    const grew = !CHAT.msgs || msgs.length !== CHAT.msgs.length;
    CHAT.msgs = msgs;
    const box = $('#ch-msgs'); if (box && grew) { box.innerHTML = chatBubbles(msgs, 'teacher'); chatScroll('#ch-msgs'); }
    const th = (CHAT.threads || []).find(x => x.subject_id === t.subject_id && x.student_id === t.student_id);
    if (th && th.mine && th.unread) { th.unread = 0; CHAT.unread = CHAT.threads.filter(x => x.mine).reduce((a, x) => a + x.unread, 0); chatBadgeSync(); chatListSync(); }
  } catch (e) { toast(chatErr(e), true); }
}
function chatStartRealtime() {
  if (CHAT.chan || typeof sb.channel !== 'function' || !session) return;
  try {
    // 1) ฐานข้อมูลแจ้งเองเมื่อมีข้อความใหม่/อ่าน/ลบ (ต้องเปิด Realtime ให้ตาราง chat_messages — phase10 ทำให้แล้ว)
    CHAT.chan = sb.channel('chat-db-' + session.user.id).on('postgres_changes', { event: '*', schema: 'public', table: 'chat_messages' }, p => {
      const m = p.new && p.new.id ? p.new : (p.old || {});
      rtTeacherEvent(m.student_id, m.subject_id, p.eventType === 'INSERT' && m.sender === 'student' && !m.deleted_at ? 'msg' : 'upd', m.body);
    }).subscribe();
    // 2) ช่องสัญญาณตรงจากหน้านักเรียน (เร็วกว่า และใช้ได้แม้ยังไม่เปิด Realtime ของตาราง)
    rtChan('chat-t-' + session.user.id, pl => rtTeacherEvent(pl.st, pl.sj, pl.k, pl.b));
  } catch (e) { CHAT.chan = null; }
}

/* =====================================================================

/* เปิด/ปิดกล่องแชทแบบนุ่มนวล: เปิด = เด้งขึ้นจากแถบ · ปิด = ยุบลงก่อนแล้วค่อยเอาออก */
function dockToggle(sel, st, draw, onOpen) {
  const box = document.querySelector(sel); if (!box || st.busy) return;
  if (!st.open) { st.open = true; st.anim = true; draw(); onOpen && onOpen(); return; }
  const panel = box.querySelector('.sc-panel'), dock = box.querySelector('.sc-fab');
  if (!panel || matchMedia('(prefers-reduced-motion: reduce)').matches) { st.open = false; draw(); return; }
  st.busy = true; panel.classList.remove('pop-in'); panel.classList.add('closing'); dock?.classList.remove('on');
  setTimeout(() => { st.busy = false; st.open = false; draw(); }, 260);
}

/* =====================================================================
   รหัสผ่านนักเรียน: เปลี่ยนรหัสเอง · ลืมรหัส → ส่งคำขอ · ผู้ดูแลรีเซ็ตเป็นเลขประจำตัว
   ===================================================================== */
const PW_ERR = { PASSWORD_TOO_SHORT: 'รหัสผ่านต้องยาวอย่างน้อย 4 ตัวอักษร', PASSWORD_TOO_LONG: 'รหัสผ่านยาวเกินไป', PASSWORD_SAME_AS_CODE: 'ห้ามใช้เลขประจำตัวเป็นรหัสใหม่ ตั้งให้ต่างจากเดิม', STUDENT_INVALID: 'รหัสผ่านปัจจุบันไม่ถูกต้อง' };
const pwErr = e => PW_ERR[Object.keys(PW_ERR).find(k => (e?.message || '').includes(k))] || errMsg(e);

/* เข้าสู่ระบบนักเรียน (จำกัดการเดารหัส 5 ครั้ง / รอ 5 นาที) → คืนข้อมูลนักเรียน หรือ throw ข้อความภาษาไทย */
async function studentLogin(cid, num, code) {
  let r;
  try { r = await q(sb.rpc('student_login', { p_classroom_id: cid, p_number: num, p_code: code })); }
  catch (e) {
    if (!/student_login|function/i.test(e?.message || '')) throw e;
    const rows = await q(sb.rpc('student_verify', { p_classroom_id: cid, p_number: num, p_code: code }));   // ยังไม่ได้รัน phase12
    if (!rows.length) throw new Error('ข้อมูลไม่ตรงกัน ตรวจสอบห้อง เลขที่ และรหัสผ่าน (ถ้ายังไม่เคยเปลี่ยน ใช้เลขประจำตัว)');
    return rows[0];
  }
  if (r.ok) return { student_id: r.student_id, full_name: r.full_name, classroom_name: r.classroom_name };
  if (r.error === 'LOGIN_LOCKED') { const m = Math.floor(r.wait / 60), sec = r.wait % 60; throw new Error(`🔒 ใส่รหัสผิดครบ 5 ครั้ง รออีก ${[m ? m + ' นาที' : '', sec ? sec + ' วินาที' : ''].filter(Boolean).join(' ')} แล้วลองใหม่ (ลืมรหัส? กด "ลืมรหัสผ่าน?")`); }
  if (r.error === 'WRONG_PASSWORD') throw new Error(`รหัสผ่านไม่ถูกต้อง · ลองได้อีก ${r.left} ครั้ง ก่อนถูกล็อก 5 นาที${r.left <= 2 ? ' (ลืมรหัส? กด "ลืมรหัสผ่าน?")' : ''}`);
  throw new Error('ไม่พบเลขที่นี้ในห้องที่เลือก ตรวจสอบห้องและเลขที่อีกครั้ง');
}

/* =====================================================================
   ข้อความถึงครูตอนส่งงาน: รองรับโค้ด HTML
   · นักเรียนพิมพ์โค้ดแล้วเห็นผลลัพธ์ทันที
   · ครูดูได้ทั้ง "ผลลัพธ์" และ "โค้ด" (มีสีแยกแท็ก) + เปิดเต็มจอ
   · แสดงผลใน iframe แบบ sandbox (ไม่มีสิทธิ์เข้าถึงหน้าเว็บ/ข้อมูลล็อกอิน) จึงปลอดภัย
   ===================================================================== */
const HN_MAX = 20000;
const isHtmlNote = t => /<\s*(!doctype|[a-z][a-z0-9-]*)(\s[^>]*)?\/?>/i.test(t || '');
function hnDoc(code) {
  if (/<html[\s>]/i.test(code)) return code;
  return `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui,'Noto Sans Thai',sans-serif;margin:0;padding:14px;line-height:1.6;color:#111}img,video,iframe{max-width:100%}</style></head><body>${code}</body></html>`;
}
function hnFrame(code, h = 240) {
  return `<div class="hn-frame" style="height:${h}px"><iframe sandbox="allow-scripts" referrerpolicy="no-referrer" loading="lazy" title="ผลลัพธ์จากโค้ด HTML" srcdoc="${esc(hnDoc(code))}"></iframe></div>`;
}
/* ใส่สีโค้ด: คอมเมนต์ · แท็ก · ชื่อแอตทริบิวต์ · ค่า */
function hnHighlight(code) {
  return esc(code)
    .replace(/(&lt;!--[\s\S]*?--&gt;)/g, '<i class="hc">$1</i>')
    .replace(/(&lt;\/?)([a-zA-Z][\w-]*)([\s\S]*?)(\/?&gt;)/g, (m, a, tag, attrs, z) =>
      `<b class="ht">${a}${tag}</b>${attrs.replace(/([\w-:]+)(=)(&quot;[\s\S]*?&quot;|&#39;[\s\S]*?&#39;|[^\s&]+)?/g, (mm, n, eq, v) => `<span class="ha">${n}</span>${eq}${v ? `<span class="hv">${v}</span>` : ''}`)}<b class="ht">${z}</b>`);
}
function hnLines(code) { return code.split('\n').length; }

/* กล่องแสดงข้อความ (ใช้ทั้งฝั่งครูและหน้าที่นักเรียนส่งแล้ว) */
let HN_SEQ = 0;
function hnViewHTML(note, title = 'ข้อความถึงครู') {
  if (!isHtmlNote(note)) return `<div class="hn-text">${esc(note)}</div>`;
  const id = 'hn' + (++HN_SEQ);
  HN_STORE[id] = { note, title };
  return `<div class="hn-box" id="${id}">
    <div class="hn-tabs"><span class="hn-badge">&lt;/&gt; HTML</span>
      <button class="on" data-act="hn-tab" data-id="${id}" data-t="view">👁 ผลลัพธ์</button><button data-act="hn-tab" data-id="${id}" data-t="code">🧾 โค้ด <small>${hnLines(note)} บรรทัด</small></button>
      <span class="spacer"></span><button class="hn-mini" data-act="hn-copy" data-id="${id}" title="คัดลอกโค้ด">📋</button><button class="hn-mini" data-act="hn-full" data-id="${id}" title="เปิดเต็มจอ">⤢</button></div>
    <div class="hn-pane view">${hnFrame(note, 240)}</div>
    <div class="hn-pane code" hidden><pre class="hn-code">${hnHighlight(note)}</pre></div></div>`;
}
var HN_STORE = {};
function hnFullModal(id) {

  openModal({

async function hnCopy(t) { try { await navigator.clipboard.writeText(t); toast('คัดลอกโค้ดแล้ว'); } catch (e) { toast('คัดลอกไม่สำเร็จ', true); } }

/* ---------- ฝั่งนักเรียน: ตัวอย่างผลลัพธ์สด ---------- */
function hnLiveHTML(aid, note) {
  if (!isHtmlNote(note)) return `<div class="hn-live" data-for="${aid}" hidden></div>`;
  return `<div class="hn-live" data-for="${aid}"><div class="hn-live-h"><span>👁 ตัวอย่างผลลัพธ์ <small>(ครูจะเห็นแบบนี้ และเห็นโค้ดด้วย)</small></span><button type="button" class="hn-mini" data-act="hn-live-full" data-id="${aid}" title="ดูเต็มจอ">⤢</button></div>${hnFrame(note, 220)}</div>`;
}
const HN_T = {};
function hnLiveUpdate(el) {
  const aid = el.dataset.id, box = document.querySelector(`.hn-live[data-for="${aid}"]`); if (!box) return;
  el.classList.toggle('mono', isHtmlNote(el.value) || el.classList.contains('code-on'));
  clearTimeout(HN_T[aid]);
  HN_T[aid] = setTimeout(() => {
    const v = el.value;
    if (!isHtmlNote(v)) { box.hidden = true; box.innerHTML = ''; return; }
    const fr = box.querySelector('iframe');
    if (fr) fr.srcdoc = hnDoc(v);
    else { box.outerHTML = hnLiveHTML(aid, v); }
    const nb = document.querySelector(`.hn-live[data-for="${aid}"]`); if (nb) nb.hidden = false;
    const cnt = document.querySelector(`.hn-count[data-for="${aid}"]`); if (cnt) cnt.textContent = `${v.length.toLocaleString()} / ${HN_MAX.toLocaleString()}`;
  }, 350);
}
/* แทรกแท็ก/โครงสร้างสำเร็จรูป */
const HN_SNIP = {
  page: '<h1>หัวข้อ</h1>\n<p>เนื้อหา…</p>',
  b: '<b>ตัวหนา</b>', img: '<img src="https://" alt="รูป" width="300">', a: '<a href="https://" target="_blank">ลิงก์</a>',
  list: '<ul>\n  <li>ข้อ 1</li>\n  <li>ข้อ 2</li>\n</ul>', table: '<table border="1">\n  <tr><th>หัว</th><th>หัว</th></tr>\n  <tr><td>ข้อมูล</td><td>ข้อมูล</td></tr>\n</table>',
  style: '<style>\n  h1 { color: royalblue; }\n</style>',
};
function hnInsert(aid, key) {
  const ta = document.querySelector(`textarea[data-inp="stu-note"][data-id="${aid}"]`); if (!ta) return;
  const snip = HN_SNIP[key] || '', s = ta.selectionStart ?? ta.value.length, e = ta.selectionEnd ?? s;
  ta.value = ta.value.slice(0, s) + snip + ta.value.slice(e);
  ta.focus(); ta.selectionStart = ta.selectionEnd = s + snip.length;
  ta.dispatchEvent(new Event('input', { bubbles: true }));
}

Object.assign(ACT, {
  'hn-tab': el => { const box = document.getElementById(el.dataset.id); if (!box) return;
    box.querySelectorAll('.hn-tabs [data-act=hn-tab]').forEach(b => b.classList.toggle('on', b === el));
    box.querySelector('.hn-pane.view').hidden = el.dataset.t !== 'view'; box.querySelector('.hn-pane.code').hidden = el.dataset.t !== 'code'; },
  'hn-full': el => hnFullModal(el.dataset.id),
  'hn-copy': el => { const o = HN_STORE[el.dataset.id]; if (o) hnCopy(o.note); },
  'hn-live-full': el => { const ta = document.querySelector(`textarea[data-inp="stu-note"][data-id="${el.dataset.id}"]`); if (!ta) return; const id = 'hnl' + el.dataset.id; HN_STORE[id] = { note: ta.value, title: 'ตัวอย่างโค้ดของฉัน' }; hnFullModal(id); },
  'hn-snip': el => hnInsert(el.dataset.id, el.dataset.k),
  'hn-code-mode': el => { const ta = document.querySelector(`textarea[data-inp="stu-note"][data-id="${el.dataset.id}"]`); if (!ta) return;
    const on = !ta.classList.contains('code-on'); ta.classList.toggle('code-on', on); ta.classList.toggle('mono', on || isHtmlNote(ta.value)); ta.rows = on ? 8 : 2;
    el.classList.toggle('on', on); document.querySelector(`.hn-snips[data-for="${el.dataset.id}"]`)?.toggleAttribute('hidden', !on); if (on) ta.focus(); },
});
/* Tab = เว้นวรรค 2 ช่อง ในโหมดโค้ด */
document.addEventListener('keydown', e => {
  const t = e.target; if (e.key !== 'Tab' || !t?.matches?.('textarea.code-on')) return;
  e.preventDefault(); const s = t.selectionStart; t.value = t.value.slice(0, s) + '  ' + t.value.slice(t.selectionEnd); t.selectionStart = t.selectionEnd = s + 2;
  t.dispatchEvent(new Event('input', { bubbles: true }));
});

/* =====================================================================
   เวอร์ชันมือถือ — โครงหน้าจอแยกจาก PC
   แถบบนแบบย่อ · แท็บด้านล่าง · แผ่น "เพิ่มเติม" · ตารางเป็นการ์ด · หน้าต่างเลื่อนจากล่าง
   ===================================================================== */
const MQ = matchMedia('(max-width: 760px)');
function isMobile() { return window.matchMedia('(max-width: 760px)').matches; }
function setDevice() { document.documentElement.dataset.device = isMobile() ? 'mobile' : 'pc'; }
MQ.addEventListener('change', () => { setDevice(); ui.moreOpen = false; ui.sideOpen = false; render(); });

const M_TAB_ORDER = [
  { id: 'dashboard', label: 'หน้าหลัก', icon: 'home' },
  { id: 'assignments', label: 'งาน', icon: 'inbox' },
  { id: 'attendance', label: 'เช็คชื่อ', icon: 'attend' },
  { id: 'exams', label: 'ข้อสอบ', icon: 'quiz' },
  { id: 'gradebook', label: 'คะแนน', icon: 'table' },
  { id: 'classes', label: 'ห้องเรียน', icon: 'users' },
  { id: 'subjects', label: 'วิชา', icon: 'book' },
];
const M_BACK = { attsess: ['attendance', 'เช็คชื่อ'], grade: ['assignments', 'งาน'], examedit: ['exams', 'ข้อสอบ'], examres: ['exams', 'ข้อสอบ'] };

function mobileShell(base, navOn, body) {
  const tabs = M_TAB_ORDER.filter(t => routeAllowed(t.id)).slice(0, 4);
  const inTabs = tabs.some(t => t.id === navOn);
  const back = M_BACK[base];
  const more = navItems().filter(n => !n.group && !tabs.some(t => t.id === n.id));
  const dark = document.documentElement.dataset.theme === 'dark';
  return `
  <div class="m-shell">
    <header class="m-top">
      ${back ? `<a class="btn ghost icon" href="#${back[0]}" aria-label="กลับไป${back[1]}">${ic('back')}</a>` : `<div class="brand-mark sm">${logoSVG()}</div>`}
      <h1>${TITLES[base] || 'แดชบอร์ด'}</h1>
      <span class="spacer"></span>
      <button class="btn primary icon" data-act="share-open" aria-label="ส่งลิงก์ให้นักเรียน">${ic('link')}</button>
    </header>
    <main class="content">${body}</main>
    <nav class="m-tabs" aria-label="เมนูหลัก">
      ${tabs.map(t => { const b = navBadge(t.id); return `<a href="#${t.id}" class="${t.id === navOn ? 'on' : ''}" ${t.id === navOn ? 'aria-current="page"' : ''}>${ic(t.icon)}<span>${t.label}</span>${b ? `<i class="tab-badge">${b > 99 ? '99+' : b}</i>` : ''}</a>`; }).join('')}
      <button class="${!inTabs || ui.moreOpen ? 'on' : ''}" data-act="m-more" aria-expanded="${!!ui.moreOpen}">${ic('grid')}<span>เพิ่มเติม</span>${(store.pendingCount && ME.admin()) || (window.CHAT && CHAT.unread) ? '<i class="m-dot"></i>' : ''}</button>
    </nav>
    ${ui.moreOpen ? `
    <div class="m-sheet-bg" data-act="m-more-close">
      <div class="m-sheet" role="dialog" aria-label="เมนูเพิ่มเติม">
        <div class="m-grab"></div>
        <div class="m-me"><div class="avatar ${ME.admin() ? 'gold' : ''}">${esc((store.teacher.name || 'ค').charAt(0))}</div>
          <div><b>${esc(store.teacher.name)}</b><small>${ME.admin() ? 'ผู้ดูแลระบบ' : 'ครูผู้ใช้'} · ภาคเรียน ${esc(Q.termLabel(Q.currentTerm()))}</small></div></div>
        ${navGroups().map(g => { const its = g.items.filter(n => !tabs.some(t => t.id === n.id)); if (!its.length) return '';
          return `<div class="m-sec g-${g.key}"><div class="m-sec-h">${g.label || 'ทางลัด'}</div><div class="m-grid4">${its.map(n => { const b = navBadge(n.id); return `<a href="#${n.id}" class="${n.id === navOn ? 'on' : ''}"><span class="m-ic">${ic(n.icon)}${b ? `<i class="nav-badge">${b > 99 ? '99+' : b}</i>` : ''}</span><span>${n.short || n.label}</span></a>`; }).join('')}${g.key === 'top' ? `<a href="#student" class="stu-link"><span class="m-ic">${ic('student')}</span><span>หน้านักเรียน</span></a>` : ''}</div></div>`; }).join('')}
        <div class="m-list">
          <button data-act="theme">${ic(dark ? 'sun' : 'moon')}<span>${dark ? 'โหมดสว่าง' : 'โหมดมืด'}</span></button>
          <button data-act="logout" class="danger">${ic('logout')}<span>ออกจากระบบ</span></button>
        </div>
      </div>
    </div>` : ''}
  </div>`;
}

/* ตาราง → การ์ด: ติดป้ายหัวคอลัมน์ให้ทุกช่อง (CSS ใช้แสดงบนมือถือ) */
function labelTables(root) {
  root.querySelectorAll('table.tbl').forEach(t => {
    const hs = [...t.querySelectorAll('thead th')].map(th => th.textContent.trim());
    t.querySelectorAll('tbody tr').forEach(tr => [...tr.children].forEach((td, i) => {
      if (td.dataset.label === undefined) td.dataset.label = hs[i] || '';
    }));
  });
}
let _lblQueued = false;
new MutationObserver(() => {
  if (_lblQueued) return; _lblQueued = true;
  requestAnimationFrame(() => { _lblQueued = false; labelTables(document); decorateEmpties(document); if (typeof FX !== 'undefined') { FX.syncBg(); if (!FX.did && document.querySelector('.content, .stu-wrap, .stu-card')) { FX.did = true; FX.enter(); } } const sh = document.querySelector('.m-shell'); if (sh) sh.classList.toggle('scrolled', window.scrollY > 60); });
}).observe(document.body, { childList: true, subtree: true });

I.back = '<path d="M15 5l-7 7 7 7"/>';
Object.assign(ACT, {
  'm-more': () => { ui.moreOpen = !ui.moreOpen; render(); },
  'm-more-close': (el, e) => { if (e.target === el) { ui.moreOpen = false; render(); } },
});

/* ---------- กระจกเหลว: ไฮไลต์ตามนิ้ว/เมาส์ + แถบแท็บหดเมื่อเลื่อน ---------- */
document.addEventListener('pointermove', e => {
  const b = e.target.closest?.('.btn'); if (!b) return;
  const r = b.getBoundingClientRect();
  b.style.setProperty('--mx', `${e.clientX - r.left}px`); b.style.setProperty('--my', `${e.clientY - r.top}px`);
}, { passive: true });
let _lastY = 0;
function syncScrollUI() {
  const y = window.scrollY, tabs = document.querySelector('.m-tabs'), sh = document.querySelector('.m-shell');
  if (sh) sh.classList.toggle('scrolled', y > 60);
  if (tabs && !ui.moreOpen) tabs.classList.toggle('min', y > 80 && y > _lastY);
  _lastY = y;
}
window.addEventListener('scroll', syncScrollUI, { passive: true });

/* =====================================================================
   เอฟเฟกต์: พื้นหลังอีโมจิ · เข้าหน้าใหม่ · ตัวเลขนับขึ้น · ระลอกน้ำ · การ์ดเอียง · สลับธีมแบบวงกลม
   ===================================================================== */
const FX = (() => {
  const calm = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
  const EMOJI = ['📚', '✏️', '🎨', '🎧', '💡', '⭐', '🧪', '📐', '💻', '🎒', '🏆', '📝', '🔬', '🌈', '🚀', '🎵', '⚽', '🧩', '📖', '🌟', '🍎', '🔭', '🎯', '🖍️', '📏', '🧠', '🎮', '🌻', '☁️', '🦄', '🐱', '🍀'];

  /* ---------- พื้นหลังอีโมจิ (สุ่มครั้งเดียว ตรึงไว้กับหน้าจอ) ---------- */
  let bgBuilt = 0;
  function buildEmojiBg() {
    let el = document.getElementById('emoji-bg');
    if (!el) { el = document.createElement('div'); el.id = 'emoji-bg'; el.setAttribute('aria-hidden', 'true'); document.body.prepend(el); }
    const w = innerWidth, h = innerHeight, gap = w < 600 ? 74 : 96;
    if (Math.abs(bgBuilt - w * 10000 - h) < 1) return;
    bgBuilt = w * 10000 + h;
    let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
    const out = [];
    const cols = Math.ceil(w / gap) + 1, rows = Math.ceil(h / gap) + 1;
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const x = c * gap + (r % 2 ? gap / 2 : 0) + (rnd() - .5) * gap * .35, y = r * gap + (rnd() - .5) * gap * .35;
      out.push(`<span style="left:${x}px;top:${y}px;--s:${Math.round(22 + rnd() * 16)}px;--r:${Math.round((rnd() - .5) * 50)}deg">${EMOJI[Math.floor(rnd() * EMOJI.length)]}</span>`);
    }
    el.innerHTML = out.join('');
  }
  function syncBg() {
    const on = typeof isStudentRoute === 'function' && (isStudentRoute() || isExamTakeRoute() || isCheckinRoute() || isGalleryRoute());
    document.body.classList.toggle('stu-bg', on);
    if (on) buildEmojiBg();
  }
  let rT; addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(() => { bgBuilt = 0; if (document.body.classList.contains('stu-bg')) buildEmojiBg(); }, 200); });

  /* ---------- เข้าหน้าใหม่: ลอยขึ้นทีละส่วน + ตัวเลขนับขึ้น ---------- */
  function enter() {
    if (calm()) return;
    const box = document.querySelector('.content') || document.querySelector('.stu-wrap') || document.querySelector('.stu');
    if (!box) return;
    [...box.children].slice(0, 10).forEach((c, i) => c.style.setProperty('--i', i));
    box.classList.remove('enter'); void box.offsetWidth; box.classList.add('enter');
    setTimeout(() => box.classList.remove('enter'), 1400);
    box.querySelectorAll('.stat .val, .counter b').forEach(countUp);
  }
  function countUp(el) {
    const m = el.textContent.trim().match(/^(\d+(?:\.\d+)?)(%?)$/); if (!m) return;
    const end = +m[1], suf = m[2], dec = (m[1].split('.')[1] || '').length; if (!end) return;
    const t0 = performance.now(), dur = 900; el.classList.add('counting');
    const step = t => { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      if (!el.isConnected) return; el.textContent = (end * e).toFixed(dec) + suf; if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  }

  /* ---------- ระลอกน้ำในปุ่มกระจก ---------- */
  document.addEventListener('pointerdown', e => {
    if (calm()) return;
    const b = e.target.closest?.('.btn'); if (!b || b.disabled) return;
    const r = b.getBoundingClientRect(), s = Math.max(r.width, r.height) * 2.2;
    const sp = document.createElement('span'); sp.className = 'ripple';
    sp.style.cssText = `left:${e.clientX - r.left}px;top:${e.clientY - r.top}px;width:${s}px;height:${s}px`;
    b.appendChild(sp); setTimeout(() => sp.remove(), 700);
  }, { passive: true });

  /* ---------- การ์ดเอียงตามเมาส์ (PC) ---------- */
  const TILT = '.subj, .stat, .room-chip, .m-grid a, .counter';
  document.addEventListener('pointermove', e => {
    if (calm() || e.pointerType !== 'mouse') return;
    const c = e.target.closest?.(TILT); if (!c) return;
    const r = c.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
    c.classList.add('tilt', 'tilting');
    c.style.transform = `perspective(700px) rotateX(${(-y * 6).toFixed(2)}deg) rotateY(${(x * 7).toFixed(2)}deg) translateY(-3px)`;
  }, { passive: true });
  document.addEventListener('pointerout', e => {
    const c = e.target.closest?.(TILT); if (!c || c.contains(e.relatedTarget)) return;
    c.classList.remove('tilting'); c.style.transform = '';
  }, { passive: true });

  /* ---------- สลับธีมแบบวงกลมขยายจากปุ่ม ---------- */
  let lastPt = { x: innerWidth - 60, y: 40 };
  document.addEventListener('click', e => { if (e.target.closest?.('[data-act=theme]')) lastPt = { x: e.clientX, y: e.clientY }; }, true);
  const origTheme = ACT.theme;
  ACT.theme = () => {
    if (!document.startViewTransition || calm()) return origTheme();
    const { x, y } = lastPt, rad = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
    const vt = document.startViewTransition(() => origTheme());
    vt.ready.then(() => document.documentElement.animate({ clipPath: [`circle(0 at ${x}px ${y}px)`, `circle(${rad}px at ${x}px ${y}px)`] },
      { duration: 550, easing: 'cubic-bezier(.2,.9,.25,1)', pseudoElement: '::view-transition-new(root)' })).catch(() => {});
  };

  addEventListener('hashchange', () => requestAnimationFrame(() => { syncBg(); enter(); }));
  return { syncBg, enter };
})();

/* ---------- นาฬิกาเรืองแสง ---------- */
const TH_DAY = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
const TH_MON = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
function clockParts(d = new Date()) {
  const p = n => String(n).padStart(2, '0');
  return { hm: `${p(d.getHours())}:${p(d.getMinutes())}`, s: p(d.getSeconds()), d: `วัน${TH_DAY[d.getDay()]}ที่ ${d.getDate()} ${TH_MON[d.getMonth()]} ${d.getFullYear() + 543}` };
}
function clockHTML() {
  const c = clockParts();
  return `<div class="live-clock" role="timer" aria-label="เวลาปัจจุบัน"><div class="lc-time"><span data-clock="hm">${c.hm}</span><span class="lc-sec" data-clock="s">${c.s}</span></div><div class="lc-date" data-clock="d">${c.d}</div></div>`;
}
/* โหมดมืด = ภาพกลางคืน ให้ตัวอักษรเรืองแสงอ่านง่าย */
function sceneHour(h = new Date().getHours()) { return document.documentElement.dataset.theme === 'dark' ? 21 : h; }
setInterval(() => {
  const els = document.querySelectorAll('[data-clock]'); if (!els.length) return;
  const c = clockParts(); els.forEach(el => { const v = c[el.dataset.clock]; if (el.textContent !== v) el.textContent = v; });
}, 1000);

</script>
