<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ห้องเรียนครู</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#f4f2ec;--surface:#fff;--surface-2:#f9f8f4;--ink:#1c2321;--muted:#5f6a65;--line:#e3e0d6;
  --primary:#1f6f5c;--primary-ink:#fff;--primary-soft:#e2efea;--accent:#d9952a;--accent-soft:#fbf0dc;
  --danger:#bf3d2a;--danger-soft:#fbe8e4;--ok:#2f8a4e;--ok-soft:#e3f3e8;
  --side:#173d33;--side-ink:#e8f1ed;--side-muted:#9fbdb2;--side-hover:#1f4d41;--side-active:#f2c56b;
  --shadow:0 1px 2px rgba(20,30,25,.06),0 4px 16px rgba(20,30,25,.06);
  --r:14px;--r-sm:9px;
  --f-head:'Anuphan','IBM Plex Sans Thai',system-ui,sans-serif;
  --f-body:'IBM Plex Sans Thai',system-ui,sans-serif;
  color-scheme:light;
}
[data-theme=dark]{
  --bg:#111513;--surface:#191e1c;--surface-2:#1f2522;--ink:#e8ece9;--muted:#9aa49f;--line:#2b3330;
  --primary:#4cb394;--primary-ink:#0b1310;--primary-soft:#1b3a31;--accent:#f0b955;--accent-soft:#3a2f1a;
  --danger:#ef7a64;--danger-soft:#3b211c;--ok:#5fc57f;--ok-soft:#1b3424;
  --side:#0d1311;--side-ink:#e3ebe7;--side-muted:#7f948b;--side-hover:#18221e;--side-active:#f0b955;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-head);margin:0;line-height:1.3;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary)}
.muted{color:var(--muted)}
.small{font-size:13px}
.hide{display:none!important}

/* ---------- buttons & inputs ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:var(--r-sm);cursor:pointer;font-weight:500;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface-2);border-color:color-mix(in srgb,var(--line) 60%,var(--ink))}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,var(--line))}
.btn.danger.solid{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:5px 10px;font-size:13.5px}
.btn.icon{padding:7px;width:36px;height:36px;justify-content:center}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:17px;height:17px;flex:none}
.input,select.input,textarea.input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);outline:none;transition:border-color .15s,box-shadow .15s}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
label.field{display:flex;flex-direction:column;gap:5px;font-size:14px;font-weight:500}
label.field>span{color:var(--muted);font-weight:500}
.row{display:flex;gap:12px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:100px 1fr 1fr;gap:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);font-size:13px;white-space:nowrap}
.chip.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.chip.warn{background:var(--accent-soft);border-color:transparent;color:color-mix(in srgb,var(--accent) 75%,var(--ink))}
.chip.bad{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.chip.pri{background:var(--primary-soft);border-color:transparent;color:var(--primary)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:var(--side);color:var(--side-ink);padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand-mark{width:38px;height:38px;border-radius:11px;background:var(--side-active);color:#1b2a24;display:grid;place-items:center;font:700 19px var(--f-head)}
.brand b{font:600 17px var(--f-head);display:block}
.brand small{color:var(--side-muted);font-size:12.5px}
.nav-group{font-size:12px;letter-spacing:.04em;color:var(--side-muted);padding:14px 10px 4px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:10px;color:var(--side-ink);text-decoration:none;cursor:pointer;border:0;background:none;width:100%;text-align:left;font-size:15px}
.nav-item svg{width:19px;height:19px;opacity:.85;flex:none}
.nav-item:hover{background:var(--side-hover)}
.nav-item.active{background:var(--side-hover);box-shadow:inset 3px 0 0 var(--side-active)}
.nav-item.active svg{color:var(--side-active);opacity:1}
.nav-item .soon{margin-left:auto;font-size:11px;padding:1px 7px;border-radius:99px;background:rgba(255,255,255,.08);color:var(--side-muted)}
.side-foot{margin-top:auto;padding:14px 10px 0;font-size:12px;color:var(--side-muted);border-top:1px solid rgba(255,255,255,.08)}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:14px 28px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(8px);position:sticky;top:0;z-index:5}
.top h1{font-size:20px}
.content{padding:26px 28px 40px;max-width:1240px;width:100%}
.credit{text-align:center;font-size:12.5px;color:var(--muted);padding:18px 0 26px;margin-top:auto}
.menu-btn{display:none}
.scrim{display:none}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.card-h h3{font-size:16.5px}
.card-b{padding:18px 20px}
.page-head{display:flex;align-items:flex-end;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.page-head h2{font-size:24px}
.page-head p{margin:2px 0 0;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stat{padding:16px 18px}
.stat .lbl{color:var(--muted);font-size:13.5px;display:flex;align-items:center;gap:7px}
.stat .lbl svg{width:16px;height:16px}
.stat .val{font:600 30px/1.2 var(--f-head);margin-top:6px;font-variant-numeric:tabular-nums}
.stat .sub{font-size:12.5px;color:var(--muted)}
.dash-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
.empty{text-align:center;padding:34px 20px;color:var(--muted)}
.empty svg{width:42px;height:42px;opacity:.5;margin-bottom:6px}
.empty b{display:block;color:var(--ink);font:600 16px var(--f-head);margin-bottom:4px}

/* phases */
.phases{list-style:none;margin:0;padding:0}
.phases li{display:flex;gap:12px;padding:9px 0;align-items:flex-start}
.phases .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:600;flex:none;border:2px solid var(--line);color:var(--muted)}
.phases li.now .dot{border-color:var(--primary);background:var(--primary);color:var(--primary-ink)}
.phases li.now b{color:var(--primary)}
.phases b{font-weight:600;display:block;font-size:14.5px}
.phases span{font-size:13px;color:var(--muted)}

/* subjects */
.subj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.subj{overflow:hidden;display:flex;flex-direction:column}
.subj-top{height:6px}
.subj .card-b{display:flex;flex-direction:column;gap:10px;flex:1}
.subj-code{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.subj h3{font-size:18px}
.subj-foot{display:flex;align-items:center;gap:6px;padding:10px 14px 10px 20px;border-top:1px solid var(--line);background:var(--surface-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* classes */
.two-pane{display:grid;grid-template-columns:270px 1fr;gap:18px;align-items:start}
.cls-list{padding:8px}
.cls-item{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:10px;border:0;background:none;cursor:pointer;text-align:left}
.cls-item:hover{background:var(--surface-2)}
.cls-item.active{background:var(--primary-soft)}
.cls-item.active .cls-name{color:var(--primary)}
.cls-name{font:600 15.5px var(--f-head)}
.cls-sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cls-count{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.search{position:relative;flex:1;min-width:180px;max-width:300px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.search .input{padding-left:33px}
.bulk{display:flex;gap:8px;align-items:center;padding:9px 16px;background:var(--accent-soft);border-bottom:1px solid var(--line);font-size:14px}
.tbl-wrap{overflow:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-weight:600;font-size:13px;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:hover td{background:color-mix(in srgb,var(--surface-2) 60%,transparent)}
.tbl tr.inactive td{color:var(--muted)}
.tbl .num{font-variant-numeric:tabular-nums;width:60px}
.tbl .act{width:1%;white-space:nowrap;text-align:right}
.tbl td .input{padding:5px 8px;font-size:14px;min-width:70px}
.tbl input[type=checkbox]{width:16px;height:16px;accent-color:var(--primary)}
.code-mask{font-variant-numeric:tabular-nums;letter-spacing:.03em}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(10,18,15,.45);display:grid;place-items:center;padding:20px;z-index:50;animation:fade .15s}
.modal{background:var(--surface);border-radius:16px;width:min(520px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:pop .18s}
.modal.wide{width:min(860px,100%)}
.modal-h{display:flex;align-items:center;padding:18px 22px 6px}
.modal-h h3{font-size:19px}
.modal-b{padding:14px 22px;overflow:auto}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 22px 18px;border-top:1px solid var(--line)}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:30px;height:30px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer}
.swatch.on{box-shadow:0 0 0 2px var(--ink)}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.check{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-sm);cursor:pointer;font-size:14px}
.check:has(input:checked){border-color:var(--primary);background:var(--primary-soft)}
.check input{accent-color:var(--primary)}

/* upload */
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:30px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;display:block}
.drop:hover,.drop.over{border-color:var(--primary);background:var(--primary-soft)}
.drop svg{width:40px;height:40px;color:var(--primary)}
.drop b{display:block;font:600 16px var(--f-head);margin:6px 0 2px}
.fmt{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;font-size:13.5px}
.fmt table{border-collapse:collapse;margin:8px 0;font-size:13px}
.fmt td,.fmt th{border:1px solid var(--line);padding:3px 9px;background:var(--surface)}
.sheet{border:1px solid var(--line);border-radius:var(--r-sm);margin-bottom:12px;overflow:hidden}
.sheet-h{display:flex;gap:12px;align-items:center;padding:10px 14px;background:var(--surface-2);flex-wrap:wrap}
.sheet-h input[type=checkbox]{width:18px;height:18px;accent-color:var(--primary)}
.sheet-h .input{width:150px;padding:6px 10px}
.sheet-b{padding:10px 14px;font-size:13.5px}
.warn-list{margin:6px 0 0;padding-left:18px;color:color-mix(in srgb,var(--accent) 70%,var(--ink))}
.radio-row{display:flex;gap:10px;flex-wrap:wrap}
.radio{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);cursor:pointer;flex:1;min-width:220px;font-size:14px}
.radio:has(input:checked){border-color:var(--primary);background:var(--primary-soft)}
.radio input{accent-color:var(--primary);margin-top:4px}

/* toast */
.toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:60;align-items:center}
.toast{background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;box-shadow:var(--shadow);animation:pop .2s}
.toast.err{background:var(--danger);color:#fff}

/* login & student */
.auth{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.auth-art{background:var(--side);color:var(--side-ink);padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.auth-art h1{font-size:38px;max-width:420px;line-height:1.25}
.auth-art p{color:var(--side-muted);max-width:420px}
.auth-art .lines{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 37px,rgba(255,255,255,.04) 37px 38px);pointer-events:none}
.auth-feat{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:460px;position:relative}
.auth-feat div{background:rgba(255,255,255,.06);border-radius:12px;padding:12px 14px;font-size:14px}
.auth-feat b{display:block;color:var(--side-active);font-family:var(--f-head)}
.auth-form{display:grid;place-items:center;padding:32px}
.auth-card{width:min(400px,100%)}
.auth-card h2{font-size:26px;margin-bottom:4px}
.note{background:var(--accent-soft);border-radius:var(--r-sm);padding:10px 12px;font-size:13.5px}
.stu{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:28px 18px;background:radial-gradient(circle at 20% 0%,var(--primary-soft),transparent 55%),var(--bg)}
.stu-card{width:min(440px,100%);padding:26px}
.stu-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stu-tile{border:1px solid var(--line);border-radius:12px;padding:14px 8px;text-align:center;font-size:14px;background:var(--surface-2)}
.stu-tile svg{width:26px;height:26px;color:var(--primary);display:block;margin:0 auto 4px}
.stu-tile small{display:block;color:var(--muted);font-size:11.5px}
.avatar{width:54px;height:54px;border-radius:50%;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;font:600 22px var(--f-head)}

.soon-page{max-width:680px}
.soon-page ul{padding-left:20px;margin:10px 0 0}
.soon-page li{margin:4px 0}

@media (max-width:1000px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .dash-grid,.two-pane{grid-template-columns:1fr}
}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:40;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30}
  .menu-btn{display:inline-flex}
  .top{padding:12px 16px}
  .content{padding:18px 16px 30px}
  .auth{grid-template-columns:1fr}
  .auth-art{padding:28px;gap:20px}
  .auth-art h1{font-size:28px}
  .top .hide-sm{display:none}
  .grid2,.grid3{grid-template-columns:1fr}
}

</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script>
/* ===== ตัวอ่านไฟล์รายชื่อนักเรียน (Excel/CSV) =====
   รับ rows = array ของแถว (แต่ละแถวเป็น array ของเซลล์) จาก 1 ชีต
   คืน { name, homeroom, students:[{number,student_code,prefix,first_name,last_name}], warnings:[] } */
const RosterParser = (() => {
  const PREFIXES = ['เด็กชาย','เด็กหญิง','ด.ช.','ด.ญ.','ดช.','ดญ.','นางสาว','น.ส.','นาย','นาง'];
  const norm = v => String(v ?? '').replace(/\s+/g, ' ').trim();
  const flat = v => norm(v).replace(/\s|\.|-/g, '').toLowerCase();

  function splitPrefix(text) {
    let t = norm(text);
    for (const p of PREFIXES) {
      if (t.startsWith(p)) return { prefix: p, rest: norm(t.slice(p.length)) };
    }
    return { prefix: '', rest: t };
  }

  function cellToCode(v) {
    if (v === null || v === undefined) return '';
    if (typeof v === 'number') return String(Math.round(v));
    return norm(v).replace(/\.0$/, '');
  }

  function detectColumns(row) {
    const cols = {};
    row.forEach((c, i) => {
      const f = flat(c);
      if (!f) return;
      if (cols.number === undefined && (f === 'เลขที่' || f === 'ที่' || f === 'no' || f === 'เลขที่นักเรียน')) cols.number = i;
      else if (cols.code === undefined && (f.includes('เลขประจำตัว') || f.includes('รหัสนักเรียน') || f.includes('เลขที่ประจำตัว') || f === 'รหัส' || f === 'studentid' || f === 'id')) cols.code = i;
      else if (cols.prefix === undefined && f.includes('คำนำหน้า')) cols.prefix = i;
      else if (cols.full === undefined && f.includes('ชื่อ') && f.includes('สกุล')) cols.full = i;
      else if (cols.last === undefined && (f === 'นามสกุล' || f === 'สกุล' || f === 'lastname' || f === 'surname')) cols.last = i;
      else if (cols.first === undefined && (f === 'ชื่อ' || f === 'firstname' || f === 'name' || f === 'ชื่อนักเรียน')) cols.first = i;
    });
    return cols;
  }

  function parseSheet(sheetName, rows) {
    const warnings = [];
    let headerIdx = -1, cols = null;
    for (let r = 0; r < Math.min(rows.length, 20); r++) {
      const c = detectColumns(rows[r] || []);
      if (c.number !== undefined && (c.first !== undefined || c.full !== undefined)) { headerIdx = r; cols = c; break; }
    }
    // หาชื่อครูที่ปรึกษาจากแถวด้านบนหัวตาราง
    let homeroom = '';
    const topEnd = headerIdx >= 0 ? headerIdx : Math.min(rows.length, 6);
    for (let r = 0; r < topEnd; r++) {
      const line = (rows[r] || []).map(norm).filter(Boolean).join(' ');
      const m = line.match(/ครูที่ปรึกษา\s*[:：]?\s*(.+)/);
      if (m) { homeroom = norm(m[1]); break; }
    }
    // ชื่อห้องจากหัวกระดาษ เช่น "ม.3/3" หรือ "มัธยมศึกษาปีที่ 3/3"
    let titleRoom = '';
    for (let r = 0; r < topEnd && !titleRoom; r++) {
      const line = (rows[r] || []).map(norm).join(' ');
      const m = line.match(/ม\.\s*(\d+)\s*[\/-]\s*(\d+)/) || line.match(/มัธยมศึกษาปีที่\s*(\d+)\s*[\/-]\s*(\d+)/);
      if (m) titleRoom = `ม.${m[1]}/${m[2]}`;
    }
    const looksLikeRoom = /ม\.?\s*\d/.test(sheetName);
    const name = (!looksLikeRoom && titleRoom) ? titleRoom : norm(sheetName);
    if (headerIdx < 0) {
      return { name, homeroom, students: [], warnings: ['ไม่พบหัวตารางที่มีคำว่า "เลขที่" และ "ชื่อ" ในชีตนี้'] };
    }
    if (cols.code === undefined) warnings.push('ไม่พบคอลัมน์เลขประจำตัวนักเรียน นักเรียนจะยังยืนยันตัวตนไม่ได้จนกว่าจะเติม');

    const students = [];
    const seen = new Set();
    for (let r = headerIdx + 1; r < rows.length; r++) {
      const row = rows[r] || [];
      const num = parseInt(String(row[cols.number] ?? '').replace(/[^\d]/g, ''), 10);
      if (!Number.isFinite(num)) continue;
      let prefix = cols.prefix !== undefined ? norm(row[cols.prefix]) : '';
      let first = '', last = '';
      if (cols.full !== undefined && cols.first === undefined) {
        const sp = splitPrefix(row[cols.full]);
        if (!prefix) prefix = sp.prefix;
        const parts = sp.rest.split(' ');
        first = parts.shift() || '';
        last = parts.join(' ');
      } else {
        const sp = splitPrefix(row[cols.first]);
        if (!prefix) prefix = sp.prefix;
        first = sp.rest;
        last = cols.last !== undefined ? norm(row[cols.last]) : '';
      }
      if (!first) continue;
      if (seen.has(num)) warnings.push(`เลขที่ ${num} ซ้ำกัน (ใช้แถวแรก)`);
      if (seen.has(num)) continue;
      seen.add(num);
      const code = cols.code !== undefined ? cellToCode(row[cols.code]) : '';
      students.push({ number: num, student_code: code, prefix, first_name: first, last_name: last });
    }
    const noCode = students.filter(s => !s.student_code).length;
    if (cols.code !== undefined && noCode) warnings.push(`${noCode} คนไม่มีเลขประจำตัว`);
    if (!students.length) warnings.push('ไม่พบรายชื่อนักเรียนใต้หัวตาราง');
    students.sort((a, b) => a.number - b.number);
    return { name, homeroom, students, warnings };
  }

  // CSV สำรอง กรณีโหลดไลบรารี Excel ไม่ได้
  function parseCSV(text) {
    const rows = []; let row = [], cell = '', q = false;
    text = text.replace(/^﻿/, '');
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) {
        if (ch === '"' && text[i + 1] === '"') { cell += '"'; i++; }
        else if (ch === '"') q = false;
        else cell += ch;
      } else if (ch === '"') q = true;
      else if (ch === ',') { row.push(cell); cell = ''; }
      else if (ch === '\n' || ch === '\r') {
        if (ch === '\r' && text[i + 1] === '\n') i++;
        row.push(cell); rows.push(row); row = []; cell = '';
      } else cell += ch;
    }
    if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
    return rows;
  }

  return { parseSheet, parseCSV, splitPrefix };
})();
if (typeof module !== 'undefined') module.exports = RosterParser;

  const out = [];
  for (let from = 0; ; from += 1000) {
    const rows = await q(sb.from(table).select('*').order(order, { ascending: true }).range(from, from + 999));
    out.push(...rows);
    if (rows.length < 1000) break;
  }
  return out;
}

async function saveSubject() {
  const name = mval('name');
  if (!name) { toast('กรุณากรอกชื่อวิชา', true); return; }
  const data = { code: mval('code'), name, term_id: mval('term_id') || null, color: modalCtx.color };
  const sel = $$('#modal-root input[name=cls]:checked').map(x => x.value);
  let id = modalCtx.subjectId;
  if (id) await db.update('subjects', id, data); else id = (await db.insert('subjects', data)).id;
  await q(sb.from('subject_classes').delete().eq('subject_id', id));
  store.subject_classes = store.subject_classes.filter(x => x.subject_id !== id);
  if (sel.length) {
    const rows = await q(sb.from('subject_classes').insert(sel.map(c => ({ subject_id: id, classroom_id: c }))).select());
    store.subject_classes.push(...rows);
  }
  closeModal(); render(); toast('บันทึกวิชาแล้ว');
}

async function saveStudent() {
  const number = parseInt(mval('number'), 10), first = mval('first_name'), cid = mval('classroom_id');
  if (!Number.isFinite(number) || number < 1) return toast('เลขที่ไม่ถูกต้อง', true);
  if (!first) return toast('กรุณากรอกชื่อ', true);
  const dup = store.students.find(x => x.classroom_id === cid && x.number === number && x.id !== modalCtx.studentId);

}

async function readRosterFile(file) {
  const ext = file.name.split('.').pop().toLowerCase();
  if (ext === 'csv') return [RosterParser.parseSheet(file.name.replace(/\.csv$/i, ''), RosterParser.parseCSV(await file.text()))];
  if (!window.XLSX) throw new Error('โหลดตัวอ่าน Excel ไม่สำเร็จ ลองบันทึกไฟล์เป็น .csv (UTF-8) แล้วอัปโหลดอีกครั้ง');
  const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
  return wb.SheetNames.map(n => RosterParser.parseSheet(n, XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, defval: '', raw: true })));
}
async function handleImportFile(file) {
  let sheets;
  try { sheets = await readRosterFile(file); } catch (e) { toast(e.message || 'อ่านไฟล์ไม่สำเร็จ', true); return; }
  sheets.forEach(s => { s.include = s.students.length > 0; });
  if (!sheets.some(s => s.include)) { toast('ไม่พบรายชื่อนักเรียนในไฟล์นี้', true); }
  importPreview(sheets, file.name);
}

async function doImport() {
  const { sheets } = modalCtx;
  const mode = $('#modal-root input[name=mode]:checked').value;
  const inc = sheets.filter(s => s.include && s.students.length);
  if (!inc.length) return toast('ยังไม่ได้เลือกชีตที่จะนำเข้า', true);
  const names = inc.map(s => s.name.trim());
  if (names.some(n => !n)) return toast('มีชีตที่ยังไม่ได้ตั้งชื่อห้อง', true);
  if (new Set(names).size !== names.length) return toast('มีชีตที่ตั้งชื่อห้องซ้ำกัน', true);
  let added = 0, updated = 0, rooms = 0, lastId = null;
  try {
    for (const s of inc) {
      let c = importTarget(s.name);
      if (!c) { c = await db.insert('classrooms', { name: s.name.trim(), homeroom_teacher: s.homeroom || null, sort_order: 0 }); rooms++; }
      else if (s.homeroom && !c.homeroom_teacher) await db.update('classrooms', c.id, { homeroom_teacher: s.homeroom });
      lastId = c.id;
      let rows;
      if (mode === 'replace') {
        await q(sb.from('students').delete().eq('classroom_id', c.id));
        rows = s.students.map(st => ({ ...st, classroom_id: c.id, active: true }));
        added += rows.length;
      } else {
        rows = s.students.map(st => {
          const ex = store.students.find(x => x.classroom_id === c.id && x.number === st.number);
          if (ex) { updated++; return { ...st, classroom_id: c.id, student_code: st.student_code || ex.student_code, prefix: st.prefix || ex.prefix || '', active: ex.active }; }
          added++; return { ...st, classroom_id: c.id, active: true };
        });
      }
      for (let i = 0; i < rows.length; i += 500) {
        await q(sb.from('students').upsert(rows.slice(i, i + 500), { onConflict: 'classroom_id,number' }));
      }
      await reloadStudents(c.id);
    }
  } catch (e) {
    await loadAll().catch(() => {}); ui.cid = lastId || ui.cid; closeModal(); render();
    return;
  }
  ui.cid = lastId; ui.sel.clear(); closeModal(); render();
  toast(`นำเข้าแล้ว: เพิ่ม ${added} คน${updated ? ` · อัปเดต ${updated} คน` : ''}${rooms ? ` · สร้างห้องใหม่ ${rooms} ห้อง` : ''}`);
}

  'modal-close': closeModal,
  'modal-bg': (el, e) => { if (e.target === el) closeModal(); },
  'modal-action': async el => {
    const btns = $$('#modal-root .modal-f .btn'); btns.forEach(b => { b.disabled = true; });
    try { await modalCtx?.actions[+el.dataset.i]?.onClick(); } catch (e) { console.error(e); }
    btns.forEach(b => { b.disabled = false; });
  },
  'side-open': () => { ui.sideOpen = true; render(); },
  'side-close': () => { ui.sideOpen = false; render(); },
  theme: () => { setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'); render(); },
  logout: () => confirmBox('ออกจากระบบ', 'ต้องการออกจากระบบใช่ไหม', 'ออกจากระบบ', async () => { await sb.auth.signOut(); session = null; render(); }),
  'subject-new': () => subjectModal(null),
  'subject-edit': el => subjectModal(db.get('subjects', el.dataset.id)),
  'subject-del': el => { const s = db.get('subjects', el.dataset.id);
    confirmBox('ลบวิชา', `ลบวิชา <b>${esc(s.name)}</b>? งาน คะแนน และข้อสอบของวิชานี้จะถูกลบด้วย`, 'ลบวิชา', async () => {
      await db.removeIds('subjects', [s.id]); store.subject_classes = store.subject_classes.filter(x => x.subject_id !== s.id); render(); toast('ลบวิชาแล้ว'); }); },
  'pick-color': el => { modalCtx.color = el.dataset.c; $$('#modal-root .swatch').forEach(s => s.classList.toggle('on', s === el)); },
  'class-pick': el => { ui.cid = el.dataset.id; ui.sel.clear(); ui.q = ''; render(); },
  'class-new': () => classModal(null),
  'class-edit': el => classModal(db.get('classrooms', el.dataset.id)),
  'class-del': el => { const c = db.get('classrooms', el.dataset.id); const n = Q.students(c.id).length;
    confirmBox('ลบห้องเรียน', `ลบห้อง <b>${esc(c.name)}</b> และนักเรียน ${thaiNum(n)} คนในห้องนี้? งานและคะแนนของนักเรียนห้องนี้จะถูกลบด้วย ลบแล้วกู้คืนไม่ได้`, 'ลบห้อง', async () => {
      await db.removeIds('classrooms', [c.id]);
      store.students = store.students.filter(x => x.classroom_id !== c.id); store.subject_classes = store.subject_classes.filter(x => x.classroom_id !== c.id);
      ui.cid = null; render(); toast('ลบห้องแล้ว'); }); },
  'toggle-edit': () => { ui.tableEdit = !ui.tableEdit; render(); },
  'student-new': () => studentModal(null),
  'student-edit': el => studentModal(db.get('students', el.dataset.id)),
  'student-del': el => { const s = db.get('students', el.dataset.id);
    confirmBox('ลบนักเรียน', `ลบ <b>${esc(Q.fullName(s))}</b> (เลขที่ ${s.number})? งานและคะแนนของคนนี้จะถูกลบด้วย ถ้านักเรียนย้ายหรือลาออก แนะนำให้เปลี่ยนสถานะแทนการลบ`, 'ลบ', async () => {
      await db.removeIds('students', [s.id]); ui.sel.delete(s.id); render(); toast('ลบแล้ว'); }); },
  'bulk-del': () => { const ids = [...ui.sel];
    confirmBox('ลบนักเรียนที่เลือก', `ลบนักเรียน ${thaiNum(ids.length)} คน? งานและคะแนนของคนเหล่านี้จะถูกลบด้วย ลบแล้วกู้คืนไม่ได้`, 'ลบทั้งหมด', async () => {
      await db.removeIds('students', ids); ui.sel.clear(); render(); toast(`ลบ ${ids.length} คนแล้ว`); }); },
  'bulk-clear': () => { ui.sel.clear(); render(); },
  'import-open': importModal,
  'imp-slash': () => { modalCtx.sheets.forEach(s => { s.name = s.name.replace(/(ม\.\s*\d+)\s*-\s*(\d+)/, '$1/$2'); }); importPreview(modalCtx.sheets, modalCtx.fname); },
  'term-new': termModal,
  'term-current': async el => {
    const id = el.dataset.id;
    await q(sb.from('terms').update({ is_current: false }).neq('id', id));
    await q(sb.from('terms').update({ is_current: true }).eq('id', id));
    store.terms.forEach(t => { t.is_current = t.id === id; }); ui.termId = null; render(); toast('เปลี่ยนภาคเรียนปัจจุบันแล้ว'); },
  'term-del': el => { const t = db.get('terms', el.dataset.id); const n = Q.subjectsOfTerm(t.id).length;
    if (n) return toast(`ภาคเรียนนี้มี ${n} วิชา ย้ายหรือลบวิชาก่อน`, true);
    confirmBox('ลบภาคเรียน', `ลบภาคเรียน ${Q.termLabel(t)}?`, 'ลบ', async () => { await db.removeIds('terms', [t.id]); render(); }); },
  'pw-open': pwModal,
  'stu-out': () => { stuState.verified = null; try { sessionStorage.removeItem('cr-student'); } catch (e) {} render(); },
};
const CHG = {
  'term-filter': el => { ui.termId = el.value; render(); },
  sel: el => { el.checked ? ui.sel.add(el.dataset.id) : ui.sel.delete(el.dataset.id); render(); },
  'sel-all': el => { const vis = $$('#stu-tbl tbody tr:not([hidden])').map(r => r.dataset.row); vis.forEach(id => el.checked ? ui.sel.add(id) : ui.sel.delete(id)); render(); },
  'bulk-move': async el => { const to = el.value; if (!to) return; const ids = [...ui.sel];
    const taken = new Set(Q.students(to).map(s => s.number));
    const clash = ids.map(id => db.get('students', id)).filter(s => taken.has(s.number));
    if (clash.length) { el.value = ''; return toast(`ห้องปลายทางมีเลขที่ ${clash.map(s => s.number).join(', ')} แล้ว แก้เลขที่ก่อนย้าย`, true); }
    el.disabled = true;
    try { await q(sb.from('students').update({ classroom_id: to }).in('id', ids)); } catch (e) { el.disabled = false; el.value = ''; return; }
    ids.forEach(id => { db.get('students', id).classroom_id = to; }); ui.sel.clear(); ui.cid = to; render(); toast(`ย้าย ${ids.length} คนแล้ว`); },
  cell: async el => { const s = db.get('students', el.dataset.id); const f = el.dataset.f; let v = el.value.trim();
    if (f === 'number') { v = parseInt(v, 10);
      if (!Number.isFinite(v) || v < 1) { el.value = s.number; return toast('เลขที่ไม่ถูกต้อง', true); }
      if (store.students.some(x => x.classroom_id === s.classroom_id && x.number === v && x.id !== s.id)) { el.value = s.number; return toast(`เลขที่ ${v} มีแล้วในห้องนี้`, true); } }
    if (f === 'first_name' && !v) { el.value = s.first_name; return toast('ชื่อห้ามว่าง', true); }
    const old = s[f];
    try { await db.update('students', s.id, { [f]: v }); } catch (e) { el.value = old ?? ''; return; }
    el.style.borderColor = 'var(--ok)'; setTimeout(() => { el.style.borderColor = ''; }, 700); },
  'import-file': el => { const f = el.files[0]; if (f) handleImportFile(f); },
  'imp-inc': el => { modalCtx.sheets[+el.dataset.i].include = el.checked; updImpTotal(); },
  'teacher-name': async el => { const name = el.value.trim() || 'ครูผู้สอน';
    await q(sb.auth.updateUser({ data: { display_name: name } })); store.teacher.name = name; render(); toast('บันทึกแล้ว'); },
};
const INP = {
  search: el => { ui.q = el.value; const q = el.value.toLowerCase().trim(); $$('#stu-tbl tbody tr').forEach(r => { r.hidden = !!q && !r.dataset.search.includes(q); }); },
  'imp-name': el => { const i = +el.dataset.i; modalCtx.sheets[i].name = el.value;
    $(`#imp-tgt-${i}`).innerHTML = importTarget(el.value) ? '<span class="chip warn">มีห้องนี้แล้ว · จะอัปเดต</span>' : '<span class="chip ok">สร้างห้องใหม่</span>'; },
};
function updImpTotal() { const n = modalCtx.sheets.filter(s => s.include).reduce((a, s) => a + s.students.length, 0); $('#imp-total').textContent = thaiNum(n); }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  if (t.dataset.act === 'modal-bg' && e.target !== t) return;
  if (t.disabled) return;
  Promise.resolve(ACT[t.dataset.act]?.(t, e)).catch(err => console.error(err));
});
document.addEventListener('change', e => { const t = e.target.closest('[data-chg]'); if (t) Promise.resolve(CHG[t.dataset.chg]?.(t, e)).catch(err => console.error(err)); });
document.addEventListener('input', e => { const t = e.target.closest('[data-inp]'); if (t) INP[t.dataset.inp]?.(t, e); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && modalCtx) closeModal(); });
document.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, fd = new FormData(f);
  const btn = f.querySelector('button.primary'); if (btn) btn.disabled = true;
  try {
    if (f.dataset.form === 'login') {
      const data = await q(sb.auth.signInWithPassword({ email: String(fd.get('email')).trim(), password: fd.get('password') }));
      session = data.session; setTeacher(data.user);
      booting = true; render();
      try { await loadAll(); } finally { booting = false; }
      if (location.hash !== '#dashboard') location.hash = 'dashboard'; else route();
    }
    if (f.dataset.form === 'stu') {
      const num = parseInt(fd.get('num'), 10), code = String(fd.get('code')).trim();
      const rows = await q(sb.rpc('student_verify', { p_classroom_id: fd.get('cid'), p_number: num, p_code: code }));
      if (!rows.length) { toast('ข้อมูลไม่ตรงกัน ตรวจสอบห้อง เลขที่ และเลขประจำตัวอีกครั้ง', true); return; }
      stuState.verified = { ...rows[0], number: num };
      try { sessionStorage.setItem('cr-student', JSON.stringify(stuState.verified)); } catch (err) {}
      render();
    }
  } catch (err) { console.error(err); }
  finally { if (btn && btn.isConnected) btn.disabled = false; }
});
function route() { ui.route = location.hash.slice(1) || 'dashboard'; ui.sideOpen = false; closeModal(); render(); window.scrollTo(0, 0); }
window.addEventListener('hashchange', route);
sb.auth.onAuthStateChange((event) => {
  if (event === 'SIGNED_OUT' && session) { session = null; render(); }
});

/* ---------- เริ่มทำงาน ---------- */
(async () => {
  render();
  try {
    const { data } = await sb.auth.getSession();
    session = data.session;
    if (session) { setTeacher(session.user); await loadAll(); }
  } catch (e) { console.error(e); }
  booting = false;
  route();
})();

</script>
</body>
</html>
