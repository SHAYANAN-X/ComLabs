<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ห้องเรียนครูปลื้ม</title>
<meta name="theme-color" content="#6d4dff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%236d4dff'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='%23ffd23f' font-family='sans-serif' font-weight='700'%3E%E0%B8%9B%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#f4f2ec;--surface:#fff;--surface-2:#f9f8f4;--ink:#1c2321;--muted:#5f6a65;--line:#e3e0d6;
  --primary:#1f6f5c;--primary-ink:#fff;--primary-soft:#e2efea;--accent:#d9952a;--accent-soft:#fbf0dc;
  --danger:#bf3d2a;--danger-soft:#fbe8e4;--ok:#2f8a4e;--ok-soft:#e3f3e8;
  --side:#173d33;--side-ink:#e8f1ed;--side-muted:#9fbdb2;--side-hover:#1f4d41;--side-active:#f2c56b;
  --shadow:0 1px 2px rgba(20,30,25,.06),0 4px 16px rgba(20,30,25,.06);
  --r:14px;--r-sm:9px;
  --f-head:'Anuphan','IBM Plex Sans Thai',system-ui,sans-serif;
  --f-body:'IBM Plex Sans Thai',system-ui,sans-serif;
  color-scheme:light;
}
[data-theme=dark]{
  --bg:#111513;--surface:#191e1c;--surface-2:#1f2522;--ink:#e8ece9;--muted:#9aa49f;--line:#2b3330;
  --primary:#4cb394;--primary-ink:#0b1310;--primary-soft:#1b3a31;--accent:#f0b955;--accent-soft:#3a2f1a;
  --danger:#ef7a64;--danger-soft:#3b211c;--ok:#5fc57f;--ok-soft:#1b3424;
  --side:#0d1311;--side-ink:#e3ebe7;--side-muted:#7f948b;--side-hover:#18221e;--side-active:#f0b955;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-head);margin:0;line-height:1.3;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary)}
.muted{color:var(--muted)}
.small{font-size:13px}
.hide{display:none!important}

/* ---------- buttons & inputs ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:var(--r-sm);cursor:pointer;font-weight:500;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface-2);border-color:color-mix(in srgb,var(--line) 60%,var(--ink))}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,var(--line))}
.btn.danger.solid{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:5px 10px;font-size:13.5px}
.btn.icon{padding:7px;width:36px;height:36px;justify-content:center}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:17px;height:17px;flex:none}
.input,select.input,textarea.input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);outline:none;transition:border-color .15s,box-shadow .15s}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
label.field{display:flex;flex-direction:column;gap:5px;font-size:14px;font-weight:500}
label.field>span{color:var(--muted);font-weight:500}
.row{display:flex;gap:12px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:100px 1fr 1fr;gap:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);font-size:13px;white-space:nowrap}
.chip.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.chip.warn{background:var(--accent-soft);border-color:transparent;color:color-mix(in srgb,var(--accent) 75%,var(--ink))}
.chip.bad{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.chip.pri{background:var(--primary-soft);border-color:transparent;color:var(--primary)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:var(--side);color:var(--side-ink);padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand-mark{width:38px;height:38px;border-radius:11px;background:var(--side-active);color:#1b2a24;display:grid;place-items:center;font:700 19px var(--f-head)}
.brand b{font:600 17px var(--f-head);display:block}
.brand small{color:var(--side-muted);font-size:12.5px}
.nav-group{font-size:12px;letter-spacing:.04em;color:var(--side-muted);padding:14px 10px 4px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:10px;color:var(--side-ink);text-decoration:none;cursor:pointer;border:0;background:none;width:100%;text-align:left;font-size:15px}
.nav-item svg{width:19px;height:19px;opacity:.85;flex:none}
.nav-item:hover{background:var(--side-hover)}
.nav-item.active{background:var(--side-hover);box-shadow:inset 3px 0 0 var(--side-active)}
.nav-item.active svg{color:var(--side-active);opacity:1}
.nav-item .soon{margin-left:auto;font-size:11px;padding:1px 7px;border-radius:99px;background:rgba(255,255,255,.08);color:var(--side-muted)}
.side-foot{margin-top:auto;padding:14px 10px 0;font-size:12px;color:var(--side-muted);border-top:1px solid rgba(255,255,255,.08)}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:14px 28px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(8px);position:sticky;top:0;z-index:5}
.top h1{font-size:20px}
.content{padding:26px 28px 40px;max-width:1240px;width:100%}
.credit{text-align:center;font-size:12.5px;color:var(--muted);padding:18px 0 26px;margin-top:auto}
.menu-btn{display:none}
.scrim{display:none}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.card-h h3{font-size:16.5px}
.card-b{padding:18px 20px}
.page-head{display:flex;align-items:flex-end;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.page-head h2{font-size:24px}
.page-head p{margin:2px 0 0;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stat{padding:16px 18px}
.stat .lbl{color:var(--muted);font-size:13.5px;display:flex;align-items:center;gap:7px}
.stat .lbl svg{width:16px;height:16px}
.stat .val{font:600 30px/1.2 var(--f-head);margin-top:6px;font-variant-numeric:tabular-nums}
.stat .sub{font-size:12.5px;color:var(--muted)}
.dash-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
.empty{text-align:center;padding:34px 20px;color:var(--muted)}
.empty svg{width:42px;height:42px;opacity:.5;margin-bottom:6px}
.empty b{display:block;color:var(--ink);font:600 16px var(--f-head);margin-bottom:4px}

/* phases */
.phases{list-style:none;margin:0;padding:0}
.phases li{display:flex;gap:12px;padding:9px 0;align-items:flex-start}
.phases .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:600;flex:none;border:2px solid var(--line);color:var(--muted)}
.phases li.now .dot{border-color:var(--primary);background:var(--primary);color:var(--primary-ink)}
.phases li.now b{color:var(--primary)}
.phases b{font-weight:600;display:block;font-size:14.5px}
.phases span{font-size:13px;color:var(--muted)}

/* subjects */
.subj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.subj{overflow:hidden;display:flex;flex-direction:column}
.subj-top{height:6px}
.subj .card-b{display:flex;flex-direction:column;gap:10px;flex:1}
.subj-code{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.subj h3{font-size:18px}
.subj-foot{display:flex;align-items:center;gap:6px;padding:10px 14px 10px 20px;border-top:1px solid var(--line);background:var(--surface-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* classes */
.two-pane{display:grid;grid-template-columns:270px 1fr;gap:18px;align-items:start}
.cls-list{padding:8px}
.cls-item{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:10px;border:0;background:none;cursor:pointer;text-align:left}
.cls-item:hover{background:var(--surface-2)}
.cls-item.active{background:var(--primary-soft)}
.cls-item.active .cls-name{color:var(--primary)}
.cls-name{font:600 15.5px var(--f-head)}
.cls-sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cls-count{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.search{position:relative;flex:1;min-width:180px;max-width:300px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.search .input{padding-left:33px}
.bulk{display:flex;gap:8px;align-items:center;padding:9px 16px;background:var(--accent-soft);border-bottom:1px solid var(--line);font-size:14px}
.tbl-wrap{overflow:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-weight:600;font-size:13px;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:hover td{background:color-mix(in srgb,var(--surface-2) 60%,transparent)}
.tbl tr.inactive td{color:var(--muted)}
.tbl .num{font-variant-numeric:tabular-nums;width:60px}
.tbl .act{width:1%;white-space:nowrap;text-align:right}
.tbl td .input{padding:5px 8px;font-size:14px;min-width:70px}
.tbl input[type=checkbox]{width:16px;height:16px;accent-color:var(--primary)}
.code-mask{font-variant-numeric:tabular-nums;letter-spacing:.03em}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(10,18,15,.45);display:grid;place-items:center;padding:20px;z-index:50;animation:fade .15s}
.modal{background:var(--surface);border-radius:16px;width:min(520px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:pop .18s}
.modal.wide{width:min(860px,100%)}
.modal-h{display:flex;align-items:center;padding:18px 22px 6px}
.modal-h h3{font-size:19px}
.modal-b{padding:14px 22px;overflow:auto}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 22px 18px;border-top:1px solid var(--line)}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:30px;height:30px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer}
.swatch.on{box-shadow:0 0 0 2px var(--ink)}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.check{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-sm);cursor:pointer;font-size:14px}
.check:has(input:checked){border-color:var(--primary);background:var(--primary-soft)}
.check input{accent-color:var(--primary)}

/* upload */
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:30px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;display:block}
.drop:hover,.drop.over{border-color:var(--primary);background:var(--primary-soft)}
.drop svg{width:40px;height:40px;color:var(--primary)}
.drop b{display:block;font:600 16px var(--f-head);margin:6px 0 2px}
.fmt{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;font-size:13.5px}
.fmt table{border-collapse:collapse;margin:8px 0;font-size:13px}
.fmt td,.fmt th{border:1px solid var(--line);padding:3px 9px;background:var(--surface)}
.sheet{border:1px solid var(--line);border-radius:var(--r-sm);margin-bottom:12px;overflow:hidden}
.sheet-h{display:flex;gap:12px;align-items:center;padding:10px 14px;background:var(--surface-2);flex-wrap:wrap}
.sheet-h input[type=checkbox]{width:18px;height:18px;accent-color:var(--primary)}
.sheet-h .input{width:150px;padding:6px 10px}
.sheet-b{padding:10px 14px;font-size:13.5px}
.warn-list{margin:6px 0 0;padding-left:18px;color:color-mix(in srgb,var(--accent) 70%,var(--ink))}
.radio-row{display:flex;gap:10px;flex-wrap:wrap}
.radio{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);cursor:pointer;flex:1;min-width:220px;font-size:14px}
.radio:has(input:checked){border-color:var(--primary);background:var(--primary-soft)}
.radio input{accent-color:var(--primary);margin-top:4px}

/* toast */
.toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:60;align-items:center}
.toast{background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;box-shadow:var(--shadow);animation:pop .2s}
.toast.err{background:var(--danger);color:#fff}

/* login & student */
.auth{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.auth-art{background:var(--side);color:var(--side-ink);padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.auth-art h1{font-size:38px;max-width:420px;line-height:1.25}
.auth-art p{color:var(--side-muted);max-width:420px}
.auth-art .lines{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 37px,rgba(255,255,255,.04) 37px 38px);pointer-events:none}
.auth-feat{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:460px;position:relative}
.auth-feat div{background:rgba(255,255,255,.06);border-radius:12px;padding:12px 14px;font-size:14px}
.auth-feat b{display:block;color:var(--side-active);font-family:var(--f-head)}
.auth-form{display:grid;place-items:center;padding:32px}
.auth-card{width:min(400px,100%)}
.auth-card h2{font-size:26px;margin-bottom:4px}
.note{background:var(--accent-soft);border-radius:var(--r-sm);padding:10px 12px;font-size:13.5px}
.stu{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:28px 18px;background:radial-gradient(circle at 20% 0%,var(--primary-soft),transparent 55%),var(--bg)}
.stu-card{width:min(440px,100%);padding:26px}
.stu-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stu-tile{border:1px solid var(--line);border-radius:12px;padding:14px 8px;text-align:center;font-size:14px;background:var(--surface-2)}
.stu-tile svg{width:26px;height:26px;color:var(--primary);display:block;margin:0 auto 4px}
.stu-tile small{display:block;color:var(--muted);font-size:11.5px}
.avatar{width:54px;height:54px;border-radius:50%;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;font:600 22px var(--f-head)}

.soon-page{max-width:680px}
.soon-page ul{padding-left:20px;margin:10px 0 0}
.soon-page li{margin:4px 0}

@media (max-width:1000px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .dash-grid,.two-pane{grid-template-columns:1fr}
}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:40;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30}
  .menu-btn{display:inline-flex}
  .top{padding:12px 16px}
  .content{padding:18px 16px 30px}
  .auth{grid-template-columns:1fr}
  .auth-art{padding:28px;gap:20px}
  .auth-art h1{font-size:28px}
  .top .hide-sm{display:none}
  .grid2,.grid3{grid-template-columns:1fr}
}

/* ---------- เฟส 2: งาน / ตรวจงาน / หน้านักเรียน ---------- */
.asg-list{display:flex;flex-direction:column;gap:12px}
.asg{display:flex;overflow:hidden}
.asg-bar{width:6px;flex:none}
.asg-main{flex:1;min-width:0;padding:16px 18px;display:grid;grid-template-columns:1fr auto;gap:10px 18px;align-items:center}
.asg-title{font:600 17px var(--f-head);margin:0}
.asg-meta{font-size:13.5px;color:var(--muted);display:flex;gap:6px 12px;flex-wrap:wrap;align-items:center}
.asg-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);grid-column:1/-1}
.prog-bar{flex:1;max-width:340px;height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;display:flex}
.prog-bar i{display:block;height:100%}
.due-late{color:var(--danger)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;font-size:14px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--primary);color:var(--primary-ink)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;cursor:pointer;font-size:14px}
.tab.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary);font-weight:600}
.score-in{width:76px!important;text-align:right;font-variant-numeric:tabular-nums}
.kinds{display:inline-flex;gap:3px;color:var(--muted)}
.kinds svg{width:15px;height:15px}
.grader{display:grid;grid-template-columns:1.7fr 1fr;gap:18px;align-items:start}
.gv{display:flex;flex-direction:column;gap:12px;max-height:68vh;overflow:auto;padding-right:4px}
.fv{border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--surface-2)}
.fv-h{display:flex;gap:8px;align-items:center;padding:7px 10px;font-size:13px;border-bottom:1px solid var(--line);background:var(--surface)}
.fv-h b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fv img,.fv video{display:block;max-width:100%;max-height:60vh;margin:0 auto;background:#000}
.fv img{background:transparent}
.fv audio{display:block;width:100%;padding:10px}
.fv iframe{display:block;width:100%;height:60vh;border:0;background:#fff}
.fv .ph{padding:30px;text-align:center;color:var(--muted);font-size:14px}
.gs{position:sticky;top:0;display:flex;flex-direction:column;gap:12px}
.gs .big-score{display:flex;align-items:center;gap:8px;font:600 22px var(--f-head)}
.gs .big-score input{width:100px;font-size:22px;text-align:right;padding:6px 10px}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick button{border:1px dashed var(--line);background:var(--surface);border-radius:99px;padding:3px 10px;font-size:13px;cursor:pointer}
.quick button:hover{border-color:var(--primary);color:var(--primary)}
textarea.input{resize:vertical;min-height:90px}

/* นักเรียน */

/* =====================================================================
   ธีม "ห้องเรียนครูปลื้ม" — สดใส โค้งมน แบบวัยรุ่น
   ===================================================================== */
:root{
  --bg:#f6f3ff;--surface:#fff;--surface-2:#f7f4ff;--ink:#231b40;--muted:#6c6690;--line:#e7e1f8;

  --accent:#ff9f1c;--accent-soft:#fff1dc;--mint:#14b8a6;--mint-soft:#d9f7f2;--sky:#38a3ff;--sky-soft:#e1f1ff;--pink-soft:#ffe6f1;--sun:#ffd23f;
  --danger:#ee3d68;--danger-soft:#ffe4ec;--ok:#12a17f;--ok-soft:#dcf6ee;
  --side:#4b2fd0;--side-ink:#fff;--side-muted:#d9d0ff;--side-hover:rgba(255,255,255,.14);--side-active:#ffd23f;
  --shadow:0 1px 0 rgba(35,27,64,.03),0 12px 32px -14px rgba(84,56,200,.28);
  --shadow-pop:0 6px 0 -1px rgba(77,52,190,.18),0 16px 30px -12px rgba(84,56,200,.35);
  --r:22px;--r-sm:13px;
  --f-head:'Mitr','IBM Plex Sans Thai Looped',system-ui,sans-serif;
  --f-body:'IBM Plex Sans Thai Looped','IBM Plex Sans Thai',system-ui,sans-serif;
  --grad:linear-gradient(135deg,#6d4dff 0%,#a34bff 55%,#ff5fa2 100%);
}
[data-theme=dark]{
  --bg:#13101f;--surface:#1c1730;--surface-2:#231d3b;--ink:#f2eefe;--muted:#a69fc8;--line:#2f2852;
  --primary:#9a85ff;--primary-ink:#140f26;--primary-soft:#2b2353;
  --accent:#ffb347;--accent-soft:#3a2b17;--mint-soft:#163a35;--sky-soft:#16304a;--pink-soft:#3d1a2d;
  --danger:#ff6b8e;--danger-soft:#3d1a26;--ok:#3fd3a9;--ok-soft:#163a30;
  --side:#1a1433;--side-hover:rgba(255,255,255,.07);
  --shadow:0 1px 0 rgba(0,0,0,.3),0 14px 34px -14px rgba(0,0,0,.6);
  --shadow-pop:0 6px 0 -1px rgba(0,0,0,.45),0 16px 30px -12px rgba(0,0,0,.6);
  --grad:linear-gradient(135deg,#7b5cff 0%,#a855f7 55%,#ec4899 100%);
}
body{background:
  radial-gradient(900px 500px at 105% -10%,color-mix(in srgb,var(--primary-2) 16%,transparent),transparent 60%),
  radial-gradient(800px 500px at -10% 110%,color-mix(in srgb,var(--sky) 14%,transparent),transparent 60%),
  var(--bg);background-attachment:fixed}
h1,h2,h3,h4{font-weight:500;letter-spacing:-.005em}
.btn{border-radius:12px;font-weight:500;transition:transform .12s,box-shadow .15s,background .15s,filter .15s}

.btn.big{padding:13px 18px;font:500 17px var(--f-head);border-radius:15px}
.input{border-radius:12px;border-width:1.5px}

/* แถบเมนูข้าง */
.side{background:linear-gradient(170deg,#4b2fd0 0%,#6d4dff 55%,#9a4dff 100%)}

/* หน้าเข้าสู่ระบบ */
.auth-art{background:var(--grad)}

.auth-art p{color:rgba(255,255,255,.85);font-size:16px}

@keyframes float{50%{transform:translateY(-12px) rotate(6deg)}}
.stu-cta{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:18px;background:linear-gradient(135deg,#fff3c4,#ffd9ea);color:#3b1d6e;text-decoration:none;box-shadow:var(--shadow-pop);transition:transform .15s}
.stu-cta:hover{transform:translateY(-2px) rotate(-.5deg)}

.stu-cta small{opacity:.75}
.stu-cta .arr{margin-left:auto;font-size:22px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13.5px;margin:4px 0}
.or::before,.or::after{content:'';flex:1;height:1px;background:var(--line)}

/* ===== โซนนักเรียน ===== */
.stu{background:transparent}
.stu-login{position:relative;padding-top:44px;margin-top:28px}
.stu-hi{position:absolute;top:-32px;left:50%;transform:translateX(-50%);width:68px;height:68px;border-radius:22px;background:var(--grad);display:grid;place-items:center;font-size:34px;box-shadow:var(--shadow-pop);animation:wave 2.4s ease-in-out infinite}
@keyframes wave{0%,60%,100%{transform:translateX(-50%) rotate(0)}70%{transform:translateX(-50%) rotate(-12deg)}80%{transform:translateX(-50%) rotate(10deg)}90%{transform:translateX(-50%) rotate(-6deg)}}
.stu-banner{position:relative;overflow:hidden;border-radius:24px;padding:20px 20px 18px;background:var(--grad);color:#fff;box-shadow:var(--shadow-pop)}

.stu-banner .pills{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}

.stu-banner .ava{width:52px;height:52px;border-radius:16px;background:#fff;color:var(--primary);display:grid;place-items:center;font:600 24px var(--f-head);transform:rotate(-5deg);flex:none}
.counters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.counter{border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.counter .em{font-size:26px}
.counter b{font:500 26px/1 var(--f-head);display:block}
.counter small{color:var(--muted);font-size:12.5px}
.counter.todo{background:linear-gradient(135deg,var(--pink-soft),var(--surface))}
.counter.wait{background:linear-gradient(135deg,var(--accent-soft),var(--surface))}
.counter.done{background:linear-gradient(135deg,var(--mint-soft),var(--surface))}
.sec-title{font:500 17px var(--f-head);margin:6px 2px -4px;display:flex;align-items:center;gap:8px}
.sa{border-radius:22px;transition:transform .15s,box-shadow .15s;border-width:1.5px}
.sa:hover{transform:translateY(-2px)}
.sa.open{border-color:color-mix(in srgb,var(--primary) 45%,var(--line))}
.sa-h{padding:16px 18px;gap:14px}
.sa-h:hover{background:transparent}
.sa-ico{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:22px;flex:none}
.sa-title{font:500 17px var(--f-head);line-height:1.35}
.sa-tag{display:inline-block;font-size:12px;font-weight:600;padding:1px 9px;border-radius:99px;margin-bottom:3px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap}
.badge.todo{background:var(--pink-soft);color:var(--danger)}
.badge.wait{background:var(--accent-soft);color:color-mix(in srgb,var(--accent) 70%,var(--ink))}

.score-bubble{display:flex;flex-direction:column;align-items:center;justify-content:center;width:62px;height:62px;border-radius:20px;background:linear-gradient(135deg,#ffd23f,#ff9f1c);color:#3b1d6e;box-shadow:0 8px 16px -8px rgba(255,159,28,.8);transform:rotate(4deg);flex:none}

.sa-b{padding:0 18px 18px 18px;gap:14px}
.desc{background:var(--surface-2);border-radius:14px;padding:12px 14px}

.lbl-sm{font:500 14px var(--f-head);color:var(--muted);margin-bottom:-6px}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.tile{position:relative;border-radius:16px;overflow:hidden;background:var(--surface);border:1.5px solid var(--line);box-shadow:var(--shadow);animation:pop .25s}
.tile .th{aspect-ratio:4/3;display:grid;place-items:center;background:var(--surface-2);position:relative;overflow:hidden}

.tile .ext{font:600 22px var(--f-head);letter-spacing:.02em;padding:6px 12px;border-radius:12px;color:#fff}
.tile .ext.k-image{background:#38a3ff}.tile .ext.k-video{background:#ff5fa2}.tile .ext.k-audio{background:#14b8a6}.tile .ext.k-document{background:#6d4dff}
.tile .ext.e-pdf{background:#ee3d68}.tile .ext.e-doc,.tile .ext.e-docx{background:#2b6cdf}.tile .ext.e-ppt,.tile .ext.e-pptx{background:#e5641e}.tile .ext.e-xls,.tile .ext.e-xlsx,.tile .ext.e-csv{background:#12a17f}.tile .ext.e-zip,.tile .ext.e-rar{background:#8a6d3b}
.tile .meta{padding:7px 9px 8px;display:flex;flex-direction:column;gap:2px;min-width:0}

.tile .sub{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--muted)}
.tile .ext-pill{font-weight:700;font-size:10.5px;padding:0 6px;border-radius:6px;background:var(--primary-soft);color:var(--primary);text-transform:uppercase}
.tile .rm{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:var(--danger);display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2);font-size:15px;line-height:1}

.tile.bad{border-color:var(--danger)}
.tile.bad .state{background:rgba(238,61,104,.6)}
.tile .err{font-size:11.5px;color:var(--danger);font-weight:600}
.tile.sent::after{content:'✓ ส่งแล้ว';position:absolute;top:6px;left:6px;font-size:11px;font-weight:700;background:var(--ok);color:#fff;border-radius:99px;padding:1px 8px}
.drop.cute{border:2.5px dashed color-mix(in srgb,var(--primary) 35%,var(--line));border-radius:20px;background:var(--surface-2);padding:20px;display:flex;flex-direction:column;align-items:center;gap:2px}
.drop.cute:hover,.drop.cute.over{background:var(--primary-soft);border-color:var(--primary)}

.drop.cute b{font:500 17px var(--f-head);margin:4px 0 0}
.send-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.send-bar .btn.primary{flex:1;justify-content:center}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti i{position:absolute;top:-30px;font-style:normal;font-size:24px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.2}}
.lock-note{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--surface-2);font-size:14px}
.lock-note .em{font-size:22px}

.mini-th{display:inline-flex;gap:4px;vertical-align:middle}

}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.tab.on .muted{color:rgba(255,255,255,.85)}

<body>
<div id="app"></div>
<div id="modal-root"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script>
/* ===== ตัวอ่านไฟล์รายชื่อนักเรียน (CSV / Excel) =====
   - อ่าน CSV ได้ทั้ง UTF-8 และภาษาไทยแบบ Windows (TIS-620 / windows-874)
   - หาแถวหัวตารางเอง แยกนักเรียนตาม "ห้อง" จากคอลัมน์ห้อง/ชั้น หรือจากบรรทัดหัวเรื่อง หรือจากชื่อชีต
   - ครูเปลี่ยนการจับคู่คอลัมน์เองได้ (mapping) */
const RosterParser = (() => {
  const PREFIXES = ['เด็กชาย', 'เด็กหญิง', 'ด.ช.', 'ด.ญ.', 'ดช.', 'ดญ.', 'นางสาว', 'น.ส.', 'นาย', 'นาง', 'Mr.', 'Miss', 'Mrs.', 'Ms.'];
  const norm = v => String(v ?? '').replace(/ /g, ' ').replace(/\s+/g, ' ').trim();
  const flat = v => norm(v).replace(/[\s.\-_/()*:：]/g, '').toLowerCase();
  const FIELDS = ['classroom', 'level', 'room', 'number', 'code', 'prefix', 'first', 'last', 'full'];
  const FIELD_LABEL = { classroom: 'ห้อง (เช่น ม.1/1)', level: 'ระดับชั้น (เช่น ม.1)', room: 'ห้องที่ (เช่น 1)', number: 'เลขที่', code: 'เลขประจำตัวนักเรียน', prefix: 'คำนำหน้า', first: 'ชื่อ', last: 'นามสกุล', full: 'ชื่อ-สกุล (รวมช่องเดียว)' };

  /* ---------- อ่านไฟล์ ---------- */
  function decodeText(buf) {
    const bytes = new Uint8Array(buf);
    if (bytes[0] === 0xFF && bytes[1] === 0xFE) return new TextDecoder('utf-16le').decode(bytes);
    try { return new TextDecoder('utf-8', { fatal: true }).decode(bytes).replace(/^﻿/, ''); }

  function parseCSV(text) {
    text = text.replace(/^﻿/, '');
    const first = text.split(/\r?\n/).slice(0, 5).join('\n');
    const count = ch => (first.match(new RegExp('\\' + ch, 'g')) || []).length;
    const delim = [',', '\t', ';', '|'].sort((a, b) => count(b) - count(a))[0];
    const rows = []; let row = [], cell = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) {
        if (ch === '"' && text[i + 1] === '"') { cell += '"'; i++; }
        else if (ch === '"') q = false;
        else cell += ch;
      } else if (ch === '"' && cell === '') q = true;
      else if (ch === delim) { row.push(cell); cell = ''; }
      else if (ch === '\n' || ch === '\r') {
        if (ch === '\r' && text[i + 1] === '\n') i++;
        row.push(cell); rows.push(row); row = []; cell = '';

  /* ---------- ห้องเรียน ---------- */
  // แปลงข้อความเป็นชื่อห้องมาตรฐาน เช่น "ม.1/1" (คืน '' ถ้าไม่ใช่)
  function normClass(v, strict) {
    let s = norm(v);
    if (!s) return '';
    s = s.replace(/มัธยมศึกษาปีที่|ชั้นมัธยมศึกษาปีที่|มัธยมปีที่/g, 'ม.').replace(/ประถมศึกษาปีที่|ชั้นประถมศึกษาปีที่/g, 'ป.')
         .replace(/^ชั้น\s*/, '').replace(/^M\.?\s*/i, 'ม.').replace(/^P\.?\s*/i, 'ป.');
    let m = s.match(/(ม|ป|ปวช|ปวส)\.?\s*(\d{1,2})\s*[\/\-\\.]\s*(\d{1,2})/);
    if (m) return `${m[1]}.${+m[2]}/${+m[3]}`;
    if (!strict) {
      m = s.match(/^(\d{1,2})\s*[\/\-]\s*(\d{1,2})$/);

  function combineLevelRoom(level, room) {
    const L = norm(level), R = norm(room).replace(/^ห้อง\s*/, '');
    if (!L && !R) return '';
    const full = normClass(`${L}/${R}`) || normClass(L);
    if (full) return full;
    const lm = L.match(/(ม|ป)\.?\s*(\d{1,2})/) || L.match(/^(\d{1,2})$/);
    const rm = R.match(/(\d{1,2})/);
    if (lm && rm) return `${lm.length === 3 ? lm[1] : 'ม'}.${+(lm[2] || lm[1])}/${+rm[1]}`;
    return [L, R].filter(Boolean).join('/');
  }

  /* ---------- หัวตาราง ---------- */
  function guessField(h) {
    const f = flat(h);
    if (!f) return null;
    if (f.includes('ประชาชน') || f.includes('บัตร') || f.includes('เบอร์') || f.includes('โทร') || f.includes('ที่อยู่') || f.includes('วันเกิด') || f.includes('อายุ')) return null;
    if (['เลขที่', 'เลขที่นักเรียน', 'no', 'number'].includes(f)) return 'number';
    if (['ที่', 'ลำดับ', 'ลำดับที่'].includes(f)) return 'number_alt';
    if (f.includes('เลขประจำตัว') || f.includes('รหัสนักเรียน') || f === 'รหัส' || f === 'studentid' || f === 'id' || f === 'เลขที่ประจำตัว') return 'code';
    if (f.includes('คำนำหน้า') || f === 'prefix' || f === 'title') return 'prefix';
    if (f.includes('ชื่อ') && f.includes('สกุล')) return 'full';
    if (f === 'นามสกุล' || f === 'สกุล' || f === 'lastname' || f === 'surname') return 'last';
    if (f === 'ชื่อ' || f === 'firstname' || f === 'name' || f === 'ชื่อนักเรียน' || f === 'ชื่อจริง') return 'first';
    if (['ชั้นห้อง', 'ชั้น/ห้อง', 'ห้องเรียน', 'class', 'classroom', 'ชั้นเรียน', 'ระดับชั้นห้อง'].includes(f)) return 'classroom';
    if (['ระดับชั้น', 'ชั้น', 'ชั้นปี', 'ระดับ', 'level', 'grade'].includes(f)) return 'level';

  }

    return map;
  }
  function refineMapping(rows, headerIdx, map) {
    if (map.level !== undefined && map.room === undefined && map.classroom === undefined) {
      const vals = rows.slice(headerIdx + 1, headerIdx + 30).map(r => (r || [])[map.level]).filter(v => norm(v));
      if (vals.length && vals.filter(v => normClass(v)).length >= vals.length * 0.6) { map.classroom = map.level; delete map.level; }
    }
    if (map.room !== undefined && map.level === undefined && map.classroom === undefined) {
      const vals = rows.slice(headerIdx + 1, headerIdx + 30).map(r => (r || [])[map.room]).filter(v => norm(v));
      if (vals.length && vals.filter(v => normClass(v)).length >= vals.length * 0.6) { map.classroom = map.room; delete map.room; }
    }

  }

  function splitPrefix(text) {
    const t = norm(text);

  function analyze(sources) {

      const { rows, headerIdx, mapping: m } = src;
      if (headerIdx < 0) { global.push(`ชีต "${src.name}": ไม่พบแถวหัวตารางที่มีคำว่า "ชื่อ"`); continue; }
      if (m.first === undefined && m.full === undefined) { global.push(`ชีต "${src.name}": ยังไม่ได้เลือกคอลัมน์ชื่อ`); continue; }
      const hasClassCol = m.classroom !== undefined || m.level !== undefined || m.room !== undefined;
      // ห้องจากหัวกระดาษ / ชื่อชีต
      let current = '', homeroom = '';
      for (let r = 0; r < headerIdx; r++) {
        const line = (rows[r] || []).map(norm).filter(Boolean).join(' ');
        current = current || normClass(line, true);
        homeroom = homeroom || homeroomFrom(line);
      }
      if (!current) current = normClass(src.name) || norm(src.name);
      let rowsWithoutClass = 0;
      for (let r = headerIdx + 1; r < rows.length; r++) {
        const row = rows[r] || [];
        const cells = row.map(norm);

        if (m.number !== undefined && cells[m.number] && flat(cells[m.number]) === 'เลขที่') continue; // หัวตารางซ้ำ

        if (m.classroom !== undefined) cls = normClass(cells[m.classroom]) || cells[m.classroom] || current;
        else if (m.level !== undefined || m.room !== undefined) cls = combineLevelRoom(m.level !== undefined ? cells[m.level] : '', m.room !== undefined ? cells[m.room] : '') || current;
        if (!cls) { rowsWithoutClass++; continue; }

          const sp = splitPrefix(cells[m.first]);

    STUDENT_INVALID: 'ข้อมูลนักเรียนไม่ถูกต้อง กรุณาเข้าห้องเรียนใหม่', ASSIGNMENT_NOT_FOUND: 'ไม่พบงานนี้', ASSIGNMENT_CLOSED: 'ครูปิดรับงานนี้แล้ว',
    PAST_DUE: 'เลยกำหนดส่งแล้ว และงานนี้ไม่รับส่งช้า', TYPE_NOT_ALLOWED: 'งานนี้ไม่รับไฟล์ชนิดนี้', TOO_LARGE: 'ไฟล์ใหญ่เกินกำหนดของงานนี้',
    ALREADY_GRADED: 'ครูตรวจงานนี้แล้ว แก้ไขไม่ได้', TOO_MANY_FILES: 'ส่งได้สูงสุด 10 ไฟล์ต่องาน', TOKEN_INVALID: 'การอัปโหลดหมดเวลา ลองใหม่อีกครั้ง',
    UPLOAD_MISSING: 'อัปโหลดไฟล์ไม่สำเร็จ ลองใหม่อีกครั้ง', FILE_NOT_FOUND: 'ไม่พบไฟล์นี้',
  };
  for (const k in codes) if (m.includes(k)) return codes[k];
  if (/exceeded the maximum allowed size|Payload too large|413/i.test(m)) return 'ไฟล์ใหญ่เกิน 50 MB';
  return 'เกิดข้อผิดพลาด: ' + m;
}
/* เรียก Supabase: ถ้าผิดพลาดจะแสดงข้อความและโยน error ต่อ */
async function q(p) {
  const { data, error } = await p;
  if (error) { console.error(error); toast(errMsg(error), true); throw error; }
  return data;
}
/* โหลดทั้งตาราง ทีละ 1,000 แถว (Supabase จำกัดต่อครั้ง) */
async function fetchAll(table, order = 'created_at') {
  const out = [];
  for (let from = 0; ; from += 1000) {
    const rows = await q(sb.from(table).select('*').order(order, { ascending: true }).range(from, from + 999));
    out.push(...rows);
    if (rows.length < 1000) break;
  }
  return out;
}
function thaiTermNow() {
  const d = new Date(), m = d.getMonth() + 1, be = d.getFullYear() + 543;
  if (m >= 5 && m <= 10) return { year: be, semester: 1 };
  return { year: m >= 11 ? be : be - 1, semester: 2 };
}
async function loadAll() {
  const [terms, classrooms, students, subjects, subject_classes, assignments, assignment_classes, submissions] = await Promise.all([
    fetchAll('terms'), fetchAll('classrooms'), fetchAll('students'), fetchAll('subjects'), fetchAll('subject_classes', 'subject_id'),
    fetchAll('assignments'), fetchAll('assignment_classes', 'assignment_id'), fetchAll('submissions', 'submitted_at'),
  ]);
  Object.assign(store, { terms, classrooms, students, subjects, subject_classes, assignments, assignment_classes, submissions, files: {} });
  if (!store.terms.length) {
    const t = await q(sb.from('terms').insert({ ...thaiTermNow(), is_current: true }).select().single());
    store.terms.push(t);
  }
}
async function reloadStudents(cid) {
  const rows = await q(sb.from('students').select('*').eq('classroom_id', cid));
  store.students = store.students.filter(s => s.classroom_id !== cid).concat(rows);
}
function setTeacher(user) {
  store.teacher.email = user?.email || '';
  store.teacher.name = user?.user_metadata?.display_name || 'ครูผู้สอน';
}

const db = {
  all: t => store[t],
  get: (t, id) => store[t].find(r => r.id === id),
  async insert(t, row) { const r = await q(sb.from(t).insert(row).select().single()); store[t].push(r); return r; },
  async update(t, id, patch) { const r = await q(sb.from(t).update(patch).eq('id', id).select().single()); Object.assign(db.get(t, id) || {}, r); return r; },
  async removeIds(t, ids) {
    if (!ids.length) return;
    for (let i = 0; i < ids.length; i += 200) await q(sb.from(t).delete().in('id', ids.slice(i, i + 200)));
    store[t] = store[t].filter(r => !ids.includes(r.id));
  },
};
const Q = {
  currentTerm: () => store.terms.find(t => t.is_current) || store.terms[0],
  termLabel: t => t ? `${t.semester}/${t.year}` : '—',
  classrooms: () => [...store.classrooms].sort((a, b) => a.name.localeCompare(b.name, 'th', { numeric: true })),
  students: cid => store.students.filter(s => s.classroom_id === cid).sort((a, b) => a.number - b.number),
  subjectClassIds: sid => store.subject_classes.filter(x => x.subject_id === sid).map(x => x.classroom_id),
  subjectsOfTerm: tid => store.subjects.filter(s => s.term_id === tid),
  fullName: s => `${s.prefix || ''}${s.first_name} ${s.last_name || ''}`.trim(),
};

function toast(msg, err) {
  const box = $('#toasts'); const el = document.createElement('div');
  el.className = 'toast' + (err ? ' err' : ''); el.textContent = msg; box.appendChild(el);
  setTimeout(() => el.remove(), 2600);

async function readRosterFile(file) {
  const ext = file.name.split('.').pop().toLowerCase();
  const buf = await file.arrayBuffer();
  if (ext === 'csv' || ext === 'txt') return [{ name: file.name.replace(/\.(csv|txt)$/i, ''), rows: RosterParser.parseCSV(RosterParser.decodeText(buf)) }];
  if (!window.XLSX) throw new Error('โหลดตัวอ่าน Excel ไม่สำเร็จ ลองบันทึกไฟล์เป็น .csv แล้วอัปโหลดอีกครั้ง');
  const wb = XLSX.read(buf, { type: 'array' });
  return wb.SheetNames.map(n => ({ name: n, rows: XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, defval: '', raw: true, blankrows: true }) }))
    .filter(s => s.rows.some(r => r.some(c => String(c).trim())));
}
async function handleImportFile(file) {
  let sources;
  try { sources = await readRosterFile(file); } catch (e) { toast(e.message || 'อ่านไฟล์ไม่สำเร็จ', true); return; }
  if (!sources.length) return toast('ไฟล์นี้ว่างเปล่า', true);
  importPreview(RosterParser.analyze(sources), file.name, 'merge');
}
function importTarget(name) { return store.classrooms.find(c => c.name === name.trim()); }
function colLetter(i) { let s = ''; i++; while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; }
function mappingUI(src, si) {

  const ncol = Math.max(src.header.length, ...src.rows.slice(src.headerIdx, src.headerIdx + 10).map(r => (r || []).length));
  const opts = sel => `<option value="">— ไม่มี —</option>` + Array.from({ length: ncol }, (_, c) => `<option value="${c}" ${sel === c ? 'selected' : ''}>${colLetter(c)}: ${esc(src.header[c] || '(ไม่มีหัว)')}${sample(c) ? ` · เช่น ${esc(sample(c))}` : ''}</option>`).join('');
  const fields = ['classroom', 'level', 'room', 'number', 'code', 'prefix', 'first', 'last', 'full'];
  return `<div class="map-grid">
    <label class="field"><span>แถวหัวตาราง (แถวที่)</span><input class="input" type="number" min="1" value="${src.headerIdx + 1}" data-chg="imp-header" data-s="${si}"></label>
    ${fields.map(f => `<label class="field"><span>${RosterParser.FIELD_LABEL[f]}${f === 'number' || f === 'first' ? ' *' : ''}</span><select class="input" data-chg="imp-map" data-s="${si}" data-f="${f}">${opts(src.mapping[f])}</select></label>`).join('')}
  </div>`;
}

      ${warnings.length ? `<div class="note"><ul class="warn-list" style="margin:0">${warnings.map(w => `<li>${esc(w)}</li>`).join('')}</ul></div>` : ''}
      <details class="sheet" ${needMap ? 'open' : ''}><summary class="sheet-h" style="cursor:pointer"><b>การจับคู่คอลัมน์</b><span class="small muted">ระบบเลือกให้อัตโนมัติ ถ้าผิดเปลี่ยนได้ที่นี่ แล้วรายชื่อด้านล่างจะอัปเดตทันที</span></summary>
        <div class="sheet-b stack">${analyzed.map((src, si) => `${analyzed.length > 1 ? `<b class="small">ชีต: ${esc(src.name)}</b>` : ''}${mappingUI(src, si)}`).join('<hr style="border:0;border-top:1px solid var(--line);width:100%">')}</div></details>
      <datalist id="cls-names">${Q.classrooms().map(c => `<option value="${esc(c.name)}">`).join('')}</datalist>
      <div>${groups.map((s, i) => { const t = importTarget(s.name);
        return `<div class="sheet"><div class="sheet-h">
          <input type="checkbox" data-chg="imp-inc" data-i="${i}" ${s.include ? 'checked' : ''} aria-label="นำเข้าห้อง ${esc(s.name)}">

async function doImport() {
  const { sheets } = modalCtx;
  const mode = $('#modal-root input[name=mode]:checked').value;
  const inc = sheets.filter(s => s.include && s.students.length);
  if (!inc.length) return toast('ยังไม่ได้เลือกชีตที่จะนำเข้า', true);
  const names = inc.map(s => s.name.trim());
  if (names.some(n => !n)) return toast('มีชีตที่ยังไม่ได้ตั้งชื่อห้อง', true);
  if (new Set(names).size !== names.length) return toast('มีชีตที่ตั้งชื่อห้องซ้ำกัน', true);
  let added = 0, updated = 0, rooms = 0, lastId = null;
  try {
    for (const s of inc) {
      let c = importTarget(s.name);
      if (!c) { c = await db.insert('classrooms', { name: s.name.trim(), homeroom_teacher: s.homeroom || null, sort_order: 0 }); rooms++; }
      else if (s.homeroom && !c.homeroom_teacher) await db.update('classrooms', c.id, { homeroom_teacher: s.homeroom });
      lastId = c.id;
      let rows;
      if (mode === 'replace') {
        await q(sb.from('students').delete().eq('classroom_id', c.id));
        rows = s.students.map(st => ({ ...st, classroom_id: c.id, active: true }));
        added += rows.length;
      } else {
        rows = s.students.map(st => {
          const ex = store.students.find(x => x.classroom_id === c.id && x.number === st.number);
          if (ex) { updated++; return { ...st, classroom_id: c.id, student_code: st.student_code || ex.student_code, prefix: st.prefix || ex.prefix || '', active: ex.active }; }
          added++; return { ...st, classroom_id: c.id, active: true };
        });
      }
      for (let i = 0; i < rows.length; i += 500) {
        await q(sb.from('students').upsert(rows.slice(i, i + 500), { onConflict: 'classroom_id,number' }));
      }
      await reloadStudents(c.id);
    }
  } catch (e) {
    await loadAll().catch(() => {}); ui.cid = lastId || ui.cid; closeModal(); render();
    return;
  }
  ui.cid = lastId; ui.sel.clear(); closeModal(); render();
  toast(`นำเข้าแล้ว: เพิ่ม ${added} คน${updated ? ` · อัปเดต ${updated} คน` : ''}${rooms ? ` · สร้างห้องใหม่ ${rooms} ห้อง` : ''}`);
}

/* ---------- ตัวช่วย ---------- */
const fmtDate = iso => iso ? new Date(iso).toLocaleString('th-TH', { day: 'numeric', month: 'short', year: '2-digit', hour: '2-digit', minute: '2-digit' }) : '—';
const fmtSize = b => b == null ? '' : b < 1024 * 1024 ? `${Math.max(1, Math.round(b / 1024))} KB` : `${(b / 1024 / 1024).toFixed(1)} MB`;
const isPast = iso => iso && new Date(iso) < new Date();
function toLocalInput(iso) {
  if (!iso) return '';
  const d = new Date(iso), p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
function dueText(iso) {
  if (!iso) return 'ไม่กำหนดวันส่ง';
  const ms = new Date(iso) - new Date(), h = Math.abs(ms) / 36e5;
  const rel = h < 1 ? `${Math.max(1, Math.round(h * 60))} นาที` : h < 48 ? `${Math.round(h)} ชั่วโมง` : `${Math.round(h / 24)} วัน`;
  return ms < 0 ? `เลยกำหนด ${rel} (${fmtDate(iso)})` : `ส่งภายใน ${fmtDate(iso)} · อีก ${rel}`;
}
function statusChip(st, forTeacher = true) {
  if (!st) return '<span class="chip">ยังไม่ส่ง</span>';

    submitted: `<span class="chip warn">${forTeacher ? 'รอตรวจ' : 'ส่งแล้ว รอตรวจ'}</span>`,
    late: `<span class="chip warn">ส่งช้า${forTeacher ? ' · รอตรวจ' : ''}</span>`,

const A = {
  classIds: aid => store.assignment_classes.filter(x => x.assignment_id === aid).map(x => x.classroom_id),
  sub: (aid, sid) => store.submissions.find(s => s.assignment_id === aid && s.student_id === sid),
  subs: aid => store.submissions.filter(s => s.assignment_id === aid),
  roster(aid, cid) {
    const subIds = new Set(A.subs(aid).map(s => s.student_id));
    return Q.students(cid).filter(s => s.active !== false || subIds.has(s.id));
  },
  stats(aid, cid) {
    const cids = cid ? [cid] : A.classIds(aid);
    const studs = cids.flatMap(c => A.roster(aid, c));
    const ids = new Set(studs.map(s => s.id));
    const subs = A.subs(aid).filter(s => ids.has(s.student_id));
    return {
      total: studs.length, sent: subs.length,
      pending: subs.filter(s => s.status === 'submitted' || s.status === 'late').length,
      graded: subs.filter(s => s.status === 'graded').length,
      returned: subs.filter(s => s.status === 'returned').length,
      missing: studs.length - subs.length,
    };
  },
  filesOf: (aid, subId) => (store.files[aid] || []).filter(f => f.submission_id === subId),
};
function pendingCount() {
  const live = new Set(store.assignments.map(a => a.id));
  return store.submissions.filter(s => live.has(s.assignment_id) && (s.status === 'submitted' || s.status === 'late')).length;
}
function pruneLocal() {
  const subj = new Set(store.subjects.map(x => x.id)), cls = new Set(store.classrooms.map(x => x.id)), stu = new Set(store.students.map(x => x.id));
  store.assignments = store.assignments.filter(a => subj.has(a.subject_id));
  const asg = new Set(store.assignments.map(x => x.id));
  store.assignment_classes = store.assignment_classes.filter(x => asg.has(x.assignment_id) && cls.has(x.classroom_id));
  store.submissions = store.submissions.filter(x => asg.has(x.assignment_id) && stu.has(x.student_id));

async function ensureFiles(aid, force) {
  if (store.files[aid] && !force) return;
  const subIds = A.subs(aid).map(s => s.id);
  const out = [];
  for (let i = 0; i < subIds.length; i += 150) {
    out.push(...await q(sb.from('submission_files').select('*').in('submission_id', subIds.slice(i, i + 150))));

}

async function saveScore(aid, sid, score, feedback, status) {
  const ex = A.sub(aid, sid);
  const now = new Date().toISOString();
  const patch = { score, status, graded_at: status === 'graded' ? now : null };
  if (feedback !== undefined) patch.feedback = feedback;
  if (ex) {
    const r = await q(sb.from('submissions').update(patch).eq('id', ex.id).select().single());
    Object.assign(ex, r); return ex;
  }
  const r = await q(sb.from('submissions').upsert({ assignment_id: aid, student_id: sid, ...patch }, { onConflict: 'assignment_id,student_id' }).select().single());
  store.submissions = store.submissions.filter(x => !(x.assignment_id === aid && x.student_id === sid));
  store.submissions.push(r); return r;
}

const signedCache = {};
async function signUrls(paths) {
  const need = paths.filter(p => !signedCache[p] || signedCache[p].exp < Date.now());
  if (need.length) {
    const data = await q(sb.storage.from('submissions').createSignedUrls(need, 3600));
    data.forEach(d => { if (d.signedUrl) signedCache[d.path] = { url: d.signedUrl, exp: Date.now() + 3500e3 }; });
  }
  return Object.fromEntries(paths.map(p => [p, signedCache[p]?.url]));
}

  else if (f.kind === 'video') body = `<video src="${u}" controls preload="metadata" playsinline></video>`;

  else body = `<div class="ph">ไฟล์ชนิดนี้แสดงในหน้าเว็บไม่ได้<br><a class="btn sm" href="${u}" target="_blank" rel="noopener" style="margin-top:8px">${ic('ext')}เปิด / ดาวน์โหลด</a></div>`;

async function graderSave(mode) {

  const feedback = $('#modal-root [name=feedback]').value.trim() || null;
  const ex = A.sub(aid, sid);
  if (mode === 'return') {
    if (!ex) return toast('นักเรียนยังไม่ได้ส่งงาน ส่งคืนไม่ได้', true);
    if (!feedback) return toast('เขียนความเห็นบอกนักเรียนว่าต้องแก้อะไรก่อนส่งคืน', true);
    await saveScore(aid, sid, null, feedback, 'returned');

    else return toast('ใส่คะแนนก่อนบันทึก', true);

/* ---------- ตัวช่วยไฟล์ของนักเรียน ---------- */
function detectKind(file) {
  const t = file.type || '';
  if (t.startsWith('image/')) return 'image';
  if (t.startsWith('video/')) return 'video';
  if (t.startsWith('audio/')) return 'audio';
  if (/\.(heic|heif)$/i.test(file.name)) return 'image';
  return 'document';
}
async function compressImage(file) {
  if (!/^image\/(jpeg|png|webp|bmp)$/.test(file.type) || file.size < 400 * 1024 || !window.createImageBitmap) return file;
  try {
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, 1920 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.82));
    if (!blob || blob.size >= file.size) return file;
    return new File([blob], file.name.replace(/\.[^.]+$/, '') + '.jpg', { type: 'image/jpeg' });
  } catch (e) { return file; }
}

  stuState.loadingAsg = true;
  try { stuState.asg = await q(sb.rpc('student_assignments', { p_student_id: v.student_id, p_code: v.code })); }
  catch (e) { if (/STUDENT_INVALID/.test(e.message || '')) { stuState.verified = null; try { sessionStorage.removeItem('cr-student'); } catch (x) {} } stuState.asg = stuState.asg || []; }
  stuState.loadingAsg = false;
  if (ui.route === 'student') render();
}
function canSubmit(a) { return a.is_open && a.status !== 'graded' && !(isPast(a.due_at) && !a.allow_late); }
function asgGroup(a) {
  if (a.status === 'returned') return 'todo';
  if (a.status === 'graded') return 'done';
  if (a.status === 'submitted' || a.status === 'late') return 'wait';
  return canSubmit(a) ? 'todo' : 'closed';
}

/* ---------- รูปย่อ (เก็บไว้ในฐานข้อมูล ครูและนักเรียนเห็นได้โดยไม่ต้องโหลดไฟล์จริง) ---------- */
function canvasThumb(src, w, h) {
  const scale = Math.min(1, 360 / Math.max(w, h));
  const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w * scale)); c.height = Math.max(1, Math.round(h * scale));
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(src, 0, 0, c.width, c.height);
  const url = c.toDataURL('image/jpeg', 0.72);
  return url.length < 70000 ? url : c.toDataURL('image/jpeg', 0.5);
}
async function makeThumb(file, kind) {
  try {
    if (kind === 'image' && window.createImageBitmap) {
      const bmp = await createImageBitmap(file);
      return canvasThumb(bmp, bmp.width, bmp.height);
    }
    if (kind === 'video') {
      return await new Promise(resolve => {
        const v = document.createElement('video'); const url = URL.createObjectURL(file);
        let done = false; const finish = r => { if (done) return; done = true; URL.revokeObjectURL(url); resolve(r); };
        v.muted = true; v.playsInline = true; v.preload = 'metadata'; v.src = url;
        v.onloadeddata = () => { v.currentTime = Math.min(1, (v.duration || 2) / 3); };
        v.onseeked = () => { try { finish(canvasThumb(v, v.videoWidth, v.videoHeight)); } catch (e) { finish(null); } };
        v.onerror = () => finish(null);
        setTimeout(() => finish(null), 5000);
      });
    }
  } catch (e) {}
  return null;
}

/* ---------- ไทล์ไฟล์ ---------- */
function tileHTML({ name, size, kind, thumb, rm, state, err, sent }) {
  const ext = fileExt(name);
  const th = thumb ? `<img src="${esc(thumb)}" alt="">${kind === 'video' ? '<span class="play">▶</span>' : ''}`
    : `<span class="ext k-${kind} e-${esc(ext)}">${esc((ext || KIND_LABEL[kind] || 'ไฟล์').toUpperCase().slice(0, 5))}</span>`;
  const st = state === 'up' ? '<div class="state"><span class="spin"></span></div>' : state === 'ok' ? '<div class="state">✓</div>' : state === 'bad' ? '<div class="state">!</div>' : '';
  return `<div class="tile ${state || ''} ${sent ? 'sent' : ''}"><div class="th">${th}${st}</div>
    <div class="meta"><span class="nm" title="${esc(name)}">${esc(name.replace(/\.[^.]+$/, '') || name)}</span>
      <span class="sub"><span class="ext-pill">.${esc(ext || '?')}</span>${size != null ? `<span>${fmtSize(size)}</span>` : ''}</span>
      ${err ? `<span class="err">${esc(err)}</span>` : ''}</div>
    ${rm ? `<button class="rm" ${rm} aria-label="เอาไฟล์ ${esc(name)} ออก">✕</button>` : ''}</div>`;
}

/* ---------- หน้า ---------- */
function studentHome(v) {
  if (!v.code) { stuState.verified = null; setTimeout(render); return ''; }
  if (!stuState.asg) loadStudentAsg();
  const list = stuState.asg || [];
  const first = v.full_name.replace(/^(เด็กชาย|เด็กหญิง|นางสาว|นาย|นาง|ด\.ช\.|ด\.ญ\.|น\.ส\.)\s*/, '').split(' ')[0] || v.full_name;
  const groups = { todo: [], wait: [], done: [], closed: [] };
  list.forEach(a => groups[asgGroup(a)].push(a));
  const byDue = (a, b) => (a.due_at || '9999').localeCompare(b.due_at || '9999');
  groups.todo.sort(byDue); groups.wait.sort(byDue);
  const sec = (key, title) => groups[key].length ? `<div class="sec-title">${title} <span class="chip">${groups[key].length}</span></div>${groups[key].map(studentAsgCard).join('')}` : '';
  return `<div class="stu-wrap">
    <div class="stu-banner"><div class="acts"><button class="btn icon sm" data-act="stu-reload" aria-label="โหลดใหม่" title="โหลดใหม่">${ic('refresh')}</button><button class="btn sm" data-act="stu-out">ออก</button></div>
      <div class="row" style="gap:14px;position:relative;z-index:1"><div class="ava">${esc(first[0] || '?')}</div><div style="min-width:0"><h2>สวัสดี ${esc(first)}! 👋</h2>
        <div class="pills"><span class="pill">🏫 ${esc(v.classroom_name)}</span><span class="pill">เลขที่ ${v.number}</span></div></div></div></div>
    ${stuState.asg ? `<div class="counters">
        <div class="counter todo"><span class="em">📝</span><div><b>${groups.todo.length}</b><small>ต้องส่ง/แก้</small></div></div>
        <div class="counter wait"><span class="em">⏳</span><div><b>${groups.wait.length}</b><small>รอครูตรวจ</small></div></div>
        <div class="counter done"><span class="em">🌟</span><div><b>${groups.done.length}</b><small>ตรวจแล้ว</small></div></div></div>
      ${list.length ? sec('todo', '📌 งานที่ต้องทำ') + sec('wait', '⏳ ส่งแล้ว รอครูตรวจ') + sec('done', '🌟 ตรวจแล้ว') + sec('closed', '🔒 ปิดรับแล้ว')
        : `<div class="card"><div class="empty"><div style="font-size:44px">🎉</div><b>ยังไม่มีงาน เย้!</b>เมื่อครูปลื้มสั่งงาน งานจะโผล่ตรงนี้</div></div>`}`
    : `<div class="card"><div class="empty"><span class="spin" style="display:inline-block;width:26px;height:26px"></span><br>กำลังโหลดงาน…</div></div>`}
  </div>`;
}
function studentBadge(a) {
  if (a.status === 'graded') return `<div class="score-bubble"><b>${+a.score}</b><small>/${+a.max_score}</small></div>`;
  if (a.status === 'returned') return '<span class="badge ret">🔁 ครูให้แก้</span>';
  if (a.status === 'late') return '<span class="badge wait">⏳ ส่งช้า รอตรวจ</span>';
  if (a.status === 'submitted') return '<span class="badge wait">⏳ รอตรวจ</span>';
  if (!canSubmit(a)) return '<span class="badge late">🔒 ปิดรับ</span>';
  return isPast(a.due_at) ? '<span class="badge late">⏰ เลยกำหนด</span>' : '<span class="badge todo">📝 ยังไม่ส่ง</span>';
}
function studentAsgCard(a) {
  const open = stuState.open === a.id;
  const can = canSubmit(a);
  const g = asgGroup(a);
  const emoji = { todo: a.status === 'returned' ? '🔁' : '📝', wait: '⏳', done: '🌟', closed: '🔒' }[g];
  const color = a.subject_color || '#6d4dff';
  const staged = stuState.staged[a.id] || [];
  const pendingStaged = staged.filter(x => x.state !== 'ok');
  return `<div class="card sa ${open ? 'open' : ''}">
    <button class="sa-h" data-act="stu-toggle" data-id="${a.id}" aria-expanded="${open}">
      <span class="sa-ico" style="background:${esc(color)}22">${emoji}</span>
      <div style="flex:1;min-width:0"><span class="sa-tag" style="background:${esc(color)}1f;color:${esc(color)}">${esc(a.subject_name)}</span>
        <div class="sa-title">${esc(a.title)}</div>
        <div class="sa-sub ${isPast(a.due_at) && !a.status ? 'due-late' : ''}">⏰ ${esc(dueText(a.due_at))}</div></div>
      ${studentBadge(a)}</button>
    ${open ? `<div class="sa-b">
      ${a.description ? `<div class="desc">${esc(a.description)}</div>` : ''}
      ${a.feedback ? `<div class="fb ${a.status === 'returned' ? 'ret' : 'star'}"><b>💬 ${a.status === 'returned' ? 'ครูปลื้มให้แก้ตรงนี้นะ:' : 'ครูปลื้มบอกว่า:'}</b><br>${esc(a.feedback)}</div>` : ''}
      ${a.files.length ? `<div class="lbl-sm">📦 ไฟล์ที่ส่งแล้ว (${a.files.length})</div><div class="tiles">${a.files.map(f => tileHTML({ name: f.file_name, size: f.size_bytes, kind: f.kind, thumb: f.thumb, sent: true, rm: can ? `data-act="stu-rm" data-id="${f.id}"` : '' })).join('')}</div>` : ''}
      ${can ? `
        ${staged.length ? `<div class="lbl-sm">🧺 ไฟล์ที่เลือกไว้ (${staged.length})</div><div class="tiles">${staged.map(x => tileHTML({ name: x.name, size: x.size, kind: x.kind, thumb: x.thumb, state: x.state, err: x.err, rm: x.state === 'up' ? '' : `data-act="stu-unstage" data-a="${a.id}" data-k="${x.key}"` })).join('')}</div>` : ''}
        <label class="drop cute" data-drop="${a.id}"><span class="em">📎</span><b>${staged.length || a.files.length ? 'เพิ่มไฟล์อีก' : 'แตะเพื่อเลือกไฟล์ หรือลากมาวาง'}</b>
          <span class="small muted">รับ ${a.accept_types.map(k => KIND_LABEL[k]).join(' · ')} · ไม่เกิน ${a.max_file_mb} MB/ไฟล์</span>
          <input type="file" multiple hidden accept="${a.accept_types.map(k => KIND_ACCEPT[k]).join(',')}" data-chg="stu-files" data-id="${a.id}"></label>
        ${pendingStaged.length ? `<div class="send-bar"><button class="btn primary big" data-act="stu-send" data-id="${a.id}" ${stuState.uploading ? 'disabled' : ''}>${stuState.uploading ? '<span class="spin" style="border-top-color:#fff"></span> กำลังส่ง…' : `🚀 ส่งงานเลย (${pendingStaged.filter(x => x.state !== 'bad').length || pendingStaged.length} ไฟล์)`}</button></div>` : ''}`
      : `<div class="lock-note"><span class="em">${a.status === 'graded' ? '🌟' : '🔒'}</span>${a.status === 'graded' ? 'ครูตรวจงานนี้แล้ว เก่งมาก!' : !a.is_open ? 'ครูปิดรับงานนี้แล้ว' : 'เลยกำหนดส่งแล้ว งานนี้ไม่รับส่งช้า'}</div>`}
    </div>` : ''}
  </div>`;
}

/* ---------- เลือกไฟล์ / ส่งงาน ---------- */
function stageFiles(aid, files) {
  const a = (stuState.asg || []).find(x => x.id === aid); if (!a) return;
  const list = stuState.staged[aid] = stuState.staged[aid] || [];
  for (const f of files) {
    const kind = detectKind(f);
    const item = { key: uid(), file: f, name: f.name, size: f.size, kind, thumb: null, state: '', err: '' };
    if (!a.accept_types.includes(kind)) { item.state = 'bad'; item.err = `งานนี้ไม่รับ${KIND_LABEL[kind]}`; }
    else if (kind !== 'image' && f.size > a.max_file_mb * 1024 * 1024) { item.state = 'bad'; item.err = `ใหญ่เกิน ${a.max_file_mb} MB${kind === 'video' ? ' ลองตัดคลิปให้สั้นลง' : ''}`; }
    list.push(item);
    makeThumb(f, kind).then(t => { item.thumb = t; if (ui.route === 'student') render(); });
  }
  stuState.open = aid;
  render();
}
async function studentSend(aid) {
  const v = stuState.verified, a = (stuState.asg || []).find(x => x.id === aid);
  const items = (stuState.staged[aid] || []).filter(x => x.state !== 'ok' && x.state !== 'bad');
  if (!v || !a || stuState.uploading || !items.length) { if (!items.length) toast('ไม่มีไฟล์ที่ส่งได้ ลองเอาไฟล์ที่มี ! ออกแล้วเลือกใหม่', true); return; }
  stuState.uploading = true; render();
  let ok = 0;
  for (const it of items) {
    it.state = 'up'; it.err = ''; render();
    try {
      const file = it.kind === 'image' ? await compressImage(it.file) : it.file;
      if (file.size > a.max_file_mb * 1024 * 1024) throw new Error(`ใหญ่เกิน ${a.max_file_mb} MB`);
      if (!it.thumb) it.thumb = await makeThumb(file, it.kind);
      const path = await q(sb.rpc('student_begin_upload', { p_student_id: v.student_id, p_code: v.code, p_assignment_id: aid, p_file_name: file.name, p_mime: file.type || 'application/octet-stream', p_size: file.size, p_kind: it.kind }));
      await q(sb.storage.from('submissions').upload(path, file, { contentType: file.type || 'application/octet-stream', upsert: false }));
      await q(sb.rpc('student_finish_upload', { p_student_id: v.student_id, p_code: v.code, p_path: path, p_thumb: it.thumb }));
      it.state = 'ok'; it.size = file.size; ok++;
    } catch (e) { it.state = 'bad'; it.err = /ใหญ่เกิน/.test(e.message || '') ? e.message : errMsg(e); }
    render();
  }
  stuState.uploading = false;
  if (ok) {
    confetti(); toast(`ส่งงานสำเร็จ ${ok} ไฟล์ 🎉`);
    stuState.staged[aid] = (stuState.staged[aid] || []).filter(x => x.state !== 'ok');
    stuState.asg = null; await loadStudentAsg(); stuState.open = aid; render();
  } else render();
}
function confetti() {
  const box = document.createElement('div'); box.className = 'confetti';
  const em = ['🎉', '⭐', '✨', '💜', '🌟', '🎊', '💖'];
  for (let i = 0; i < 28; i++) {
    const s = document.createElement('i'); s.textContent = em[i % em.length];
    s.style.left = Math.random() * 100 + 'vw'; s.style.animationDelay = Math.random() * .5 + 's'; s.style.fontSize = 16 + Math.random() * 18 + 'px';
    box.appendChild(s);
  }
  document.body.appendChild(box); setTimeout(() => box.remove(), 2600);
}

</script>
