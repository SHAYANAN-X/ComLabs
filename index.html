@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* =====================================================================
   ตาราง · สื่อในข้อสอบ · พื้นหลังอีโมจิ · เอฟเฟกต์
   ===================================================================== */

/* ---------- 1) ตารางแบบรายการ iOS ---------- */
.tbl-wrap{overflow:auto;border:0}
table.tbl{border-collapse:separate;border-spacing:0;width:100%;font-size:14.5px}
.tbl thead th,[data-theme=dark] .tbl thead th{position:sticky;top:0;z-index:2;background:color-mix(in srgb,var(--surface) 82%,transparent);
  -webkit-backdrop-filter:blur(14px) saturate(180%);backdrop-filter:blur(14px) saturate(180%);
  font:600 12.5px var(--f-body);color:var(--muted);text-align:left;padding:12px 14px;border:0;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl thead th:first-child,.tbl td:first-child{padding-left:22px}
.tbl thead th:last-child,.tbl td:last-child{padding-right:22px}
.tbl td{padding:13px 14px;border:0;border-bottom:1px solid var(--line);vertical-align:middle;transition:background .2s}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr{position:relative}
.tbl tbody tr:hover td,[data-theme=dark] .tbl tbody tr:hover td{background:color-mix(in srgb,var(--primary) 5%,transparent)}
.tbl tbody tr:hover td:first-child{box-shadow:inset 3px 0 0 var(--primary)}
.tbl td.num,.tbl .gb-no{font:600 14px var(--f-head);font-variant-numeric:tabular-nums}
.tbl td.num:first-child,.tbl td:first-child.num{color:var(--muted)}
.tbl tr.inactive td{opacity:.55}
.tbl .chip{font-size:12px}
.tbl td.act{white-space:nowrap;text-align:right}
.tbl td b,.tbl td strong{font-weight:600}
/* ตัวเลขเลขที่ในวงกลม */
#stu-tbl td.num,.tbl td.num:first-child{width:52px}
#stu-tbl td.num::after{content:none}

/* ตารางคะแนน */
.gb-wrap{border-top:0;border-radius:0 0 var(--r) var(--r)}
table.gb{font-size:14.5px}
.gb th,.gb td,[data-theme=dark] .gb th,[data-theme=dark] .gb td{border:0;border-bottom:1px solid var(--line);background:var(--surface)}
.gb thead th,[data-theme=dark] .gb thead th{background:color-mix(in srgb,var(--surface) 84%,transparent);-webkit-backdrop-filter:blur(14px) saturate(180%);backdrop-filter:blur(14px) saturate(180%);padding:12px 12px 10px;border-bottom:1px solid var(--line)}
.gb tfoot td,[data-theme=dark] .gb tfoot td{background:color-mix(in srgb,var(--surface-2) 90%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);border-bottom:0}
.gb .gb-no{color:var(--muted)}
.gb .gb-name{box-shadow:8px 0 14px -12px rgba(16,24,48,.35);font-weight:500}
.gb tbody tr:hover td{background:color-mix(in srgb,var(--surface) 92%,var(--primary))}
.gcol{border-left:1px solid var(--line)!important}
.gcol.assignment,.gcol.manual,.gcol.exam{box-shadow:none}
.gcol .gh::before{content:'';display:block;width:26px;height:4px;border-radius:99px;margin-bottom:6px;background:var(--primary)}
.gcol.manual .gh::before{background:var(--orange)}
.gcol.exam .gh::before{background:var(--indigo)}
.gcol .gt{font:600 13.5px var(--f-head)}
.gcell-td{border-left:1px solid var(--line)!important}
.gcell{border-radius:10px;margin:3px 0;padding:8px 6px;font:600 15px var(--f-head);transition:background .2s,box-shadow .2s,transform .2s}
.gcell:hover{background:var(--fill)}
.gcell:focus{background:var(--surface);box-shadow:0 0 0 2px var(--primary),0 6px 16px -6px color-mix(in srgb,var(--primary) 60%,transparent);transform:scale(1.04)}
.gcell.saving{background:var(--accent-soft)}
.gcell.saved{background:var(--ok-soft);animation:saved-pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes saved-pop{40%{transform:scale(1.1)}}
.gb-tot{font:700 15px var(--f-head)!important}
.grade{border-radius:10px;font:700 14px var(--f-head);padding:3px 10px}
.grade.g4{background:linear-gradient(145deg,#5EE08A,#1FAF55);color:#fff}
.grade.g25,.grade.g2{background:linear-gradient(145deg,#6FB6FF,#0A7CFF);color:#fff}
.grade.g0{background:linear-gradient(145deg,#FF8A8C,#E5383B);color:#fff}

/* ---------- 2–3) สื่อในข้อสอบ + HTML ---------- */
.q-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.q-tools .btn svg{width:17px;height:17px}
.q-html-sw{display:inline-flex;align-items:center;gap:8px;font:600 13.5px var(--f-body);color:var(--muted);cursor:pointer;user-select:none}
.q-html-sw input{position:absolute;opacity:0;pointer-events:none}
.q-html-sw svg{width:16px;height:16px}
.q-html-sw .sw{width:44px;height:26px;border-radius:99px;background:rgba(120,120,128,.3);position:relative;transition:background .25s}
.q-html-sw .sw::after{content:'';position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .35s cubic-bezier(.2,1.5,.4,1)}
.q-html-sw input:checked+.sw{background:var(--green)}
.q-html-sw input:checked+.sw::after{transform:translateX(18px)}
.q-html-sw input:checked~svg{color:var(--primary)}
.q-html-sw input:focus-visible+.sw{outline:2.5px solid var(--primary);outline-offset:2px}
.q-prompt.mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:14px;line-height:1.55}
.q-tagbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.q-tag{border:0;border-radius:10px;padding:5px 11px;background:var(--fill);color:var(--ink);font:500 13px var(--f-body);cursor:pointer;transition:background .15s,transform .15s}
.q-tag:hover{background:var(--primary-soft);color:var(--primary)}.q-tag:active{transform:scale(.94)}
.q-tag code{font-size:12px}
.q-preview{margin-top:10px;border-radius:16px;border:1.5px dashed color-mix(in srgb,var(--primary) 40%,transparent);background:color-mix(in srgb,var(--primary) 4%,var(--surface));padding:12px 16px}
.q-prev-lbl{font-size:12.5px;font-weight:600;color:var(--primary);margin-bottom:6px}
.q-media{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:10px}
.q-mi{position:relative}
.q-mi .qm-list{margin:0}
.q-mi-x{position:absolute;top:8px;right:8px;z-index:3;width:30px;height:30px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;color:#fff;background:rgba(20,24,36,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.q-mi-x svg{width:15px;height:15px}
.link-kinds{display:flex;flex-wrap:wrap;gap:6px}
.link-kinds span{font-size:12.5px;padding:3px 10px;border-radius:99px;background:var(--fill)}
.q-link-prev{min-height:60px;border-radius:16px;background:var(--surface-2);padding:10px;display:grid;place-items:center}
.q-link-prev .qm-list{width:100%;margin:0}

/* คำถามที่นักเรียนเห็น */
.qp-text{white-space:pre-wrap}
.qp-html,.q-prev-body{overflow-wrap:anywhere;line-height:1.7}
.qp-html :is(p,ul,ol,pre,blockquote,table),.q-prev-body :is(p,ul,ol,pre,blockquote,table){margin:.4em 0}
.qp-html img,.q-prev-body img{max-width:100%;height:auto;border-radius:12px}
.qp-html code,.q-prev-body code,.rv-q code{background:var(--fill);border-radius:6px;padding:1px 6px;font:13.5px ui-monospace,'SF Mono',Menlo,Consolas,monospace}
.qp-html pre,.q-prev-body pre{background:#16192A;color:#E6EBF5;border-radius:14px;padding:12px 14px;overflow:auto;font:13.5px/1.6 ui-monospace,'SF Mono',Menlo,Consolas,monospace}
.qp-html pre code,.q-prev-body pre code{background:none;padding:0;color:inherit}
.qp-html mark,.q-prev-body mark{background:#FFE58A;border-radius:4px;padding:0 3px}
.qp-html table,.q-prev-body table{border-collapse:collapse;font-size:14px}
.qp-html :is(td,th),.q-prev-body :is(td,th){border:1px solid var(--line-2);padding:6px 10px}
.qp-html th,.q-prev-body th{background:var(--surface-2)}
.qp-html blockquote,.q-prev-body blockquote{border-left:4px solid var(--primary);padding:4px 12px;margin-left:0;color:var(--muted)}
.qm-list{display:flex;flex-direction:column;gap:10px;margin:12px 0 4px}
.qm{margin:0;border-radius:18px;overflow:hidden;background:var(--surface-2);box-shadow:0 0 0 .5px rgba(16,24,48,.08),0 8px 24px -14px rgba(16,24,48,.35)}
.qm-img img{display:block;width:100%;max-height:440px;object-fit:contain;background:#fff;cursor:zoom-in}
.qm-video{aspect-ratio:16/9;background:#000}
.qm-video iframe,.qm-video video{width:100%;height:100%;border:0;display:block}
.qm-link{display:flex;align-items:center;gap:8px;padding:12px 16px;text-decoration:none;color:var(--primary);font-weight:500}
.rv-q{flex:1;min-width:0;font-weight:600}
.rv-q .qm-list{max-width:520px}
.qm-zoom{position:fixed;inset:0;z-index:90;background:rgba(8,12,22,.82);display:grid;place-items:center;padding:20px;cursor:zoom-out;animation:fade .2s;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.qm-zoom img{max-width:100%;max-height:100%;border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.5);animation:zoom-in .3s cubic-bezier(.2,1.2,.4,1)}
@keyframes zoom-in{from{transform:scale(.85);opacity:0}}

/* ---------- 4) พื้นหลังอีโมจิหน้านักเรียน (ตรึงไว้ ไม่เลื่อนตาม) ---------- */
#emoji-bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;display:none}
body.stu-bg #emoji-bg{display:block}
#emoji-bg span{position:absolute;font-size:var(--s,30px);line-height:1;opacity:.2;transform:translate(-50%,-50%) rotate(var(--r,0deg));filter:saturate(.9);user-select:none}
[data-theme=dark] #emoji-bg span{opacity:.11}
body.stu-bg #app{position:relative;z-index:1}
body.stu-bg::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(60% 50% at 50% 30%,color-mix(in srgb,var(--bg) 70%,transparent),transparent 80%)}

/* ---------- 5) เอฟเฟกต์ ---------- */
/* เข้าหน้าใหม่: ค่อยๆ ลอยขึ้นทีละส่วน */
.enter>*{animation:rise .55s cubic-bezier(.2,.9,.25,1) both;animation-delay:calc(var(--i,0) * 55ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}}
/* แถบความคืบหน้าค่อยๆ เติม */
.enter :is(.prog-bar i,.bar-track i,.mini-prog i,.item-bar i,.asg-prog i){animation:grow 1s cubic-bezier(.2,.9,.25,1) both;animation-delay:.25s;transform-origin:left}
@keyframes grow{from{transform:scaleX(0)}}
/* หน้าต่างเด้งแบบสปริง */
[data-device=pc] .modal{animation:spring-in .42s cubic-bezier(.2,1.25,.35,1)}
@keyframes spring-in{from{opacity:0;transform:scale(.92) translateY(10px)}}
.toast{animation:toast-in .5s cubic-bezier(.2,1.4,.35,1)}
@keyframes toast-in{from{opacity:0;transform:translateY(16px) scale(.9)}}
/* ระลอกน้ำในปุ่มกระจก */
.btn .ripple{position:absolute;border-radius:50%;pointer-events:none;z-index:-1;transform:translate(-50%,-50%) scale(0);background:radial-gradient(circle,rgba(255,255,255,.75),rgba(255,255,255,0) 70%);animation:ripple .65s ease-out forwards}
@keyframes ripple{to{transform:translate(-50%,-50%) scale(1);opacity:0}}
/* การ์ดเอียงตามเมาส์ */
.tilt{transform-style:preserve-3d;will-change:transform}
.tilt.tilting{transition:transform .08s linear}
.tilt:not(.tilting){transition:transform .5s cubic-bezier(.2,1.2,.4,1),box-shadow .25s}
.subj-top .art,.asg-bar .art,.sa-ico .art{transition:transform .6s cubic-bezier(.2,1,.3,1)}
.subj:hover .subj-top .art{transform:scale(1.06)}
.asg:hover .asg-bar .art,.sa:hover .sa-ico .art{transform:scale(1.08) rotate(-3deg)}
/* ภาพหน้าแรกขยับเบาๆ */
.hero .art.desk circle:first-of-type{animation:sun 6s ease-in-out infinite alternate}
@keyframes sun{to{transform:translateY(-4px)}}
.hero .art.desk g:first-of-type ellipse{animation:cloud 14s ease-in-out infinite alternate}
@keyframes cloud{to{transform:translateX(18px)}}
/* ตัวเลขนับขึ้น */
.counting{font-variant-numeric:tabular-nums}
/* สลับธีมแบบวงกลมขยาย */
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
/* ช่องคะแนนที่บันทึกแล้วในหน้าตรวจงาน */
.tbl input[data-chg=quick-score]{transition:transform .2s,box-shadow .2s}
.tbl input[data-chg=quick-score]:focus{transform:scale(1.06)}

@media (prefers-reduced-motion:reduce){
  .enter>*,.enter :is(.prog-bar i,.bar-track i,.mini-prog i,.item-bar i),.hero .art *{animation:none!important}
}

/* =====================================================================
   โหมดมืด: ชื่อและหัวข้อเรืองแสงสีเหลือง
   ===================================================================== */
[data-theme=dark]{--glow:#FFE27A;--glow-shadow:0 0 6px rgba(255,214,10,.55),0 0 18px rgba(255,196,0,.35),0 0 36px rgba(255,170,0,.18)}
[data-theme=dark] :is(.page-head h2,.hero-txt h2,.stu-banner h2,.auth-art h1,.m-top h1,.side .brand b,.exm-title,.exm-hero h2,.stu-card h2,.pending-card h2,.modal-h h3,.uc-id b,.m-me b){
  color:var(--glow)!important;text-shadow:var(--glow-shadow)}
[data-theme=dark] :is(.subj h3,.asg-title,.sa-title,.card-h h3,.stat .val,.counter b,.room-chip b,.gb .gb-name,.gcol .gt){
  color:#FFE9A3;text-shadow:0 0 10px rgba(255,214,10,.28)}
[data-theme=dark] .hero::after{background:linear-gradient(90deg,rgba(11,15,23,.72),rgba(11,15,23,.1) 60%)}
[data-theme=dark] .stu-banner::before{background:linear-gradient(180deg,rgba(22,27,37,0) 50%,var(--surface))}

/* =====================================================================
   นาฬิกาเรืองแสง
   ===================================================================== */
.live-clock{display:inline-flex;flex-direction:column;align-items:flex-end;gap:2px;padding:12px 20px 10px;border-radius:24px;
  background:rgba(255,255,255,.42);-webkit-backdrop-filter:blur(16px) saturate(180%);backdrop-filter:blur(16px) saturate(180%);
  box-shadow:var(--lg-rim),var(--lg-edge),0 10px 30px -12px rgba(16,24,48,.35)}
.lc-time{display:flex;align-items:flex-start;gap:4px;font:700 56px/1 var(--f-head);font-variant-numeric:tabular-nums;letter-spacing:-.02em;
  background:linear-gradient(180deg,#2D7BFF,#5E5CE6);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 10px rgba(80,140,255,.45)) drop-shadow(0 2px 0 rgba(255,255,255,.6))}
.lc-sec{font-size:.42em;margin-top:.18em;opacity:.85}
.lc-date{font:600 14px var(--f-body);color:#24324F}
[data-theme=dark] .live-clock{background:rgba(14,18,30,.45);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.14),0 12px 30px -12px rgba(0,0,0,.6)}
[data-theme=dark] .lc-time{background:linear-gradient(180deg,#FFF3B0,#FFD23F 55%,#FFB000);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 6px rgba(255,214,10,.75)) drop-shadow(0 0 20px rgba(255,170,0,.45))}
[data-theme=dark] .lc-date{color:#FFE9A3;text-shadow:0 0 10px rgba(255,214,10,.4)}
.lc-sec{animation:tick 1s steps(1) infinite}
@keyframes tick{50%{opacity:.55}}
.hero-clock{position:absolute;top:18px;right:20px;z-index:2}
.stu-clock{position:absolute;top:12px;left:14px;z-index:2}
.stu-clock .live-clock{align-items:flex-start;padding:8px 14px 7px;border-radius:18px}
.stu-clock .lc-time{font-size:38px}
.stu-clock .lc-date{font-size:12px}
.stu-banner .acts{top:12px;right:12px}
[data-device=mobile] .hero-clock{top:12px;left:14px;right:auto}
[data-device=mobile] .hero-clock .live-clock{align-items:flex-start;padding:8px 14px 7px;border-radius:18px}
[data-device=mobile] .hero-clock .lc-time{font-size:40px}
[data-device=mobile] .hero-clock .lc-date{font-size:12px}
[data-device=mobile] .hero-txt{padding-top:150px}
[data-device=mobile] .hero .art.desk{height:70%}
@media (max-width:1000px){.hero-clock .lc-time{font-size:44px}}

/* =====================================================================
   ข้อความถึงครู + ลิงก์อ้างอิง
   ===================================================================== */
.note-box{display:flex;flex-direction:column;gap:12px;margin-top:14px;padding:14px;border-radius:18px;background:var(--surface-2)}
.note-box .field small{font-weight:400}
.link-rows{display:flex;flex-direction:column;gap:8px}
.link-row{display:flex;gap:6px;align-items:center}
.link-row .input{flex:1;min-width:0}
.note-box .field{display:flex;flex-direction:column;gap:6px}
.note-read{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:16px;background:var(--surface-2);margin:10px 0;font-size:14px}
.note-read a,.sn-link{color:var(--primary);text-decoration:none;font-weight:500;overflow-wrap:anywhere}
.note-read a:hover,.sn-link:hover{text-decoration:underline}
.nb{display:inline-grid;place-items:center;min-width:26px;height:24px;padding:0 6px;margin-right:4px;border-radius:99px;background:var(--primary-soft);font-size:12.5px;cursor:help}
.sub-note{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:16px;background:var(--primary-soft);margin-bottom:12px}
.sn-msg div{white-space:pre-wrap;font-weight:500}
.sn-link{display:flex;gap:6px;padding:8px 12px;border-radius:12px;background:var(--surface)}
.sn-link span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* =====================================================================
   ข้อสอบทีละหน้า
   ===================================================================== */
.exm-dot.cur{box-shadow:0 0 0 2px var(--primary)}
.exm-pagehead{display:flex;align-items:center;gap:10px;margin:4px 4px 12px}
.exm-pagehead b{font:700 17px var(--f-head)}
.exm-pips{display:flex;gap:6px}
.exm-pips i{width:10px;height:10px;border-radius:50%;background:var(--line-2);transition:all .3s}
.exm-pips i.done{background:var(--green)}
.exm-pips i.cur{width:26px;border-radius:99px;background:var(--primary)}
.exm-page{animation:page-in .45s cubic-bezier(.2,.9,.25,1)}
@keyframes page-in{from{opacity:0;transform:translateX(24px)}}
.exm-pager{display:flex;gap:10px;align-items:center;margin-top:10px;position:sticky;bottom:calc(14px + env(safe-area-inset-bottom));z-index:5}
.exm-pager .btn.big{min-width:140px;justify-content:center}
.exm-pager .btn small{font-size:11.5px;opacity:.85;font-weight:400}
#exm-next.ready{animation:pulse-ready 1.6s ease-in-out infinite}
@keyframes pulse-ready{50%{box-shadow:inset 0 0 0 .5px rgba(255,255,255,.45),0 0 0 6px color-mix(in srgb,var(--primary) 25%,transparent),0 10px 24px -10px rgba(10,112,240,.75)}}
[data-device=mobile] .exm-pager .btn.big{min-width:0;flex:1}
[data-device=mobile] .exm-pager .spacer{display:none}
@media (prefers-reduced-motion:reduce){.exm-page,#exm-next.ready,.lc-sec{animation:none}}
#exm-next{overflow:hidden;white-space:nowrap}
[data-device=mobile] #exm-next small{display:none}

/* =====================================================================
   แก้โหมดมืด: ส่วนควบคุมของเบราว์เซอร์ (รายการเลือก ปฏิทิน แถบเลื่อน)
   ===================================================================== */
:root{color-scheme:light}
[data-theme=dark]{color-scheme:dark}
select option,select optgroup{background:var(--surface);color:var(--ink)}
[data-theme=dark] select option{background:#1C2230;color:#F1F4FA}
[data-theme=dark] input::-webkit-calendar-picker-indicator{filter:invert(.85)}
[data-theme=dark] ::placeholder{color:#7F8AA3}
[data-theme=dark] ::-webkit-scrollbar{width:10px;height:10px}
[data-theme=dark] ::-webkit-scrollbar-thumb{background:#3A4458;border-radius:99px;border:2px solid transparent;background-clip:padding-box}
[data-theme=dark] ::-webkit-scrollbar-track{background:transparent}
[data-theme=dark][data-device=mobile] .hero::after{background:linear-gradient(180deg,rgba(22,27,37,0) 30%,var(--surface) 64%)}
/* แถบเปลี่ยนหน้าข้อสอบ: แคปซูลกระจก ไม่ทับคำถามจนอ่านยาก */
.exm-pager{padding:8px;border-radius:28px;background:var(--bar);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:var(--lg-rim),var(--lg-edge),0 12px 30px -12px rgba(16,24,48,.35)}
.exm-pager .btn:disabled{opacity:.35}

/* =====================================================================
   หัวข้อใหญ่: ไล่สีเรืองแสง (ทั้ง 2 โหมด)
   ===================================================================== */
:is(.page-head h2,.hero-txt h2,.stu-banner h2,.auth-art h1,.stu-card h2,.pending-card h2){
  width:fit-content;max-width:100%;padding-bottom:.08em;font-weight:700;letter-spacing:-.012em;
  background:linear-gradient(100deg,#0A5BFF 0%,#4F5BEA 45%,#9B4DFF 100%);-webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent;text-shadow:none;
  filter:drop-shadow(0 2px 10px rgba(70,100,255,.28))}
.page-head h2{font-size:36px}
.stu-card h2,.pending-card h2{margin-left:auto;margin-right:auto}
[data-theme=dark] :is(.page-head h2,.hero-txt h2,.stu-banner h2,.auth-art h1,.stu-card h2,.pending-card h2){
  background:linear-gradient(180deg,#FFF6C4 0%,#FFD84A 50%,#FFB21A 100%);-webkit-background-clip:text;background-clip:text;
  color:transparent!important;-webkit-text-fill-color:transparent;text-shadow:none;
  filter:drop-shadow(0 0 6px rgba(255,214,10,.55)) drop-shadow(0 0 18px rgba(255,170,0,.35))}
[data-device=mobile] .page-head h2{font-size:30px}
/* มือถือ: ภาพทักทายอยู่ด้านบน ข้อความอยู่ใต้ภาพ ไม่ทับกัน */
[data-device=mobile] .hero{flex-direction:column;align-items:stretch;min-height:0}
[data-device=mobile] .hero .art.desk{position:relative;inset:auto;height:190px;width:100%;flex:none}
[data-device=mobile] .hero::after,[data-theme=dark][data-device=mobile] .hero::after{top:0;bottom:auto;height:190px;background:linear-gradient(180deg,transparent 62%,var(--surface))}
[data-device=mobile] .hero-txt{padding:6px 18px 18px}

/* =====================================================================
   เฟส 6: เช็คชื่อ · รูบริก · รายงาน/สำรองข้อมูล
   ===================================================================== */
/* ---------- เช็คชื่อ ---------- */
.att-live{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:16px;align-items:start}
.att-live.closed{grid-template-columns:1fr}
.att-qr-card{padding:22px;position:sticky;top:76px;display:flex;flex-direction:column;align-items:center}
.att-qr{width:100%;aspect-ratio:1;display:grid;place-items:center;background:#fff;border-radius:22px;padding:14px;box-shadow:inset 0 0 0 1px var(--line)}
.att-qr svg{width:100%;height:100%}
.att-ring{position:relative;width:64px;height:64px;margin-top:-34px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center}
.att-ring svg{position:absolute;inset:4px;width:calc(100% - 8px);height:calc(100% - 8px);transform:rotate(-90deg)}
.att-ring circle{fill:none;stroke-width:3.2;stroke:var(--fill)}
.att-ring circle+circle{stroke:var(--primary);stroke-linecap:round;stroke-dasharray:97.4;transition:stroke-dashoffset 1s linear}
.att-ring span{font:700 20px var(--f-head);font-variant-numeric:tabular-nums}
.att-roster .card-h{flex-wrap:wrap;gap:6px}
.att-roster .card-h h3 span{color:var(--ok);font-size:1.25em}
.att-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding:14px}
.att-stu{position:relative;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;gap:0 8px;align-items:center;text-align:left;padding:10px 12px;border:0;border-radius:16px;background:var(--fill);color:var(--ink);cursor:pointer;font:inherit;transition:transform .2s,background .25s}
.att-stu:hover{transform:translateY(-1px)}
.att-no{grid-row:span 2;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--surface);font:700 13px var(--f-head)}
.att-nm{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att-st{font-size:12.5px;color:var(--muted)}
.att-st small{opacity:.8}
.att-stu.s-present{background:var(--ok-soft)}.att-stu.s-present .att-no{background:var(--green);color:#fff}
.att-stu.s-late{background:var(--accent-soft)}.att-stu.s-late .att-no{background:var(--orange);color:#fff}
.att-stu.s-absent{background:var(--danger-soft)}.att-stu.s-absent .att-no{background:var(--danger);color:#fff}
.att-stu.s-leave,.att-stu.s-sick{background:var(--primary-soft)}.att-stu.s-leave .att-no,.att-stu.s-sick .att-no{background:var(--primary);color:#fff}
.att-stu.pop{animation:att-pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes att-pop{40%{transform:scale(1.06)}}
.att-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.att-opt{border:0;border-radius:18px;padding:14px 8px;background:var(--fill);color:var(--ink);font:600 15px var(--f-body);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .15s}
.att-opt span{font-size:26px}.att-opt:active{transform:scale(.95)}
.att-opt.on{box-shadow:0 0 0 2.5px var(--primary);background:var(--primary-soft)}
.att-mx .att-h{font-size:12px;text-align:center;min-width:46px}
.att-c{text-align:center;font:700 14px var(--f-head);padding:8px 4px!important}
.att-c.s-present{color:var(--ok)}.att-c.s-late{color:var(--orange)}.att-c.s-absent{color:var(--danger);background:var(--danger-soft)!important}.att-c.s-leave,.att-c.s-sick{color:var(--primary)}
.att-pct{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--ok-soft);color:var(--ok)}
.att-pct.low{background:var(--danger-soft);color:var(--danger)}
.att-present .present-card{max-width:620px}
.att-present .present-qr{background:#fff;border-radius:24px;padding:16px}
.att-present-meta{display:flex;justify-content:center;gap:24px;font-size:20px;margin:10px 0}
.att-present-meta b{font:700 30px var(--f-head);color:var(--primary)}
.att-present .live-clock{margin-top:6px}
/* นักเรียนสแกน */
.chk-card{text-align:center}
.chk-done{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0}
.chk-em{font-size:72px;line-height:1;animation:spring-in .5s cubic-bezier(.2,1.4,.35,1)}
.chk-done h2{font:700 26px var(--f-head);margin:6px 0 0}
.chk-st{font:700 20px var(--f-head);padding:6px 18px;border-radius:99px;background:var(--ok-soft);color:var(--ok)}
.chk-done.s-late .chk-st{background:var(--accent-soft);color:var(--accent)}
.chk-card form{text-align:left}

/* ---------- รูบริก ---------- */
.rb-sec{border-radius:18px;background:var(--surface-2);padding:12px 14px}
.rb-h{display:inline-flex;align-items:center;gap:6px;font:600 15px var(--f-head)}
.rb-h svg,.rb-gh svg{width:18px;height:18px;color:var(--primary)}
.rb-wrap{overflow-x:auto;margin-top:10px;border-radius:14px}
.rb-tbl{border-collapse:separate;border-spacing:4px;width:100%;min-width:560px}
.rb-tbl th{font:600 13px var(--f-body);color:var(--muted);text-align:center;vertical-align:bottom;padding:4px}
.rb-tbl th small{display:block;font-weight:400;font-size:11.5px}
.rb-tbl td{vertical-align:top;padding:0}
.rb-tbl .input{padding:7px 9px;font-size:13.5px;border-radius:10px;min-width:0;width:100%;resize:vertical}
.rb-tbl .rb-c{width:24%;text-align:left}
.rb-tbl .rb-w{width:72px}.rb-w .input{text-align:center}.rb-w small{display:block;text-align:center;color:var(--muted)}
.rb-tbl .rb-x{width:36px}
.rb-lv{font-weight:600;text-align:center;margin-bottom:3px}
.rb-pt{text-align:center;width:70px!important;margin:0 auto}
.rb-tbl.ro{min-width:520px}
.rb-tbl.ro td{background:var(--surface);border-radius:12px;padding:8px 10px;font-size:13px;line-height:1.5;position:relative}
.rb-tbl.ro td.rb-c{background:transparent}
.rb-tbl.ro td.hit{background:var(--primary-soft);box-shadow:inset 0 0 0 2px var(--primary);font-weight:500}
.rb-mark{position:absolute;top:4px;right:6px;width:20px;height:20px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:12px}
.rb-stu{margin:10px 0;border-radius:16px;background:var(--surface-2);padding:10px 14px}
.rb-stu summary{cursor:pointer;font:600 15px var(--f-head);list-style:none}
.rb-stu summary::-webkit-details-marker{display:none}
.rb-stu summary small{font-weight:400;color:var(--muted)}
.rb-grade{border-radius:18px;background:var(--surface-2);padding:12px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px}
.rb-gh{display:flex;align-items:center;gap:6px;font:600 15px var(--f-head)}
.rb-row{display:flex;flex-direction:column;gap:6px}
.rb-rt{font-weight:600;font-size:14px}.rb-rt small{color:var(--muted);font-weight:500}
.rb-lvls{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:6px}
.rb-lvbtn{border:0;border-radius:12px;padding:7px 4px;background:var(--surface);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;font:inherit;box-shadow:inset 0 0 0 1px var(--line);transition:transform .15s,background .2s}
.rb-lvbtn b{font-size:13px}.rb-lvbtn span{font:700 15px var(--f-head);color:var(--muted)}
.rb-lvbtn:active{transform:scale(.95)}
.rb-lvbtn.on{background:linear-gradient(180deg,#3D93FF,#0A6CF0);color:#fff;box-shadow:0 8px 18px -8px rgba(10,108,240,.8)}
.rb-lvbtn.on span{color:#fff}

/* ---------- รายงาน / สำรองข้อมูล ---------- */
.rp-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.rp-card{display:flex;gap:16px;padding:20px}
.rp-ic{width:52px;height:52px;flex:none;border-radius:16px;display:grid;place-items:center;color:#fff;box-shadow:inset 0 1px 1px rgba(255,255,255,.5),0 8px 18px -8px rgba(16,24,48,.4)}
.rp-ic svg{width:26px;height:26px}
.rp-ic.b{background:linear-gradient(145deg,#4DA3FF,#0A6CF0)}.rp-ic.g{background:linear-gradient(145deg,#5EE08A,#1FAF55)}
.rp-body{display:flex;flex-direction:column;gap:10px;min-width:0;flex:1}
.rp-body h3{font:700 19px var(--f-head);margin:0}
.rp-body p{margin:0}
.rp-last{font-weight:600;font-size:14px;padding:8px 12px;border-radius:12px}
.rp-last.ok{background:var(--ok-soft);color:var(--ok)}.rp-last.warn{background:var(--accent-soft);color:var(--accent)}
.rp-prev,.rp-res{border-radius:14px;background:var(--surface-2);padding:12px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.rp-chips{display:flex;flex-wrap:wrap;gap:6px}
.rp-doc{padding:18px 22px}
.rp-head{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.rp-title{font:700 22px var(--f-head)!important;margin:0 0 2px;width:auto!important;background:none!important;-webkit-text-fill-color:currentColor!important;color:var(--ink)!important;filter:none!important}
.rp-stats{display:flex;gap:8px}
.rp-stats div{min-width:86px;padding:8px 12px;border-radius:14px;background:var(--surface-2);text-align:center}
.rp-stats b{display:block;font:700 22px var(--f-head)}.rp-stats small{font-size:12px;color:var(--muted)}
.rp-dist{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.rp-g{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:99px;background:var(--surface-2)}
.rp-g b{font-family:var(--f-head)}
.grade.gms{background:linear-gradient(145deg,#8E8BFF,#5E5CE6);color:#fff}
.grade.g35,.grade.g3{background:linear-gradient(145deg,#6FB6FF,#0A7CFF);color:#fff}
.grade.g15,.grade.g1{background:linear-gradient(145deg,#FFC46B,#FF9F0A);color:#fff}
.rp-tbl .rp-num{text-align:center}
.rp-tbl th small{display:block;font-weight:400}
.rp-tbl td.bad{color:var(--danger);font-weight:700}
.rp-foot{margin-top:12px;line-height:1.7}
.rp-sign{margin-top:28px;text-align:right;line-height:2.1;color:var(--ink)}
[data-device=mobile] .rp-grid,[data-device=mobile] .att-live{grid-template-columns:1fr}
[data-device=mobile] .att-qr-card{position:static}
[data-device=mobile] .att-grid{grid-template-columns:repeat(2,1fr)}
[data-device=mobile] .rp-card{flex-direction:column}
[data-device=mobile] .rp-stats{flex-wrap:wrap}

/* พิมพ์รายงาน: แสดงเฉพาะตัวรายงาน */
@media print{
  body.printing-report{background:#fff!important;color:#000}
  body.printing-report *{visibility:hidden;box-shadow:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;animation:none!important}
  body.printing-report #rp-report .rp-doc,body.printing-report #rp-report .rp-doc *{visibility:visible}
  body.printing-report #rp-report{position:absolute;left:0;top:0;width:100%;background:#fff!important}
  body.printing-report #rp-report .card-h{display:none}
  body.printing-report #emoji-bg,body.printing-report .side,body.printing-report .top{display:none}
  body.printing-report .rp-doc{padding:0;color:#000}
  body.printing-report .tbl th,body.printing-report .tbl td{border:1px solid #999!important;padding:4px 6px!important;color:#000;background:#fff!important;position:static}
  body.printing-report .grade{background:none!important;color:#000!important;padding:0}
  body.printing-report .rp-stats div,body.printing-report .rp-g{background:none;border:1px solid #bbb}
  @page{size:A4 landscape;margin:12mm}
}
.card-h select.input.sm-sel{width:auto;max-width:220px;flex:none;padding:6px 12px;font-size:14px}
.card-h h3{white-space:nowrap}
.rb-lvls{grid-template-columns:repeat(var(--n,4),1fr)}
.rp-cfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--surface-2)}

/* =====================================================================
   เฟส 7: ยศ · มงกุฎ · ทำเนียบ · ร้านฉายา · ติดตามนักเรียน · ประกาศ · คลังข้อสอบ · แกลเลอรี
   ===================================================================== */
/* ---------- สีชื่อตามยศ (อ่อน → เรืองแสง) ---------- */
:root{--g0:#8A93A3;--g1:#3FA34D;--g2:#0F9E8E;--g3:#2F74E8;--g4:#5458E0;--g5:#8048E8;--g6:#EA6A0C;--g7:#D9183F}
[data-theme=dark]{--g0:#A7B0C0;--g1:#6BD47A;--g2:#3FD9C6;--g3:#6FA8FF;--g4:#8C90FF;--g5:#B28CFF;--g6:#FF9A4D;--g7:#FF5C7A}
.ntag{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.gname{font-weight:700}
.gname.g0{color:var(--g0)}.gname.g1{color:var(--g1)}.gname.g2{color:var(--g2)}.gname.g3{color:var(--g3)}.gname.g4{color:var(--g4)}
.gname.g5{color:var(--g5)}.gname.g6{color:var(--g6)}.gname.g7{color:var(--g7);text-shadow:0 0 8px color-mix(in srgb,var(--g7) 35%,transparent)}
.gname.g8{background:linear-gradient(180deg,#FFE680,#F5B300 55%,#C77700);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 5px rgba(255,190,0,.65))}
.gname.g9{background:linear-gradient(90deg,#FF5E62,#FF9966,#FFD452,#6EE7B7,#60A5FA,#A78BFA,#FF5E62);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 6px rgba(167,139,250,.75));animation:rainbow 4s linear infinite}
@keyframes rainbow{to{background-position:300% 0}}
/* ป้ายยศ */
.rk{display:inline-flex;align-items:center;gap:3px;padding:1px 8px 1px 5px;border-radius:99px;font-size:11.5px;line-height:1.6;white-space:nowrap;
  background:color-mix(in srgb,var(--rc,#888) 14%,transparent);color:var(--rc,#888);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--rc,#888) 35%,transparent)}
.rk b{font-weight:600}
.rk.g0{--rc:var(--g0)}.rk.g1{--rc:var(--g1)}.rk.g2{--rc:var(--g2)}.rk.g3{--rc:var(--g3)}.rk.g4{--rc:var(--g4)}.rk.g5{--rc:var(--g5)}.rk.g6{--rc:var(--g6)}.rk.g7{--rc:var(--g7)}
.rk.g8{--rc:#D79A00;background:linear-gradient(135deg,#FFF3C4,#FFD54A);color:#7A4F00;box-shadow:0 0 10px rgba(255,190,0,.55),inset 0 0 0 1px #F5B300}
.rk.g9{color:#fff;background:linear-gradient(90deg,#FF5E62,#FFB347,#6EE7B7,#60A5FA,#A78BFA);background-size:200% 100%;animation:rainbow 5s linear infinite;box-shadow:0 0 12px rgba(167,139,250,.7)}
/* ตราอันดับ 1–10 */
.crown{position:relative;display:inline-flex;align-items:center;justify-content:center;flex:none;width:1.45em;height:1.15em;line-height:1;vertical-align:-.15em}
.crown svg{width:100%;height:100%;overflow:visible}
.crown.k1{width:1.9em;height:1.55em;animation:cw-glow1 2.2s ease-in-out infinite}
.crown.k2{width:1.7em;height:1.35em;animation:cw-glow2 2.6s ease-in-out infinite}
.crown.k3{width:1.7em;height:1.35em;animation:cw-glow3 2.6s ease-in-out infinite}
.crown.k4,.crown.k5{width:1.6em;height:1.3em;animation:cw-float 3s ease-in-out infinite}
.crown.k4{filter:drop-shadow(0 0 3px rgba(168,85,247,.55))}.crown.k5{filter:drop-shadow(0 0 3px rgba(141,183,51,.6))}
.crown.kx{animation:cw-blink 1.8s ease-in-out infinite;filter:drop-shadow(0 0 2px rgba(245,190,30,.6))}
@keyframes cw-glow1{0%,100%{filter:drop-shadow(0 0 3px rgba(255,196,0,.7)) drop-shadow(0 1px 1px rgba(120,70,0,.4));transform:translateY(0) rotate(-4deg)}
  50%{filter:drop-shadow(0 0 11px rgba(255,214,10,1)) drop-shadow(0 0 22px rgba(255,120,60,.55));transform:translateY(-2px) rotate(4deg)}}
@keyframes cw-glow2{0%,100%{filter:drop-shadow(0 0 2px rgba(150,190,255,.6))}50%{filter:drop-shadow(0 0 9px rgba(120,170,255,1))}}
@keyframes cw-glow3{0%,100%{filter:drop-shadow(0 0 2px rgba(255,160,90,.6))}50%{filter:drop-shadow(0 0 9px rgba(16,185,129,.9))}}
@keyframes cw-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes cw-blink{0%,100%{opacity:1}50%{opacity:.45}}
.cw-tw{transform-origin:18px 1px;transform-box:view-box;animation:cw-tw 1.4s ease-in-out infinite}
@keyframes cw-tw{0%,100%{opacity:.2;transform:scale(.5)}50%{opacity:1;transform:scale(1.25)}}
/* ประกายแสงวิ่งผ่านตราอันดับ 1–3 */
.cw-glint{position:absolute;inset:0;pointer-events:none;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;
  background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.95) 50%,transparent 65%);background-size:300% 100%;animation:cw-sweep 2.8s ease-in-out infinite;mix-blend-mode:overlay}
.crown .cw-glint{--m:linear-gradient(#000,#000);border-radius:30%;opacity:.8}
@keyframes cw-sweep{0%{background-position:150% 0}60%,100%{background-position:-150% 0}}
/* ฉายา */
.ttl{display:inline-flex;align-items:center;padding:1px 9px;border-radius:7px;font-size:11.5px;font-weight:600;white-space:nowrap;letter-spacing:.1px}
.ttl::before{content:'「';opacity:.6}.ttl::after{content:'」';opacity:.6}
.ttl.common{background:var(--fill);color:var(--muted)}
.ttl.rare{background:rgba(47,116,232,.12);color:#2F74E8;box-shadow:inset 0 0 0 1px rgba(47,116,232,.35)}
.ttl.epic{background:linear-gradient(135deg,rgba(128,72,232,.16),rgba(217,70,239,.12));color:#7C3AED;box-shadow:inset 0 0 0 1px rgba(128,72,232,.45)}
.ttl.legendary{background:linear-gradient(110deg,#FFE9A8 30%,#FFF7DB 45%,#FFE9A8 60%);background-size:250% 100%;color:#8A5A00;box-shadow:inset 0 0 0 1px #F5B300,0 0 8px rgba(255,190,0,.45);animation:shine 2.6s linear infinite}
.ttl.mythic{color:#fff;background:linear-gradient(90deg,#FF5E62,#FFB347,#6EE7B7,#60A5FA,#A78BFA,#FF5E62);background-size:300% 100%;animation:rainbow 3.5s linear infinite;box-shadow:0 0 12px rgba(167,139,250,.7)}
[data-theme=dark] .ttl.rare{color:#8AB6FF}[data-theme=dark] .ttl.epic{color:#C4A6FF}
@keyframes shine{to{background-position:-250% 0}}

/* ---------- ทำเนียบคนเก่ง ---------- */
.hall{overflow:hidden;background:linear-gradient(180deg,color-mix(in srgb,#FFD54A 10%,var(--surface)),var(--surface) 45%)}
[data-theme=dark] .hall{background:linear-gradient(180deg,rgba(255,196,0,.08),var(--surface) 45%)}
.hall-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 20px 4px}
.hall-h h3{font:700 19px var(--f-head);margin:0}.hall-h small{color:var(--muted)}
.podium{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;gap:10px;padding:18px 18px 14px}
.pq{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:30px 8px 12px;border-radius:20px 20px 12px 12px;min-width:0;
  background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.pq-medal{position:absolute;top:-22px;font-size:40px;line-height:1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
.pq-no{font:800 13px var(--f-head);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow);margin-bottom:4px}
.pq-name{font-size:14.5px;max-width:100%;overflow:hidden}
.pq-name .ntag{justify-content:center}
.pq-meta{font-size:12px;color:var(--muted)}
.pq-xp{font:800 16px var(--f-head);margin-top:2px}
.pq-cls{font-size:11.5px;color:var(--muted)}
.pq{--g0:#C3CAD6;--g1:#7BE08A;--g2:#4FE3CF;--g3:#86B6FF;--g4:#A2A6FF;--g5:#C4A4FF;--g6:#FFAA66;--g7:#FF7590;color:#F4F6FB;
  background:linear-gradient(175deg,#2B3463,#1A1F3D 70%);box-shadow:0 14px 28px -16px rgba(16,20,48,.8),inset 0 0 0 2px var(--mt,#56608F),inset 0 3px 0 var(--mt,#56608F)}
.pq .pq-meta,.pq .pq-cls{color:#AEB6CF}.pq .pq-no{background:var(--mt,#56608F);color:#1A1F3D;box-shadow:none}
.pq.p1{--mt:#F5C02E;min-height:205px;background:radial-gradient(120% 70% at 50% 0%,rgba(255,200,40,.35),transparent 60%),linear-gradient(175deg,#3A2F5E,#1E1A3A 70%);box-shadow:0 16px 34px -14px rgba(245,170,0,.75),inset 0 0 0 2px #F5C02E,inset 0 3px 0 #FFE27A}
.pq.p2{--mt:#C9D0DB;min-height:178px;background:radial-gradient(120% 70% at 50% 0%,rgba(220,228,240,.25),transparent 60%),linear-gradient(175deg,#2B3463,#1A1F3D 70%)}
.pq.p3{--mt:#D98A4A;min-height:160px;background:radial-gradient(120% 70% at 50% 0%,rgba(230,140,70,.28),transparent 60%),linear-gradient(175deg,#2B3463,#1A1F3D 70%)}
.pq.p4,.pq.p5{--mt:#56608F;min-height:140px}
.pq.p1 .pq-xp{font-size:19px;color:#FFD54A;text-shadow:0 0 10px rgba(255,200,40,.6)}
.pq .rk{background:rgba(255,255,255,.08)}.pq .rk.g8{background:linear-gradient(135deg,#FFF3C4,#FFD54A)}
.pq.p1::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.18) 45%,transparent 60%);background-size:250% 100%;animation:shine 3.2s linear infinite}
.pq.me{outline:3px solid var(--primary);outline-offset:3px}
.pq.vacant{min-height:110px;opacity:.45;justify-content:center}
.pod-rest{padding:0 18px 16px;display:flex;flex-direction:column;gap:6px}
.pr-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:14px;background:var(--surface-2)}
.pr-row.me{box-shadow:inset 0 0 0 2px var(--primary)}
.pr-no{font:800 14px var(--f-head);width:26px;text-align:center;color:var(--muted)}
.pr-xp{font-family:var(--f-head)}
.pod-empty{padding:26px;text-align:center;color:var(--muted)}
.dash-duo{display:grid;grid-template-columns:1.65fr 1fr;gap:16px;margin-bottom:16px;align-items:start}

/* ---------- การ์ดนักผจญภัยของนักเรียน ---------- */
.gcard{display:flex;gap:16px;align-items:center;padding:16px 18px;margin-bottom:12px;--rc:var(--g0)}
.gcard.g1{--rc:var(--g1)}.gcard.g2{--rc:var(--g2)}.gcard.g3{--rc:var(--g3)}.gcard.g4{--rc:var(--g4)}.gcard.g5{--rc:var(--g5)}.gcard.g6{--rc:var(--g6)}.gcard.g7{--rc:var(--g7)}.gcard.g8{--rc:#F5B300}.gcard.g9{--rc:#A78BFA}
.gc-emblem{flex:none;width:68px;height:68px;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(150deg,color-mix(in srgb,var(--rc) 25%,var(--surface)),color-mix(in srgb,var(--rc) 55%,var(--surface)));box-shadow:0 10px 22px -12px var(--rc),inset 0 1px 0 rgba(255,255,255,.6)}
.gc-emblem span{font-size:30px;line-height:1}.gc-emblem b{font:800 12.5px var(--f-head);margin-top:2px}
.gc-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.gc-name{font-size:17px}
.gc-bar{height:10px;border-radius:99px;background:var(--fill);overflow:hidden}
.gc-bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,color-mix(in srgb,var(--rc) 60%,#fff),var(--rc));box-shadow:0 0 10px var(--rc)}
.gc-lv{height:4px;border-radius:99px;background:var(--fill);overflow:hidden;opacity:.7}.gc-lv i{display:block;height:100%;background:var(--muted)}
.gc-meta{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.gc-side{display:flex;flex-direction:column;align-items:stretch;gap:6px;flex:none}
.gc-stat{text-align:center;padding:4px 10px;border-radius:12px;background:var(--surface-2)}
.gc-stat b{display:block;font:800 18px var(--f-head)}.gc-stat small{font-size:11px;color:var(--muted)}
.gc-stat.coin b{color:#C78A00}
.stu-hall{margin-bottom:14px}
.exm-hall{width:min(680px,100%);margin-top:16px}
/* ร้าน */
.shop-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.shop-coins{font:800 22px var(--f-head);padding:4px 14px;border-radius:99px;background:linear-gradient(180deg,#FFF3C4,#FFD54A);color:#7A4F00;box-shadow:0 6px 16px -8px rgba(245,180,0,.9)}
.shop-sec{margin-top:12px}
.shop-h{font:700 14px var(--f-head);margin-bottom:6px}
.shop-h.rare{color:#2F74E8}.shop-h.epic{color:#7C3AED}.shop-h.legendary{color:#C47F00}.shop-h.mythic{background:linear-gradient(90deg,#FF5E62,#60A5FA,#A78BFA);-webkit-background-clip:text;background-clip:text;color:transparent}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.shop-item{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:12px;border-radius:16px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.shop-item.owned{box-shadow:inset 0 0 0 2px var(--ok)}
.shop-item.locked{opacity:.6}
.si-meta{font-size:12px;color:var(--muted)}
.help-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.help-grid h4{font:700 15px var(--f-head);margin:0 0 6px}
.hr-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.rk-row .rk{font-size:13px}

/* ---------- ติดตามนักเรียน ---------- */
.risk-card .card-h{padding:14px 18px}
.risk-sum{display:flex;gap:8px;padding:12px 18px 4px}
.risk-sum div{padding:6px 14px;border-radius:14px;background:var(--accent-soft);color:var(--accent);text-align:center}
.risk-sum div.bad{background:var(--danger-soft);color:var(--danger)}
.risk-sum b{display:block;font:800 22px var(--f-head)}.risk-sum small{font-size:12px}
.risk-mini{padding:6px 12px 14px}
.rm-row{display:flex;align-items:center;gap:8px;padding:8px 6px;border-bottom:1px solid var(--line);font-size:14px}
.rm-row:last-child{border-bottom:0}
.rm-dot{width:9px;height:9px;border-radius:50%;flex:none}.rm-dot.high{background:var(--danger)}.rm-dot.mid{background:var(--orange)}.rm-dot.low{background:var(--primary)}
.rm-nm{color:var(--muted)}.rm-r{font-size:12.5px;color:var(--muted);text-align:right}
.risk-cfg{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:14px 18px;margin-bottom:14px}
.risk-cfg label{display:inline-flex;align-items:center;gap:6px;font-size:14px}
.risk-cfg .input{width:70px;padding:6px 8px;text-align:center}
.rc-t{font-weight:700}
.rc-att{padding:6px 10px;border-radius:12px;background:var(--fill)}.rc-att.on{background:var(--primary-soft)}
.rk-chips{display:flex;flex-wrap:wrap;gap:4px}
.rk-chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12.5px;font-weight:500}
.rk-chip.miss{background:var(--accent-soft);color:var(--accent)}.rk-chip.score{background:var(--danger-soft);color:var(--danger)}
.rk-chip.exam{background:var(--primary-soft);color:var(--primary)}.rk-chip.att{background:rgba(128,72,232,.12);color:#7C3AED}
.rd-sec ul{margin:6px 0 0;padding-left:20px}

/* ---------- ประกาศ ---------- */
.ann-t{display:flex;gap:14px;align-items:flex-start;padding:16px 18px}
.ann-t.off{opacity:.6}
.ann-e{font-size:28px;line-height:1;flex:none}
.ann-b{flex:1;min-width:0}.ann-b p{margin:4px 0;white-space:pre-wrap}
.ann-a{display:flex;gap:4px}
.ann-t.warn{box-shadow:var(--shadow),inset 4px 0 0 var(--orange)}.ann-t.urgent{box-shadow:var(--shadow),inset 4px 0 0 var(--danger)}.ann-t.fun{box-shadow:var(--shadow),inset 4px 0 0 var(--green)}.ann-t.info{box-shadow:var(--shadow),inset 4px 0 0 var(--primary)}
.tone-pick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tone{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px;border-radius:16px;background:var(--fill);cursor:pointer;font-weight:600;font-size:13.5px}
.tone input{position:absolute;opacity:0}.tone span{font-size:24px}
.tone:has(input:checked){background:var(--primary-soft);box-shadow:inset 0 0 0 2px var(--primary)}
.ann-stu{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.ann-s{position:relative;display:flex;gap:12px;align-items:flex-start;padding:12px 40px 12px 14px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow);animation:rise .5s cubic-bezier(.2,.9,.25,1)}
.ann-s.info{box-shadow:var(--shadow),inset 4px 0 0 var(--primary)}.ann-s.warn{background:color-mix(in srgb,var(--orange) 10%,var(--surface));box-shadow:var(--shadow),inset 4px 0 0 var(--orange)}
.ann-s.urgent{background:color-mix(in srgb,var(--danger) 10%,var(--surface));box-shadow:var(--shadow),inset 4px 0 0 var(--danger)}.ann-s.urgent .ann-e{animation:crown 1.2s ease-in-out infinite}
.ann-s.fun{background:color-mix(in srgb,var(--green) 10%,var(--surface));box-shadow:var(--shadow),inset 4px 0 0 var(--green)}
.ann-s .ann-b b{font:700 15.5px var(--f-head)}.ann-s small{color:var(--muted);font-size:12px}
.ann-x{position:absolute;top:8px;right:8px;width:28px;height:28px;border:0;border-radius:50%;background:var(--fill);color:var(--muted);cursor:pointer;display:grid;place-items:center}
.ann-x svg{width:14px;height:14px}

/* ---------- คลังข้อสอบ ---------- */
.qb-units{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-bottom:14px}
.qb-unit{text-align:left;border:0;border-radius:18px;padding:14px 16px;background:var(--surface);box-shadow:var(--shadow);cursor:pointer;color:var(--ink);font:inherit;display:flex;flex-direction:column;gap:2px;transition:transform .2s}
.qb-unit:hover{transform:translateY(-2px)}.qb-unit.on{box-shadow:var(--shadow),inset 0 0 0 2px var(--primary)}
.qb-unit b{font:700 15px var(--f-head)}.qb-unit small{color:var(--muted);font-size:12px}
.qb-list{display:flex;flex-direction:column}
.qb-item{padding:14px 20px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:4px 12px}
.qb-tags{grid-column:1;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.qb-p{grid-column:1;font-weight:500}
.qb-c{grid-column:1;display:flex;gap:4px 14px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.qb-c .ok{color:var(--ok);font-weight:700}
.qb-a{grid-column:2;grid-row:1/span 3;display:flex;gap:4px;align-items:center}
.qb-draw{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
textarea.mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:13.5px}

/* ---------- แกลเลอรี ---------- */
.gal-page{width:min(1100px,100%)}
.gal-hero{text-align:center;margin-bottom:14px}.gal-hero h2{font:700 28px var(--f-head);margin:0 auto}.gal-hero p{color:var(--muted)}
.gal-lv{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.gal-card{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;transition:transform .25s,box-shadow .25s}
.gal-card:hover{transform:translateY(-3px);box-shadow:var(--shadow),0 18px 40px -18px rgba(16,24,48,.35)}
.gal-open{border:0;padding:0;background:none;cursor:zoom-in;display:block;width:100%}
.gal-cover{aspect-ratio:4/3;background:var(--surface-2);display:grid;place-items:center;position:relative;overflow:hidden}
.gal-cover img,.gal-cover video{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.gal-card:hover .gal-cover img{transform:scale(1.05)}
.gal-cover .play{position:absolute;width:48px;height:48px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;display:grid;place-items:center;font-size:18px}
.gal-cover.doc span,.gal-cover.link svg{font-size:44px;width:44px;height:44px}
.gal-cover.doc small,.gal-cover.link span{position:absolute;bottom:10px;font-size:12px;color:var(--muted);max-width:90%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gal-b{padding:12px 14px 4px;display:flex;flex-direction:column;gap:2px}.gal-b b{font:700 15px var(--f-head)}
.gal-f{display:flex;align-items:center;justify-content:space-between;padding:4px 10px 12px 14px}
.gal-like{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:99px;padding:6px 12px;background:var(--fill);color:var(--muted);font:600 14px var(--f-body);cursor:pointer;transition:transform .2s}
.gal-like svg{width:18px;height:18px}
.gal-like.on{background:rgba(229,56,59,.12);color:#E5383B}.gal-like.on svg{fill:#E5383B}
.gal-like.pop{animation:saved-pop .45s cubic-bezier(.2,1.6,.4,1)}
.gal-view{display:flex;flex-direction:column;gap:10px}
.gal-view img,.gal-view video{width:100%;border-radius:16px;max-height:70vh;object-fit:contain;background:var(--surface-2)}
.gal-cap{padding:10px 14px;border-radius:14px;background:var(--primary-soft);font-weight:500}

/* ---------- มือถือ ---------- */
[data-device=mobile] .dash-duo{grid-template-columns:1fr}
[data-device=mobile] .podium{grid-template-columns:repeat(3,1fr);gap:8px 6px;padding:22px 10px 10px}
[data-device=mobile] .pq.p4,[data-device=mobile] .pq.p5{min-height:0;padding:22px 6px 10px}
[data-device=mobile] .pq{padding:26px 4px 10px}
[data-device=mobile] .pq-medal{font-size:32px;top:-18px}
[data-device=mobile] .pq.p1{min-height:180px}[data-device=mobile] .pq.p2{min-height:160px}[data-device=mobile] .pq.p3{min-height:148px}
[data-device=mobile] .pq-name{font-size:13px}
[data-device=mobile] .podium>.pq.p4{order:4}[data-device=mobile] .podium>.pq.p5{order:5}
[data-device=mobile] .podium>.pq.p2{order:1}[data-device=mobile] .podium>.pq.p1{order:2}[data-device=mobile] .podium>.pq.p3{order:3}
[data-device=mobile] .gcard{flex-wrap:wrap}
[data-device=mobile] .gc-side{flex-direction:row;width:100%}
[data-device=mobile] .gc-side>*{flex:1}
[data-device=mobile] .help-grid,[data-device=mobile] .qb-draw,[data-device=mobile] .tone-pick{grid-template-columns:1fr 1fr}
[data-device=mobile] .gal-grid{grid-template-columns:1fr 1fr;gap:10px}
@media (prefers-reduced-motion:reduce){.crown,.gname.g9,.rk.g9,.ttl.legendary,.ttl.mythic,.pq.p1::after{animation:none!important}}
.qb-pick{display:flex;flex-wrap:wrap;gap:6px}.qb-pick .check{flex:none;white-space:nowrap;max-width:100%}
.gal-ph{font-size:44px;opacity:.5;position:absolute;z-index:0}.gal-cover img{position:relative;z-index:1}
.gc-stat small{white-space:nowrap}
[data-device=mobile] .gc-side{align-items:stretch}
[data-device=mobile] .gc-side>.btn{align-self:center;height:auto;min-height:44px;border-radius:14px}
.pq .gname,.pq .ttl{white-space:normal;word-break:break-word}.pq .ttl{font-size:11px}
.pr-xp{white-space:nowrap}
[data-device=mobile] .podium{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:26px 6px}
[data-device=mobile] .podium>.pq{width:calc(33.3% - 4px)}

/* ---------- นักเรียน: แท็บ Ranking / ร้านค้า ---------- */
.stu-tabs{max-width:100%;overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap}
.stu-tabs::-webkit-scrollbar{display:none}.stu-tabs button{white-space:nowrap;flex:none}
.gparts{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:12px;margin-bottom:12px}
.gparts.in-modal{padding:0;margin:12px 0 0;box-shadow:none;background:none}
.gp{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 4px;border-radius:14px;background:var(--surface-2)}
.gp span{font-size:20px}.gp small{font-size:12px;color:var(--muted)}.gp b{font:800 17px var(--f-head)}
.rank-2col{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.ladder{padding:6px 14px 12px}
.ld-row{display:flex;align-items:center;gap:8px;padding:7px 6px;border-bottom:1px dashed var(--line);font-size:14px}
.ld-row:last-child{border-bottom:0}.ld-row.done{opacity:.6}
.ld-row.now{background:var(--primary-soft);border-radius:12px;border-bottom-color:transparent}
.gb-h{font:700 14px var(--f-head);margin:14px 0 4px}
.pos{color:var(--ok)}.neg{color:var(--danger)}
.shop-card{padding:16px 18px}
.shop-now{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;border-radius:14px;background:var(--surface-2);margin:6px 0 4px}
.shop-coins.sm{font-size:15px;padding:2px 10px}
/* ---------- ครู: หน้า Ranking ---------- */
.rk-note{padding:12px 16px;margin-bottom:12px;background:var(--accent-soft)}
.rk-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.rk-q{width:200px}
.rk-stats{display:flex;gap:6px;flex-wrap:wrap}.rk-stats span{padding:6px 12px;border-radius:99px;background:var(--surface);box-shadow:var(--shadow);font-size:13.5px}
.rk-hall{margin-bottom:12px}
.rk-bulk{position:sticky;top:8px;z-index:5;display:flex;align-items:center;gap:8px;padding:10px 14px;margin-bottom:10px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);font-size:14px}
.rk-bulk.on{background:var(--primary-soft);box-shadow:var(--shadow),inset 0 0 0 2px var(--primary)}
.rk-tbl td,.rk-tbl th{white-space:nowrap}.rk-tbl td:nth-child(5){white-space:normal;min-width:240px}
.rk-tbl .ck{width:34px}.rk-tbl tr.sel td{background:var(--primary-soft)}
.rk-no{display:inline-grid;place-items:center;min-width:28px;height:28px;border-radius:50%;font:800 13px var(--f-head);background:var(--fill)}
.rk-no.n1{background:linear-gradient(150deg,#FFF3B0,#F5B300);color:#5A3B00}.rk-no.n2{background:linear-gradient(150deg,#fff,#AEB7C4);color:#333}.rk-no.n3{background:linear-gradient(150deg,#FFE3CC,#CF7436);color:#4A2208}
.rk-lv{margin-left:6px}
.rk-act{display:flex;gap:4px}
.rk-reasons{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.rk-rs{display:flex;align-items:center;gap:6px;border:0;border-radius:14px;padding:9px 10px;background:var(--fill);color:var(--ink);font:500 13.5px var(--f-body);cursor:pointer;text-align:left}
.rk-rs span{font-size:18px}.rk-rs b{margin-left:auto;color:var(--ok)}.rk-rs.neg b{color:var(--danger)}
.rk-rs.on{background:var(--primary-soft);box-shadow:inset 0 0 0 2px var(--primary)}
.rk-sm-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:17px}
.rk-sm-xp{font:800 20px var(--f-head)}
.rk-quick{display:flex;flex-wrap:wrap;gap:6px}
.btn.danger-soft{background:var(--danger-soft);color:var(--danger)}
.rk-hist{max-height:240px;overflow:auto}
.rk-rules{display:grid;grid-template-columns:1fr 1fr;gap:6px 22px}
.rk-rules h4{font:700 14px var(--f-head);margin:10px 0 4px}
.rk-rule{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:14px}.rk-rule span{flex:1}.rk-rule .input{width:84px;text-align:center;padding:6px}
.rk-calc{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--primary-soft);font-size:14px;line-height:1.7}
[data-device=mobile] .gparts{grid-template-columns:repeat(3,1fr)}
[data-device=mobile] .rank-2col,[data-device=mobile] .rk-rules{grid-template-columns:1fr}
[data-device=mobile] .rk-reasons{grid-template-columns:1fr 1fr}
[data-device=mobile] .rk-q{width:100%}
@media (prefers-reduced-motion:reduce){.crown,.cw-tw,.cw-glint{animation:none!important}}
.rk-bar .input{width:auto;min-width:0}.rk-bar .rk-q{width:200px}[data-device=mobile] .rk-bar .rk-q{width:100%}
.shop-coins{white-space:nowrap}
[data-device=mobile] .rk-tbl td:nth-child(n+6):nth-child(-n+10){display:none}
[data-device=mobile] .rk-tbl td:nth-child(5){min-width:0}
[data-device=mobile] .rk-tbl td.num{width:auto}

/* =====================================================================
   เฟส 8.1: คำทักทายเด่น · ชิปข้อมูลนักเรียน · รูปโปรไฟล์ตามยศ · ชื่อบนป้ายทำเนียบ
   ===================================================================== */
/* คำทักทาย (หน้านักเรียน + แดชบอร์ดครู) */
h2.hello{font-size:40px!important;line-height:1.15!important;font-weight:800!important;letter-spacing:-.02em;width:auto!important;
  background:none!important;-webkit-text-fill-color:initial!important;color:inherit!important;text-shadow:none!important;filter:none!important}
h2.hello .hello-t{display:inline;background:linear-gradient(100deg,#0B3F86 0%,#1462D6 50%,#0F8FC8 100%);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;-webkit-box-decoration-break:clone;box-decoration-break:clone;
  filter:drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 14px rgba(40,120,255,.5));animation:hello-glow 3.2s ease-in-out infinite}
h2.hello .hello-s{font-size:.6em;font-weight:700;letter-spacing:0}
h2.hello .wave{display:inline-block;transform-origin:70% 75%;animation:wave 2.4s ease-in-out infinite}
[data-theme=dark] h2.hello .hello-t{background:linear-gradient(180deg,#FFFBE0 0%,#FFE066 45%,#FFB21A 100%);-webkit-background-clip:text;background-clip:text;
  filter:drop-shadow(0 0 6px rgba(255,214,10,.8)) drop-shadow(0 0 22px rgba(255,170,0,.55));animation-name:hello-glow-d}
@keyframes hello-glow{0%,100%{filter:drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 10px rgba(40,120,255,.35))}50%{filter:drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 22px rgba(255,190,40,.75))}}
@keyframes hello-glow-d{0%,100%{filter:drop-shadow(0 0 5px rgba(255,214,10,.7)) drop-shadow(0 0 16px rgba(255,170,0,.4))}50%{filter:drop-shadow(0 0 9px rgba(255,224,60,1)) drop-shadow(0 0 30px rgba(255,170,0,.7))}}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(16deg)}20%,40%{transform:rotate(-8deg)}}
.hero-txt h2.hello{font-size:44px!important}
[data-device=mobile] h2.hello{font-size:32px!important}[data-device=mobile] .hero-txt h2.hello{font-size:34px!important}

/* ชิปข้อมูลนักเรียน: อันดับ · ยศ · ฉายา · เหรียญ */
.gchip-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px;padding:6px 8px;border:0;border-radius:16px;cursor:pointer;font:inherit;text-align:left;
  background:rgba(255,255,255,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 6px 18px -10px rgba(20,30,70,.5),inset 0 0 0 1px rgba(255,255,255,.8);transition:transform .2s}
.gchip-row:hover{transform:translateY(-1px)}
[data-theme=dark] .gchip-row{background:rgba(20,24,40,.7);box-shadow:0 6px 18px -10px #000,inset 0 0 0 1px rgba(255,255,255,.1)}
.gchip-row .rk,.gchip-row .ttl{font-size:13px;padding-top:2px;padding-bottom:2px}
.pill.gchip,.pill.gcoin{display:inline-flex;align-items:center;gap:4px;font-weight:700;border:0!important;background:linear-gradient(135deg,#FFF3C4,#FFD54A)!important;box-shadow:0 4px 14px -6px rgba(245,180,0,.8)!important}
.pill.gchip .gx,.pill.gcoin{color:#5A3B00!important}
.gchip .crown{font-size:14px}
.ttl-none{font-size:12px;color:var(--muted)}

/* รูปโปรไฟล์ = ภาพประจำยศ ไม่มีพื้นหลัง */
.ava.rv-e{position:relative;width:76px!important;height:76px!important;flex:none;display:grid;place-items:center;transform:none!important;
  background:none!important;box-shadow:none!important;border:0!important;border-radius:0!important;overflow:visible;--gc:rgba(140,150,170,.45)}
.ava.rv-e span{font-size:62px;line-height:1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25)) drop-shadow(0 0 10px var(--gc));animation:av-bob 3.2s ease-in-out infinite}
.ava.rv-e.wait span{width:40px;height:40px;border-radius:50%;background:var(--fill);animation:none;filter:none}
.ava.rv-e.g1{--gc:rgba(80,200,100,.55)}.ava.rv-e.g2{--gc:rgba(40,210,190,.55)}.ava.rv-e.g3{--gc:rgba(80,140,255,.6)}.ava.rv-e.g4{--gc:rgba(110,110,255,.65)}
.ava.rv-e.g5{--gc:rgba(150,100,255,.7)}.ava.rv-e.g6{--gc:rgba(255,140,60,.75)}.ava.rv-e.g7{--gc:rgba(255,70,110,.8)}.ava.rv-e.g8{--gc:rgba(255,196,0,.9)}.ava.rv-e.g9{--gc:rgba(190,140,255,.95)}
/* ยศสูง: แสงเรืองเป็นจังหวะ */
.ava.rv-e:is(.g6,.g7,.g8,.g9) span{animation:av-bob 3.2s ease-in-out infinite,av-pulse 2.4s ease-in-out infinite}
@keyframes av-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes av-pulse{0%,100%{filter:drop-shadow(0 4px 6px rgba(0,0,0,.25)) drop-shadow(0 0 8px var(--gc))}50%{filter:drop-shadow(0 4px 6px rgba(0,0,0,.25)) drop-shadow(0 0 22px var(--gc)) drop-shadow(0 0 36px var(--gc))}}
[data-device=mobile] .ava.rv-e{width:64px!important;height:64px!important}[data-device=mobile] .ava.rv-e span{font-size:52px}
@media (prefers-reduced-motion:reduce){.ava.rv-e span{animation:none!important}}

/* ชื่อบนป้ายทำเนียบ 1–5: ใหญ่ ขาว เรืองแสงตามสียศ */
.pq-name{font-size:17px!important;line-height:1.3;margin:2px 0}
.pq .gname{font-weight:800;letter-spacing:-.01em}
.pq .gname:is(.g0,.g1,.g2,.g3,.g4,.g5,.g6,.g7){color:#fff!important;text-shadow:0 0 6px var(--gl,rgba(255,255,255,.5)),0 0 16px var(--gl,rgba(255,255,255,.25)),0 1px 2px rgba(0,0,0,.6)}
.pq .gname.g0{--gl:rgba(200,210,225,.6)}.pq .gname.g1{--gl:rgba(110,220,130,.8)}.pq .gname.g2{--gl:rgba(70,225,205,.8)}.pq .gname.g3{--gl:rgba(110,170,255,.9)}
.pq .gname.g4{--gl:rgba(150,150,255,.9)}.pq .gname.g5{--gl:rgba(190,150,255,.9)}.pq .gname.g6{--gl:rgba(255,160,80,.9)}.pq .gname.g7{--gl:rgba(255,100,130,.9)}
.pq .gname.g8{filter:drop-shadow(0 0 6px rgba(255,200,0,.9)) drop-shadow(0 0 14px rgba(255,170,0,.6))}
.pq .gname.g9{filter:drop-shadow(0 0 7px rgba(190,150,255,1)) drop-shadow(0 0 16px rgba(255,120,200,.6))}
.pq.p1 .pq-name{font-size:20px!important}
.pq.p1 .gname:is(.g0,.g1,.g2,.g3,.g4,.g5,.g6,.g7){color:#FFF6CF!important}
[data-device=mobile] .pq-name{font-size:14.5px!important}[data-device=mobile] .pq.p1 .pq-name{font-size:16px!important}
.pod-rest .gname{font-size:15.5px;font-weight:700}
@media (prefers-reduced-motion:reduce){h2.hello .hello-t,h2.hello .wave{animation:none!important}}
/* หน้า Ranking: เลือกห้องก่อน */
.rk-pick{margin-bottom:12px}
.rk-pick .card-h{flex-wrap:wrap;gap:8px}
.rk-rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;padding:4px 18px 18px}
.rk-room{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 14px;border:0;border-radius:16px;background:var(--surface-2);color:var(--ink);font:inherit;text-align:left;cursor:pointer;box-shadow:inset 0 0 0 1px var(--line);transition:transform .15s}
.rk-room:hover{transform:translateY(-2px)}
.rk-room b{font:700 17px var(--f-head)}.rk-room small{font-size:12px;color:var(--muted)}
.rk-room-top{font-size:12.5px;margin-top:4px;padding:2px 8px;border-radius:99px;background:var(--surface)}
.rk-room.on{background:var(--primary-soft);box-shadow:inset 0 0 0 2px var(--primary)}
.rk-room.all{background:transparent;box-shadow:inset 0 0 0 1.5px dashed var(--line);border:1.5px dashed var(--line)}
.rk-empty{padding:30px}
.rk-pager{display:flex;align-items:center;justify-content:center;gap:12px;padding:12px;font-size:14px;color:var(--muted)}
[data-device=mobile] .rk-rooms{grid-template-columns:1fr 1fr;padding:4px 12px 14px}

/* =====================================================================
   แบรนด์: โลโก้ตราทอง-กรมท่า + ชื่อเว็บตัวอักษรอาลักษณ์ (Trirong)
   ===================================================================== */
.brand-mark{width:46px!important;height:46px!important;padding:0!important;border-radius:13px!important;background:none!important;transform:none!important;flex:none;
  box-shadow:0 8px 18px -8px rgba(10,15,51,.75),0 0 0 1px rgba(201,142,26,.25)!important;overflow:hidden;display:grid;place-items:center}
.brand-mark .logo{width:100%;height:100%;display:block}
.brand-mark.sm{width:36px!important;height:36px!important;border-radius:10px!important}
.brand-mark::after{content:'';position:absolute}
.brand b{font-family:'Trirong',Anuphan,serif!important;font-weight:700!important;font-size:19px!important;letter-spacing:.01em;line-height:1.5!important;padding-top:.15em;margin-top:-.15em;display:block;
  background:linear-gradient(180deg,#1E2A78 0%,#16205A 55%,#0A0F33 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent!important;text-shadow:none!important;
  filter:drop-shadow(0 1px 0 rgba(255,255,255,.8))}
.brand small{display:flex;align-items:center;gap:6px;font-size:11.5px!important;letter-spacing:.04em;color:#A07A1E!important;font-weight:500}
.brand small::before{content:'';width:14px;height:1.5px;border-radius:2px;background:linear-gradient(90deg,transparent,#C98E1A)}
[data-theme=dark] .brand b{background:linear-gradient(180deg,#FFF6CF 0%,#F4C84A 55%,#C98E1A 100%)!important;-webkit-background-clip:text!important;background-clip:text!important;
  -webkit-text-fill-color:transparent;color:transparent!important;filter:drop-shadow(0 0 6px rgba(255,200,60,.45))!important;text-shadow:none!important}
[data-theme=dark] .brand small{color:#D9B866!important}
.side .brand{gap:12px}
.present-card .brand b{font-size:24px!important}
.rk-room-top.risk-h{background:var(--danger-soft);color:var(--danger)}
/* มุมซ้าย-ขวาหน้านักเรียน: ท็อป 5 */
.stu-rails{width:min(680px,100%);display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.stu-rail{border-radius:22px;padding:14px 12px 12px;background:linear-gradient(175deg,#26306A,#151A3A 75%);color:#EEF1FA;box-shadow:0 16px 34px -18px rgba(16,20,48,.8),inset 0 0 0 1px rgba(255,215,90,.28);
  --g0:#C3CAD6;--g1:#7BE08A;--g2:#4FE3CF;--g3:#86B6FF;--g4:#A2A6FF;--g5:#C4A4FF;--g6:#FFAA66;--g7:#FF7590}
.rail-h{display:flex;align-items:center;gap:10px;padding:0 4px 10px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:6px}
.rail-h>span{font-size:26px;filter:drop-shadow(0 0 8px rgba(255,210,80,.6))}
.rail-h b{display:block;font:800 16px var(--f-head);background:linear-gradient(180deg,#FFF6CF,#F4C84A 60%,#D99A1E);-webkit-background-clip:text;background-clip:text;color:transparent}
.rail-h small{font-size:11.5px;color:#AEB6CF}
.rail-row{display:flex;align-items:center;gap:8px;padding:8px 6px;border-radius:14px}
.rail-row+.rail-row{margin-top:2px}
.rail-row.p1{background:linear-gradient(90deg,rgba(255,200,40,.22),rgba(255,200,40,.04));box-shadow:inset 0 0 0 1px rgba(255,210,80,.45)}
.rail-row.p2{background:rgba(220,228,240,.08)}.rail-row.p3{background:rgba(230,140,70,.1)}
.rail-row.me{box-shadow:inset 0 0 0 2px #6FA8FF}
.rail-md{width:28px;flex:none;text-align:center;font-size:22px;line-height:1}
.rail-md i{font:800 13px var(--f-head);font-style:normal;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.12);color:#D8DEEE}
.rail-b{flex:1;min-width:0}
.rail-n{font-size:15px;line-height:1.25}.rail-n .ntag{gap:4px;flex-wrap:nowrap}.rail-n .ttl{display:none}
.rail-n .gname:is(.g0,.g1,.g2,.g3,.g4,.g5,.g6,.g7){color:#fff!important;text-shadow:0 0 8px var(--gl,rgba(255,255,255,.35))}
.rail-n .gname{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail-n .gname.g8{filter:drop-shadow(0 0 5px rgba(255,200,0,.9))}.rail-n .gname.g9{filter:drop-shadow(0 0 6px rgba(190,150,255,1))}
.rail-b small{display:block;font-size:11.5px;color:#AEB6CF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail-xp{font:800 15px var(--f-head);text-align:right;line-height:1.1;color:#FFE27A}.rail-xp small{display:block;font-size:10px;color:#AEB6CF;font-weight:500}
.rail-row.p1 .rail-xp{font-size:17px;text-shadow:0 0 10px rgba(255,200,40,.7)}
.rail-empty{padding:16px;text-align:center;color:#AEB6CF;font-size:13px}
.rail-more{display:block;width:100%;margin-top:8px;border:0;border-radius:12px;padding:8px;background:rgba(255,255,255,.08);color:#FFE27A;font:600 13px var(--f-body);cursor:pointer}
.rail-more:hover{background:rgba(255,255,255,.14)}
/* จอกว้าง: ปักไว้มุมซ้าย-ขวา */
@media (min-width:1400px){
  [data-device=pc] .stu-rails{display:contents}
  [data-device=pc] .stu-rail{position:fixed;top:96px;width:clamp(230px,calc((100vw - 860px)/2 - 48px),300px);z-index:4;max-height:calc(100vh - 120px);overflow:auto;animation:rail-in .6s cubic-bezier(.2,.9,.25,1) both}
  [data-device=pc] .stu-rail.l{left:max(20px,calc(50% - 410px - 24px - clamp(230px,calc((100vw - 860px)/2 - 48px),300px)))}
  [data-device=pc] .stu-rail.r{right:max(20px,calc(50% - 410px - 24px - clamp(230px,calc((100vw - 860px)/2 - 48px),300px)))}
}
@keyframes rail-in{from{opacity:0;transform:translateY(12px)}}
[data-device=mobile] .stu-rails{grid-template-columns:1fr}
.miss-rk{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:800 13px var(--f-head);background:var(--fill);color:var(--muted)}
.miss:nth-child(1) .miss-rk{background:var(--danger);color:#fff}.miss:nth-child(2) .miss-rk,.miss:nth-child(3) .miss-rk{background:var(--danger-soft);color:var(--danger)}
.miss-more{display:block;padding:10px 6px 4px;font-size:13px;color:var(--primary);text-decoration:none}

/* =====================================================================
   เฟส 9.1: โทน Ranking สีทองอบอุ่น (ไม่มีสีม่วง) · โพเดียมไล่ขนาด · มงกุฎเฉพาะ 1–3
   ===================================================================== */
/* สียศใหม่: เทา → เขียว → เขียวน้ำทะเล → ฟ้า → น้ำเงิน → น้ำตาลทอง → ส้ม → แดง → ทองเรืองแสง → เปลวไฟเรืองแสง */
:root{--g4:#2563EB;--g5:#A16207}
[data-theme=dark]{--g4:#6FA0FF;--g5:#E0A64A}
.gname.g9{background:linear-gradient(90deg,#E8341C,#FF8A00,#FFC83D,#FF8A00,#E8341C)!important;background-size:300% 100%!important;-webkit-background-clip:text!important;background-clip:text!important;
  filter:drop-shadow(0 0 6px rgba(255,140,0,.75))!important}
.rk.g9{background:linear-gradient(90deg,#E8341C,#FF8A00,#FFC83D,#FF8A00,#E8341C)!important;background-size:300% 100%!important;box-shadow:0 0 12px rgba(255,140,0,.7)!important}
.gcard.g9{--rc:#FF8A00}.ava.rv-e.g4{--gc:rgba(37,99,235,.6)}.ava.rv-e.g5{--gc:rgba(200,140,40,.7)}.ava.rv-e.g9{--gc:rgba(255,140,0,.95)}
.ttl.epic{background:linear-gradient(135deg,rgba(16,185,129,.16),rgba(14,165,233,.12))!important;color:#047857!important;box-shadow:inset 0 0 0 1px rgba(16,185,129,.45)!important}
[data-theme=dark] .ttl.epic{color:#6EE7B7!important}
.ttl.mythic{background:linear-gradient(90deg,#E8341C,#FF8A00,#FFC83D,#FF8A00,#E8341C)!important;background-size:300% 100%!important;box-shadow:0 0 12px rgba(255,140,0,.7)!important}
.shop-h.epic{color:#047857}.shop-h.mythic{background:linear-gradient(90deg,#E8341C,#FF8A00,#E0A800)!important;-webkit-background-clip:text!important;background-clip:text!important}

/* มงกุฎ 1–3 ใหญ่ขึ้นเล็กน้อย */
.crown.k1{width:2em;height:1.6em}.crown.k2,.crown.k3{width:1.75em;height:1.4em}
.crown.k2{animation-name:cw-glow2s}.crown.k3{animation-name:cw-glow3b}
@keyframes cw-glow2s{0%,100%{filter:drop-shadow(0 0 2px rgba(200,210,225,.7))}50%{filter:drop-shadow(0 0 9px rgba(225,232,242,1))}}
@keyframes cw-glow3b{0%,100%{filter:drop-shadow(0 0 2px rgba(230,150,80,.6))}50%{filter:drop-shadow(0 0 9px rgba(240,160,90,1))}}

/* ทำเนียบ: พื้นครีมทอง */
.hall{background:linear-gradient(180deg,#FFF6D8 0%,#FFFBEE 38%,var(--surface) 100%)!important;box-shadow:var(--shadow),inset 0 0 0 1px rgba(224,168,0,.25)!important}
[data-theme=dark] .hall{background:linear-gradient(180deg,#2B2312 0%,#1E1A12 45%,var(--surface) 100%)!important;box-shadow:var(--shadow),inset 0 0 0 1px rgba(224,168,0,.25)!important}
.hall-h h3{color:#7A5200}[data-theme=dark] .hall-h h3{color:#FFD970}
/* โพเดียมไล่ขนาด: 1 ใหญ่สุด → 2,3 → 4,5 */
.podium{grid-template-columns:.78fr .95fr 1.3fr .95fr .78fr!important;gap:12px!important;padding:34px 18px 16px!important}
.pq{color:#3B2A05!important;background:linear-gradient(175deg,#FFFDF4,#FFF3CF)!important;
  box-shadow:0 10px 24px -16px rgba(150,100,0,.55),inset 0 0 0 1.5px #F0D27A!important;border-radius:18px 18px 12px 12px!important;padding:30px 8px 12px!important}
.pq .pq-meta,.pq .pq-cls{color:#7A6535!important}
.pq .pq-no{background:#F0D27A!important;color:#5A3B00!important;box-shadow:none!important}
.pq .gname,.pq .gname:is(.g0,.g1,.g2,.g3,.g4,.g5,.g6,.g7,.g8,.g9){background:none!important;-webkit-text-fill-color:currentColor!important;color:#2A1D00!important;filter:none!important;animation:none!important;
  text-shadow:0 1px 0 rgba(255,255,255,.9)!important}
.pq .pq-name{font-size:14px!important}
.pq .pq-xp{color:#7A5200;font-size:15px}
.pq .pq-medal{font-size:30px;top:-18px}
.pq .rk{background:rgba(255,255,255,.6)}
.pq.p4,.pq.p5{min-height:150px!important}
.pq.p3{min-height:178px!important;background:linear-gradient(175deg,#FFF4EA,#F8D2B0 70%,#EDB284)!important;box-shadow:0 12px 26px -14px rgba(190,110,40,.6),inset 0 0 0 1.5px #D98A4A,inset 0 2px 0 #fff!important}
.pq.p2{min-height:196px!important;background:linear-gradient(175deg,#FFFFFF,#E9EDF3 70%,#D3DAE4)!important;box-shadow:0 12px 26px -14px rgba(110,120,140,.6),inset 0 0 0 1.5px #AEB7C4,inset 0 2px 0 #fff!important}
.pq.p1{min-height:240px!important;background:radial-gradient(120% 60% at 50% 0%,#FFFBE6,transparent 70%),linear-gradient(175deg,#FFF3B8,#FFDC6A 60%,#F7BE2A)!important;
  box-shadow:0 18px 40px -14px rgba(230,160,0,.75),0 0 0 4px rgba(255,214,90,.25),inset 0 0 0 2px #E0A800,inset 0 3px 0 #FFF7D0!important}
.pq.p2 .pq-name,.pq.p3 .pq-name{font-size:16px!important}
.pq.p1 .pq-name{font-size:22px!important}
.pq.p2 .pq-medal,.pq.p3 .pq-medal{font-size:40px;top:-24px}
.pq.p1 .pq-medal{font-size:56px;top:-34px;filter:drop-shadow(0 6px 10px rgba(180,120,0,.45))}
.pq.p2 .pq-xp,.pq.p3 .pq-xp{font-size:17px}
.pq.p1 .pq-xp{font-size:23px!important;color:#6B4200!important;text-shadow:0 1px 0 rgba(255,255,255,.7)!important}
.pq.p1 .pq-no{background:#B97800!important;color:#FFF6CF!important}
.pq.p1::after{background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.5) 45%,transparent 60%)!important;background-size:250% 100%!important}
[data-theme=dark] .pq.p4,[data-theme=dark] .pq.p5{background:linear-gradient(175deg,#3A3020,#2A2416)!important;color:#FFF1C9!important;box-shadow:inset 0 0 0 1.5px #7A6330!important}
[data-theme=dark] .pq:is(.p4,.p5) .gname{color:#FFF1C9!important;text-shadow:none!important}
[data-theme=dark] .pq:is(.p4,.p5) :is(.pq-meta,.pq-cls){color:#CDBB8E!important}[data-theme=dark] .pq:is(.p4,.p5) .pq-xp{color:#FFD970}
.pod-rest .pr-row{background:#FFF9E8;box-shadow:inset 0 0 0 1px #F3E2A8}
[data-theme=dark] .pod-rest .pr-row{background:#2A2416;box-shadow:inset 0 0 0 1px #4A3E22}
.pr-no{color:#A07A1E}
/* มือถือ: 1 กว้างสุดตรงกลาง */
[data-device=mobile] .podium{padding:40px 8px 12px!important;gap:34px 6px!important}
[data-device=mobile] .podium>.pq.p1{width:calc(40% - 4px)!important}
[data-device=mobile] .podium>.pq.p2,[data-device=mobile] .podium>.pq.p3{width:calc(30% - 4px)!important}
[data-device=mobile] .podium>.pq.p4,[data-device=mobile] .podium>.pq.p5{width:calc(42% - 4px)!important;min-height:0!important}
[data-device=mobile] .pq.p1{min-height:205px!important}[data-device=mobile] .pq.p2{min-height:175px!important}[data-device=mobile] .pq.p3{min-height:165px!important}
[data-device=mobile] .pq.p1 .pq-name{font-size:17px!important}[data-device=mobile] .pq:is(.p2,.p3) .pq-name{font-size:14px!important}
[data-device=mobile] .pq.p1 .pq-medal{font-size:46px;top:-28px}

/* ท็อป 5 ข้างหน้านักเรียน: ครีมทอง */
.stu-rail{background:linear-gradient(175deg,#FFFBEA,#FFF3CC)!important;color:#3B2A05!important;box-shadow:0 16px 34px -20px rgba(150,100,0,.55),inset 0 0 0 1.5px #F0D27A!important;
  --g0:#8A93A3;--g1:#3FA34D;--g2:#0F9E8E;--g3:#0E7DC2;--g4:#2563EB;--g5:#A16207;--g6:#EA6A0C;--g7:#D9183F}
.rail-h{border-bottom-color:rgba(160,120,30,.2)!important}
.rail-h b{background:linear-gradient(180deg,#B97800,#7A4F00)!important;-webkit-background-clip:text!important;background-clip:text!important}
.rail-h small,.rail-b small,.rail-xp small{color:#8A7444!important}

/* =====================================================================

   ===================================================================== */
.ch-wrap{display:grid;grid-template-columns:minmax(280px,360px) 1fr;gap:14px;height:calc(100vh - 210px);min-height:480px}
.ch-side,.ch-pane{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.ch-tools{display:flex;flex-direction:column;gap:8px;padding:12px;border-bottom:1px solid var(--line)}
.ch-tools .seg{align-self:flex-start}
.ch-mine{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.ch-list,.sc-list{flex:1;overflow:auto;padding:6px}
.ch-th{width:100%;display:flex;align-items:center;gap:10px;padding:10px;border:0;border-radius:16px;background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer;transition:background .15s}
.ch-th:hover{background:var(--fill)}.ch-th.on{background:var(--primary-soft)}
.ch-th.new .ch-tl{color:var(--ink);font-weight:600}
.ch-av{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font:700 17px var(--f-head);color:#fff;
  background:linear-gradient(150deg,color-mix(in srgb,var(--c) 70%,#fff),var(--c));box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
