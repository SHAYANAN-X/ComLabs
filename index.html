.ch-ts{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ch-ts i{font-style:normal;font-weight:600}
.ch-tl{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-un{flex:none;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:#FF3B30;color:#fff;font:700 12px var(--f-head);display:grid;place-items:center}
.ch-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--surface) 85%,transparent);backdrop-filter:blur(14px)}
.ch-hn{min-width:0}.ch-hn b{display:block;font:700 16px var(--f-head)}.ch-hn small{font-size:12.5px;color:var(--muted)}
.ch-msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:4px;
  background:radial-gradient(60% 40% at 0% 0%,color-mix(in srgb,var(--primary) 6%,transparent),transparent),radial-gradient(60% 40% at 100% 100%,color-mix(in srgb,#34C759 6%,transparent),transparent)}
.ch-day{text-align:center;margin:10px 0 6px}.ch-day span{font-size:11.5px;color:var(--muted);background:var(--fill);padding:3px 10px;border-radius:99px}
.ch-msg{display:flex;flex-direction:column;max-width:76%;animation:ch-in .25s cubic-bezier(.2,.9,.3,1)}
.ch-msg.me{align-self:flex-end;align-items:flex-end}.ch-msg.them{align-self:flex-start}
.ch-b{padding:9px 14px;border-radius:20px;font-size:15px;line-height:1.45;word-break:break-word}
.ch-msg.me .ch-b{background:linear-gradient(180deg,#2E95FF,#0A7AFF);color:#fff;border-bottom-right-radius:6px;box-shadow:0 4px 12px -6px rgba(10,122,255,.6)}
.ch-msg.them .ch-b{background:var(--surface-2);color:var(--ink);border-bottom-left-radius:6px;box-shadow:inset 0 0 0 1px var(--line)}
.ch-msg.me .ch-b a{color:#fff;text-decoration:underline}
.ch-t{font-size:11px;color:var(--muted);margin:2px 8px 6px}
@keyframes ch-in{from{opacity:0;transform:translateY(6px) scale(.98)}}
.ch-empty{margin:auto;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;color:var(--muted);padding:30px 16px;font-size:13.5px}
.ch-empty b{color:var(--ink);font-size:15px}.ch-empty:first-line{font-size:30px}
.ch-quick{display:flex;gap:6px;overflow-x:auto;padding:8px 12px 0;scrollbar-width:none}.ch-quick::-webkit-scrollbar{display:none}.ch-quick .chip{white-space:nowrap;cursor:pointer;border:0;font:inherit;font-size:12.5px}

/* ---------- นักเรียน: ปุ่มลอย + หน้าต่างแชท ---------- */
#stu-chat{position:fixed;right:20px;bottom:20px;z-index:60;display:flex;flex-direction:column;align-items:flex-end;gap:12px;pointer-events:none}
#stu-chat>*{pointer-events:auto}
.sc-fab{position:relative;width:62px;height:62px;border:0;border-radius:50%;cursor:pointer;display:grid;place-items:center;color:#fff;font-size:22px;
  background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.55),transparent 45%),linear-gradient(160deg,#3FA0FF,#0A6CF0);
  box-shadow:0 14px 30px -10px rgba(10,108,240,.75),inset 0 1px 0 rgba(255,255,255,.7),inset 0 -4px 10px rgba(0,40,120,.3);transition:transform .2s}
.sc-fab:hover{transform:translateY(-2px) scale(1.04)}.sc-fab svg{width:28px;height:28px}
.sc-fab.on{background:linear-gradient(160deg,#8A93A3,#5B6473);font-size:20px}
.sc-badge{position:absolute;top:-2px;right:-2px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:#FF3B30;color:#fff;font:700 12px var(--f-head);display:grid;place-items:center;box-shadow:0 0 0 3px var(--bg,#fff);animation:sc-pop 1.6s ease-in-out infinite}
@keyframes sc-pop{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.sc-tip{position:absolute;right:72px;top:50%;transform:translateY(-50%);white-space:nowrap;font:600 13px var(--f-body);color:var(--ink);background:var(--surface);padding:6px 12px;border-radius:99px;box-shadow:var(--shadow);opacity:0;transition:opacity .2s;pointer-events:none}
.sc-fab:hover .sc-tip{opacity:1}
.sc-panel{width:min(380px,calc(100vw - 24px));height:min(560px,calc(100vh - 120px));display:flex;flex-direction:column;overflow:hidden;border-radius:26px;
  background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);
  box-shadow:0 30px 60px -20px rgba(15,30,70,.5),inset 0 1px 0 rgba(255,255,255,.7),inset 0 0 0 1px var(--line);animation:sc-up .28s cubic-bezier(.2,.9,.3,1)}
@keyframes sc-up{from{opacity:0;transform:translateY(16px) scale(.97)}}
.sc-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.sc-hn b{display:block;font:700 16px var(--f-head)}.sc-hn small{font-size:12px;color:var(--muted)}
.sc-body{flex:1;overflow:auto}
.sc-foot{font-size:11.5px;color:var(--muted);text-align:center;padding:8px 12px 12px}
[data-device=mobile] #stu-chat{right:12px;bottom:12px}

[data-device=mobile] .page-head .sub{display:none}
/* ---------- เฟส 11: ออนไลน์ · บล็อก · ลบข้อความ · รหัสผ่าน ---------- */
.ch-av{position:relative}
.ch-av.on::after{content:'';position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:#34C759;box-shadow:0 0 0 2.5px var(--surface)}
.on-txt{color:#1F9D44;font-weight:600}.on-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#34C759;margin-right:4px;vertical-align:1px;box-shadow:0 0 0 3px rgba(52,199,89,.2)}
.off-txt{color:var(--muted)}
.ch-blk{font-style:normal;font-size:11px;font-weight:600;color:var(--danger);background:var(--danger-soft);padding:1px 6px;border-radius:99px;margin-left:4px}

.sc-panel .ch-blocked{margin:10px 12px 12px}
.ch-row{display:flex;align-items:center;gap:6px}

.ch-del{opacity:0;width:26px;height:26px;border:0;border-radius:50%;background:var(--fill);color:var(--muted);display:grid;place-items:center;cursor:pointer;flex:none;transition:opacity .15s}
.ch-del svg{width:13px;height:13px}.ch-del:hover{background:var(--danger-soft);color:var(--danger)}
.ch-msg:hover .ch-del,.ch-del:focus-visible{opacity:1}
[data-device=mobile] .ch-del{opacity:.55}
.ch-head .btn.sm{flex:none}
[data-device=mobile] .ch-head{flex-wrap:wrap}
.stu-pass-hint{font-size:13px;color:var(--muted);text-align:center}
.linkish{border:0;background:none;padding:0;color:var(--primary);font:inherit;font-weight:600;cursor:pointer;text-decoration:underline}
.pw-state{padding:10px 12px;border-radius:14px;background:var(--accent-soft);color:var(--accent);font-size:13.5px}.pw-state.ok{background:rgba(52,199,89,.14);color:#1F7A3A}
.check-inline{display:flex;align-items:center;gap:6px;font-size:13.5px}
.pw-done{text-align:center}.pw-done div{font-size:44px}
.pw-req{margin-bottom:14px;box-shadow:var(--shadow),inset 4px 0 0 var(--accent)}
.pw-list{padding:4px 14px 14px}
.pw-row{display:flex;align-items:center;gap:8px;padding:10px 6px;border-bottom:1px solid var(--line);flex-wrap:wrap}.pw-row:last-child{border-bottom:0}
.pw-who{flex:1;min-width:200px;display:flex;flex-direction:column}.pw-who small{color:var(--muted);font-size:12.5px}.pw-who i{font-size:13px;color:var(--ink)}
.pw-chip{font-size:14px;margin-right:2px;vertical-align:middle}
/* ---------- เฟส 12: ป๊อบอัพแชทครู · แจ้งเตือนเด้ง ---------- */
#t-chat{position:fixed;right:20px;bottom:20px;z-index:60;display:flex;flex-direction:column;align-items:flex-end;gap:12px;pointer-events:none}
#t-chat>*{pointer-events:auto}
.sc-fab.t{background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.55),transparent 45%),linear-gradient(160deg,#34C759,#16A34A);box-shadow:0 14px 30px -10px rgba(22,163,74,.75),inset 0 1px 0 rgba(255,255,255,.7),inset 0 -4px 10px rgba(0,80,30,.3)}
.sc-fab.t.on{background:linear-gradient(160deg,#8A93A3,#5B6473)}
[data-device=mobile] #t-chat{right:12px;bottom:calc(92px + env(safe-area-inset-bottom))}

[data-device=mobile] #chat-pops{right:12px;bottom:calc(160px + env(safe-area-inset-bottom))}
.chat-pop{position:relative;pointer-events:auto;border-radius:20px;overflow:hidden;
  background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);
  box-shadow:0 20px 40px -16px rgba(15,30,70,.5),inset 0 1px 0 rgba(255,255,255,.7),inset 0 0 0 1px var(--line);animation:cp-in .35s cubic-bezier(.2,1.2,.3,1)}
.chat-pop.out{animation:cp-out .35s ease forwards}
@keyframes cp-in{from{opacity:0;transform:translateX(30px) scale(.96)}}
@keyframes cp-out{to{opacity:0;transform:translateX(30px)}}
.cp-main{display:flex;gap:10px;align-items:flex-start;width:100%;border:0;background:none;padding:12px 36px 12px 12px;text-align:left;font:inherit;color:var(--ink);cursor:pointer}
.cp-b{flex:1;min-width:0;display:flex;flex-direction:column}
.cp-b b{font:700 14.5px var(--f-head)}.cp-b small{font-size:11.5px;color:var(--muted)}
.cp-b span{font-size:13.5px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cp-x{position:absolute;top:8px;right:8px;width:24px;height:24px;border:0;border-radius:50%;background:var(--fill);color:var(--muted);cursor:pointer;font-size:11px}
.chat-pop::before{content:'💬 ข้อความใหม่';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#0A84FF,#34C759);font-size:0}
@media (prefers-reduced-motion:reduce){.chat-pop{animation:none!important}}

/* =====================================================================
   เฟส 12.3: แถบเลื่อนทันสมัย · เมนูข้างแบบพับกลุ่ม · เมนูเพิ่มเติมบนมือถือ
   ===================================================================== */
/* แถบเลื่อน: บาง โค้งมน โปร่งใส เข้มขึ้นเมื่อชี้ */
*{scrollbar-width:thin;scrollbar-color:rgba(100,116,139,.38) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(100,116,139,.32);border-radius:99px;border:3px solid transparent;background-clip:padding-box;min-height:40px}
::-webkit-scrollbar-thumb:hover{background:rgba(10,132,255,.55);background-clip:padding-box;border-width:2px}
::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-button{display:none;width:0;height:0}
[data-theme=dark] *{scrollbar-color:rgba(203,213,225,.28) transparent}
[data-theme=dark] ::-webkit-scrollbar-thumb{background:rgba(203,213,225,.22);background-clip:padding-box}
[data-theme=dark] ::-webkit-scrollbar-thumb:hover{background:rgba(120,180,255,.55);background-clip:padding-box}
/* แถบเลื่อนในกล่องเล็ก (ตาราง แชท เมนู) บางลงอีก */
.tbl-wrap::-webkit-scrollbar,.ch-msgs::-webkit-scrollbar,.ch-list::-webkit-scrollbar,.sc-body::-webkit-scrollbar,.nav-scroll::-webkit-scrollbar,.modal-body::-webkit-scrollbar{width:8px;height:8px}
.nav-scroll{scrollbar-width:none}.nav-scroll::-webkit-scrollbar{display:none}
.side:hover .nav-scroll{scrollbar-width:thin}

/* เมนูข้าง */
.side{gap:2px!important}
.nav-scroll{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:4px;margin:6px -4px 0;padding:0 4px 6px}
.nav-top{display:flex;flex-direction:column;gap:2px;padding-bottom:6px;margin-bottom:2px;border-bottom:1px solid var(--line)}
.nav-sec{border-radius:18px;transition:background .2s}
.nav-sec.open{background:color-mix(in srgb,var(--fill) 55%,transparent)}
.nav-sec-h{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;cursor:pointer;padding:9px 12px;border-radius:14px;font:600 13.5px var(--f-body);color:var(--muted);text-align:left;transition:color .15s,background .15s}
.nav-sec-h:hover{background:var(--fill);color:var(--ink)}
.nav-sec-h svg{width:17px;height:17px;opacity:.8}
.nav-sec-h small{font-size:11px;min-width:20px;height:18px;border-radius:9px;display:grid;place-items:center;background:var(--fill);color:var(--muted)}
.nav-sec.has .nav-sec-h{color:var(--primary)}
.nav-chev{width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .25s;opacity:.6;margin-right:2px}
.nav-sec.open .nav-chev{transform:rotate(45deg) translate(-2px,-2px)}
.nav-sec-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s cubic-bezier(.2,.8,.2,1)}
.nav-sec.open .nav-sec-b{grid-template-rows:1fr}
.nav-sec-b>div{overflow:hidden;display:flex;flex-direction:column;gap:2px;padding:0 4px}
.nav-sec.open .nav-sec-b>div{padding-bottom:6px}
.nav-sec .nav-item{font-size:14.5px;padding:8px 12px 8px 14px}
.nav-sec-h .nav-badge{margin-left:0}
@media (prefers-reduced-motion:reduce){.nav-sec-b,.nav-chev{transition:none}}

/* มือถือ: เมนูเพิ่มเติมจัดเป็นหมวด ไอคอน 4 คอลัมน์ ขนาดเท่ากัน */
.m-sheet{max-height:86dvh;overflow:auto}
.m-sec{margin-top:12px}
.m-sec-h{font:600 12.5px var(--f-body);color:var(--muted);padding:0 4px 6px;letter-spacing:.01em}
.m-grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.m-grid4 a{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 2px 8px;border-radius:16px;color:var(--ink);text-decoration:none;font-size:12px;line-height:1.25;text-align:center;transition:background .15s}
.m-grid4 a:active{background:var(--fill)}
.m-grid4 a.on{background:var(--primary-soft);color:var(--primary);font-weight:600}
.m-ic{position:relative;width:46px;height:46px;border-radius:15px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(160deg,#3FA0FF,#0A6CF0);box-shadow:0 8px 16px -10px rgba(10,108,240,.8),inset 0 1px 0 rgba(255,255,255,.5)}
.m-ic svg{width:22px;height:22px}
.m-ic .nav-badge{position:absolute;top:-5px;right:-7px;margin:0}
.m-sec.g-top .m-ic{background:linear-gradient(160deg,#4ADE80,#16A34A);box-shadow:0 8px 16px -10px rgba(22,163,74,.8),inset 0 1px 0 rgba(255,255,255,.5)}
.m-sec.g-teach .m-ic{background:linear-gradient(160deg,#FFB347,#F07A0A);box-shadow:0 8px 16px -10px rgba(240,122,10,.8),inset 0 1px 0 rgba(255,255,255,.5)}
.m-sec.g-data .m-ic{background:linear-gradient(160deg,#34D399,#059669);box-shadow:0 8px 16px -10px rgba(5,150,105,.8),inset 0 1px 0 rgba(255,255,255,.5)}
.m-sec.g-sys .m-ic{background:linear-gradient(160deg,#94A3B8,#475569);box-shadow:0 8px 16px -10px rgba(71,85,105,.8),inset 0 1px 0 rgba(255,255,255,.5)}
.m-sec .stu-link .m-ic{background:linear-gradient(160deg,#FFD25A,#E0A000);box-shadow:0 8px 16px -10px rgba(224,160,0,.8),inset 0 1px 0 rgba(255,255,255,.5)}
.nav-sec-h>span:not(.nav-badge){flex:1}.nav-sec-h .nav-badge{flex:none;min-width:20px}
.m-list{margin-top:14px}
body:has(.m-sheet-bg) #t-chat,body:has(.m-sheet-bg) #chat-pops{display:none}
[data-device=mobile] .sc-fab.t{width:52px;height:52px}
/* ---------- เฟส 13: ข้อความถึงครูแบบโค้ด HTML ---------- */
.hn-label{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.hn-tabs [data-act=hn-tab].on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

[data-device=mobile] .hn-full{grid-template-columns:1fr}[data-device=mobile] .hn-code.tall{height:260px}
/* ---------- ตัวเลขแจ้งเตือนสีแดง ---------- */
.nav-badge{background:#FF3B30!important;color:#fff!important;box-shadow:0 2px 6px -1px rgba(255,59,48,.55);font-weight:700;animation:badge-in .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes badge-in{from{transform:scale(.4);opacity:0}}
.red-badge{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;margin-left:6px;border-radius:99px;background:#FF3B30;color:#fff;font:700 11.5px var(--f-head);font-style:normal;vertical-align:1px;box-shadow:0 2px 6px -1px rgba(255,59,48,.55)}
.tab .red-badge{margin-left:6px}
.chip.has-red{padding-right:4px}
.red-pill{display:inline-flex;align-items:center;gap:4px;font:700 12px var(--f-body);color:#fff;background:#FF3B30;padding:2px 9px;border-radius:99px;vertical-align:3px;box-shadow:0 3px 8px -3px rgba(255,59,48,.7)}
.m-tabs a{position:relative}
.tab-badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:#FF3B30;color:#fff;font:700 11px var(--f-head);font-style:normal;display:grid;place-items:center;box-shadow:0 0 0 2px var(--surface)}
/* ---------- กล่องแชท: แถบกระจก Liquid Glass ลอยมุมล่าง + เปิด/ปิดแบบสปริง ---------- */
#stu-chat,#t-chat{right:22px;bottom:18px;gap:10px}
.sc-fab.dock{position:relative;width:320px;height:auto;min-height:60px;border-radius:22px;display:flex;align-items:center;gap:12px;padding:10px 14px 10px 10px;text-align:left;font:inherit;color:var(--ink);overflow:hidden;
  background:linear-gradient(160deg,rgba(255,255,255,.78),rgba(255,255,255,.52));backdrop-filter:blur(24px) saturate(1.8);-webkit-backdrop-filter:blur(24px) saturate(1.8);

/* =========================================================
   แถบด้านบน v2 — "Glass toolbar"
   แถบกระจกเต็มความกว้าง + เส้นแสงสีโลโก้ SX ด้านล่าง
   ซ้าย: ไอคอนหน้าแบบ iOS tile + หมวด/ชื่อหน้า
   ขวา: ปุ่มหลัก 1 ปุ่ม + กลุ่มเครื่องมือในแคปซูลเดียวแบบ macOS toolbar
   ========================================================= */
.top.anav,[data-theme=dark] .top.anav,.snav{
  --bar-bg:linear-gradient(180deg,rgba(255,255,255,.86),rgba(246,249,255,.66));
  --bar-hair:rgba(15,40,90,.08);--tool-bg:rgba(255,255,255,.7);--tool-rim:rgba(15,40,90,.09);--ink:#0E1B33;--ink-2:#5B6B86}

  --bar-bg:linear-gradient(180deg,rgba(24,28,40,.86),rgba(18,21,30,.66));
  --bar-hair:rgba(255,255,255,.07);--tool-bg:rgba(255,255,255,.06);--tool-rim:rgba(255,255,255,.1);--ink:#EEF3FF;--ink-2:#93A1BD}
.top.anav,[data-theme=dark] .top.anav{
  position:sticky;top:0;z-index:20;margin:0;border:0;border-radius:0;pointer-events:auto;
  display:flex;align-items:center;justify-content:space-between;gap:18px;height:66px;padding:0 26px 0 30px;
  background:var(--bar-bg);-webkit-backdrop-filter:saturate(190%) blur(24px);backdrop-filter:saturate(190%) blur(24px);
  box-shadow:inset 0 -1px 0 var(--bar-hair);transition:box-shadow .3s}
.top.anav::after,.snav::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;pointer-events:none;opacity:0;transition:opacity .35s;
  background:linear-gradient(90deg,transparent,rgba(10,132,255,.55) 25%,rgba(90,200,250,.65) 55%,rgba(10,132,255,.4) 80%,transparent)}
body.bar-scrolled .top.anav,body.bar-scrolled .snav{box-shadow:inset 0 -1px 0 var(--bar-hair),0 10px 28px -18px rgba(10,40,100,.35)}
body.bar-scrolled .top.anav::after,body.bar-scrolled .snav::after{opacity:1}
[data-device=pc] .top.anav{zoom:1.04}
.an-l,.an-r{display:flex;align-items:center;gap:12px;min-width:0}

  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(0,0,0,.08),0 6px 14px -8px var(--tile-sh,rgba(10,100,240,.7))}

  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 0 0 1px rgba(10,90,210,.55),0 8px 18px -10px rgba(10,108,240,.9);
  transition:transform .35s cubic-bezier(.2,1.6,.4,1),filter .2s}

      <g><path d="M262 120h26l-3 36h-20z" fill="#fff"/><path d="M288 128h6a6 6 0 0 1 0 12h-6" fill="none" stroke="#fff" stroke-width="4"/><path d="M270 110c0-6 6-6 6-12M280 110c0-6 6-6 6-12" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".7"/></g>

  }

  /* ---------- ภาพหน้าว่าง ---------- */
  const SPOT = {

      <path d="M50 30l4 8 8 4-8 4-4 8-4-8-8-4 8-4zM152 70l3 6 6 3-6 3-3 6-3-6-6-3 6-3z" fill="#FFD45C"/>`,
    party: `<path d="M60 96l26-62 36 36z" fill="#FF9F0A"/><path d="M74 62l24 24M68 78l14 14" stroke="#fff" stroke-width="5"/><circle cx="130" cy="30" r="6" fill="#2F7CF6"/><circle cx="148" cy="56" r="5" fill="#34C759"/><circle cx="112" cy="18" r="4" fill="#5E5CE6"/>
      <path d="M120 44c8-6 16-2 22-10M100 40c2-10 10-14 10-24" fill="none" stroke="#30B0C7" stroke-width="4" stroke-linecap="round"/>`,
    wait: `<path d="M72 18h56M72 98h56" stroke="#5E5CE6" stroke-width="8" stroke-linecap="round"/><path d="M78 22c0 22 44 22 44 36s-44 14-44 36h44c0-22-44-22-44-36s44-14 44-36z" fill="#E8F0FF" stroke="#5E5CE6" stroke-width="4"/><path d="M88 86h24l-12-12z" fill="#FF9F0A"/>`,

/* แทนไอคอนในหน้าว่างด้วยภาพประกอบ (ทำงานหลังทุกการแสดงผล) */
function decorateEmpties(root) {
  root.querySelectorAll('.empty:not([data-art])').forEach(el => {
    el.dataset.art = '1';
    const first = el.firstElementChild;
    if (!first) return;
    let kind = null;
    if (first.tagName === 'svg' && first.dataset.i) kind = ART.SPOT_BY_ICON[first.dataset.i] || 'star';
    else if (first.tagName === 'DIV' && /font-size/.test(first.getAttribute('style') || '')) kind = ART.SPOT_BY_EMOJI[first.textContent.trim()] || 'star';
    if (!kind) return;
    first.outerHTML = ART.spot(kind);
  });
}

/* ===== ตัวอ่านไฟล์รายชื่อนักเรียน (CSV / Excel) =====
   - อ่าน CSV ได้ทั้ง UTF-8 และภาษาไทยแบบ Windows (TIS-620 / windows-874)
   - หาแถวหัวตารางเอง แยกนักเรียนตาม "ห้อง" จากคอลัมน์ห้อง/ชั้น หรือจากบรรทัดหัวเรื่อง หรือจากชื่อชีต
   - ครูเปลี่ยนการจับคู่คอลัมน์เองได้ (mapping) */
const RosterParser = (() => {
  const PREFIXES = ['เด็กชาย', 'เด็กหญิง', 'ด.ช.', 'ด.ญ.', 'ดช.', 'ดญ.', 'นางสาว', 'น.ส.', 'นาย', 'นาง', 'Mr.', 'Miss', 'Mrs.', 'Ms.'];
  const norm = v => String(v ?? '').replace(/ /g, ' ').replace(/\s+/g, ' ').trim();
  const flat = v => norm(v).replace(/[\s.\-_/()*:：]/g, '').toLowerCase();
  const FIELDS = ['classroom', 'level', 'room', 'number', 'code', 'prefix', 'first', 'last', 'full'];
  const FIELD_LABEL = { classroom: 'ห้อง (เช่น ม.1/1)', level: 'ระดับชั้น (เช่น ม.1)', room: 'ห้องที่ (เช่น 1)', number: 'เลขที่', code: 'เลขประจำตัวนักเรียน', prefix: 'คำนำหน้า', first: 'ชื่อ', last: 'นามสกุล', full: 'ชื่อ-สกุล (รวมช่องเดียว)' };

  /* ---------- อ่านไฟล์ ---------- */
  function decodeText(buf) {
    const bytes = new Uint8Array(buf);
    if (bytes[0] === 0xFF && bytes[1] === 0xFE) return new TextDecoder('utf-16le').decode(bytes);
    try { return new TextDecoder('utf-8', { fatal: true }).decode(bytes).replace(/^﻿/, ''); }
    catch (e) {
      try { return new TextDecoder('windows-874').decode(bytes); } catch (e2) { return new TextDecoder('utf-8').decode(bytes); }
    }
  }
  function parseCSV(text) {
    text = text.replace(/^﻿/, '');
    const first = text.split(/\r?\n/).slice(0, 5).join('\n');
    const count = ch => (first.match(new RegExp('\\' + ch, 'g')) || []).length;
    const delim = [',', '\t', ';', '|'].sort((a, b) => count(b) - count(a))[0];
    const rows = []; let row = [], cell = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) {
        if (ch === '"' && text[i + 1] === '"') { cell += '"'; i++; }
        else if (ch === '"') q = false;
        else cell += ch;
      } else if (ch === '"' && cell === '') q = true;
      else if (ch === delim) { row.push(cell); cell = ''; }
      else if (ch === '\n' || ch === '\r') {
        if (ch === '\r' && text[i + 1] === '\n') i++;
        row.push(cell); rows.push(row); row = []; cell = '';
      } else cell += ch;
    }
    if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
    return rows;
  }

  /* ---------- ห้องเรียน ---------- */
  // แปลงข้อความเป็นชื่อห้องมาตรฐาน เช่น "ม.1/1" (คืน '' ถ้าไม่ใช่)
  function normClass(v, strict) {
    let s = norm(v);

/* เรียก Supabase: ถ้าผิดพลาดจะแสดงข้อความและโยน error ต่อ */
async function q(p) {
  const { data, error } = await p;
  if (error) { console.error(error); toast(errMsg(error), true); throw error; }
  return data;
}
/* โหลดทั้งตาราง ทีละ 1,000 แถว (Supabase จำกัดต่อครั้ง) */
async function fetchAll(table, order = 'created_at') {
  const out = [];
  for (let from = 0; ; from += 1000) {
    const rows = await q(sb.from(table).select('*').order(order, { ascending: true }).range(from, from + 999));
    out.push(...rows);
    if (rows.length < 1000) break;
  }
  return out;
}
function thaiTermNow() {
  const d = new Date(), m = d.getMonth() + 1, be = d.getFullYear() + 543;
  if (m >= 5 && m <= 10) return { year: be, semester: 1 };
  return { year: m >= 11 ? be : be - 1, semester: 2 };
}

async function fetchStudents(cid) {
  const out = [];
  for (let from = 0; ; from += 1000) {
    let qb = sb.from('students').select(STU_COLS).order('created_at', { ascending: true }).range(from, from + 999);
    if (cid) qb = qb.eq('classroom_id', cid);
    const rows = await q(qb); out.push(...rows);
    if (rows.length < 1000) break;
  }
  if (ME.admin()) {
    const codes = await q(sb.rpc('admin_student_codes'));
    const m = new Map(codes.map(c => [c.id, c.student_code]));
    out.forEach(r => { r.student_code = m.get(r.id) ?? ''; });
  } else out.forEach(r => { r.student_code = ''; });
  return out;
}

function subjectModal(s) {
  const isNew = !s;
  s = s || { code: '', name: '', color: COLORS[store.subjects.length % COLORS.length], term_id: ui.termId || Q.currentTerm()?.id };
  const cids = isNew ? [] : Q.subjectClassIds(s.id);

      <div class="grid3" style="grid-template-columns:140px 1fr">
        <label class="field"><span>รหัสวิชา</span><input class="input" name="code" value="${esc(s.code)}" placeholder="ว23104"></label>

      </div>
      <label class="field"><span>ภาคเรียน</span><select class="input" name="term_id">${store.terms.map(t => `<option value="${t.id}" ${t.id === s.term_id ? 'selected' : ''}>${Q.termLabel(t)}</option>`).join('')}</select></label>
      <div class="field"><span class="muted" style="font-weight:500">สีประจำวิชา</span><div class="swatches">${COLORS.map(c => `<button type="button" class="swatch ${c === s.color ? 'on' : ''}" style="background:${c}" data-act="pick-color" data-c="${c}" aria-label="สี ${c}"></button>`).join('')}</div></div>
      <div class="field"><span class="muted" style="font-weight:500">ห้องที่สอน</span>
        ${cls.length ? `<div class="checks">${cls.map(c => `<label class="check"><input type="checkbox" name="cls" value="${c.id}" ${cids.includes(c.id) ? 'checked' : ''}>${esc(c.name)}</label>`).join('')}</div>`
        : `<div class="note">ยังไม่มีห้องเรียน เพิ่มห้องหรืออัปโหลดรายชื่อที่เมนู "ห้องเรียนและรายชื่อ" ก่อน</div>`}
      </div></div>`,
    actions: [{ label: 'ยกเลิก', onClick: closeModal }, { label: isNew ? 'เพิ่มวิชา' : 'บันทึก', kind: 'primary', onClick: saveSubject }],
  });
}
async function saveSubject() {
  const name = mval('name');
  if (!name) { toast('กรุณากรอกชื่อวิชา', true); return; }
  const data = { code: mval('code'), name, term_id: mval('term_id') || null, color: modalCtx.color };
  const sel = $$('#modal-root input[name=cls]:checked').map(x => x.value);
  let id = modalCtx.subjectId;
  if (id) await db.update('subjects', id, data); else id = (await db.insert('subjects', data)).id;
  await q(sb.from('subject_classes').delete().eq('subject_id', id));
  store.subject_classes = store.subject_classes.filter(x => x.subject_id !== id);
  if (sel.length) {
    const rows = await q(sb.from('subject_classes').insert(sel.map(c => ({ subject_id: id, classroom_id: c }))).select());
    store.subject_classes.push(...rows);
  }
  closeModal(); render(); toast('บันทึกวิชาแล้ว');
}

function levelOf(name) { const m = String(name).match(/^(.*?)\s*\/\s*\d+$/); return m ? m[1].trim() : 'อื่นๆ'; }

function classModal(c) {
  const isNew = !c;
  openModal({
    title: isNew ? 'เพิ่มห้องเรียน' : 'แก้ไขห้องเรียน', ctx: { classId: c?.id },
    body: `<div class="stack"><label class="field"><span>ชื่อห้อง *</span><input class="input" name="name" value="${esc(c?.name)}" placeholder="ม.3/1"></label>
      <label class="field"><span>ครูที่ปรึกษา</span><input class="input" name="homeroom_teacher" value="${esc(c?.homeroom_teacher)}" placeholder="ครู…"></label></div>`,
    actions: [{ label: 'ยกเลิก', onClick: closeModal }, { label: isNew ? 'เพิ่มห้อง' : 'บันทึก', kind: 'primary', onClick: async () => {
      const name = mval('name'); if (!name) return toast('กรุณากรอกชื่อห้อง', true);
      if (store.classrooms.some(x => x.name === name && x.id !== modalCtx.classId)) return toast('มีห้องชื่อนี้แล้ว', true);
      const data = { name, homeroom_teacher: mval('homeroom_teacher') };
      if (modalCtx.classId) await db.update('classrooms', modalCtx.classId, data); else ui.cid = (await db.insert('classrooms', { ...data, sort_order: 0 })).id;
      closeModal(); render(); toast('บันทึกห้องแล้ว');
    } }],
  });
}

  openModal({
    title: isNew ? 'เพิ่มนักเรียน' : 'แก้ไขข้อมูลนักเรียน', ctx: { studentId: s.id },
    body: `<div class="stack">
      <div class="grid2"><label class="field"><span>เลขที่ *</span><input class="input" type="number" min="1" name="number" value="${s.number}"></label>
        <label class="field"><span>เลขประจำตัวนักเรียน</span><input class="input" name="student_code" value="${esc(s.student_code)}" inputmode="numeric" placeholder="ใช้ยืนยันตัวตน"></label></div>
      <div class="grid3"><label class="field"><span>คำนำหน้า</span><input class="input" name="prefix" value="${esc(s.prefix)}" list="prefixes-m"><datalist id="prefixes-m">${PREFIX_OPTS.map(p => `<option value="${p}">`).join('')}</datalist></label>
        <label class="field"><span>ชื่อ *</span><input class="input" name="first_name" value="${esc(s.first_name)}"></label>
        <label class="field"><span>นามสกุล</span><input class="input" name="last_name" value="${esc(s.last_name)}"></label></div>
      <div class="grid2"><label class="field"><span>ห้อง</span><select class="input" name="classroom_id">${Q.classrooms().map(c => `<option value="${c.id}" ${c.id === s.classroom_id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></label>
        <label class="field"><span>สถานะ</span><select class="input" name="active"><option value="1" ${s.active !== false ? 'selected' : ''}>กำลังเรียน</option><option value="0" ${s.active === false ? 'selected' : ''}>ย้าย/ลาออก</option></select></label></div>
    </div>`,
    actions: [{ label: 'ยกเลิก', onClick: closeModal }, { label: isNew ? 'เพิ่มนักเรียน' : 'บันทึก', kind: 'primary', onClick: saveStudent }],
  });
}
async function saveStudent() {
  const number = parseInt(mval('number'), 10), first = mval('first_name'), cid = mval('classroom_id');
  if (!Number.isFinite(number) || number < 1) return toast('เลขที่ไม่ถูกต้อง', true);
  if (!first) return toast('กรุณากรอกชื่อ', true);
  const dup = store.students.find(x => x.classroom_id === cid && x.number === number && x.id !== modalCtx.studentId);
  if (dup) return toast(`เลขที่ ${number} มีแล้วในห้องนี้ (${Q.fullName(dup)})`, true);
  const data = { number, student_code: mval('student_code'), prefix: mval('prefix'), first_name: first, last_name: mval('last_name'), classroom_id: cid, active: mval('active') === '1' };
  if (!data.student_code) toast('ยังไม่มีเลขประจำตัว นักเรียนคนนี้จะยืนยันตัวตนไม่ได้จนกว่าจะเติม');
  if (modalCtx.studentId) await db.update('students', modalCtx.studentId, data); else await db.insert('students', data);
  closeModal(); render(); toast('บันทึกแล้ว');
}

async function readRosterFile(file) {
  const ext = file.name.split('.').pop().toLowerCase();
  const buf = await file.arrayBuffer();
  if (ext === 'csv' || ext === 'txt') return [{ name: file.name.replace(/\.(csv|txt)$/i, ''), rows: RosterParser.parseCSV(RosterParser.decodeText(buf)) }];
  if (!window.XLSX) throw new Error('โหลดตัวอ่าน Excel ไม่สำเร็จ ลองบันทึกไฟล์เป็น .csv แล้วอัปโหลดอีกครั้ง');
  const wb = XLSX.read(buf, { type: 'array' });
  return wb.SheetNames.map(n => ({ name: n, rows: XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, defval: '', raw: true, blankrows: true }) }))
    .filter(s => s.rows.some(r => r.some(c => String(c).trim())));
}
async function handleImportFile(file) {
  let sources;
  try { sources = await readRosterFile(file); } catch (e) { toast(e.message || 'อ่านไฟล์ไม่สำเร็จ', true); return; }
  if (!sources.length) return toast('ไฟล์นี้ว่างเปล่า', true);
  importPreview(RosterParser.analyze(sources), file.name, 'merge');
}

async function doImport() {
  const { sheets } = modalCtx;
  const mode = $('#modal-root input[name=mode]:checked').value;
  const inc = sheets.filter(s => s.include && s.students.length);
  if (!inc.length) return toast('ยังไม่ได้เลือกชีตที่จะนำเข้า', true);
  const names = inc.map(s => s.name.trim());
  if (names.some(n => !n)) return toast('มีชีตที่ยังไม่ได้ตั้งชื่อห้อง', true);
  if (new Set(names).size !== names.length) return toast('มีชีตที่ตั้งชื่อห้องซ้ำกัน', true);
  let added = 0, updated = 0, rooms = 0, lastId = null;
  try {
    for (const s of inc) {
      let c = importTarget(s.name);
      if (!c) { c = await db.insert('classrooms', { name: s.name.trim(), homeroom_teacher: s.homeroom || null, sort_order: 0 }); rooms++; }
      else if (s.homeroom && !c.homeroom_teacher) await db.update('classrooms', c.id, { homeroom_teacher: s.homeroom });
      lastId = c.id;
      let rows;
      if (mode === 'replace') {
        await q(sb.from('students').delete().eq('classroom_id', c.id));
        rows = s.students.map(st => ({ ...st, classroom_id: c.id, active: true }));
        added += rows.length;
      } else {
        rows = s.students.map(st => {
          const ex = store.students.find(x => x.classroom_id === c.id && x.number === st.number);
          if (ex) { updated++; return { ...st, classroom_id: c.id, student_code: st.student_code || ex.student_code, prefix: st.prefix || ex.prefix || '', active: ex.active }; }
          added++; return { ...st, classroom_id: c.id, active: true };
        });
      }
      for (let i = 0; i < rows.length; i += 500) {
        await q(sb.rpc('admin_upsert_students', { p_rows: rows.slice(i, i + 500) }));
      }
      await reloadStudents(c.id);
    }
  } catch (e) {
    await loadAll().catch(() => {}); ui.cid = lastId || ui.cid; closeModal(); render();
    return;
  }
  ui.cid = inc.length === 1 ? lastId : null; ui.clsLevel = inc.length === 1 ? ui.clsLevel : ''; ui.sel.clear(); closeModal(); render();
  toast(`นำเข้าแล้ว: เพิ่ม ${added} คน${updated ? ` · อัปเดต ${updated} คน` : ''}${rooms ? ` · สร้างห้องใหม่ ${rooms} ห้อง` : ''}`);
}

const fmtDate = iso => iso ? new Date(iso).toLocaleString('th-TH', { day: 'numeric', month: 'short', year: '2-digit', hour: '2-digit', minute: '2-digit' }) : '—';
const fmtSize = b => b == null ? '' : b < 1024 * 1024 ? `${Math.max(1, Math.round(b / 1024))} KB` : `${(b / 1024 / 1024).toFixed(1)} MB`;
const isPast = iso => iso && new Date(iso) < new Date();
function toLocalInput(iso) {
  if (!iso) return '';
  const d = new Date(iso), p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
function dueText(iso) {
  if (!iso) return 'ไม่กำหนดวันส่ง';
  const ms = new Date(iso) - new Date(), h = Math.abs(ms) / 36e5;
  const rel = h < 1 ? `${Math.max(1, Math.round(h * 60))} นาที` : h < 48 ? `${Math.round(h)} ชั่วโมง` : `${Math.round(h / 24)} วัน`;
  return ms < 0 ? `เลยกำหนด ${rel} (${fmtDate(iso)})` : `ส่งภายใน ${fmtDate(iso)} · อีก ${rel}`;
}
function statusChip(st, forTeacher = true) {

/* ---------- ข้อมูลฝั่งครู ---------- */
const A = {
  classIds: aid => store.assignment_classes.filter(x => x.assignment_id === aid).map(x => x.classroom_id),
  sub: (aid, sid) => store.submissions.find(s => s.assignment_id === aid && s.student_id === sid),
  subs: aid => store.submissions.filter(s => s.assignment_id === aid),
  roster(aid, cid) {
    const subIds = new Set(A.subs(aid).map(s => s.student_id));
    return Q.students(cid).filter(s => s.active !== false || subIds.has(s.id));
  },
  stats(aid, cid) {
    const cids = cid ? [cid] : A.classIds(aid);
    const studs = cids.flatMap(c => A.roster(aid, c));
    const ids = new Set(studs.map(s => s.id));
    const subs = A.subs(aid).filter(s => ids.has(s.student_id));
    return {
      total: studs.length, sent: subs.length,
      pending: subs.filter(s => s.status === 'submitted' || s.status === 'late').length,
      graded: subs.filter(s => s.status === 'graded').length,
      returned: subs.filter(s => s.status === 'returned').length,
      missing: studs.length - subs.length,
    };
  },
  filesOf: (aid, subId) => (store.files[aid] || []).filter(f => f.submission_id === subId),
};
function pendingCount() {
  const live = new Set(store.assignments.map(a => a.id));
  return store.submissions.filter(s => live.has(s.assignment_id) && (s.status === 'submitted' || s.status === 'late')).length;
}
function pruneLocal() {
  const subj = new Set(store.subjects.map(x => x.id)), cls = new Set(store.classrooms.map(x => x.id)), stu = new Set(store.students.map(x => x.id));
  store.assignments = store.assignments.filter(a => subj.has(a.subject_id));
  const asg = new Set(store.assignments.map(x => x.id));
  store.assignment_classes = store.assignment_classes.filter(x => asg.has(x.assignment_id) && cls.has(x.classroom_id));
  store.submissions = store.submissions.filter(x => asg.has(x.assignment_id) && stu.has(x.student_id));
}
async function refreshAsgSubs(aid) {
  const rows = await q(sb.from('submissions').select('*').eq('assignment_id', aid));
  store.submissions = store.submissions.filter(s => s.assignment_id !== aid).concat(rows);
  await ensureFiles(aid, true);
}

}
async function ensureFiles(aid, force) {
  if (store.files[aid] && !force) return;
  const subIds = A.subs(aid).map(s => s.id);
  const out = [];
  for (let i = 0; i < subIds.length; i += 150) {
    out.push(...await q(sb.from('submission_files').select('*').in('submission_id', subIds.slice(i, i + 150))));
  }
  store.files[aid] = out;
}

async function saveAssignment() {
  const rub = modalCtx.rubric;
  if (rub && !rbValid(rub)) return toast('รูบริก: กรอกชื่อเกณฑ์ ชื่อระดับ และน้ำหนักให้ครบ หรือกด "เอารูบริกออก"', true);
  const title = mval('title'), max = rub ? rbMax(rub) : parseFloat(mval('max_score')), mb = parseInt(mval('max_file_mb'), 10);
  const cls = $$('#modal-root input[name=acls]:checked').map(x => x.value);
  const kinds = $$('#modal-root input[name=kind]:checked').map(x => x.value);
  const due = mval('due_at');
  if (!title) return toast('กรุณากรอกชื่องาน', true);
  if (!(max > 0)) return toast('คะแนนเต็มต้องมากกว่า 0', true);
  if (!cls.length) return toast('เลือกห้องที่มอบหมายอย่างน้อย 1 ห้อง', true);
  if (!kinds.length) return toast('เลือกชนิดไฟล์ที่รับอย่างน้อย 1 ชนิด', true);
  if (!(mb >= 1 && mb <= 50)) return toast('ขนาดไฟล์ต้องอยู่ระหว่าง 1–50 MB', true);
  const data = {
    subject_id: mval('subject_id'), title, description: mval('description') || null, max_score: max,
    due_at: due ? new Date(due).toISOString() : null, accept_types: kinds, max_file_mb: mb,
    is_open: $('#modal-root [name=is_open]').checked, allow_late: $('#modal-root [name=allow_late]').checked,
  };
  if (rub || modalCtx.hadRubric) data.rubric = rub ? rbCopy(rub) : null;
  const wasNew = !modalCtx.asgId;
  let id = modalCtx.asgId;
  if (id) await db.update('assignments', id, data); else id = (await db.insert('assignments', data)).id;
  await q(sb.from('assignment_classes').delete().eq('assignment_id', id));
  store.assignment_classes = store.assignment_classes.filter(x => x.assignment_id !== id);
  const rows = await q(sb.from('assignment_classes').insert(cls.map(c => ({ assignment_id: id, classroom_id: c }))).select());
  store.assignment_classes.push(...rows);
  const gc = store.grade_columns.find(c => c.assignment_id === id);
  if (gc && gc.title !== title) { try { await db.update('grade_columns', gc.id, { title }); } catch (e) {} }
  closeModal(); render(); toast(wasNew ? 'สร้างงานแล้ว' : 'บันทึกงานแล้ว');
}
async function deleteAssignment(a) {
  try {
    await refreshAsgSubs(a.id);
    const paths = (store.files[a.id] || []).map(f => f.storage_path);
    for (let i = 0; i < paths.length; i += 100) await sb.storage.from('submissions').remove(paths.slice(i, i + 100));
  } catch (e) { console.error(e); }
  await db.removeIds('assignments', [a.id]);
  delete store.files[a.id];
  pruneLocal(); render(); toast('ลบงานแล้ว');
}

async function saveScore(aid, sid, score, feedback, status, extra) {
  const ex = A.sub(aid, sid);
  const now = new Date().toISOString();
  const patch = { score, status, graded_at: status === 'graded' ? now : null, ...(extra || {}) };
  if (feedback !== undefined) patch.feedback = feedback;
  if (ex) {
    const r = await q(sb.from('submissions').update(patch).eq('id', ex.id).select().single());
    Object.assign(ex, r); return ex;
  }
  const r = await q(sb.from('submissions').upsert({ assignment_id: aid, student_id: sid, ...patch }, { onConflict: 'assignment_id,student_id' }).select().single());
  store.submissions = store.submissions.filter(x => !(x.assignment_id === aid && x.student_id === sid));
  store.submissions.push(r); return r;
}
async function quickScore(el) {
  const aid = ui.route.slice(6), a = db.get('assignments', aid), sid = el.dataset.sid;
  const ex = A.sub(aid, sid);
  const raw = el.value.trim();
  if (raw === '') {
    if (!ex || ex.score == null) return;
    const hasFiles = A.filesOf(aid, ex.id).length > 0;
    try { await saveScore(aid, sid, null, undefined, hasFiles ? 'submitted' : 'returned'); } catch (e) { el.value = ex.score; return; }
  } else {
    const v = parseFloat(raw);
    if (!(v >= 0)) { el.value = ex?.score ?? ''; return toast('คะแนนไม่ถูกต้อง', true); }
    if (v > +a.max_score) toast(`คะแนนเกินคะแนนเต็ม (${+a.max_score}) — บันทึกให้แล้ว`);
    try { await saveScore(aid, sid, v, undefined, 'graded'); } catch (e) { el.value = ex?.score ?? ''; return; }
  }
  const sub = A.sub(aid, sid);
  const row = $(`#gr-${sid} .gr-st`); if (row) row.innerHTML = statusChip(sub?.status);
  const sum = $('#grade-sum'); if (sum) sum.innerHTML = gradeSummary(aid);
  el.style.borderColor = 'var(--ok)'; setTimeout(() => { el.style.borderColor = ''; }, 700);
}

/* ---------- ครูลบไฟล์ / ลบงาน / คืนค่าการตรวจ ---------- */
function statusBeforeGrading(aid, sub) {
  const a = db.get('assignments', aid);
  return a?.due_at && sub.submitted_at && new Date(sub.submitted_at) > new Date(a.due_at) ? 'late' : 'submitted';
}
async function teacherResetSubmission(aid, sid) {
  const sub = A.sub(aid, sid); if (!sub) return;
  const hasFiles = A.filesOf(aid, sub.id).length > 0;
  if (!hasFiles) { // ไม่มีไฟล์ = ครูให้คะแนนเอง → ลบทิ้ง กลับเป็น "ยังไม่ส่ง"
    await q(sb.from('submissions').delete().eq('id', sub.id));
    store.submissions = store.submissions.filter(x => x.id !== sub.id);
  } else {
    const r = await q(sb.from('submissions').update({ score: null, feedback: null, graded_at: null, status: statusBeforeGrading(aid, sub) }).eq('id', sub.id).select().single());
    Object.assign(sub, r);
  }
}

/* ---------- ตัวช่วยไฟล์ของนักเรียน ---------- */
function detectKind(file) {
  const t = file.type || '';
  if (t.startsWith('image/')) return 'image';
  if (t.startsWith('video/')) return 'video';
  if (t.startsWith('audio/')) return 'audio';
  if (/\.(heic|heif)$/i.test(file.name)) return 'image';
  return 'document';
}
async function compressImage(file) {
  if (!/^image\/(jpeg|png|webp|bmp)$/.test(file.type) || file.size < 400 * 1024 || !window.createImageBitmap) return file;
  try {
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, 1920 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.82));
    if (!blob || blob.size >= file.size) return file;
    return new File([blob], file.name.replace(/\.[^.]+$/, '') + '.jpg', { type: 'image/jpeg' });
  } catch (e) { return file; }
}

/* ---------- รูปย่อ (เก็บไว้ในฐานข้อมูล ครูและนักเรียนเห็นได้โดยไม่ต้องโหลดไฟล์จริง) ---------- */
function canvasThumb(src, w, h) {
  const scale = Math.min(1, 360 / Math.max(w, h));
  const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w * scale)); c.height = Math.max(1, Math.round(h * scale));
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(src, 0, 0, c.width, c.height);
  const url = c.toDataURL('image/jpeg', 0.72);
  return url.length < 70000 ? url : c.toDataURL('image/jpeg', 0.5);
}
async function makeThumb(file, kind) {
  try {
    if (kind === 'image' && window.createImageBitmap) {
      const bmp = await createImageBitmap(file);
      return canvasThumb(bmp, bmp.width, bmp.height);
    }
    if (kind === 'video') {
      return await new Promise(resolve => {
        const v = document.createElement('video'); const url = URL.createObjectURL(file);
        let done = false; const finish = r => { if (done) return; done = true; URL.revokeObjectURL(url); resolve(r); };
        v.muted = true; v.playsInline = true; v.preload = 'metadata'; v.src = url;
        v.onloadeddata = () => { v.currentTime = Math.min(1, (v.duration || 2) / 3); };
        v.onseeked = () => { try { finish(canvasThumb(v, v.videoWidth, v.videoHeight)); } catch (e) { finish(null); } };
        v.onerror = () => finish(null);
        setTimeout(() => finish(null), 5000);
      });
    }
  } catch (e) {}
  return null;
}

/* ---------- เลือกไฟล์ / ส่งงาน ---------- */
function stageFiles(aid, files) {
  const a = (stuState.asg || []).find(x => x.id === aid); if (!a) return;
  const list = stuState.staged[aid] = stuState.staged[aid] || [];
  for (const f of files) {
    const kind = detectKind(f);
    const item = { key: uid(), file: f, name: f.name, size: f.size, kind, thumb: null, state: '', err: '' };
    if (!a.accept_types.includes(kind)) { item.state = 'bad'; item.err = `งานนี้ไม่รับ${KIND_LABEL[kind]}`; }
    else if (kind !== 'image' && f.size > a.max_file_mb * 1024 * 1024) { item.state = 'bad'; item.err = `ใหญ่เกิน ${a.max_file_mb} MB${kind === 'video' ? ' ลองตัดคลิปให้สั้นลง' : ''}`; }
    list.push(item);
    makeThumb(f, kind).then(t => { item.thumb = t; if (isStudentRoute()) render(); });
  }
  stuState.open = aid;
  render();
}
async function studentSend(aid) {
  const v = stuState.verified, a = (stuState.asg || []).find(x => x.id === aid);
  const items = (stuState.staged[aid] || []).filter(x => x.state !== 'ok' && x.state !== 'bad');
  const nd = noteDraft(a);
  if (!v || !a || stuState.uploading || (!items.length && !nd.dirty)) { if (!items.length && !nd.dirty) toast('ไม่มีไฟล์ที่ส่งได้ ลองเอาไฟล์ที่มี ! ออกแล้วเลือกใหม่', true); return; }
  const bad = nd.links.map(x => x.trim()).filter(x => x && !/^https?:\/\/\S+$/i.test(x));
  if (bad.length) return toast('ลิงก์ต้องขึ้นต้นด้วย https:// เช่น https://www.canva.com/…', true);
  stuState.uploading = true; render();
  let ok = 0, noteOk = false;
  for (const it of items) {
    it.state = 'up'; it.err = ''; render();
    try {
      const file = it.kind === 'image' ? await compressImage(it.file) : it.file;
      if (file.size > a.max_file_mb * 1024 * 1024) throw new Error(`ใหญ่เกิน ${a.max_file_mb} MB`);
      if (!it.thumb) it.thumb = await makeThumb(file, it.kind);
      const path = await q(sb.rpc('student_begin_upload', { p_student_id: v.student_id, p_code: v.code, p_assignment_id: aid, p_file_name: file.name, p_mime: file.type || 'application/octet-stream', p_size: file.size, p_kind: it.kind }));
      await q(sb.storage.from('submissions').upload(path, file, { contentType: file.type || 'application/octet-stream', upsert: false }));
      await q(sb.rpc('student_finish_upload', { p_student_id: v.student_id, p_code: v.code, p_path: path, p_thumb: it.thumb }));
      it.state = 'ok'; it.size = file.size; ok++;
    } catch (e) { it.state = 'bad'; it.err = /ใหญ่เกิน/.test(e.message || '') ? e.message : errMsg(e); }
    render();
  }
  if (nd.dirty) {
    try {
      await q(sb.rpc('student_save_note', { p_student_id: v.student_id, p_code: v.code, p_assignment_id: aid, p_note: nd.note, p_links: nd.links.map(x => x.trim()).filter(Boolean) }));
      delete stuState.notes[aid]; noteOk = true;
    } catch (e) { toast(errMsg(e), true); }
  }
  stuState.uploading = false;
  if (ok || noteOk) {
    confetti(); toast(ok ? `ส่งงานสำเร็จ ${ok} ไฟล์ 🎉` : 'ส่งข้อความและลิงก์ให้ครูแล้ว 🎉');
    stuState.staged[aid] = (stuState.staged[aid] || []).filter(x => x.state !== 'ok');
    stuState.asg = null; await loadStudentAsg(); stuState.open = aid; render();
  } else render();
}
function confetti() {
  const box = document.createElement('div'); box.className = 'confetti';
  const em = ['🎉', '⭐', '✨', '💜', '🌟', '🎊', '💙'];
  for (let i = 0; i < 28; i++) {
    const s = document.createElement('i'); s.textContent = em[i % em.length];
    s.style.left = Math.random() * 100 + 'vw'; s.style.animationDelay = Math.random() * .5 + 's'; s.style.fontSize = 16 + Math.random() * 18 + 'px';
    box.appendChild(s);
  }
  document.body.appendChild(box); setTimeout(() => box.remove(), 2600);
}

function thaiGrade(pct) {
  if (pct == null || isNaN(pct)) return '–';
  return pct >= 80 ? '4' : pct >= 75 ? '3.5' : pct >= 70 ? '3' : pct >= 65 ? '2.5' : pct >= 60 ? '2' : pct >= 55 ? '1.5' : pct >= 50 ? '1' : '0';
}
const GB = {
  cols(sid, cid, withHidden) {
    const assigned = new Set(store.assignment_classes.filter(x => x.classroom_id === cid).map(x => x.assignment_id));
    const live = new Set(store.assignments.map(a => a.id));
    const exLive = new Set(store.exam_classes.filter(x => x.classroom_id === cid).map(x => x.exam_id));
    return store.grade_columns.filter(c => c.subject_id === sid && (!c.classroom_id || c.classroom_id === cid)
      && (c.source !== 'assignment' || (live.has(c.assignment_id) && assigned.has(c.assignment_id)))
      && (c.source !== 'exam' || exLive.has(c.exam_id))
      && (withHidden || !c.hidden))
      .sort((a, b) => (a.sort_order - b.sort_order) || (a.created_at || '').localeCompare(b.created_at || ''));
  },
  max(c) { if (c.source === 'exam') return +EX.total(c.exam_id); if (c.source === 'assignment') { const a = db.get('assignments', c.assignment_id); return +(a?.max_score ?? c.max_score); } return +c.max_score; },
  entry: (colId, sid) => store.grade_entries.find(e => e.column_id === colId && e.student_id === sid),
  score(c, sid) {
    if (c.source === 'exam') return { v: EX.best(c.exam_id, sid), st: null };
    if (c.source === 'assignment') { const s = A.sub(c.assignment_id, sid); return { v: s?.score ?? null, st: s?.status || null }; }
    const e = GB.entry(c.id, sid); return { v: e?.score ?? null, st: null };
  },
  roster(cid, cols) {
    const ids = new Set();
    cols.forEach(c => store.grade_entries.forEach(e => { if (e.column_id === c.id) ids.add(e.student_id); }));
    return Q.students(cid).filter(s => s.active !== false || ids.has(s.id));
  },
  total(cols, sid) {
    let sum = 0, max = 0;
    cols.forEach(c => { const m = GB.max(c); if (m > 0) { max += m; sum += +(GB.score(c, sid).v || 0); } });
    const pct = max ? sum / max * 100 : null;
    return { sum: Math.round(sum * 100) / 100, max, pct };
  },
};
async function syncExamColumns(subjectId) {
  const have = new Set(store.grade_columns.map(c => c.exam_id).filter(Boolean));
  const missing = store.exams.filter(e => e.subject_id === subjectId && !have.has(e.id)).sort((a, b) => (a.created_at || '').localeCompare(b.created_at || ''));
  if (!missing.length) return false;
  const base = Math.max(0, ...store.grade_columns.filter(c => c.subject_id === subjectId).map(c => c.sort_order || 0));
  const rows = missing.map((e, i) => ({ subject_id: subjectId, title: e.title, max_score: 0, source: 'exam', exam_id: e.id, sort_order: base + (i + 1) * 10 }));
  const out = await q(sb.from('grade_columns').upsert(rows, { onConflict: 'exam_id', ignoreDuplicates: true }).select());
  const ids = new Set(store.grade_columns.map(c => c.id));
  out.forEach(r => { if (!ids.has(r.id)) store.grade_columns.push(r); });
  return true;
}
async function syncAssignmentColumns(subjectId) {
  const have = new Set(store.grade_columns.map(c => c.assignment_id).filter(Boolean));
  const missing = store.assignments.filter(a => a.subject_id === subjectId && !have.has(a.id))
    .sort((a, b) => (a.created_at || '').localeCompare(b.created_at || ''));
  if (!missing.length) return false;
  const base = Math.max(0, ...store.grade_columns.filter(c => c.subject_id === subjectId).map(c => c.sort_order || 0));
  const rows = missing.map((a, i) => ({ subject_id: subjectId, title: a.title, max_score: a.max_score, source: 'assignment', assignment_id: a.id, sort_order: base + (i + 1) * 10 }));
  const out = await q(sb.from('grade_columns').upsert(rows, { onConflict: 'assignment_id', ignoreDuplicates: true }).select());
  const ids = new Set(store.grade_columns.map(c => c.id));
  out.forEach(r => { if (!ids.has(r.id)) store.grade_columns.push(r); });
  return true;
}

async function gbSaveCell(el) {
  const c = db.get('grade_columns', el.dataset.c), sid = el.dataset.s;
  const raw = el.value.trim();
  const old = GB.score(c, sid).v;
  let v = null;
  if (raw !== '') {
    v = parseFloat(raw.replace(',', '.'));
    if (!(v >= 0)) { el.value = old ?? ''; return toast('คะแนนไม่ถูกต้อง', true); }
  }
  if (v === old || (v == null && old == null)) return;
  el.classList.add('saving');
  try {
    if (c.source === 'assignment') {
      const ex = A.sub(c.assignment_id, sid);
      if (v == null) { if (ex) await saveScore(c.assignment_id, sid, null, undefined, A.filesOf(c.assignment_id, ex.id).length ? 'submitted' : 'returned'); }
      else await saveScore(c.assignment_id, sid, v, undefined, 'graded');
    } else if (v == null) {
      await q(sb.from('grade_entries').delete().eq('column_id', c.id).eq('student_id', sid));
      store.grade_entries = store.grade_entries.filter(e => !(e.column_id === c.id && e.student_id === sid));
    } else {
      const r = await q(sb.from('grade_entries').upsert({ column_id: c.id, student_id: sid, score: v, updated_at: new Date().toISOString() }, { onConflict: 'column_id,student_id' }).select().single());
      store.grade_entries = store.grade_entries.filter(e => !(e.column_id === c.id && e.student_id === sid)); store.grade_entries.push(r);
    }
  } catch (e) { el.value = old ?? ''; el.classList.remove('saving'); return; }
  el.classList.remove('saving', 'pend'); el.classList.toggle('over', v != null && v > GB.max(c));
  el.classList.add('saved'); setTimeout(() => el.classList.remove('saved'), 700);
  if (v != null && v > GB.max(c)) toast(`คะแนนเกินคะแนนเต็ม (${GB.max(c)}) — บันทึกให้แล้ว`);
  gbRefreshRow(sid);
}

  const el = e.target.closest?.('.gcell'); if (!el) return;
  const move = dr => {
    const tr = el.closest('tr'); let row = dr > 0 ? tr.nextElementSibling : tr.previousElementSibling;
    const next = row?.querySelector(`.gcell[data-ci="${el.dataset.ci}"]`);
    if (next) { e.preventDefault(); el.blur(); next.focus(); next.select(); }
  };
  if (e.key === 'Enter' || e.key === 'ArrowDown') move(1);
  else if (e.key === 'ArrowUp') move(-1);
});
document.addEventListener('focusin', e => { if (e.target.classList?.contains('gcell')) setTimeout(() => e.target.select(), 0); });

async function gbMove(dir) {

function gbSheetRows(sid, cid) {
  const cols = GB.cols(sid, cid);
  const studs = GB.roster(cid, cols);
  const header = ['เลขที่', 'เลขประจำตัว', 'ชื่อ - สกุล', ...cols.map(c => `${c.title} (${GB.max(c)})`), `รวม (${cols.reduce((a, c) => a + GB.max(c), 0)})`, 'ร้อยละ', 'เกรด'];
  const rows = studs.map(s => { const t = GB.total(cols, s.id);
    return [s.number, s.student_code, Q.fullName(s), ...cols.map(c => GB.score(c, s.id).v ?? ''), t.sum, t.pct == null ? '' : Math.round(t.pct * 10) / 10, thaiGrade(t.pct)]; });
  return [header, ...rows];
}
function gbExport(all) {
  const sj = db.get('subjects', ui.gbSubject);
  const cids = all ? Q.subjectClassIds(sj.id).sort((x, y) => (db.get('classrooms', x)?.name || '').localeCompare(db.get('classrooms', y)?.name || '', 'th', { numeric: true })) : [ui.gbCid];
  const fname = `คะแนน_${sj.name}${all ? '' : '_' + db.get('classrooms', ui.gbCid).name}`.replace(/[\\/:*?"<>|]/g, '-');
  if (window.XLSX) {
    const wb = XLSX.utils.book_new();
    const used = new Set();
    cids.forEach(cid => {
      const rows = gbSheetRows(sj.id, cid);
      const ws = XLSX.utils.aoa_to_sheet([[`${sj.name} ${sj.code || ''} · ห้อง ${db.get('classrooms', cid).name} · ภาคเรียน ${Q.termLabel(Q.currentTerm())}`], [], ...rows]);
      ws['!cols'] = rows[0].map((h, i) => ({ wch: i === 2 ? 28 : Math.max(8, Math.min(24, String(h).length + 2)) }));
      let name = db.get('classrooms', cid).name.replace(/[\\/?*[\]:]/g, '-').slice(0, 31) || 'ห้อง';
      while (used.has(name)) name = name.slice(0, 28) + '_' + used.size;
      used.add(name);
      XLSX.utils.book_append_sheet(wb, ws, name);
    });
    XLSX.writeFile(wb, fname + '.xlsx');
  } else {
    const rows = cids.flatMap(cid => [[`ห้อง ${db.get('classrooms', cid).name}`], ...gbSheetRows(sj.id, cid), []]);
    const csv = '﻿' + rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\r\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = fname + '.csv'; a.click();
  }
  toast('กำลังดาวน์โหลดไฟล์คะแนน');
}

function timeAgo(iso) {
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60) return 'เมื่อสักครู่';
  if (s < 3600) return `${Math.floor(s / 60)} นาทีที่แล้ว`;
  if (s < 86400) return `${Math.floor(s / 3600)} ชั่วโมงที่แล้ว`;
  if (s < 86400 * 7) return `${Math.floor(s / 86400)} วันที่แล้ว`;
  return fmtDate(iso);
}
const DB = {
  termAssignments(subjectId) {
    const subs = new Set(Q.subjectsOfTerm(Q.currentTerm()?.id).map(s => s.id));
    return store.assignments.filter(a => subs.has(a.subject_id) && (!subjectId || a.subject_id === subjectId));
  },
  classStats(cid, asgs) {
    const studs = Q.students(cid).filter(s => s.active !== false);
    const ids = new Set(studs.map(s => s.id));
    let slots = 0, graded = 0, pending = 0, returned = 0;
    asgs.forEach(a => {
      if (!store.assignment_classes.some(x => x.assignment_id === a.id && x.classroom_id === cid)) return;
      slots += studs.length;
      A.subs(a.id).forEach(s => {
        if (!ids.has(s.student_id)) return;
        if (s.status === 'graded') graded++; else if (s.status === 'returned') returned++; else pending++;
      });
    });
    const done = graded + pending;
    return { slots, graded, pending, returned, done, missing: slots - done - returned, pct: slots ? done / slots * 100 : null };
  },
  missingByStudent(cid, asgs) {
    const list = asgs.filter(a => store.assignment_classes.some(x => x.assignment_id === a.id && x.classroom_id === cid));
    return Q.students(cid).filter(s => s.active !== false).map(s => {
      const miss = list.filter(a => { const sub = A.sub(a.id, s.id); return !sub || sub.status === 'returned'; });
      return { s, miss, overdue: miss.filter(a => isPast(a.due_at)) };
    }).filter(x => x.miss.length).sort((a, b) => b.overdue.length - a.overdue.length || b.miss.length - a.miss.length || a.s.number - b.s.number);
  },
};

I.up = '<path d="M12 19V5M5 12l7-7 7 7"/>';
I.down = '<path d="M12 5v14M5 12l7 7 7-7"/>';
I.play = '<path d="M7 4v16l13-8z"/>';
I.warn = '<path d="M12 3 2 21h20z"/><path d="M12 10v5M12 18h.01"/>';
const QTYPE = { mcq: 'ปรนัย', true_false: 'ถูก/ผิด', short: 'เติมคำ', essay: 'อัตนัย' };
const QICON = { mcq: '🔘', true_false: '⭕', short: '✍️', essay: '📝' };

const EX = {
  classIds: eid => store.exam_classes.filter(x => x.exam_id === eid).map(x => x.classroom_id),
  questions: eid => store.exam_questions.filter(q => q.exam_id === eid).sort((a, b) => (a.sort_order - b.sort_order) || (a.id > b.id ? 1 : -1)),
  total: eid => EX.questions(eid).reduce((a, q) => a + (+q.points || 0), 0),
  attempts: eid => store.exam_attempts.filter(a => a.exam_id === eid),
  best(eid, sid) {
    const done = store.exam_attempts.filter(a => a.exam_id === eid && a.student_id === sid && a.submitted_at);
    return done.length ? Math.max(...done.map(a => +(a.total_score || 0))) : null;
  },
  link: e => `${location.origin}${location.pathname}#exam-${e.share_code}`,
  problems(q) {
    if (!String(q.prompt || '').trim()) return 'ยังไม่มีคำถาม';
    if (q.qtype === 'mcq') {
      const ch = Array.isArray(q.choices) ? q.choices : [];
      if (ch.filter(c => String(c).trim()).length < 2) return 'ต้องมีตัวเลือกอย่างน้อย 2 ข้อ';
      if (q.answer == null || +q.answer >= ch.length || !String(ch[+q.answer] || '').trim()) return 'ยังไม่ได้เลือกคำตอบที่ถูก';
    }
    if (q.qtype === 'short' && !(Array.isArray(q.answer) && q.answer.length)) return 'ยังไม่ได้ใส่คำตอบที่ยอมรับ';
    if (q.qtype === 'true_false' && typeof q.answer !== 'boolean') return 'ยังไม่ได้เลือกว่าถูกหรือผิด';
    return '';
  },
};

function examClassChecks(subjectId, selected) {

function questionCard(qq, i, n) {

    body = `<div class="q-choices">${ch.map((c, k) => `<div class="q-choice ${+qq.answer === k && qq.answer != null ? 'right' : ''}">
        <label class="q-radio" title="เลือกเป็นคำตอบที่ถูก"><input type="radio" name="ans-${qq.id}" ${+qq.answer === k && qq.answer != null ? 'checked' : ''} data-chg="q-correct" data-id="${qq.id}" data-i="${k}"><span>${ExamParser.TH[k] || k + 1}</span></label>
        <input class="input" value="${esc(c)}" placeholder="ตัวเลือก ${ExamParser.TH[k] || k + 1}" data-chg="q-choice" data-id="${qq.id}" data-i="${k}">
        <button class="btn ghost icon" data-act="q-choice-del" data-id="${qq.id}" data-i="${k}" aria-label="ลบตัวเลือก" ${ch.length <= 2 ? 'disabled' : ''}>${ic('x')}</button></div>`).join('')}
      ${ch.length < 8 ? `<button class="btn sm ghost" data-act="q-choice-add" data-id="${qq.id}">${ic('plus')}เพิ่มตัวเลือก</button>` : ''}
      <div class="small muted">กดวงกลมหน้าตัวเลือกที่ถูก</div></div>`;
  } else if (qq.qtype === 'true_false') {
    body = `<div class="tf"><button class="tf-b ${qq.answer === true ? 'on ok' : ''}" data-act="q-tf" data-id="${qq.id}" data-v="1">⭕ ถูก</button><button class="tf-b ${qq.answer === false ? 'on bad' : ''}" data-act="q-tf" data-id="${qq.id}" data-v="0">❌ ผิด</button><span class="small muted">เลือกคำตอบที่ถูกต้อง</span></div>`;
  } else if (qq.qtype === 'short') {
    body = `<label class="field"><span>คำตอบที่ยอมรับ (บรรทัดละ 1 คำตอบ · ไม่สนตัวพิมพ์เล็ก/ใหญ่และช่องว่างหน้า-หลัง)</span><textarea class="input" rows="2" data-chg="q-short" data-id="${qq.id}" placeholder="เช่น CPU&#10;ซีพียู">${esc((Array.isArray(qq.answer) ? qq.answer : []).join('\n'))}</textarea></label>`;
  } else body = `<div class="note">📝 นักเรียนพิมพ์คำตอบ ครูให้คะแนนเองในหน้าผลสอบ</div>`;
  return `<div class="card qcard ${prob ? 'has-prob' : ''}" id="q-${qq.id}">
    <div class="q-top"><span class="q-no">${i + 1}</span>
      <select class="input q-type" data-chg="q-type" data-id="${qq.id}" aria-label="ประเภทคำถาม">${Object.keys(QTYPE).map(t => `<option value="${t}" ${t === qq.qtype ? 'selected' : ''}>${QICON[t]} ${QTYPE[t]}</option>`).join('')}</select>
      <label class="q-pts"><input class="input" type="number" min="0" step="0.5" value="${+qq.points}" data-chg="q-points" data-id="${qq.id}" aria-label="คะแนน"><span>คะแนน</span></label>
      ${prob ? `<span class="chip bad">${ic('warn')}${esc(prob)}</span>` : ''}<span class="spacer"></span>
      <button class="btn ghost icon" data-act="q-move" data-id="${qq.id}" data-d="-1" ${i === 0 ? 'disabled' : ''} aria-label="ย้ายขึ้น">${ic('up')}</button>

      <button class="btn ghost icon" data-act="q-del" data-id="${qq.id}" aria-label="ลบคำถาม" style="color:var(--danger)">${ic('trash')}</button></div>
    <textarea class="input q-prompt ${qq.prompt_html ? 'mono' : ''}" rows="${qq.prompt_html ? 4 : 2}" placeholder="${qq.prompt_html ? 'พิมพ์คำถามเป็น HTML เช่น <b>ตัวหนา</b> <mark>ไฮไลต์</mark>' : 'พิมพ์คำถาม… (วางรูปจากคลิปบอร์ดได้)'}" data-chg="q-prompt" data-inp="q-live" data-id="${qq.id}">${esc(qq.prompt)}</textarea>
    ${qMediaTools(qq)}

async function qUpdate(id, patch, rerender = true) {
  await db.update('exam_questions', id, patch);
  if (rerender) { const y = window.scrollY; render(); window.scrollTo(0, y); }
}
async function qAdd(eid, rows) {
  const base = Math.max(0, ...EX.questions(eid).map(q => q.sort_order || 0));
  const payload = rows.map((r, k) => ({ exam_id: eid, sort_order: base + (k + 1) * 10, qtype: r.qtype, prompt: r.prompt || '', choices: r.qtype === 'mcq' ? (r.choices || ['', '', '', '']) : null, answer: r.answer ?? null, points: r.points ?? 1 }));
  for (let i = 0; i < payload.length; i += 200) {
    const out = await q(sb.from('exam_questions').insert(payload.slice(i, i + 200)).select());
    store.exam_questions.push(...out);
  }
}

async function examImportFile(file, kind) {
  try {
    const buf = await file.arrayBuffer();
    if (kind === 'word') {
      if (!window.mammoth) throw new Error('โหลดตัวอ่าน Word ไม่สำเร็จ — เปิดไฟล์ Word แล้วคัดลอกข้อความมาวางในแท็บ "วางข้อความ" แทนได้');
      const r = await window.mammoth.extractRawText({ arrayBuffer: buf });
      const qs = ExamParser.parseText(r.value);
      if (!qs.length) throw new Error('ไม่พบข้อสอบในไฟล์ ตรวจรูปแบบ (เลขข้อ + ก. ข. ค. ง. + ตอบ)');
      ui.exImpText = r.value; examImportModal(qs);
    } else {
      let rows;
      if (/\.csv$/i.test(file.name)) rows = RosterParser.parseCSV(RosterParser.decodeText(buf));
      else { if (!window.XLSX) throw new Error('โหลดตัวอ่าน Excel ไม่สำเร็จ ลองบันทึกเป็น .csv'); const wb = XLSX.read(buf, { type: 'array' }); rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '' }); }
      const r = ExamParser.parseRows(rows);
      if (r.error) throw new Error(r.error);
      examImportModal(r.questions);
    }
  } catch (e) { toast(e.message || 'อ่านไฟล์ไม่สำเร็จ', true); }
}

async function loadExamResults(eid) {
  const atts = await q(sb.from('exam_attempts').select('*').eq('exam_id', eid));
  store.exam_attempts = store.exam_attempts.filter(a => a.exam_id !== eid).concat(atts);
  const ids = atts.map(a => a.id); const ans = [];
  for (let i = 0; i < ids.length; i += 150) ans.push(...await q(sb.from('exam_answers').select('*').in('attempt_id', ids.slice(i, i + 150))));
  store.exam_answers = (store.exam_answers || []).filter(a => !ids.includes(a.attempt_id)).concat(ans);
  ui.exResLoaded = eid;
}
function attemptStatus(a) {
  if (!a) return '<span class="chip">ยังไม่สอบ</span>';
  if (!a.submitted_at) return (a.deadline && new Date(a.deadline) < new Date()) ? '<span class="chip warn">หมดเวลา · ยังไม่ส่ง</span>' : '<span class="chip warn">🟡 กำลังทำ</span>';
  const essay = EX.questions(a.exam_id).some(q => q.qtype === 'essay');
  if (essay && a.manual_score == null) return '<span class="chip pri">รอตรวจอัตนัย</span>';
  return '<span class="chip ok">ส่งแล้ว</span>';
}

async function saveEssayScores(a) {
  const inputs = $$('#modal-root [data-essay]').filter(i => !i.disabled);
  for (const el of inputs) {
    const qq = db.get('exam_questions', el.dataset.essay);
    const v = el.value.trim() === '' ? null : parseFloat(el.value);
    if (v != null && (!(v >= 0) || v > +qq.points)) return toast(`คะแนนอัตนัยต้องอยู่ระหว่าง 0–${+qq.points}`, true);
    await q(sb.from('exam_answers').update({ points_awarded: v }).eq('attempt_id', a.id).eq('question_id', qq.id));
  }
  if (a.submitted_at || inputs.length) await q(sb.rpc('teacher_exam_grade', { p_attempt_id: a.id }));
  await loadExamResults(a.exam_id); closeModal(); render(); toast('บันทึกคะแนนแล้ว');
}
function examExport(eid) {
  const e = db.get('exams', eid);
  const header = ['ห้อง', 'เลขที่', 'เลขประจำตัว', 'ชื่อ - สกุล', `คะแนน (${EX.total(eid)})`, 'จำนวนครั้ง', 'สลับแท็บ', 'ส่งเมื่อ'];
  const rows = EX.classIds(eid).flatMap(cid => Q.students(cid).filter(s => s.active !== false).map(s => {
    const atts = store.exam_attempts.filter(a => a.exam_id === eid && a.student_id === s.id);
    const best = EX.best(eid, s.id); const last = atts.filter(a => a.submitted_at).sort((a, b) => (b.submitted_at || '').localeCompare(a.submitted_at || ''))[0];
    return [db.get('classrooms', cid).name, s.number, s.student_code, Q.fullName(s), best ?? '', atts.length, Math.max(0, ...atts.map(a => a.tab_switches || 0)), last ? fmtDate(last.submitted_at) : ''];
  }));
  const fname = `ผลสอบ_${e.title}`.replace(/[\\/:*?"<>|]/g, '-');
  if (window.XLSX) { const wb = XLSX.utils.book_new(); const ws = XLSX.utils.aoa_to_sheet([header, ...rows]); ws['!cols'] = header.map((h, i) => ({ wch: i === 3 ? 28 : 12 })); XLSX.utils.book_append_sheet(wb, ws, 'ผลสอบ'); XLSX.writeFile(wb, fname + '.xlsx'); }
  else { const csv = '﻿' + [header, ...rows].map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\r\n'); const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = fname + '.csv'; a.click(); }
}

async function saveUser(uid, patch) {
  const u = USR.list.find(x => x.user_id === uid); if (!u) return;
  const next = { status: patch.status ?? u.status, perms: { ...u.perms, ...(patch.perms || {}) } };
  const r = await q(sb.rpc('admin_set_user', { p_user: uid, p_status: next.status, p_perms: next.perms, p_name: null }));
  Object.assign(u, { status: r.status, perms: r.perms }); store.pendingCount = USR.list.filter(x => x.status === 'pending').length; render();
}

/* =====================================================================
   เนื้อหาคำถามแบบ "รวย": HTML ที่ปลอดภัย + รูป + วิดีโอ (YouTube / Google Drive / ไฟล์วิดีโอ)
   ===================================================================== */
const RICH = (() => {
  const ALLOW = new Set(['b', 'strong', 'i', 'em', 'u', 's', 'mark', 'small', 'sub', 'sup', 'br', 'p', 'div', 'span', 'h3', 'h4', 'h5',
    'ul', 'ol', 'li', 'blockquote', 'code', 'pre', 'kbd', 'table', 'thead', 'tbody', 'tfoot', 'tr', 'th', 'td', 'caption', 'hr', 'img', 'a', 'figure', 'figcaption', 'center', 'font']);
  const DROP = new Set(['script', 'style', 'object', 'embed', 'link', 'meta', 'base', 'form', 'input', 'button', 'select', 'textarea', 'svg', 'math', 'template', 'noscript', 'frame', 'frameset']);
  const STYLE_OK = /^(color|background|background-color|font-weight|font-style|font-size|text-decoration|text-align|border|border-radius|padding|margin|width|max-width|line-height|letter-spacing|vertical-align|display)$/;
  const urlOk = (u, img) => /^https?:\/\//i.test(u) || (img && /^data:image\/(png|jpe?g|gif|webp);base64,/i.test(u));

  /* ---------- วิดีโอ / ลิงก์ ---------- */
  function parseUrl(raw) {
    const u = String(raw || '').trim(); if (!/^https?:\/\//i.test(u)) return null;
    let m = u.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([\w-]{11})/i);
    if (m) { const t = u.match(/[?&](?:t|start)=(\d+)/); return { t: 'youtube', id: m[1], start: t ? +t[1] : 0 }; }
    m = u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:.*&)?id=)([\w-]{20,})/i);
    if (m) return { t: 'drive', id: m[1] };
    if (/\.(mp4|webm|ogg|mov)(\?|#|$)/i.test(u)) return { t: 'video', url: u };
    if (/\.(png|jpe?g|gif|webp|svg)(\?|#|$)/i.test(u) || /\/storage\/v1\/object\/public\//.test(u)) return { t: 'image', url: u };
    return { t: 'link', url: u };
  }
  function iframeFor(src) {
    const yt = src.match(/^https:\/\/www\.(?:youtube|youtube-nocookie)\.com\/embed\/([\w-]{11})/);
    if (yt) return { t: 'youtube', id: yt[1] };
    const dr = src.match(/^https:\/\/drive\.google\.com\/file\/d\/([\w-]{20,})\/preview/);
    if (dr) return { t: 'drive', id: dr[1] };
    return null;
  }
  function mediaOne(m, i) {
    if (!m || typeof m !== 'object') return '';
    if (m.t === 'image' && urlOk(m.url, true)) return `<figure class="qm qm-img"><img src="${esc(m.url)}" alt="${esc(m.alt || 'รูปประกอบคำถาม')}" loading="lazy" data-act="qm-zoom"></figure>`;
    if (m.t === 'youtube' && /^[\w-]{11}$/.test(m.id)) return `<figure class="qm qm-video"><iframe src="https://www.youtube-nocookie.com/embed/${m.id}?rel=0${m.start ? `&start=${+m.start}` : ''}" title="วิดีโอประกอบคำถาม" loading="lazy" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></figure>`;
    if (m.t === 'drive' && /^[\w-]{20,}$/.test(m.id)) return `<figure class="qm qm-video"><iframe src="https://drive.google.com/file/d/${m.id}/preview" title="ไฟล์จาก Google Drive" loading="lazy" allow="autoplay; fullscreen" allowfullscreen></iframe></figure>`;
    if (m.t === 'video' && urlOk(m.url)) return `<figure class="qm qm-video file"><video src="${esc(m.url)}" controls preload="metadata" playsinline></video></figure>`;
    if (m.t === 'link' && urlOk(m.url)) return `<a class="qm qm-link" href="${esc(m.url)}" target="_blank" rel="noopener noreferrer">🔗 <span>${esc(m.url.replace(/^https?:\/\//, '').slice(0, 60))}</span></a>`;
    return '';
  }
  const media = list => Array.isArray(list) && list.length ? `<div class="qm-list">${list.map(mediaOne).join('')}</div>` : '';

  /* ---------- HTML ที่ปลอดภัย ---------- */
  function cleanStyle(st) {
    return String(st || '').split(';').map(x => x.trim()).filter(Boolean).map(d => {
      const k = d.slice(0, d.indexOf(':')).trim().toLowerCase(), v = d.slice(d.indexOf(':') + 1).trim();
      if (!STYLE_OK.test(k) || /url\s*\(|expression|javascript:|@import|[<>]/i.test(v) || v.length > 120) return '';
      if (k === 'display' && !/^(inline|inline-block|block|none)$/.test(v)) return '';
      return `${k}:${v}`;
    }).filter(Boolean).join(';');
  }
  function sanitize(html) {
    const doc = new DOMParser().parseFromString(`<div>${String(html || '')}</div>`, 'text/html');
    const walk = node => {
      [...node.childNodes].forEach(n => {
        if (n.nodeType === 8) { n.remove(); return; }
        if (n.nodeType !== 1) return;
        const tag = n.tagName.toLowerCase();
        if (tag === 'iframe') { const m = iframeFor(n.getAttribute('src') || ''); const tmp = doc.createElement('div'); tmp.innerHTML = m ? mediaOne(m) : ''; n.replaceWith(...tmp.childNodes); return; }
        if (DROP.has(tag)) { n.remove(); return; }
        if (!ALLOW.has(tag)) { walk(n); n.replaceWith(...n.childNodes); return; }
        [...n.attributes].forEach(a => {
          const k = a.name.toLowerCase(), v = a.value;
          const keep = (k === 'style' && (n.setAttribute('style', cleanStyle(v)), true))
            || (k === 'href' && tag === 'a' && urlOk(v)) || (k === 'src' && tag === 'img' && urlOk(v, true))
            || (['alt', 'title', 'colspan', 'rowspan', 'width', 'height', 'align'].includes(k) && !/[<>"]/.test(v) && v.length < 200)
            || (k === 'color' && tag === 'font' && /^#?[\w]{3,20}$/.test(v));
          if (!keep) n.removeAttribute(a.name);
        });
        if (tag === 'a') { n.setAttribute('target', '_blank'); n.setAttribute('rel', 'noopener noreferrer'); }
        if (tag === 'img') { n.setAttribute('loading', 'lazy'); if (!n.getAttribute('src')) n.remove(); }
        walk(n);

    return root.innerHTML;
  }
  /* คำถาม: HTML หรือข้อความธรรมดา + สื่อ */
  function prompt(qq) {
    const body = qq.prompt_html ? `<div class="qp-html">${sanitize(qq.prompt)}</div>` : `<div class="qp-text">${esc(qq.prompt || '')}</div>`;
    return body + media(qq.media);
  }
  /* ข้อความสั้นในรายการ (ตัดแท็กออก) */
  function plain(qq) {
    if (!qq.prompt_html) return qq.prompt || '';
    const d = document.createElement('div'); d.innerHTML = sanitize(qq.prompt); return (d.textContent || '').trim() || '(คำถามแบบ HTML)';
  }

  /* ---------- อัปโหลดรูป (ย่อก่อนส่ง) ---------- */
  async function shrink(file, max = 1600) {
    if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return file; // gif เก็บตามเดิม
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
    const k = Math.min(1, max / Math.max(img.width, img.height));
    if (k === 1 && file.size < 900 * 1024) return file;
    const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', .86));
    return new File([blob], file.name.replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' });
  }
  async function uploadImage(file) {
    if (!/^image\/(jpeg|png|gif|webp)$/.test(file.type)) throw new Error('รองรับเฉพาะรูป JPG PNG GIF WEBP');
    const f = await shrink(file);
    if (f.size > 5 * 1048576) throw new Error('รูปใหญ่เกิน 5 MB');
    const ext = (f.name.split('.').pop() || 'jpg').toLowerCase();
    const path = `${session.user.id}/${crypto.randomUUID()}.${ext}`;
    const { error } = await sb.storage.from('exam-media').upload(path, f, { contentType: f.type, cacheControl: '31536000' });
    if (error) throw error;
    return { t: 'image', url: sb.storage.from('exam-media').getPublicUrl(path).data.publicUrl, path };
  }
  return { sanitize, prompt, media, parseUrl, plain, uploadImage };
})();

}

/* ---------- ฝั่งนักเรียน ---------- */
function rbStudentHTML(a) {

Object.assign(ACT, {
  'rb-off': () => { modalCtx.rubric = null; rbRefresh(); },
  'rb-add': () => { const r = modalCtx.rubric; r.criteria.push({ title: '', w: 1, d: r.levels.map(() => '') }); rbRefresh(); },
  'rb-del': el => { modalCtx.rubric.criteria.splice(+el.dataset.ci, 1); rbRefresh(); },
  'rb-lvl': el => {
    const r = modalCtx.rubric, d = +el.dataset.d;
    if (d > 0 && r.levels.length < 5) { r.levels.push({ label: 'ระดับ ' + (r.levels.length + 1), pts: 0 }); r.criteria.forEach(c => c.d.push('')); }
    if (d < 0 && r.levels.length > 2) { r.levels.pop(); r.criteria.forEach(c => c.d.pop()); }
    rbRefresh();
  },
  'rb-save-lib': async () => {
    const r = modalCtx.rubric; if (!rbValid(r)) return toast('กรอกชื่อเกณฑ์และชื่อระดับให้ครบก่อน', true);
    const title = (mval('title') || 'รูบริก') + ' (' + new Date().toLocaleDateString('th-TH', { day: 'numeric', month: 'short' }) + ')';
    try { await db.insert('rubrics', { title, data: rbCopy(r) }); toast('เก็บลงคลังรูบริกแล้ว ใช้ซ้ำกับงานอื่นได้'); } catch (e) {}
  },
  'rb-pick': el => {
    const ci = +el.dataset.ci, li = +el.dataset.li, a = db.get('assignments', modalCtx.aid);
    modalCtx.rs = { ...(modalCtx.rs || {}) }; if (modalCtx.rs[ci] === li) delete modalCtx.rs[ci]; else modalCtx.rs[ci] = li;
    el.parentElement.querySelectorAll('.rb-lvbtn').forEach(b => b.classList.toggle('on', +b.dataset.li === modalCtx.rs[ci]));
    const sc = rbScore(a.rubric, modalCtx.rs), inp = $('#modal-root [name=score]'); if (inp) inp.value = sc ?? '';
    const t = $('#rb-g-total'); if (t) t.textContent = `${sc ?? '–'} / ${rbMax(a.rubric)}`;
  },
});
Object.assign(CHG, {
  'rb-preset': el => {
    const v = el.value; if (!v) return;
    if (v.startsWith('p:')) { const p = RB_PRESETS.find(x => x.id === v.slice(2)); modalCtx.rubric = rbCopy({ levels: p.levels, criteria: p.criteria }); }
    else { const x = (store.rubrics || []).find(y => y.id === v.slice(2)); if (x) modalCtx.rubric = rbCopy(x.data); }
    rbRefresh();

});
Object.assign(INP, {
  'rb-lv': el => { modalCtx.rubric.levels[+el.dataset.li].label = el.value; },

  'rb-w': el => { modalCtx.rubric.criteria[+el.dataset.ci].w = +el.value || 0; rbLive(); },

function attStudentStats(c) {
  const sess = attSessions(c.id).filter(s => !s.is_open).reverse();
  const recs = new Map(); store.attendance_records.forEach(r => recs.set(r.session_id + ':' + r.student_id, r.status));

    const cells = sess.map(se => { const v = recs.get(se.id + ':' + st.id) || 'absent'; k[v]++; return v; });

const attUrl = (id, token) => `${location.origin}${location.pathname}#checkin-${id}.${token}`;
function attStopLive() { clearTimeout(ATT.timer); clearInterval(ATT.poll); ATT.timer = ATT.poll = null; ATT.sid = null; ATT.token = null; }
function attStartLive(s) {
  if (!s.is_open) { if (ATT.sid) attStopLive(); return; }
  if (ATT.sid === s.id) return;
  attStopLive(); ATT.sid = s.id;
  const stillHere = () => ui.route === 'att-' + s.id && ATT.sid === s.id;
  const refresh = async () => {
    if (!stillHere()) return attStopLive();
    try {
      const r = await q(sb.rpc('teacher_att_token', { p_session: s.id }));
