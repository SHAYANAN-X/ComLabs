.sa-st{position:absolute;right:-6px;bottom:-6px;width:24px;height:24px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font:normal 13px/1 system-ui;box-shadow:0 2px 6px rgba(16,24,48,.2)}
.counter,[data-theme=dark] .counter{border:0;border-radius:20px;box-shadow:var(--shadow);background:var(--surface)}
.counter.todo,.counter.wait,.counter.done{background:var(--surface)}
.counter b{font:700 26px/1 var(--f-head)}
.tile{border:0;border-radius:16px;box-shadow:var(--shadow)}
.exm-hero{position:relative;overflow:hidden;background:#333!important}
.exm-hero>.art{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.exm-hero>*:not(.art){position:relative;z-index:1}
.exm-score .big{font-family:var(--f-head);color:var(--primary)}

/* ---------- ผู้ใช้และสิทธิ์ ---------- */
.role-card.admin{background:linear-gradient(135deg,#FFF6D6,#FFFFFF 60%)}
[data-theme=dark] .role-card.admin{background:linear-gradient(135deg,#3A3210,var(--surface) 60%)}
.avatar{background:linear-gradient(145deg,#4DA3FF,#0A6CF0);border-radius:14px;box-shadow:inset 0 1px 1px rgba(255,255,255,.5)}

.perm,.perm.on{background:var(--fill);border:0;border-radius:16px}

/* แท็บเล็ต: เมนูข้างเลื่อนออก */
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .side,[data-theme=dark] .side{position:fixed;top:12px;left:12px;bottom:12px;height:auto;margin:0;width:270px;transform:translateX(-115%);z-index:40;transition:transform .3s cubic-bezier(.2,.9,.3,1)}
  .side.open{transform:none}
  .content{padding:8px 18px 40px}
  .top h1{opacity:1}
}

/* =====================================================================
   มือถือ: แถบแท็บลอยแบบ iOS 26 (หดเมื่อเลื่อนลง)
   ===================================================================== */
.m-top{background:transparent;border:0;-webkit-backdrop-filter:none;backdrop-filter:none;padding:calc(10px + env(safe-area-inset-top)) 14px 6px;pointer-events:none}
.m-top>*{pointer-events:auto}
.m-top h1{font:700 17px var(--f-head);padding:7px 16px;border-radius:999px;background:var(--lg);-webkit-backdrop-filter:var(--lg-blur);backdrop-filter:var(--lg-blur);box-shadow:var(--lg-rim),var(--lg-edge),var(--lg-drop);opacity:0;transition:opacity .2s}
.m-shell.scrolled .m-top h1{opacity:1}
.m-top .brand-mark.sm{box-shadow:var(--lg-drop)}
.m-shell .content{padding:2px 14px calc(110px + env(safe-area-inset-bottom))}
.m-tabs,[data-theme=dark] .m-tabs{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));padding:6px;border:0;border-radius:34px;
  background:var(--bar);-webkit-backdrop-filter:blur(24px) saturate(190%);backdrop-filter:blur(24px) saturate(190%);box-shadow:var(--lg-rim),var(--lg-edge),0 12px 30px -10px rgba(16,24,48,.35);
  transition:transform .35s cubic-bezier(.2,1,.3,1),padding .3s}
.m-tabs a,.m-tabs button{border-radius:28px;min-height:54px;gap:1px;transition:background .25s,min-height .3s}
.m-tabs svg{padding:2px;width:24px;height:24px;background:none!important}
.m-tabs .on{color:var(--primary);background:var(--lg-strong);box-shadow:var(--lg-rim),0 2px 8px -3px rgba(16,24,48,.25)}
.m-tabs span{transition:opacity .2s,max-height .3s;max-height:20px;overflow:hidden}

.m-tabs.min a,.m-tabs.min button{min-height:42px}
.m-tabs.min span{opacity:0;max-height:0}
.m-dot{background:var(--orange);border-color:transparent}
.m-sheet{border-radius:32px 32px 0 0;background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%)}
.m-grid a{border:0;background:var(--surface);border-radius:20px;box-shadow:var(--shadow)}
.m-grid a svg{width:40px;height:40px;padding:9px;border-radius:12px;color:#fff;background:linear-gradient(145deg,#4DA3FF,#0A6CF0);box-shadow:inset 0 1px 1px rgba(255,255,255,.5)}
.m-grid a:nth-child(3n+2) svg{background:linear-gradient(145deg,#8E8BFF,#5E5CE6)}
.m-grid a:nth-child(3n) svg{background:linear-gradient(145deg,#5BD6E6,#1FA0B8)}
.m-grid a.on{background:var(--primary-soft)}
[data-device=mobile] .page-head h2{font-size:30px}
[data-device=mobile] .hero{min-height:200px;align-items:flex-end}
[data-device=mobile] .hero .art.desk{height:62%;top:0;bottom:auto}
[data-device=mobile] .hero::after{background:linear-gradient(180deg,rgba(255,255,255,0) 30%,var(--surface) 62%)}
[data-device=mobile] .hero-txt{padding:120px 18px 18px;max-width:none}
[data-device=mobile] .hero-txt h2{font-size:24px;color:var(--ink)}
[data-device=mobile] .hero-txt p{color:var(--muted)}
[data-device=mobile] .asg-bar{width:52px;height:52px;margin:14px 0 0 14px;border-radius:15px}
